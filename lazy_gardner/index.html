<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lazy Gardener: Jardim Zen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            /* Céu inicial */
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
            color: #333;
        }

        #ui button {
            margin: 2px;
            padding: 5px 8px;
            cursor: pointer;
        }

        #notifications {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 0.9em;
            max-width: 80%;
            display: none;
            /* Começa escondido */
        }

        /* === TASK_002: Loja incremental (glassmorphism) === */
        #ui {
            background: rgba(20, 30, 25, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            color: #eafff0;
            width: 230px;
            max-height: 94vh;
            overflow-y: auto;
        }
        #goldDisplay {
            font-size: 1.25em;
            font-weight: bold;
            color: #ffd54a;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            transition: transform 0.15s ease;
        }
        #goldDisplay.bump { transform: scale(1.18); }
        .shop-section-title {
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9fe6b8;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 3px;
            margin: 10px 0 6px;
        }
        #ui button.shop-btn {
            display: block;
            width: 100%;
            margin: 3px 0;
            padding: 6px 8px;
            text-align: left;
            background: rgba(76, 175, 80, 0.25);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 6px;
            color: #eafff0;
            cursor: pointer;
            font-size: 0.82em;
            transition: background 0.2s, opacity 0.2s;
        }
        #ui button.shop-btn:hover:not(:disabled) { background: rgba(76, 175, 80, 0.45); }
        #ui button.shop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #ui button.shop-btn.selected { outline: 2px solid #ffd54a; background: rgba(76, 175, 80, 0.5); }
        #ui button.shop-btn.owned { background: rgba(41, 128, 185, 0.4); cursor: default; }
        .shop-cost { float: right; color: #ffd54a; font-weight: bold; }
        #statusBadges { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
        .status-badge {
            font-size: 0.7em; padding: 3px 6px; border-radius: 10px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.25);
        }

        /* Texto flutuante de colheita automática */
        .float-text {
            position: absolute;
            color: #ffd54a;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 50;
            transition: transform 1.2s ease-out, opacity 1.2s ease-out;
        }

        /* Modal Glassmorphic de boas-vindas (ganhos offline) */
        #welcomeModal {
            position: fixed; inset: 0; display: none;
            justify-content: center; align-items: center; z-index: 2000;
            background: rgba(0,0,0,0.55);
        }
        #welcomeModal .card {
            background: rgba(20, 30, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 16px;
            padding: 28px 32px;
            text-align: center;
            color: #eafff0;
            font-family: sans-serif;
            max-width: 360px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        #welcomeModal h2 { color: #ffd54a; margin: 0 0 12px; }
        #welcomeModal button {
            margin-top: 18px; padding: 10px 22px; border: none; border-radius: 8px;
            background: #4caf50; color: white; cursor: pointer; font-size: 1em;
        }
    </style>
</head>

<body>
    <div id="ui">
        <div id="goldDisplay">🪙 100</div>
        <div id="statusBadges"></div>

        <div class="shop-section-title">🛒 Sementes</div>
        <button id="plantFlower" class="shop-btn" data-seed="flower">🌸 Flor <span class="shop-cost">10</span></button>
        <button id="plantMushroom" class="shop-btn" data-seed="mushroom">🍄 Cogumelo <span class="shop-cost">20</span></button>
        <button id="plantBamboo" class="shop-btn" data-seed="bamboo">🎋 Bambu <span class="shop-cost">45</span></button>
        <button id="plantBerryBush" class="shop-btn" data-seed="berrybush">🫐 Arbusto <span class="shop-cost">90</span></button>
        <button id="plantTree" class="shop-btn" data-seed="tree">🌳 Árvore <span class="shop-cost">180</span></button>
        <button id="plantPineTree" class="shop-btn" data-seed="pinetree">🌲 Pinheiro <span class="shop-cost">350</span></button>
        <button id="plantLotus" class="shop-btn" data-seed="lotus">🪷 Lótus <span class="shop-cost">700</span></button>

        <div class="shop-section-title">🚀 Automações</div>
        <button id="buySprinkler" class="shop-btn">💧 Regador Auto <span class="shop-cost">300</span></button>
        <button id="buyScarecrow" class="shop-btn">🦅 Espantalho <span class="shop-cost">500</span></button>
        <button id="buyHarvester" class="shop-btn">🚜 Robô Colhedor <span class="shop-cost">800</span></button>

        <div class="shop-section-title">🌦️ Estado</div>
        <div id="weatherStatus">Clima: Ensolarado</div>
        <div id="timeStatus">Hora: Dia</div>
        <div style="font-size:0.72em; color:#9fe6b8; margin-top:6px;">Clique numa planta madura para colher · na terra para regar · na praga para eliminá-la.</div>
    </div>

    <div id="notifications" role="alert"></div>

    <div id="welcomeModal">
        <div class="card">
            <h2>🌱 Bem-vindo de volta!</h2>
            <p id="welcomeText">Seu jardim ocioso rendeu ouro enquanto você descansava.</p>
            <button id="welcomeClose">Coletar 🪙</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <audio id="ambientSoundDay" loop src="../lazy_gardner/assets/birds-forest-spring.mp3" preload="auto"></audio>
    <audio id="ambientSoundNight" loop src="../lazy_gardner/assets/night-ambience.mp3" preload="auto"></audio>
    <audio id="rainSound" loop src="../lazy_gardner/assets/rain.mp3" preload="auto"></audio>
    <audio id="notificationSound" src="../lazy_gardner/assets/notification.mp3" preload="auto"></audio>

    <!-- Import map para Three.js (maneira moderna de importar módulos) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

        // --- Configuração Inicial ---
        let scene, camera, renderer;
        let ground, sky;
        let bearModel; // Variável para armazenar o modelo do urso
        const plants = [];
        const butterflies = [];
        const clouds = [];
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clock = new THREE.Clock();

        let currentSeedType = null; // 'flower', 'tree', 'mushroom'
        let simulatedWeather = 'sunny'; // 'sunny', 'rainy'
        let timeOfDay = 'day'; // 'day', 'night'
        let timeAccumulator = 0;
        const timeSpeed = 0.5; // Controla a velocidade da passagem do tempo (1 = normal)
        const dayDuration = 120; // Segundos para um ciclo dia/noite completo

        const growthTimes = { // Em segundos (reduzido para demonstração)
            flower: { seed: 0, sprout: 5, bud: 15, bloom: 30 },
            tree: { seed: 0, sapling: 10, growing: 30, mature: 60 },
            pinetree: { seed: 0, sapling: 20, growing: 60, mature: 120, ancient: 180 },
            mushroom: { spore: 0, small: 5, grown: 20 },
            bamboo: { seed: 0, shoot: 5, cluster: 15, dense: 40 },
            berrybush: { seed: 0, sapling: 10, foliage: 35, berry: 80 },
            lotus: { spore: 0, pad: 40, bud: 100, bloom: 150 }
        };

        const weatherChangeInterval = 45; // TASK_002: Mudar clima a cada 45 segundos
        let timeSinceLastWeatherChange = 0;
        let weatherGrowthMultiplier = 1.0; // sunny 1.0 / rainy 2.0 / drought 0.5
        let goldMultiplier = 1.0;          // drought => 1.5x ouro

        // === TASK_002: Economia incremental ===
        const SEED_INFO = {
            flower:    { cost: 10,  harvest: 25 },
            mushroom:  { cost: 20,  harvest: 45 },
            bamboo:    { cost: 45,  harvest: 95 },
            berrybush: { cost: 90,  harvest: 210 },
            tree:      { cost: 180, harvest: 450 },
            pinetree:  { cost: 350, harvest: 950 },
            lotus:     { cost: 700, harvest: 2100 }
        };
        const UPGRADE_COSTS = { sprinkler: 300, scarecrow: 500, harvester: 800 };
        const SAVE_KEY = 'lazyGardenerState';

        const gardenState = {
            gold: 100,
            sprinklerActive: false,
            harvesterRobots: 0,
            ultrasonicScarecrow: false,
            lastActiveTimestamp: Date.now()
        };

        // Pragas e robôs
        const pests = [];
        let timeSinceLastPest = 0;
        let nextPestInterval = 60 + Math.random() * 60; // 60..120s
        let harvesterTimer = 0;
        const HARVEST_INTERVAL = 3; // segundos
        let harvesterRobotMesh = null;

        const flowerBloomColors = [
            0xFF69B4, // HotPink (original)
            0xFFD700, // Gold
            0xDA70D6, // Orchid
            0xFF4500, // OrangeRed
            0x4169E1, // RoyalBlue
            0xFFFFFF  // White
        ];

        // Elementos da UI
        const uiElement = document.getElementById('ui');
        const notificationElement = document.getElementById('notifications');
        const weatherStatusElement = document.getElementById('weatherStatus');
        const timeStatusElement = document.getElementById('timeStatus');
        const goldDisplayElement = document.getElementById('goldDisplay');
        const statusBadgesElement = document.getElementById('statusBadges');

        // === TASK_002: Helpers de economia ===
        function getSeedCost(type) { return SEED_INFO[type] ? SEED_INFO[type].cost : 0; }
        function getHarvestValue(type) { return SEED_INFO[type] ? SEED_INFO[type].harvest : 0; }

        function addGold(amount) {
            gardenState.gold += amount;
            if (gardenState.gold < 0) gardenState.gold = 0;
            updateGoldUI();
            saveGame();
        }
        function spendGold(amount) {
            if (gardenState.gold < amount) return false;
            gardenState.gold -= amount;
            updateGoldUI();
            saveGame();
            return true;
        }
        function updateGoldUI() {
            if (!goldDisplayElement) return;
            goldDisplayElement.textContent = `🪙 ${Math.floor(gardenState.gold)}`;
            goldDisplayElement.classList.add('bump');
            setTimeout(() => goldDisplayElement.classList.remove('bump'), 150);
            refreshShopAffordability();
            updateStatusBadges();
        }

        function updateStatusBadges() {
            if (!statusBadgesElement) return;
            const badges = [];
            if (gardenState.sprinklerActive) badges.push('💧 Regador');
            if (gardenState.ultrasonicScarecrow) badges.push('🦅 Espantalho');
            if (gardenState.harvesterRobots > 0) badges.push(`🚜 x${gardenState.harvesterRobots}`);
            statusBadgesElement.innerHTML = badges.map(b => `<span class="status-badge">${b}</span>`).join('');
        }

        function refreshShopAffordability() {
            // Sementes
            Object.keys(SEED_INFO).forEach(type => {
                const btn = document.querySelector(`.shop-btn[data-seed="${type}"]`);
                if (!btn) return;
                btn.disabled = gardenState.gold < getSeedCost(type);
                btn.classList.toggle('selected', currentSeedType === type);
            });
            // Automações
            const sprBtn = document.getElementById('buySprinkler');
            const scrBtn = document.getElementById('buyScarecrow');
            const harBtn = document.getElementById('buyHarvester');
            if (sprBtn) {
                sprBtn.classList.toggle('owned', gardenState.sprinklerActive);
                sprBtn.disabled = gardenState.sprinklerActive || gardenState.gold < UPGRADE_COSTS.sprinkler;
                if (gardenState.sprinklerActive) sprBtn.innerHTML = '💧 Regador Auto <span class="shop-cost">✔</span>';
            }
            if (scrBtn) {
                scrBtn.classList.toggle('owned', gardenState.ultrasonicScarecrow);
                scrBtn.disabled = gardenState.ultrasonicScarecrow || gardenState.gold < UPGRADE_COSTS.scarecrow;
                if (gardenState.ultrasonicScarecrow) scrBtn.innerHTML = '🦅 Espantalho <span class="shop-cost">✔</span>';
            }
            if (harBtn) {
                harBtn.disabled = gardenState.gold < UPGRADE_COSTS.harvester;
                harBtn.innerHTML = `🚜 Robô Colhedor (${gardenState.harvesterRobots}) <span class="shop-cost">800</span>`;
            }
        }

        // Texto flutuante na tela (HTML sobre o canvas) numa posição 3D
        function showFloatingText(text, worldPos, color = '#ffd54a') {
            const v = worldPos.clone().project(camera);
            const x = (v.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            document.body.appendChild(el);
            requestAnimationFrame(() => {
                el.style.transform = 'translateY(-50px)';
                el.style.opacity = '0';
            });
            setTimeout(() => el.remove(), 1200);
        }

        // Elementos de Áudio
        const ambientSoundDay = document.getElementById('ambientSoundDay');
        const ambientSoundNight = document.getElementById('ambientSoundNight');
        const rainSound = document.getElementById('rainSound');
        const notificationSound = document.getElementById('notificationSound');

        function init() {
            // Cena
            scene = new THREE.Scene();
            // scene.background = new THREE.Color(0x87CEEB); // Céu azul inicial

            // Câmera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Habilitar sombras
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras mais suaves
            renderer.outputEncoding = THREE.sRGBEncoding; // Importante para texturas
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // Melhor reprodução de cores
            renderer.toneMappingExposure = 1.0; // Ajuste da exposição

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2); // Reduzir um pouco a intensidade
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;

            // Melhorar configurações de sombra
            directionalLight.shadow.mapSize.width = 2048; // Aumentar resolução
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.bias = -0.001; // Corrigir artefatos de sombra
            directionalLight.shadow.normalBias = 0.05; // Ajuda com acne de sombra em modelos

            // Ajustar a área da sombra
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;

            scene.add(directionalLight);
            scene.add(directionalLight.target);

            // Adicionar uma luz suave de preenchimento do lado oposto para evitar sombras muito duras
            const fillLight = new THREE.DirectionalLight(0xffffcc, 0.3); // Luz amarelada suave
            fillLight.position.set(-5, 8, -7.5); // Posição oposta à luz principal
            scene.add(fillLight);

            // Chão (Ground)
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22, side: THREE.DoubleSide }); // Verde grama
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; // Deitar o plano
            ground.receiveShadow = true;
            scene.add(ground);

            // Sky Dome (Simples)
            const skyGeometry = new THREE.SphereGeometry(500, 32, 16); // Raio grande
            const skyMaterial = new THREE.MeshBasicMaterial({ side: THREE.BackSide }); // Material visível por dentro
            sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);
            updateSkyColor(); // Definir cor inicial

            // --- Create initial clouds ---
            for (let i = 0; i < 20; i++) {
                addCloud();
            }

            // TASK_002: sistema de chuva
            createRain();

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown); // Usar pointerdown para mouse e toque

            document.getElementById('plantFlower').addEventListener('click', () => setSeedType('flower'));
            document.getElementById('plantTree').addEventListener('click', () => setSeedType('tree'));
            document.getElementById('plantPineTree').addEventListener('click', () => setSeedType('pinetree'));
            document.getElementById('plantMushroom').addEventListener('click', () => setSeedType('mushroom'));
            document.getElementById('plantBamboo').addEventListener('click', () => setSeedType('bamboo'));
            document.getElementById('plantBerryBush').addEventListener('click', () => setSeedType('berrybush'));
            document.getElementById('plantLotus').addEventListener('click', () => setSeedType('lotus'));

            // TASK_002: botões de automação + modal de boas-vindas
            document.getElementById('buySprinkler').addEventListener('click', buySprinkler);
            document.getElementById('buyScarecrow').addEventListener('click', buyScarecrow);
            document.getElementById('buyHarvester').addEventListener('click', buyHarvester);
            document.getElementById('welcomeClose').addEventListener('click', () => {
                document.getElementById('welcomeModal').style.display = 'none';
            });

            // TASK_002: carregar progresso salvo e processar ganhos offline
            loadGame();
            applyWeatherEffects();
            updateGoldUI();
            processOfflineEarnings();

            // Salvar ao sair / trocar de aba (idle state)
            window.addEventListener('beforeunload', saveGame);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) saveGame();
            });

            // Iniciar loop de animação
            animate();
            updateWeather(); // Define o clima inicial
            updateAudio(); // Tenta iniciar o áudio

            // Hook de depuração/teste (TASK_002)
            window.__garden = {
                THREE, gardenState, plants, pests, SEED_INFO, UPGRADE_COSTS,
                getWeather: () => simulatedWeather,
                getMultipliers: () => ({ growth: weatherGrowthMultiplier, gold: goldMultiplier }),
                setWeather: (w) => { simulatedWeather = w; applyWeatherEffects(); updateSkyColor(); },
                plantAt: (x, z, type) => plantSeed(new THREE.Vector3(x, 0, z), type),
                plantSeed, harvestPlant, spawnPest, killPest, buySprinkler, buyScarecrow, buyHarvester,
                isPlantMature, updatePests, updateHarvesterRobots, updatePlantGrowth
            };
        }

        function setSeedType(type) {
            currentSeedType = type;
            const cost = getSeedCost(type);
            showNotification(`Semente selecionada (${cost} 🪙). Toque no chão para plantar.`, 3000);
            refreshShopAffordability();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function findPlantFromObject(obj) {
            let o = obj;
            while (o) {
                if (o.userData && o.userData.plantData) return o.userData.plantData;
                o = o.parent;
            }
            return null;
        }
        function findPestFromObject(obj) {
            let o = obj;
            while (o) {
                if (o.userData && o.userData.pestRef) return o.userData.pestRef;
                o = o.parent;
            }
            return null;
        }

        function onPointerDown(event) {
            // Calcular posição do ponteiro em coordenadas normalizadas (-1 a +1)
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            // 1. Pragas têm prioridade (clicar elimina e dá bônus)
            if (pests.length > 0) {
                const pestHits = raycaster.intersectObjects(pests.map(p => p.mesh).filter(Boolean), true);
                if (pestHits.length > 0) {
                    const pest = findPestFromObject(pestHits[0].object);
                    if (pest) { killPest(pest); return; }
                }
            }

            // 2. Plantas: morta = limpar canteiro; madura = colher; senão = regar
            const plantMeshes = plants.map(p => p.mesh).filter(Boolean);
            const plantHits = raycaster.intersectObjects(plantMeshes, true);
            if (plantHits.length > 0) {
                const plant = findPlantFromObject(plantHits[0].object);
                if (plant) {
                    if (plant.isDead) { cleanDeadPlant(plant); return; }
                    if (isPlantMature(plant)) { harvestPlant(plant); return; }
                    waterPlant(plant); return;
                }
            }

            // 3. Chão: plantar a semente selecionada
            const groundHits = raycaster.intersectObject(ground);
            if (groundHits.length > 0) {
                if (currentSeedType) {
                    plantSeed(groundHits[0].point, currentSeedType);
                } else {
                    showNotification('Selecione uma semente na loja para plantar. 🌱', 2000);
                }
            }
        }

        function cleanDeadPlant(plant) {
            if (plant.mesh) scene.remove(plant.mesh);
            if (plant.soilMesh) scene.remove(plant.soilMesh);
            const idx = plants.indexOf(plant);
            if (idx >= 0) plants.splice(idx, 1);
            showNotification('Canteiro limpo. Plante de novo! 🌱', 2500);
            saveGame();
        }

        function plantSeed(position, type) {
            // TASK_002: cobra o custo da semente
            const cost = getSeedCost(type);
            if (!spendGold(cost)) {
                showNotification(`Ouro insuficiente! ${type} custa ${cost} 🪙.`, 2500);
                return;
            }

            // Adicionar variabilidade de tamanho para cada planta individual
            const sizeVariation = 0.85 + Math.random() * 0.3; // Variação de 85% a 115% do tamanho normal

            const plantData = {
                id: THREE.MathUtils.generateUUID(),
                type: type,
                position: position.clone(),
                plantedTime: clock.getElapsedTime(),
                growthStage: 0,
                mesh: null,
                notifiedStages: {},
                sizeVariation: sizeVariation, // Armazenar o fator de escala para esta planta
                bloomColor: type === 'flower' ? flowerBloomColors[Math.floor(Math.random() * flowerBloomColors.length)] : null,
                moisture: 100,   // TASK_002: umidade do solo
                growTimer: 0,    // segundos efetivos de crescimento
                isDead: false,
                hasPest: false
            };

            plantData.mesh = createPlantMesh(plantData);
            plantData.mesh.position.copy(position); // Colocar na posição correta
            plantData.mesh.position.y += 0.1; // Elevar um pouco para evitar z-fighting inicial
            plantData.mesh.castShadow = true;

            plantData.mesh.userData.plantData = plantData;
            scene.add(plantData.mesh);

            // Anel de terra (indicador de umidade)
            const soilGeo = new THREE.RingGeometry(0.35, 0.6, 24);
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x3D2314, side: THREE.DoubleSide });
            const soilMesh = new THREE.Mesh(soilGeo, soilMat);
            soilMesh.rotation.x = -Math.PI / 2;
            soilMesh.position.copy(position);
            soilMesh.position.y = 0.02;
            soilMesh.receiveShadow = true;
            scene.add(soilMesh);
            plantData.soilMesh = soilMesh;

            plants.push(plantData);
            showFloatingText(`-${cost} 🪙`, position, '#ff8a80');
            saveGame();
        }

        function getPlantStages(type) {
            switch (type) {
                case 'flower': return ['seed', 'sprout', 'bud', 'bloom'];
                case 'tree': return ['seed', 'sapling', 'growing', 'mature'];
                case 'pinetree': return ['seed', 'sapling', 'growing', 'mature', 'ancient'];
                case 'mushroom': return ['spore', 'small', 'grown'];
                case 'bamboo': return ['seed', 'shoot', 'cluster', 'dense'];
                case 'berrybush': return ['seed', 'sapling', 'foliage', 'berry'];
                case 'lotus': return ['spore', 'pad', 'bud', 'bloom'];
                default: return [];
            }
        }

        // TASK_002: retorna a duração BASE do estágio. O efeito do clima agora é
        // aplicado globalmente via weatherGrowthMultiplier + umidade do solo no loop de crescimento.
        function getGrowthDuration(type, stageName) {
            if (growthTimes[type] && growthTimes[type][stageName] !== undefined) {
                return growthTimes[type][stageName];
            }
            return Infinity;
        }

        function createCloudMesh() {
            const cloudGroup = new THREE.Group();
            const cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.9 });

            const numBlobs = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < numBlobs; i++) {
                const radius = 1 + Math.random() * 1.5;
                const geometry = new THREE.SphereGeometry(radius, 8, 8);
                const blob = new THREE.Mesh(geometry, cloudMaterial);
                blob.position.set(
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 2
                );
                cloudGroup.add(blob);
            }
            return cloudGroup;
        }

        function addCloud() {
            const cloud = createCloudMesh();
            cloud.position.set(
                (Math.random() - 0.5) * 80,
                15 + Math.random() * 10,
                (Math.random() - 0.5) * 80
            );
            cloud.userData = {
                speed: 0.5 + Math.random() * 1.5
            };
            scene.add(cloud);
            clouds.push(cloud);
        }

        function updateClouds(deltaTime) {
            clouds.forEach(cloud => {
                cloud.position.x += cloud.userData.speed * deltaTime;
                if (cloud.position.x > 50) {
                    cloud.position.x = -50;
                    cloud.position.z = (Math.random() - 0.5) * 80;
                }
            });
        }

        function createPlantMesh(plantData) {
            const stages = getPlantStages(plantData.type);
            const stageName = stages[plantData.growthStage];
            let geometry, material, mesh;
            const sizeVariation = plantData.sizeVariation || 1.0;

            switch (plantData.type) {
                case 'flower':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.8 });
                    if (stageName === 'seed') {
                        geometry = new THREE.SphereGeometry(0.08 * sizeVariation, 8, 6);
                        material.color.set(0x8B4513);
                    } else if (stageName === 'sprout') {
                        geometry = new THREE.ConeGeometry(0.12 * sizeVariation, 0.3 * sizeVariation, 8);
                        material.color.set(0x90EE90);
                        mesh = new THREE.Mesh(geometry, material);
                        mesh.position.y = 0.15 * sizeVariation;
                        return mesh;
                    } else if (stageName === 'bud') {
                        geometry = new THREE.SphereGeometry(0.2 * sizeVariation, 8, 6);
                        material.color.set(0xFFC0CB);
                    } else {
                        geometry = new THREE.SphereGeometry(0.3 * sizeVariation, 16, 12);
                        material.color.set(plantData.bloomColor || 0xFF69B4);
                    }
                    break;

                case 'tree':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.8 });
                    const trunkHeight = [0.1, 0.8, 1.5, 3.0][plantData.growthStage] * sizeVariation;
                    const trunkRadius = [0.05, 0.1, 0.2, 0.4][plantData.growthStage] * sizeVariation;
                    const leavesRadius = [0.1, 0.5, 1.0, 1.8][plantData.growthStage] * sizeVariation;
                    const leavesColor = stageName === 'seed' ? 0x8B4513 : 0x006400;

                    const trunkGeo = new THREE.CylinderGeometry(trunkRadius * 0.8, trunkRadius, trunkHeight, 8);
                    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
                    trunkMesh.castShadow = true;
                    trunkMesh.position.y = trunkHeight / 2;

                    mesh = new THREE.Group();
                    mesh.add(trunkMesh);

                    if (stageName !== 'seed') {
                        const leavesGeo = new THREE.SphereGeometry(leavesRadius, 16, 12);
                        const colorVariation = -0.1 + Math.random() * 0.2;
                        const baseColor = new THREE.Color(leavesColor);
                        baseColor.r = Math.max(0, Math.min(1, baseColor.r * (1 + colorVariation * 0.3)));
                        baseColor.g = Math.max(0, Math.min(1, baseColor.g * (1 + colorVariation)));
                        baseColor.b = Math.max(0, Math.min(1, baseColor.b * (1 + colorVariation * 0.3)));

                        const leavesMat = new THREE.MeshStandardMaterial({ color: baseColor });
                        const leavesMesh = new THREE.Mesh(leavesGeo, leavesMat);
                        leavesMesh.castShadow = true;
                        leavesMesh.position.y = trunkHeight + leavesRadius * 0.7;
                        mesh.add(leavesMesh);
                    }
                    return mesh;

                case 'pinetree':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.8 });
                    const pineHeight = [0.1, 1.5, 3.0, 6.0, 11.0][plantData.growthStage] * sizeVariation;
                    const pineTrunkRadius = [0.05, 0.1, 0.2, 0.35, 0.5][plantData.growthStage] * sizeVariation;
                    const pineTrunkColor = 0x5C4033;

                    const pineTrunkGeo = new THREE.CylinderGeometry(pineTrunkRadius * 0.8, pineTrunkRadius, pineHeight, 10);
                    const pineTrunkMat = new THREE.MeshStandardMaterial({ color: pineTrunkColor });
                    const pineTrunkMesh = new THREE.Mesh(pineTrunkGeo, pineTrunkMat);
                    pineTrunkMesh.castShadow = true;
                    pineTrunkMesh.position.y = pineHeight / 2;

                    mesh = new THREE.Group();
                    mesh.add(pineTrunkMesh);

                    if (stageName !== 'seed') {
                        const numLayers = plantData.growthStage === 1 ? 1 :
                            plantData.growthStage === 2 ? 3 :
                                plantData.growthStage === 3 ? 4 : 5;

                        let pineGreen = plantData.growthStage === 4 ? 0x1A4D2E : 0x2E8B57;
                        const colorVariation = -0.1 + Math.random() * 0.2;
                        const baseColor = new THREE.Color(pineGreen);
                        baseColor.g = Math.max(0, Math.min(1, baseColor.g * (1 + colorVariation)));
                        baseColor.b = Math.max(0, Math.min(1, baseColor.b * (1 + colorVariation * 0.5)));
                        pineGreen = baseColor;

                        for (let i = 0; i < numLayers; i++) {
                            const layerVariation = 0.95 + Math.random() * 0.1;
                            const layerHeight = pineHeight * (0.45 - i * 0.05) * layerVariation;
                            const layerRadius = pineHeight * (0.35 - i * 0.03) * layerVariation;
                            const layerY = pineHeight * (stageName === 'ancient' ? (0.5 + i * 0.12) : (0.55 + i * 0.15));

                            const coneGeo = new THREE.ConeGeometry(layerRadius, layerHeight, 10);
                            const coneMat = new THREE.MeshStandardMaterial({ color: pineGreen, roughness: 0.9, flatShading: true });
                            const coneMesh = new THREE.Mesh(coneGeo, coneMat);
                            coneMesh.castShadow = true;
                            coneMesh.position.y = layerY;
                            mesh.add(coneMesh);
                        }

                        if (stageName === 'ancient') {
                            const barkDetails = 15 + Math.floor(Math.random() * 10);
                            for (let i = 0; i < barkDetails; i++) {
                                const barkSize = (0.1 + Math.random() * 0.2) * sizeVariation;
                                const barkGeo = new THREE.BoxGeometry(barkSize, barkSize * 0.5, barkSize);
                                const barkMat = new THREE.MeshStandardMaterial({ color: 0x4B3621, roughness: 1.0 });
                                const barkMesh = new THREE.Mesh(barkGeo, barkMat);
                                const angle = Math.random() * Math.PI * 2;
                                const trunkOffset = pineTrunkRadius * 0.9;
                                const height = Math.random() * pineHeight * 0.8;
                                barkMesh.position.set(Math.cos(angle) * trunkOffset, height, Math.sin(angle) * trunkOffset);
                                barkMesh.rotation.set(Math.random() * 0.5, Math.random() * Math.PI * 2, Math.random() * 0.5);
                                mesh.add(barkMesh);
                            }
                        }
                    }
                    return mesh;

                case 'mushroom':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.7 });
                    const mushStemHeight = [0.05, 0.2, 0.4][plantData.growthStage] * sizeVariation;
                    const mushCapRadius = [0.05, 0.25, 0.5][plantData.growthStage] * sizeVariation;

                    const stemHue = Math.random() * 0.1;
                    const stemColor = new THREE.Color(0xFFFACD).lerp(new THREE.Color(0xFFF0C0), stemHue);
                    const capHue = Math.random() * 0.2;
                    const baseCapColor = stageName === 'spore' ? 0xD2B48C : 0xDC143C;
                    const capColor = new THREE.Color(baseCapColor).lerp(stageName === 'spore' ? new THREE.Color(0xC2A478) : new THREE.Color(0xFF0000), capHue);

                    const stemGeo = new THREE.CylinderGeometry(mushStemHeight * 0.3, mushStemHeight * 0.4, mushStemHeight, 8);
                    const stemMat = new THREE.MeshStandardMaterial({ color: stemColor });
                    const stemMesh = new THREE.Mesh(stemGeo, stemMat);
                    stemMesh.castShadow = true;
                    stemMesh.position.y = mushStemHeight / 2;

                    mesh = new THREE.Group();
                    mesh.add(stemMesh);

                    if (stageName !== 'spore') {
                        const capGeo = new THREE.SphereGeometry(mushCapRadius, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
                        const capMat = new THREE.MeshStandardMaterial({ color: capColor });
                        const capMesh = new THREE.Mesh(capGeo, capMat);
                        capMesh.castShadow = true;
                        capMesh.position.y = mushStemHeight;
                        mesh.add(capMesh);
                    }
                    return mesh;

                case 'bamboo':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.6 });
                    const bambooColor = 0x6B8E23;
                    if (stageName === 'seed') {
                        geometry = new THREE.SphereGeometry(0.05 * sizeVariation, 8, 6);
                        material.color.set(0x8B4513);
                    } else {
                        mesh = new THREE.Group();
                        const numStalks = stageName === 'shoot' ? 1 : (stageName === 'cluster' ? 4 : 10);
                        const heightBase = stageName === 'shoot' ? 0.5 : (stageName === 'cluster' ? 1.2 : 2.5);

                        for (let i = 0; i < numStalks; i++) {
                            const h = heightBase * (0.8 + Math.random() * 0.4) * sizeVariation;
                            const r = 0.03 * sizeVariation;
                            const stalkGeo = new THREE.CylinderGeometry(r, r, h, 6);
                            const stalkMat = new THREE.MeshStandardMaterial({ color: bambooColor });
                            const stalk = new THREE.Mesh(stalkGeo, stalkMat);
                            stalk.castShadow = true;
                            const offset = stageName === 'shoot' ? 0 : (0.1 + Math.random() * 0.2);
                            const angle = Math.random() * Math.PI * 2;
                            stalk.position.set(Math.cos(angle) * offset, h / 2, Math.sin(angle) * offset);
                            stalk.rotation.x = (Math.random() - 0.5) * 0.2;
                            stalk.rotation.z = (Math.random() - 0.5) * 0.2;
                            mesh.add(stalk);

                            if (stageName !== 'shoot') {
                                const numLeaves = stageName === 'cluster' ? 2 : 5;
                                for (let j = 0; j < numLeaves; j++) {
                                    const leafGeo = new THREE.ConeGeometry(0.05, 0.2, 4);
                                    const leafMat = new THREE.MeshStandardMaterial({ color: 0x9ACD32 });
                                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                                    const leafH = Math.random() * h;
                                    leaf.position.set(0, leafH - h / 2, 0);
                                    leaf.rotation.z = Math.PI / 3;
                                    leaf.rotation.y = Math.random() * Math.PI * 2;
                                    stalk.add(leaf);
                                }
                            }
                        }
                        return mesh;
                    }
                    break;

                case 'berrybush':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.8 });
                    if (stageName === 'seed') {
                        geometry = new THREE.SphereGeometry(0.06 * sizeVariation, 8, 6);
                        material.color.set(0x8B4513);
                    } else if (stageName === 'sapling') {
                        mesh = new THREE.Group();
                        const trunkGeo = new THREE.CylinderGeometry(0.02 * sizeVariation, 0.03 * sizeVariation, 0.4 * sizeVariation, 6);
                        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                        trunk.position.y = 0.2 * sizeVariation;
                        mesh.add(trunk);

                        const foliageGeo = new THREE.SphereGeometry(0.15 * sizeVariation, 8, 8);
                        const foliageMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
                        const foliage = new THREE.Mesh(foliageGeo, foliageMat);
                        foliage.position.y = 0.4 * sizeVariation;
                        mesh.add(foliage);
                        return mesh;
                    } else {
                        mesh = new THREE.Group();
                        const mainBushGeo = new THREE.SphereGeometry(0.5 * sizeVariation, 16, 12);
                        const bushColor = 0x006400;
                        const bushMat = new THREE.MeshStandardMaterial({ color: bushColor, roughness: 1.0 });
                        const mainBush = new THREE.Mesh(mainBushGeo, bushMat);
                        mainBush.position.y = 0.4 * sizeVariation;
                        mainBush.scale.y = 0.8;
                        mesh.add(mainBush);

                        if (stageName === 'berry') {
                            const numBerries = 10 + Math.floor(Math.random() * 10);
                            const berryGeo = new THREE.SphereGeometry(0.05 * sizeVariation, 6, 6);
                            const berryMat = new THREE.MeshStandardMaterial({ color: 0xFF0000, roughness: 0.4 });

                            for (let i = 0; i < numBerries; i++) {
                                const berry = new THREE.Mesh(berryGeo, berryMat);
                                const u = Math.random();
                                const v = Math.random();
                                const theta = 2 * Math.PI * u;
                                const phi = Math.acos(2 * v - 1);
                                const r = 0.45 * sizeVariation;
                                berry.position.set(
                                    r * Math.sin(phi) * Math.cos(theta),
                                    0.4 * sizeVariation + r * Math.sin(phi) * Math.sin(theta) * 0.8,
                                    r * Math.cos(phi)
                                );
                                mesh.add(berry);
                            }
                        }
                        return mesh;
                    }
                    break;

                case 'lotus':
                    material = new THREE.MeshStandardMaterial({ roughness: 0.5 });
                    if (stageName === 'spore') {
                        geometry = new THREE.SphereGeometry(0.04 * sizeVariation, 8, 6);
                        material.color.set(0x4B0082); // Indigo
                    } else {
                        mesh = new THREE.Group();

                        // Pad (Folha)
                        const padGeo = new THREE.CircleGeometry(0.3 * sizeVariation, 16);
                        const padMat = new THREE.MeshStandardMaterial({ color: 0x228B22, side: THREE.DoubleSide });
                        const pad = new THREE.Mesh(padGeo, padMat);
                        pad.rotation.x = -Math.PI / 2;
                        pad.position.y = 0.05; // Flutuando levemente
                        mesh.add(pad);

                        // Corte na folha (estilo vitória régia) - visual simples
                        // (Poderia ser feito com geometria customizada, mas círculo serve por enquanto)

                        if (stageName === 'bud' || stageName === 'bloom') {
                            const budSize = stageName === 'bud' ? 0.1 : 0.25;
                            const budColor = 0xFF69B4; // HotPink
                            const budGeo = new THREE.SphereGeometry(budSize * sizeVariation, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
                            const budMat = new THREE.MeshStandardMaterial({ color: budColor });

                            if (stageName === 'bloom') {
                                budMat.emissive = new THREE.Color(0xFF1493); // Brilho base
                                budMat.emissiveIntensity = 0.2;
                                // Lógica de brilho noturno será tratada no updateTimeOfDay ou aqui se tiver acesso ao timeOfDay
                            }

                            const flower = new THREE.Mesh(budGeo, budMat);
                            flower.position.y = 0.05;
                            mesh.add(flower);
                        }
                        return mesh;
                    }
                    break;
            }

            if (!mesh && geometry) {
                mesh = new THREE.Mesh(geometry, material);
                mesh.position.y = (geometry.parameters.height || geometry.parameters.radius * 2 || 0.2) / 2;
            }
            return mesh;
        }

        function isPlantMature(plant) {
            const stages = getPlantStages(plant.type);
            return plant.growthStage >= stages.length - 1;
        }

        function rebuildPlantMesh(plant) {
            if (plant.mesh) scene.remove(plant.mesh);
            plant.mesh = createPlantMesh(plant);
            if (plant.mesh) {
                plant.mesh.position.copy(plant.position);
                if (plant.mesh.type === 'Group') {
                    plant.mesh.position.y = plant.position.y;
                } else {
                    plant.mesh.position.y = plant.position.y + (plant.mesh.geometry?.parameters?.height / 2 || plant.mesh.geometry?.parameters?.radius || 0.1);
                }
                plant.mesh.castShadow = true;
                plant.mesh.userData.plantData = plant;
                scene.add(plant.mesh);
            }
        }

        function updateSoilColor(plant) {
            if (!plant.soilMesh) return;
            const wet = (plant.moisture ?? 100) >= 30;
            plant.soilMesh.material.color.set(wet ? 0x3D2314 : 0x9A8A78);
        }

        function notifyMaturity(plant, newStageName) {
            const isMatureStage =
                (plant.type === 'flower' && newStageName === 'bloom') ||
                (plant.type === 'tree' && newStageName === 'mature') ||
                (plant.type === 'pinetree' && (newStageName === 'mature' || newStageName === 'ancient')) ||
                (plant.type === 'mushroom' && newStageName === 'grown') ||
                (plant.type === 'bamboo' && newStageName === 'dense') ||
                (plant.type === 'berrybush' && newStageName === 'berry') ||
                (plant.type === 'lotus' && newStageName === 'bloom');
            if (!isMatureStage || plant.notifiedStages[newStageName]) return;
            const messages = {
                'flower': `Sua flor desabrochou! 🌸 Clique para colher.`,
                'tree': `Sua árvore está madura! 🌳 Clique para colher.`,
                'pinetree': `Seu pinheiro está pronto! 🌲 Clique para colher.`,
                'mushroom': `Seu cogumelo cresceu! 🍄 Clique para colher.`,
                'bamboo': `Seu bambuzal está denso! 🎋 Clique para colher.`,
                'berrybush': `Seu arbusto deu frutos! 🍒 Clique para colher.`,
                'lotus': `Sua lótus desabrochou! 🪷 Clique para colher.`
            };
            showNotification(messages[plant.type] || 'Planta pronta para colheita!', 4000);
            try { notificationSound.play(); } catch (e) { }
            plant.notifiedStages[newStageName] = true;
        }

        function updatePlantGrowth(deltaTime) {
            plants.forEach(plant => {
                if (!plant.mesh) return;

                // Umidade do solo: chuva ou regador mantêm em 100%; senão decai
                if (simulatedWeather === 'rainy' || gardenState.sprinklerActive) {
                    plant.moisture = 100;
                } else {
                    const decay = simulatedWeather === 'drought' ? 2 : 1; // %/s
                    plant.moisture = Math.max(0, (plant.moisture ?? 100) - decay * deltaTime);
                }
                updateSoilColor(plant);

                if (plant.isDead) return;            // planta morta não cresce
                if (isPlantMature(plant)) return;    // já madura

                // Velocidade de crescimento efetiva = clima * solo
                const soilMult = (plant.moisture > 0) ? 1.0 : 0.1;
                plant.growTimer = (plant.growTimer || 0) + deltaTime * weatherGrowthMultiplier * soilMult;

                const stages = getPlantStages(plant.type);
                let cumulativeTime = 0;
                for (let i = 1; i <= plant.growthStage + 1; i++) {
                    cumulativeTime += getGrowthDuration(plant.type, stages[i]);
                }

                if (plant.growTimer >= cumulativeTime) {
                    plant.growthStage++;
                    rebuildPlantMesh(plant);
                    notifyMaturity(plant, stages[plant.growthStage]);
                }
            });
        }

        // Colhe uma planta madura: paga ouro (x1.5 na seca) e reinicia o ciclo
        function harvestPlant(plant, auto = false) {
            if (!plant || plant.isDead || !isPlantMature(plant)) return false;
            const value = Math.round(getHarvestValue(plant.type) * goldMultiplier);
            addGold(value);
            showFloatingText(`+${value} 🪙${auto ? ' (Auto)' : ''}`, plant.position, '#ffd54a');
            try { notificationSound.play(); } catch (e) { }
            // Reinicia o ciclo de crescimento (volta para semente)
            plant.growthStage = 0;
            plant.growTimer = 0;
            plant.plantedTime = clock.getElapsedTime();
            plant.notifiedStages = {};
            rebuildPlantMesh(plant);
            return true;
        }

        function waterPlant(plant) {
            plant.moisture = 100;
            updateSoilColor(plant);
            showFloatingText('💧', plant.position, '#4fc3f7');
        }

        function weatherLabel() {
            return simulatedWeather === 'sunny' ? 'Ensolarado ☀️'
                 : simulatedWeather === 'rainy' ? 'Chuvoso 🌧️'
                 : 'Seca 🏜️';
        }

        function applyWeatherEffects() {
            if (simulatedWeather === 'rainy') { weatherGrowthMultiplier = 2.0; goldMultiplier = 1.0; }
            else if (simulatedWeather === 'drought') { weatherGrowthMultiplier = 0.5; goldMultiplier = 1.5; }
            else { weatherGrowthMultiplier = 1.0; goldMultiplier = 1.0; }
            setRainVisible(simulatedWeather === 'rainy');
        }

        function updateWeather(deltaTime = 0) {
            timeSinceLastWeatherChange += deltaTime;
            if (timeSinceLastWeatherChange > weatherChangeInterval) {
                timeSinceLastWeatherChange = 0;
                const prevState = simulatedWeather;
                // Sorteio ponderado: 60% sol / 25% chuva / 15% seca
                const r = Math.random();
                simulatedWeather = r < 0.60 ? 'sunny' : (r < 0.85 ? 'rainy' : 'drought');
                if (prevState !== simulatedWeather) {
                    applyWeatherEffects();
                    updateAudio();
                    updateSkyColor();
                    showNotification(`O clima mudou: ${weatherLabel()}`, 3000);
                }
            }
            weatherStatusElement.textContent = `Clima: ${weatherLabel()}`;
        }

        // === TASK_002: Sistema de partículas de chuva ===
        let rainPoints = null;
        function createRain() {
            const count = 1500;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 60;
                positions[i * 3 + 1] = Math.random() * 40;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x99bbff, size: 0.15, transparent: true, opacity: 0.6 });
            rainPoints = new THREE.Points(geo, mat);
            rainPoints.visible = false;
            scene.add(rainPoints);
        }
        function setRainVisible(v) { if (rainPoints) rainPoints.visible = v; }
        function updateRain(deltaTime) {
            if (!rainPoints || !rainPoints.visible) return;
            const pos = rainPoints.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let y = pos.getY(i) - deltaTime * 25;
                if (y < 0) y = 40;
                pos.setY(i, y);
            }
            pos.needsUpdate = true;
        }

        function updateTimeOfDay(deltaTime) {
            timeAccumulator += deltaTime * timeSpeed;
            const cycleTime = timeAccumulator % dayDuration;
            const dayProgress = cycleTime / dayDuration;

            const prevTimeOfDay = timeOfDay;

            if (dayProgress < 0.45 || dayProgress > 0.95) { // Dia (0-0.45) e (0.95-1 -> amanhecer)
                timeOfDay = 'day';
            } else if (dayProgress >= 0.45 && dayProgress < 0.55) { // Crepúsculo (0.45-0.55)
                timeOfDay = 'evening';
            } else { // Noite (0.55 - 0.95)
                timeOfDay = 'night';
            }


            if (prevTimeOfDay !== timeOfDay) {
                console.log(`Time changed to: ${timeOfDay}`);
                updateAudio(); // Atualiza o som ambiente
                updateSkyColor();

                // Se mudou de noite para outro período, remove todos os vagalumes
                if (prevTimeOfDay === 'night' && timeOfDay !== 'night') {
                    // Remover todos os vagalumes quando o dia começa
                    for (let i = butterflies.length - 1; i >= 0; i--) {
                        scene.remove(butterflies[i]);
                    }
                    butterflies.length = 0; // Limpar o array
                }
            }
            timeStatusElement.textContent = `Hora: ${timeOfDay === 'day' ? 'Dia ☀️' : (timeOfDay === 'evening' ? 'Entardecer 🌇' : 'Noite 🌙')}`;

            // Atualizar luz direcional (simular sol/lua)
            const sunAngle = dayProgress * Math.PI * 2 - Math.PI / 2; // Ciclo completo de 2PI, começando do horizonte leste
            const light = scene.getObjectByProperty('isDirectionalLight', true);
            if (light) {
                light.position.set(Math.cos(sunAngle) * 15, Math.sin(sunAngle) * 10 + 5, 10); // Movimento no céu
                light.intensity = timeOfDay === 'night' ? 0.3 : (timeOfDay === 'evening' ? 0.8 : 1.5); // Mais fraco à noite
                light.color.set(timeOfDay === 'night' ? 0xaaaaff : (timeOfDay === 'evening' ? 0xffccaa : 0xffffff)); // Cor da luz
                light.target.position.set(0, 0, 0); // Manter olhando para o centro
            }
            const ambient = scene.getObjectByProperty('isAmbientLight', true);
            if (ambient) {
                ambient.intensity = timeOfDay === 'night' ? 0.2 : (timeOfDay === 'evening' ? 0.4 : 0.6);
            }

            // Atualizar brilho da Lótus
            plants.forEach(plant => {
                if (plant.type === 'lotus' && plant.growthStage === 3 && plant.mesh) { // Bloom
                    // Encontrar a parte da flor (último filho adicionado)
                    const flower = plant.mesh.children[plant.mesh.children.length - 1];
                    if (flower && flower.material) {
                        flower.material.emissiveIntensity = timeOfDay === 'night' ? 1.0 : 0.2;
                    }
                }
            });
        }

        function updateSkyColor() {
            let skyCol = new THREE.Color(0x87CEEB); // Dia
            let groundCol = new THREE.Color(0x228B22); // Grama dia

            if (timeOfDay === 'evening') {
                skyCol.set(0xFF8C00); // Laranja
                groundCol.lerp(new THREE.Color(0x556B2F), 0.3); // Verde mais escuro
            } else if (timeOfDay === 'night') {
                skyCol.set(0x000033); // Azul escuro
                groundCol.set(0x1A4D2E); // Verde bem escuro
            }

            // Modificador de clima
            if (simulatedWeather === 'rainy') {
                skyCol.lerp(new THREE.Color(0x778899), 0.6); // Cinza
                groundCol.lerp(new THREE.Color(0x1E5631), 0.4); // Verde mais escuro/molhado
            } else if (simulatedWeather === 'drought') {
                skyCol.lerp(new THREE.Color(0xE08B5E), 0.5); // Entardecer desértico quente
                groundCol.lerp(new THREE.Color(0x9A8A78), 0.45); // Terra seca/bege
            }

            // scene.background = skyCol; // Muda o fundo da cena
            if (sky && sky.material) {
                sky.material.color = skyCol; // Muda a cor do sky dome
            }
            if (ground && ground.material) {
                ground.material.color = groundCol;
            }
        }

        function updateButterflies(deltaTime) {
            if (timeOfDay !== 'night') return; // Apenas à noite

            // Adicionar novos vagalumes ocasionalmente
            if (butterflies.length < 15 && Math.random() < 0.05) {
                addFirefly();
            }

            butterflies.forEach(firefly => {
                firefly.userData.angle += deltaTime * firefly.userData.speed;
                firefly.position.x += Math.cos(firefly.userData.angle) * 0.05;
                firefly.position.z += Math.sin(firefly.userData.angle) * 0.05;
                firefly.position.y += (Math.random() - 0.5) * 0.05;

                // Manter dentro dos limites
                if (firefly.position.y < 0.5) firefly.position.y = 0.5;
                if (firefly.position.y > 4) firefly.position.y = 4;
            });
        }

        function addFirefly() {
            const geometry = new THREE.SphereGeometry(0.05, 4, 4);
            const material = new THREE.MeshBasicMaterial({ color: 0xFFFF00 });
            const firefly = new THREE.Mesh(geometry, material);

            firefly.position.set(
                (Math.random() - 0.5) * 20,
                0.5 + Math.random() * 2,
                (Math.random() - 0.5) * 20
            );

            firefly.userData = {
                angle: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random()
            };

            scene.add(firefly);
            butterflies.push(firefly);
        }

        function showNotification(message, duration = 3000) {
            notificationElement.textContent = message;
            notificationElement.style.display = 'block';
            setTimeout(() => {
                notificationElement.style.display = 'none';
            }, duration);
        }

        function updateAudio() {
            // Lógica simples de áudio baseada no estado
            if (simulatedWeather === 'rainy') {
                rainSound.volume = 0.5;
                if (rainSound.paused) rainSound.play().catch(e => { });
            } else {
                if (!rainSound.paused) rainSound.pause();
            }

            if (timeOfDay === 'day') {
                ambientSoundDay.volume = 0.3;
                if (ambientSoundDay.paused) ambientSoundDay.play().catch(e => { });
                if (!ambientSoundNight.paused) ambientSoundNight.pause();
            } else {
                ambientSoundNight.volume = 0.3;
                if (ambientSoundNight.paused) ambientSoundNight.play().catch(e => { });
                if (!ambientSoundDay.paused) ambientSoundDay.pause();
            }
        }

        // === TASK_002: Pragas (lagartas) ===
        function createCaterpillarMesh() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.6 });
            for (let i = 0; i < 3; i++) {
                const seg = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), bodyMat);
                seg.position.x = (i - 1) * 0.2;
                seg.castShadow = true;
                group.add(seg);
            }
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            [-0.07, 0.07].forEach(dz => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), eyeMat);
                eye.position.set(0.32, 0.06, dz);
                group.add(eye);
            });
            return group;
        }

        function spawnPest() {
            if (gardenState.ultrasonicScarecrow) return;
            const candidates = plants.filter(p => !p.isDead && !p.hasPest && p.growthStage >= 1 && p.mesh);
            if (candidates.length === 0) return;
            const target = candidates[Math.floor(Math.random() * candidates.length)];
            target.hasPest = true;

            const mesh = createCaterpillarMesh();
            mesh.position.copy(target.position);
            mesh.position.y = target.position.y + 0.6;

            // Barra de tempo vermelha
            const bar = new THREE.Mesh(
                new THREE.PlaneGeometry(0.6, 0.08),
                new THREE.MeshBasicMaterial({ color: 0xff3333, side: THREE.DoubleSide })
            );
            bar.position.set(0, 0.45, 0);
            mesh.add(bar);

            const pest = { plant: target, mesh, bar, timeLeft: 12, maxTime: 12 };
            mesh.userData.pestRef = pest;
            scene.add(mesh);
            pests.push(pest);
            showNotification('🐛 Uma praga apareceu! Clique nela para eliminá-la!', 4000);
            try { notificationSound.play(); } catch (e) { }
        }

        function updatePests(deltaTime) {
            if (!gardenState.ultrasonicScarecrow) {
                timeSinceLastPest += deltaTime;
                if (timeSinceLastPest >= nextPestInterval) {
                    timeSinceLastPest = 0;
                    nextPestInterval = 60 + Math.random() * 60; // 60..120s
                    spawnPest();
                }
            }
            for (let i = pests.length - 1; i >= 0; i--) {
                const pest = pests[i];
                pest.timeLeft -= deltaTime;
                pest.mesh.rotation.y += deltaTime * 2; // wiggle
                pest.bar.scale.x = Math.max(0.001, pest.timeLeft / pest.maxTime);
                pest.bar.lookAt(camera.position);
                if (pest.timeLeft <= 0) pestDevoursPlant(pest);
            }
        }

        function killPest(pest) {
            addGold(15);
            showFloatingText('+15 🪙', pest.plant.position, '#8bc34a');
            spawnPestParticles(pest.mesh.position.clone());
            removePest(pest);
            showNotification('Praga eliminada! +15 🪙 de controle biológico. 🐛💥', 2500);
        }

        function removePest(pest) {
            if (pest.mesh) scene.remove(pest.mesh);
            if (pest.plant) pest.plant.hasPest = false;
            const idx = pests.indexOf(pest);
            if (idx >= 0) pests.splice(idx, 1);
        }

        function pestDevoursPlant(pest) {
            const plant = pest.plant;
            removePest(pest);
            if (!plant || plant.isDead) return;
            plant.isDead = true;
            if (plant.mesh) scene.remove(plant.mesh);
            const stump = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.13, 0.45, 6),
                new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 1.0 })
            );
            stump.position.copy(plant.position);
            stump.position.y = plant.position.y + 0.22;
            stump.rotation.z = 0.3;
            stump.castShadow = true;
            stump.userData.plantData = plant;
            plant.mesh = stump;
            scene.add(stump);
            showNotification('😢 Uma praga devorou sua planta! Clique no tronco seco para limpar.', 4500);
            saveGame();
        }

        function spawnPestParticles(pos) {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0x8bc34a });
            const parts = [];
            for (let i = 0; i < 12; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 4), mat);
                p.position.copy(pos);
                parts.push({ mesh: p, vel: new THREE.Vector3((Math.random() - 0.5), Math.random(), (Math.random() - 0.5)).multiplyScalar(2.5) });
                group.add(p);
            }
            scene.add(group);
            let life = 0.6;
            (function anim() {
                const dt = 0.016;
                life -= dt;
                parts.forEach(pp => { pp.mesh.position.addScaledVector(pp.vel, dt); pp.vel.y -= 5 * dt; });
                if (life > 0) requestAnimationFrame(anim); else scene.remove(group);
            })();
        }

        // === TASK_002: Robô colheitadeiro (idle) ===
        function createHarvesterRobot() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.7, roughness: 0.3 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd54a, metalness: 0.8, roughness: 0.2 });
            const neonMat = new THREE.MeshStandardMaterial({ color: 0x2196f3, emissive: 0x2196f3, emissiveIntensity: 1.0 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.0), bodyMat);
            body.position.y = 0.35; body.castShadow = true; group.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), goldMat);
            cabin.position.set(0, 0.65, -0.1); group.add(cabin);
            [-0.4, 0.4].forEach(x => [-0.45, 0.45].forEach(z => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                wheel.rotation.z = Math.PI / 2; wheel.position.set(x, 0.18, z); group.add(wheel);
            }));
            const light = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), neonMat);
            light.position.set(0, 0.85, -0.1); group.add(light);
            group.position.set(-8, 0, -8);
            return group;
        }

        function ensureHarvesterRobot() {
            if (!harvesterRobotMesh && gardenState.harvesterRobots > 0) {
                harvesterRobotMesh = createHarvesterRobot();
                scene.add(harvesterRobotMesh);
            }
        }

        function fireHarvestLaser(fromPos, toPos) {
            const geo = new THREE.BufferGeometry().setFromPoints([fromPos, toPos]);
            const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x2196f3, transparent: true, opacity: 0.9 }));
            scene.add(line);
            setTimeout(() => scene.remove(line), 200);
        }

        function updateHarvesterRobots(deltaTime) {
            if (gardenState.harvesterRobots <= 0) return;
            ensureHarvesterRobot();
            harvesterTimer += deltaTime;
            if (harvesterTimer < HARVEST_INTERVAL) return;
            harvesterTimer = 0;
            const mature = plants.filter(p => !p.isDead && isPlantMature(p));
            mature.slice(0, gardenState.harvesterRobots).forEach(plant => {
                if (harvesterRobotMesh) {
                    const from = harvesterRobotMesh.position.clone(); from.y = 0.7;
                    const to = plant.position.clone(); to.y += 0.3;
                    fireHarvestLaser(from, to);
                }
                harvestPlant(plant, true);
            });
        }

        // === TASK_002: Persistência + ganhos offline (idle) ===
        function saveGame() {
            try {
                gardenState.lastActiveTimestamp = Date.now();
                const data = {
                    gold: gardenState.gold,
                    sprinklerActive: gardenState.sprinklerActive,
                    harvesterRobots: gardenState.harvesterRobots,
                    ultrasonicScarecrow: gardenState.ultrasonicScarecrow,
                    lastActiveTimestamp: gardenState.lastActiveTimestamp,
                    plants: plants.map(p => ({
                        type: p.type, x: p.position.x, y: p.position.y, z: p.position.z,
                        growthStage: p.growthStage, growTimer: p.growTimer, moisture: p.moisture,
                        isDead: p.isDead, bloomColor: p.bloomColor, sizeVariation: p.sizeVariation
                    }))
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('Falha ao salvar:', e); }
        }

        function loadGame() {
            let data;
            try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { data = null; }
            if (!data) return;
            gardenState.gold = data.gold ?? 100;
            gardenState.sprinklerActive = !!data.sprinklerActive;
            gardenState.harvesterRobots = data.harvesterRobots || 0;
            gardenState.ultrasonicScarecrow = !!data.ultrasonicScarecrow;
            gardenState.lastActiveTimestamp = data.lastActiveTimestamp || Date.now();

            (data.plants || []).forEach(pd => {
                const pos = new THREE.Vector3(pd.x, pd.y, pd.z);
                const plantData = {
                    id: THREE.MathUtils.generateUUID(), type: pd.type, position: pos,
                    plantedTime: clock.getElapsedTime(), growthStage: pd.growthStage || 0,
                    mesh: null, notifiedStages: {}, sizeVariation: pd.sizeVariation || 1,
                    bloomColor: pd.bloomColor || (pd.type === 'flower' ? flowerBloomColors[0] : null),
                    moisture: pd.moisture ?? 100, growTimer: pd.growTimer || 0, isDead: !!pd.isDead, hasPest: false
                };
                if (plantData.isDead) {
                    const stump = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.08, 0.13, 0.45, 6),
                        new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 1.0 }));
                    stump.position.copy(pos); stump.position.y = pos.y + 0.22; stump.rotation.z = 0.3;
                    stump.castShadow = true; stump.userData.plantData = plantData; plantData.mesh = stump;
                    scene.add(stump);
                } else {
                    plantData.mesh = createPlantMesh(plantData);
                    if (plantData.mesh) {
                        plantData.mesh.position.copy(pos);
                        plantData.mesh.position.y += 0.1;
                        plantData.mesh.castShadow = true;
                        plantData.mesh.userData.plantData = plantData;
                        scene.add(plantData.mesh);
                    }
                }
                const soilMesh = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.6, 24),
                    new THREE.MeshStandardMaterial({ color: 0x3D2314, side: THREE.DoubleSide }));
                soilMesh.rotation.x = -Math.PI / 2; soilMesh.position.copy(pos); soilMesh.position.y = 0.02;
                scene.add(soilMesh); plantData.soilMesh = soilMesh;
                plants.push(plantData);
            });
            ensureHarvesterRobot();
        }

        function processOfflineEarnings() {
            const timeAway = (Date.now() - gardenState.lastActiveTimestamp) / 1000;
            if (timeAway < 10 || gardenState.harvesterRobots <= 0) return;
            let offlineGold = 0;
            plants.filter(p => !p.isDead).forEach(plant => {
                const stages = getPlantStages(plant.type);
                let cycle = 0;
                for (let i = 1; i < stages.length; i++) cycle += getGrowthDuration(plant.type, stages[i]);
                cycle += HARVEST_INTERVAL;
                if (cycle <= 0) return;
                const cycles = Math.floor(timeAway / cycle);
                if (cycles > 0) offlineGold += cycles * getHarvestValue(plant.type);
            });
            offlineGold = Math.floor(offlineGold);
            if (offlineGold > 0) {
                gardenState.gold += offlineGold;
                updateGoldUI();
                showWelcomeModal(offlineGold);
                saveGame();
            }
        }

        function showWelcomeModal(gold) {
            const modal = document.getElementById('welcomeModal');
            const text = document.getElementById('welcomeText');
            if (!modal) return;
            text.innerHTML = `Seu jardim ocioso rendeu <strong>+${gold} 🪙</strong> enquanto você descansava! 🌟`;
            modal.style.display = 'flex';
        }

        // === TASK_002: Compras da loja ===
        function buySprinkler() {
            if (gardenState.sprinklerActive) return;
            if (!spendGold(UPGRADE_COSTS.sprinkler)) { showNotification('Ouro insuficiente! 🪙', 2000); return; }
            gardenState.sprinklerActive = true;
            updateGoldUI();
            showNotification('💧 Regador Automático instalado! O solo fica sempre úmido.', 3000);
            saveGame();
        }
        function buyScarecrow() {
            if (gardenState.ultrasonicScarecrow) return;
            if (!spendGold(UPGRADE_COSTS.scarecrow)) { showNotification('Ouro insuficiente! 🪙', 2000); return; }
            gardenState.ultrasonicScarecrow = true;
            updateGoldUI();
            showNotification('🦅 Espantalho Ultrassônico ativo! Sem mais pragas.', 3000);
            saveGame();
        }
        function buyHarvester() {
            if (!spendGold(UPGRADE_COSTS.harvester)) { showNotification('Ouro insuficiente! 🪙', 2000); return; }
            gardenState.harvesterRobots++;
            updateGoldUI();
            ensureHarvesterRobot();
            showNotification(`🚜 Robô Colhedor comprado! Frota: ${gardenState.harvesterRobots}.`, 3000);
            saveGame();
        }

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            updatePlantGrowth(deltaTime);
            updateWeather(deltaTime);
            updateTimeOfDay(deltaTime);
            updateButterflies(deltaTime);
            updateClouds(deltaTime);
            updateRain(deltaTime);
            updatePests(deltaTime);
            updateHarvesterRobots(deltaTime);

            renderer.render(scene, camera);
        }

        // Iniciar
        init();

    </script>
</body>
