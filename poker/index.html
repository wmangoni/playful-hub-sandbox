        // WebSocket Mock (em uma implementação real, isso seria conectado a um servidor)
        class WebSocketMock {
            constructor(url) {
                this.url = url;
                this.callbacks = {};
                
                // Simular conexão bem-sucedida
                setTimeout(() => {
                    if (this.callbacks.open) {
                        this.callbacks.open();
                    }
                }, 500);
            }
            
            send(data) {
                console.log('Enviando dados:', data);
                
                // Simular resposta do servidor
                setTimeout(() => {
                    if (this.callbacks.message) {
                        this.callbacks.message({
                            data: JSON.stringify({
                                type: 'acknowledgment',
                                message: 'Dados recebidos pelo servidor'
                            })
                        });
                    }
                }, 300);
            }
            
            addEventListener(event, callback) {
                this.callbacks[event] = callback;
            }
            
            close() {
                if (this.callbacks.close) {
                    this.callbacks.close();
                }
            }
        }

        // Implementação do modo multiplayer (simulada)
        function connectToServer() {
            const ws = new WebSocketMock('wss://mock-poker-server.com');
            
            ws.addEventListener('open', () => {
                console.log('Conectado ao servidor');
                showGameMessage('Conectado ao servidor', 2000);
                
                // Enviar informações do jogador
                ws.send(JSON.stringify({
                    type: 'join',
                    player: {
                        name: playerNameInput.value.trim() || 'Jogador',
                        chips: 1000
                    }
                }));
            });
            
            ws.addEventListener('message', (event) => {
                const data = JSON.parse(event.data);
                console.log('Mensagem recebida:', data);
                
                // Processar mensagens do servidor
                if (data.type === 'game_state') {
                    // Atualizar estado do jogo com dados do servidor
                    gameState.players = data.players;
                    gameState.communityCards = data.communityCards;
                    gameState.pot = data.pot;
                    gameState.currentBet = data.currentBet;
                    gameState.phase = data.phase;
                    gameState.currentPlayerIndex = data.currentPlayerIndex;
                    
                    updateUI();
                } else if (data.type === 'your_turn') {
                    // Ativar controles para o jogador atual
                    gameState.isPlayerTurn = true;
                    updateControls();
                }
            });
            
            ws.addEventListener('close', () => {
                console.log('Desconectado do servidor');
                showGameMessage('Desconectado do servidor. Reconectando...', 2000);
                
                // Tentar reconectar após 3 segundos
                setTimeout(connectToServer, 3000);
            });
            
            ws.addEventListener('error', (error) => {
                console.error('Erro de WebSocket:', error);
                showGameMessage('Erro de conexão com o servidor', 2000);
            });
            
            gameState.socket = ws;
        }

        function resetToMainMenu() {
            modeSelect.style.display = 'flex';
            gameState.players = [];
            gameState.communityCards = [];
            gameState.pot = 0;
            gameState.currentBet = 0;
            gameState.phase = 'waiting';
            tournamentState.active = false; // TASK_003
            const bh = document.getElementById('blindsHud'); if (bh) bh.style.display = 'none';
            updateUI();
            init();
        }

        // Inicializar a página
        function init() {
            // Desativar elementos da UI até que o jogo comece
            checkCallBtn.disabled = true;
            betRaiseBtn.disabled = true;
            foldBtn.disabled = true;
            
            showGameMessage('Bem-vindo ao Poker Texas Hold\'em! Escolha um modo de jogo.', 0);
            
            gameState.history = [];
            gameState.round = 0;
        }

        // ===================================================================
        // === TASK_003 — UI de torneios, perfil/estatísticas e HUD de blinds
        // ===================================================================
        function flashBlindsUp() {
            const el = document.getElementById('blindsUpFlash');
            if (!el) return;
            el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
        }
        function updateBlindsHud() {
            const hud = document.getElementById('blindsHud');
            if (!hud || !tournamentState.active) { if (hud) hud.style.display = 'none'; return; }
            const lvl = BLIND_LEVELS[tournamentState.blindLevel];
            hud.style.display = 'block';
            document.getElementById('bhBlinds').textContent = `${lvl.sb} / ${lvl.bb}`;
            document.getElementById('bhAnte').textContent = tournamentState.config.ante > 0 ? `Ante: $${tournamentState.config.ante}` : '';
            const left = Math.max(0, tournamentState.config.blindEveryHands - tournamentState.handsThisLevel + 1);
            document.getElementById('bhNext').textContent = `Sobe em ${left} mão(s)`;
        }

        function startTournament(config) {
            if (pokerData.wallet < config.buyIn) { alert(`Carteira insuficiente! Buy-in: $${config.buyIn}.`); return; }
            pokerData.wallet -= config.buyIn; savePokerData();
            document.getElementById('tournamentOverlay').classList.remove('show');
            modeSelect.style.display = 'none';
            gameState.gameMode = 'singleplayer';
            gameState.minBet = BLIND_LEVELS[0].sb;
            tournamentState.active = true;
            tournamentState.config = config;
            tournamentState.blindLevel = 0;
            tournamentState.handsThisLevel = 0;
            const playerName = (playerNameInput.value || '').trim() || 'Jogador';
            gameState.players = [{ name: playerName, chips: config.startingChips, bet: 0, cards: [], folded: false, isHuman: true }];
            config.opponents.forEach(op => gameState.players.push({ name: op, chips: config.startingChips, bet: 0, cards: [], folded: false, isAI: true, profileKey: op }));
            updateBlindsHud();
            startNewHand();
        }

        function renderTournamentCards() {
            const grid = document.getElementById('tournamentGrid');
            grid.innerHTML = '';
            document.getElementById('walletDisplay').textContent = `$${pokerData.wallet}`;
            TOURNAMENTS_CONFIG.forEach((t, i) => {
                const unlocked = pokerData.unlockedStages.includes(i + 1);
                const won = pokerData.trophies.includes(t.id);
                const card = document.createElement('div');
                card.className = 'tournament-card' + (unlocked ? '' : ' locked');
                card.innerHTML = `<div class="t-trophy">${unlocked ? t.trophy : '🔒'}</div>
                    <div class="t-name">${t.name} ${won ? '✅' : ''}</div>
                    <div class="t-detail">Buy-in: $${t.buyIn}<br>Fichas: $${t.startingChips}<br>Blinds: a cada ${t.blindEveryHands} mãos${t.ante ? `<br>Ante: $${t.ante}` : ''}<br>${t.opponents.length} oponentes</div>`;
                if (unlocked) card.addEventListener('click', () => startTournament(t));
                grid.appendChild(card);
            });
        }

        function renderProfile() {
            const gallery = document.getElementById('trophyGallery');
            gallery.innerHTML = '';
            TOURNAMENTS_CONFIG.forEach(t => {
                const slot = document.createElement('div');
                slot.className = 'trophy-slot' + (pokerData.trophies.includes(t.id) ? ' earned' : '');
                slot.textContent = t.trophy;
                slot.title = t.name;
                gallery.appendChild(slot);
            });
            const s = pokerData.stats;
            const winRate = s.handsPlayed > 0 ? Math.round((s.handsWon / s.handsPlayed) * 100) : 0;
            document.getElementById('statsGrid').innerHTML =
                `<div class="stat-row">Mãos Jogadas<strong>${s.handsPlayed}</strong></div>
                 <div class="stat-row">Win Rate<strong>${winRate}%</strong></div>
                 <div class="stat-row">Maior Pote<strong>$${s.biggestPot}</strong></div>
                 <div class="stat-row">Blefes Vencedores<strong>${s.successfulBluffs}</strong></div>`;
        }

        // Wiring dos novos botões
        loadPokerData();
        document.getElementById('tournament-mode').addEventListener('click', () => { renderTournamentCards(); document.getElementById('tournamentOverlay').classList.add('show'); });
        document.getElementById('tournamentClose').addEventListener('click', () => document.getElementById('tournamentOverlay').classList.remove('show'));
        document.getElementById('openProfileBtn').addEventListener('click', () => { renderProfile(); document.getElementById('profileOverlay').classList.add('show'); });
        document.getElementById('profileClose').addEventListener('click', () => document.getElementById('profileOverlay').classList.remove('show'));
        document.getElementById('walletReload').addEventListener('click', () => { if (pokerData.wallet < 100) { pokerData.wallet += 500; savePokerData(); renderProfile(); renderTournamentCards(); } });

        // Hook de teste (TASK_003)
        window.__poker = {
            gameState, tournamentState, pokerData, TOURNAMENTS_CONFIG, BLIND_LEVELS, AI_PROFILES,
            calculateChipsForAmount, startTournament, recordHandResult, awardTrophy, loadPokerData, savePokerData
        };

        // Iniciar o jogo
        init();

        // Função para adicionar uma entrada ao histórico
        function addToHistory(entry) {
            // Limitar o histórico a 7 entradas
            if (gameState.history.length >= 7) {
                gameState.history.pop(); // Remove a entrada mais antiga
            }
            
            // Adicionar nova entrada no início
            gameState.history.unshift({
                ...entry,
                round: gameState.round
            });
            
            // Atualizar a exibição do histórico
            updateHistoryDisplay();
        }

        // Função para atualizar a exibição do histórico
        function updateHistoryDisplay() {
            const historyContainer = document.getElementById('history-container');
            historyContainer.innerHTML = '';
            
            gameState.history.forEach(entry => {
                const historyEntry = document.createElement('div');
                historyEntry.className = 'history-entry';
                
                const roundElement = document.createElement('div');
                roundElement.className = 'history-round';
                roundElement.textContent = `Rodada ${entry.round}`;
                
                const winnerElement = document.createElement('div');
                winnerElement.className = 'history-winner';
                
                if (entry.winners.length === 1) {
                    // Um vencedor
                    const winnerNameElement = document.createElement('span');
                    winnerNameElement.className = 'history-winner-name';
                    winnerNameElement.textContent = entry.winners[0].name;
                    
                    const amountElement = document.createElement('span');
                    amountElement.className = 'history-amount';
                    amountElement.textContent = ` ganhou $${entry.amount}`;
                    
                    winnerElement.appendChild(winnerNameElement);
                    winnerElement.appendChild(amountElement);
                    
                    if (entry.hand) {
                        const handElement = document.createElement('div');
                        handElement.className = 'history-hand';
                        
                        // Verificar se a vitória foi por fold
                        if (entry.type === 'fold' || entry.hand === "todos desistiram") {
                            handElement.textContent = `(todos desistiram)`;
                        } else {
                            handElement.textContent = `com ${entry.hand}`;
                        }
                        
                        historyEntry.appendChild(handElement);
                    }
                } else {
                    // Múltiplos vencedores (empate)
                    winnerElement.textContent = 'Empate entre ';
                    
                    entry.winners.forEach((winner, index) => {
                        const winnerNameElement = document.createElement('span');
                        winnerNameElement.className = 'history-winner-name';
                        winnerNameElement.textContent = winner.name;
                        
                        winnerElement.appendChild(winnerNameElement);
                        
                        if (index < entry.winners.length - 1) {
                            winnerElement.appendChild(document.createTextNode(', '));
                        }
                    });
                    
                    const amountElement = document.createElement('div');
                    amountElement.className = 'history-amount';
                    amountElement.textContent = `Cada um ganhou $${Math.floor(entry.amount / entry.winners.length)}`;
                    historyEntry.appendChild(amountElement);
                    
                    if (entry.hand) {
                        const handElement = document.createElement('div');
                        handElement.className = 'history-hand';
                        handElement.textContent = `com ${entry.hand}`;
                        historyEntry.appendChild(handElement);
                    }
                }
                
                historyEntry.appendChild(roundElement);
                historyEntry.appendChild(winnerElement);
                historyContainer.appendChild(historyEntry);
            });
        }

        // Função para alternar entre minimizado e maximizado
        function toggleHistoryPanel() {
            const historyPanel = document.getElementById('history-panel');
            const historyToggle = document.getElementById('history-toggle');
            
            historyPanel.classList.toggle('minimized');
            
            // Salvar preferência do usuário
            const isMinimized = historyPanel.classList.contains('minimized');
            localStorage.setItem('pokerHistoryMinimized', isMinimized);
        }

        // Adicionar evento de clique ao título do histórico
        document.addEventListener('DOMContentLoaded', function() {
            const historyTitle = document.getElementById('history-title');
            if (historyTitle) {
                historyTitle.addEventListener('click', toggleHistoryPanel);
            }
            
            // Verificar preferência salva
            const historyPanel = document.getElementById('history-panel');
            if (historyPanel) {
                const savedPreference = localStorage.getItem('pokerHistoryMinimized');
                if (savedPreference === 'true') {
                    historyPanel.classList.add('minimized');
                }
            }
        });

    </script>
</body>
