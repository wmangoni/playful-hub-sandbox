    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Texas Hold'em</title>
    <style>
        :root {
            --primary-color: #1a5e1a;
            --secondary-color: #0f360f;
            --text-color: #ddd;
            --accent-color: #d4af37;
            --card-bg: #fff;
            --card-red: #e44145;
            --card-black: #222;
            --button-primary: #2c7873;
            --button-hover: #1e5350;
            --button-secondary: #a23131;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-modes {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background-color: var(--button-primary);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .mode-button:hover {
            background-color: var(--button-hover);
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            height: 660px;
            background-color: var(--secondary-color);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            padding: 20px;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .table {
            background-color: var(--primary-color);
            border-radius: 120px;
            border: 10px solid #143914;
            padding: 15px;
            position: absolute;
            top: 311px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 160px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .community-cards {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0;
        }

        .player-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .player {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            padding: 8px 10px;
            width: 160px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player.pos-bottom {
            left: 50%;
            bottom: 95px;
            transform: translateX(-50%);
        }

        .player.pos-left {
            left: 20px;
            top: 311px;
            transform: translateY(-50%);
        }

        .player.pos-top {
            left: 50%;
            top: 55px;
            transform: translateX(-50%);
        }

        .player.pos-right {
            right: 20px;
            top: 311px;
            transform: translateY(-50%);
        }

        .player.current {
            box-shadow: 0 0 10px var(--accent-color);
        }

        .player.folded {
            opacity: 0.6;
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .player-chips {
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--accent-color);
        }

        .player-bet {
            margin-bottom: 6px;
            font-size: 12px;
        }

        .player-cards {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 2px;
        }

        .card {
            width: 45px;
            height: 68px;
            background-color: var(--card-bg);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .card.red {
            color: var(--card-red);
        }

        .card.black {
            color: var(--card-black);
        }

        .card.facedown {
            background-color: #2b5797;
            background-image: linear-gradient(45deg, #2b5797 25%, #1c4677 25%, #1c4677 50%, #2b5797 50%, #2b5797 75%, #1c4677 75%, #1c4677 100%);
            background-size: 10px 10px;
        }

        .card-value {
            font-size: 14px;
            position: absolute;
            top: 3px;
            left: 4px;
        }

        .card-suit {
            font-size: 18px;
        }

        .community-cards .card {
            width: 50px;
            height: 75px;
        }

        .pot {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 5;
            white-space: nowrap;
        }

        .controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            z-index: 10;
        }

        .control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: var(--button-primary);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .control-button:hover {
            background-color: var(--button-hover);
        }

        .control-button.fold {
            background-color: var(--button-secondary);
        }

        .control-button.fold:hover {
            background-color: #7e2424;
        }

        .control-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bet-amount {
            width: 100px;
            padding: 8px;
            border-radius: 5px;
            border: 2px solid var(--button-primary);
            text-align: center;
            font-size: 16px;
        }

        .game-message-container {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            min-height: 40px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .game-message {
            background-color: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            padding: 8px 15px;
            color: #fff;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .mode-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }

        .mode-select h2 {
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .online-options {
            display: none;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }

        .online-options input,
        .online-options button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
        }

        .online-options button {
            background-color: var(--button-primary);
            color: white;
            cursor: pointer;
        }

        .hand-ranking {
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
        }
        
        .hidden {
            display: none;
        }

        .mode-button.disabled {
            background-color: #555;
            cursor: not-allowed;
            position: relative;
        }
        
        .mode-button.disabled:hover::after {
            content: "Funcionalidade em construção";
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            z-index: 100;
        }

        @keyframes winnerGlow {
            0% { box-shadow: 0 0 5px 2px rgba(212, 175, 55, 0.5); }
            50% { box-shadow: 0 0 20px 10px rgba(212, 175, 55, 0.8); }
            100% { box-shadow: 0 0 5px 2px rgba(212, 175, 55, 0.5); }
        }
        
        @keyframes chipsFly {
            0% { 
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% { 
                transform: translate(var(--target-x), var(--target-y)) scale(0.5);
                opacity: 0;
            }
        }
        
        .winner-highlight {
            animation: winnerGlow 1.5s ease-in-out infinite;
            border: 2px solid #d4af37 !important;
        }
        
        .pot-chip {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-weight: bold;
            font-size: 12px;
            z-index: 100;
            animation: chipsFly 1.5s forwards;
        }
        
        .win-amount {
            position: absolute;
            color: #d4af37;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 5px black;
            z-index: 101;
            opacity: 0;
            animation: fadeInOut 2s forwards;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        .history-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 250px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            padding: 15px;
            color: var(--text-color);
            max-height: 80vh;
            overflow-y: auto;
            transition: height 0.3s ease, padding 0.3s ease;
        }

        .history-title {
            color: var(--accent-color);
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 5px;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .history-toggle {
            position: absolute;
            right: 5px;
            top: 0;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .history-panel.minimized {
            height: 40px;
            padding-bottom: 5px;
            overflow: hidden;
        }

        .history-panel.minimized .history-toggle {
            transform: rotate(180deg);
        }

        .history-entry {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-entry:last-child {
            border-bottom: none;
        }

        .history-round {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .history-winner {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .history-winner-name {
            font-weight: bold;
            margin-right: 5px;
        }

        .history-amount {
            color: #d4af37;
            font-weight: bold;
        }

        .history-hand {
            font-style: italic;
            font-size: 0.9em;
            color: #aaa;
        }

        #background-music {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: none; /* Oculto por padrão */
        }

        #play-music {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
        }

        /* === TASK_002: Personalidades de IA, Balões de Fala e Hand Tracker === */

        .player-avatar-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }

        .player-avatar-icon {
            font-size: 18px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .player.ai-styled {
            border: 2px solid var(--ai-color, var(--accent-color));
            box-shadow: 0 0 12px var(--ai-glow, rgba(212, 175, 55, 0.4));
        }

        .speech-bubble {
            position: absolute;
            bottom: 100%;
            margin-bottom: 10px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            transform-origin: bottom center;
            background: rgba(13, 20, 38, 0.96);
            border: 1.5px solid var(--ai-color, var(--accent-color));
            padding: 9px 13px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
            width: 160px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            z-index: 20;
            pointer-events: none;
            animation: bubblePopIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bubblePopIn {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: var(--ai-color, var(--accent-color)) transparent;
            display: block;
            width: 0;
        }

        .hand-tracker-panel {
            position: fixed;
            left: 12px;
            bottom: 12px;
            width: 220px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            padding: 14px;
            color: var(--text-color);
            z-index: 50;
            display: none;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        .tracker-header {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .tracker-body .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .tracker-body .stat-item strong,
        .tracker-body .stat-item span:last-child {
            text-align: right;
        }

        .strength-bar-container {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0 6px;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .strength-label {
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 1100px) {
            .hand-tracker-panel {
                position: static;
                width: 100%;
                max-width: 360px;
                margin: 15px auto 0;
            }
        }
        /* =====================================================================
           === TASK_003 — Torneios, Fichas 3D, Cartas 3D, Tells, Stats
           ===================================================================== */
        /* Fichas físicas empilhadas */
        .chip-stack-wrapper { display: flex; gap: 6px; align-items: flex-end; justify-content: center; height: 34px; }
        .chip-stack { position: relative; width: 22px; height: 34px; }
        .poker-chip {
            position: absolute; left: 0; width: 22px; height: 8px; border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.55);
            box-shadow: 0 1px 2px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.25);
        }
        .chip-red { background: radial-gradient(circle, #ff5b5b, #b71c1c); }
        .chip-blue { background: radial-gradient(circle, #5b8bff, #1a3fb7); }
        .chip-green { background: radial-gradient(circle, #5bff8b, #1ab74f); }
        .chip-black { background: radial-gradient(circle, #555, #111); }

        /* Tells: troca de emoji + barra de tensão */
        .tell-emoji { animation: tellPop 0.4s ease; }
        @keyframes tellPop { 0% { transform: scale(0.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .tension-bar-bg { width: 60px; height: 5px; background: rgba(0,0,0,0.5); border-radius: 3px; margin: 3px auto 0; overflow: hidden; }
        .tension-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb300, #ff5722); transition: width 0.3s ease; box-shadow: 0 0 6px #ff9800; }

        /* All-in screen shake */
        .allin-shake { animation: allinShake 0.6s cubic-bezier(.36,.07,.19,.97); }
        @keyframes allinShake {
            10%,90% { transform: translate3d(-2px,0,0); } 20%,80% { transform: translate3d(5px,0,0); }
            30%,50%,70% { transform: translate3d(-8px,0,0); } 40%,60% { transform: translate3d(8px,0,0); }
        }

        /* Cartas 3D (flip + deal-in) */
        .card-container {
            perspective: 1000px;
            width: 45px;
            height: 68px;
            position: relative;
            display: inline-block;
        }
        .community-cards .card-container {
            width: 50px;
            height: 75px;
        }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px; }
        .card-back { background: repeating-linear-gradient(45deg, #1a365d, #1a365d 6px, #24477a 6px, #24477a 12px); transform: rotateY(180deg); }
        .card-container.dealing { animation: dealIn 0.5s cubic-bezier(0.2,0.8,0.3,1) both; }
        @keyframes dealIn { 0% { transform: translate(140px,-120px) rotate(360deg) scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }

        /* HUD de blinds (torneio) */
        #blindsHud {
            position: absolute; top: 12px; right: 12px; z-index: 60; display: none;
            background: rgba(10, 20, 30, 0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 10px; padding: 8px 14px;
            color: #d6f5ff; font-size: 0.82em; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,0.5);
        }
        #blindsHud .bh-blinds { font-size: 1.2em; font-weight: bold; color: #00f0ff; text-shadow: 0 0 8px rgba(0,240,255,0.6); }
        #blindsUpFlash {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(0.6);
            font-size: 3em; font-weight: bold; color: #00f0ff; text-shadow: 0 0 24px #00f0ff; z-index: 1200;
            opacity: 0; pointer-events: none; font-family: 'Arial Black', sans-serif; letter-spacing: 3px;
        }
        #blindsUpFlash.show { animation: blindsUp 1.8s ease-out; }
        @keyframes blindsUp { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.6); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } 75% { opacity: 1; } 100% { opacity: 0; } }

        /* Botões de Dealer / SB / BB */
        .blind-token {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%; font-size: 0.62em; font-weight: bold; color: #111;
            margin: 2px auto; box-shadow: 0 0 8px currentColor;
        }
        .token-D { background: #fff; color: #111; }
        .token-SB { background: #ffe082; color: #5d4000; }
        .token-BB { background: #ffab40; color: #5d2c00; }

        /* Tela de seleção de torneio + modal de perfil/stats (glassmorphism) */
        .glass-overlay {
            position: fixed; inset: 0; display: none; z-index: 1500;
            justify-content: center; align-items: center; background: rgba(0,0,0,0.65);
        }
        .glass-overlay.show { display: flex; }
        .glass-card {
            background: rgba(18, 26, 38, 0.78); backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 18px; padding: 26px 30px;
            color: #eafff0; max-width: 560px; width: 90%; box-shadow: 0 14px 44px rgba(0,0,0,0.55); text-align: center;
        }
        .glass-card h2 { color: #d4af37; letter-spacing: 1px; margin-top: 0; }
        .tournament-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin: 18px 0; }
        .tournament-card {
            flex: 1 1 150px; min-width: 150px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; padding: 14px; cursor: pointer; transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        const POKER_SAVE_KEY = 'playful_poker_tournament_data';

        // -- Fichas físicas 3D --

            const chips = { black: 0, green: 0, blue: 0, red: 0 };
            let r = Math.max(0, Math.floor(amount));
            chips.black = Math.min(5, Math.floor(r / 500)); r %= 500;
            chips.green = Math.min(5, Math.floor(r / 100)); r %= 100;
            chips.blue = Math.min(5, Math.floor(r / 50)); r %= 50;
            chips.red = Math.min(5, Math.floor(r / 10));
            return chips;
        }
        function renderChipStacks(containerEl, amount) {
            if (!containerEl) return;

        function triggerAllInJuice() {
            const wrap = document.querySelector('.container') || document.body;

            setTimeout(() => wrap.classList.remove('allin-shake'), 600);
            try {
                if (!pokerAudioCtx) pokerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = pokerAudioCtx, now = ctx.currentTime;
                for (let k = 0; k < 2; k++) {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(440, now + k * 0.25);
                    o.frequency.linearRampToValueAtTime(880, now + k * 0.25 + 0.12);
                    o.frequency.linearRampToValueAtTime(440, now + k * 0.25 + 0.24);
                    g.gain.setValueAtTime(0.0001, now + k * 0.25);
                    g.gain.linearRampToValueAtTime(0.12, now + k * 0.25 + 0.04);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + k * 0.25 + 0.24);
                    o.connect(g); g.connect(ctx.destination); o.start(now + k * 0.25); o.stop(now + k * 0.25 + 0.25);
                }
            } catch (e) { }
        }

        // Funções para o baralho
        function createDeck() {
            const deck = [];
            for (const suit of SUITS) {
                for (const value of VALUES) {
                    deck.push({ suit, value });
                }
            }
            return deck;
        }

        function shuffleDeck(deck) {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;

        function dealCards() {
            gameState.deck = shuffleDeck(createDeck());

        // Funções para classificar mãos de poker
        function getCardValue(card) {
            return VALUES.indexOf(card.value);
        }

        // Avaliador de mãos robusto. Trabalha com valores numéricos consistentes
        // (2..14, onde J=11, Q=12, K=13, A=14) derivados de getCardValue, evitando os
        // bugs de parseInt('A')=NaN da versão anterior. Mantém o contrato de retorno
        // { name, rank, primaryValue, secondaryValue, kickers } usado pelo desempate.
        function cardNumericValue(card) {
            return getCardValue(card) + 2; // VALUES.indexOf -> 0..12, +2 => 2..14
        }

        // Retorna a carta mais alta de uma sequência de 5 (ou 0 se não houver), com Ás baixo (A-2-3-4-5)
        function straightHighFrom(values) {
            const set = new Set(values);
            if (set.has(14)) set.add(1); // Ás também conta como 1
            const sorted = [...set].sort((a, b) => b - a);
            let run = 1;
            for (let i = 0; i < sorted.length - 1; i++) {
                if (sorted[i] - 1 === sorted[i + 1]) {
                    run++;
                    if (run >= 5) return sorted[i - 3];
                } else {
                    run = 1;
                }
            }
            return 0;
        }

        function evaluateHand(cards) {
            const result = {
                name: "High Card",
                rank: 0,
                primaryValue: 0,
                secondaryValue: 0,
                kickers: []
            };

            if (!cards || cards.length === 0) return result;

            const nums = cards.map(cardNumericValue).sort((a, b) => b - a);

            // Contagem por valor
            const countByVal = {};
            nums.forEach(v => countByVal[v] = (countByVal[v] || 0) + 1);

            // Cartas por naipe (valores numéricos)
            const bySuit = {};
            cards.forEach(c => {
                (bySuit[c.suit] = bySuit[c.suit] || []).push(cardNumericValue(c));
            });

            // Detectar flush
            let flushSuit = null;
            for (const s in bySuit) {
                if (bySuit[s].length >= 5) flushSuit = s;
            }

            // Royal Flush / Straight Flush
            if (flushSuit) {
                const sfHigh = straightHighFrom(bySuit[flushSuit]);
                if (sfHigh === 14) {
                    result.name = "Royal Flush"; result.rank = 9; result.primaryValue = 14;
                    return result;
                }
                if (sfHigh) {
                    result.name = "Straight Flush"; result.rank = 8; result.primaryValue = sfHigh;
                    return result;
                }
            }

            // Grupos ordenados por quantidade e, em empate, por valor
            const groups = Object.entries(countByVal)
                .map(([v, c]) => ({ v: parseInt(v, 10), c }))
                .sort((a, b) => b.c - a.c || b.v - a.v);

            // Four of a Kind
            if (groups[0].c === 4) {
                result.name = "Four of a Kind"; result.rank = 7; result.primaryValue = groups[0].v;
                result.kickers = nums.filter(n => n !== groups[0].v).slice(0, 1);
                return result;
            }

            // Full House (trinca + par)
            if (groups[0].c === 3 && groups[1] && groups[1].c >= 2) {
                result.name = "Full House"; result.rank = 6;
                result.primaryValue = groups[0].v; result.secondaryValue = groups[1].v;
                return result;
            }

            // Flush
            if (flushSuit) {
                result.name = "Flush"; result.rank = 5;
                result.kickers = bySuit[flushSuit].slice().sort((a, b) => b - a).slice(0, 5);
                return result;
            }

            // Straight
            const stHigh = straightHighFrom(nums);
            if (stHigh) {
                result.name = "Straight"; result.rank = 4; result.primaryValue = stHigh;
                return result;
            }

            // Three of a Kind
            if (groups[0].c === 3) {
                result.name = "Three of a Kind"; result.rank = 3; result.primaryValue = groups[0].v;
                result.kickers = nums.filter(n => n !== groups[0].v).slice(0, 2);
                return result;
            }

            // Two Pair
            if (groups[0].c === 2 && groups[1] && groups[1].c === 2) {
                const hi = Math.max(groups[0].v, groups[1].v);
                const lo = Math.min(groups[0].v, groups[1].v);
                result.name = "Two Pair"; result.rank = 2;
                result.primaryValue = hi; result.secondaryValue = lo;
                result.kickers = nums.filter(n => n !== hi && n !== lo).slice(0, 1);
                return result;
            }

            // One Pair
            if (groups[0].c === 2) {
                result.name = "One Pair"; result.rank = 1; result.primaryValue = groups[0].v;
                result.kickers = nums.filter(n => n !== groups[0].v).slice(0, 3);
                return result;
            }

            // High Card
            result.name = "High Card"; result.rank = 0;
            result.kickers = nums.slice(0, 5);
            return result;
        }

        // === TASK_002: Hand Tracker / Calculadora de Mãos do Jogador ===
        const HAND_NAME_PT = {
            'High Card': 'Carta Alta',
            'One Pair': 'Um Par',
            'Two Pair': 'Dois Pares',
            'Three of a Kind': 'Trinca',
            'Straight': 'Sequência',

        // Retorna o índice (VALUES) do maior par presente nas cartas, ou -1
        function getHighestPairIndex(cards) {
            const groups = {};
            cards.forEach(c => groups[c.value] = (groups[c.value] || 0) + 1);
            let best = -1;
            for (const v in groups) {
                if (groups[v] >= 2) best = Math.max(best, VALUES.indexOf(v));
            }
            return best;
        }

        function updateHandTracker() {
            const panel = document.getElementById('hand-tracker');
            if (!panel) return;

            const player = gameState.players[0]; // Jogador Humano
            if (!player || !player.isHuman || player.folded ||
                gameState.phase === 'waiting' || gameState.phase === 'showdown' ||
                !player.cards || player.cards.length === 0) {
                panel.style.display = 'none';
                return;
            }

            panel.style.display = 'block';

            const playerCards = player.cards;
            const communityCards = gameState.communityCards.filter(c => c);
            const allCards = [...playerCards, ...communityCards];

            // 1. Classificação atual da mão
            const evaluation = evaluateHand(allCards);
            document.getElementById('tracker-hand-name').textContent =
                HAND_NAME_PT[evaluation.name] || evaluation.name;

            // 2. Detectar Draws (Flush Draw, Straight Draw)
            let drawText = "Nenhum";
            let isDraw = false;

            // Flush Draw (4 cartas de mesmo naipe)
            const suits = {};
            allCards.forEach(c => suits[c.suit] = (suits[c.suit] || 0) + 1);
            for (const suit in suits) {
                if (suits[suit] === 4) {
                    drawText = `Flush Draw (4 de 5 ${suit})`;
                    isDraw = true;
                }
            }

            // Straight Draw (4 cartas consecutivas)
            if (!isDraw) {
                const uniqueValues = [...new Set(allCards.map(c => getCardValue(c)))].sort((a, b) => a - b);
                for (let i = 0; i <= uniqueValues.length - 4; i++) {
                    const slice = uniqueValues.slice(i, i + 4);
                    if (slice[3] - slice[0] === 3) {
                        drawText = "Straight Draw (4 sequenciais)";
                        isDraw = true;
                        break;
                    }
                }
            }

            document.getElementById('tracker-draw-name').textContent = drawText;

            // 3. Força relativa e coloração da barra
            let strengthPct = 0;
            let label = "Fraca";
            let barColor = "#e74c3c"; // Vermelho

            if (evaluation.rank >= 5) { // Flush ou maior
                strengthPct = 85 + (evaluation.rank - 5) * 3;
                label = "Excelente (Forte)";
                barColor = "#2ecc71"; // Verde
            } else if (evaluation.rank >= 2) { // Two Pair, Three of a Kind, Straight
                strengthPct = 60 + (evaluation.rank - 2) * 8;
                label = "Boa (Média)";
                barColor = "#3498db"; // Azul
            } else if (evaluation.rank >= 1) { // One Pair
                const isHighPair = getHighestPairIndex(allCards) >= VALUES.indexOf('J'); // Par de Valetes ou maior
                strengthPct = isHighPair ? 50 : 35;
                label = isHighPair ? "Par Alto (Médio)" : "Par Baixo (Fraco)";
                barColor = isHighPair ? "#f1c40f" : "#e67e22"; // Amarelo ou Laranja
            } else { // High Card
                strengthPct = isDraw ? 25 : 10;
                label = isDraw ? "Desenho Ativo (Fraco)" : "Mão Típica (Muito Fraca)";
                barColor = isDraw ? "#e67e22" : "#e74c3c";
            }

            strengthPct = Math.min(100, strengthPct);

            const barFill = document.getElementById('tracker-strength-bar');
            barFill.style.width = `${strengthPct}%`;
            barFill.style.backgroundColor = barColor;

            const strengthText = document.getElementById('tracker-strength-text');
            strengthText.textContent = `Força: ${strengthPct}% (${label})`;
            strengthText.style.color = barColor;
        }

        function startNewHand() {
            // Remover bots/oponentes falidos (chips <= 0)
            const initialPlayers = [...gameState.players];
            const bankruptOpponents = initialPlayers.filter(p => !p.isHuman && p.chips <= 0);
            const humanPlayer = initialPlayers.find(p => p.isHuman);
            
            // Se o jogador humano faliu
            if (humanPlayer && humanPlayer.chips <= 0) {
                showGameMessage('Você faliu! Fim de jogo.', 0);
                setTimeout(() => {
                    alert('Você faliu! Fim de jogo.');
                    resetToMainMenu();
                }, 3000);
                return;
            }
            
            // Filtrar jogadores mantendo o humano e oponentes com fichas
            const activeOpponents = initialPlayers.filter(p => !p.isHuman && p.chips > 0);
            
            // Se todos os oponentes faliram
            if (activeOpponents.length === 0) {
                // TASK_003: vitória de torneio concede troféu + prêmio na carteira
                if (tournamentState.active && tournamentState.config) {
                    awardTrophy(tournamentState.config.id);
                    const prize = tournamentState.config.buyIn * 5;
                    pokerData.wallet += prize;
                    savePokerData();
                    showGameMessage(`🏆 Você venceu o ${tournamentState.config.name}! Troféu conquistado +$${prize}!`, 0);
                    tournamentState.active = false;
                    setTimeout(() => { alert(`🏆 Campeão do ${tournamentState.config.name}! Prêmio: $${prize}`); resetToMainMenu(); }, 3000);
                    return;
                }
                showGameMessage('Você venceu o jogo! Todos os oponentes faliram.', 0);
                setTimeout(() => {
                    alert('Parabéns! Você venceu o jogo! Todos os oponentes faliram.');
                    resetToMainMenu();
                }, 3000);
                return;
            }
            
            // Atualizar o array de players no estado do jogo
            gameState.players = [humanPlayer, ...activeOpponents];
            
            // Mostrar mensagem se algum oponente faliu nesta rodada
            let msg = 'Nova mão iniciada!';
            if (bankruptOpponents.length > 0) {
                const names = bankruptOpponents.map(b => b.name).join(', ');
                msg = `${names} faliu e saiu do jogo! ` + msg;
            }
            
            // Incrementar o contador de rodadas
            gameState.round = (gameState.round || 0) + 1;
            recordHandPlayed(); // TASK_003: estatística de mãos jogadas
            gameState._humanBluff = false;

            // TASK_003: progressão de blinds por mãos jogadas + nível de blind ativo
            let ante = 0;
            if (tournamentState.active) {
                tournamentState.handsThisLevel++;
                if (tournamentState.handsThisLevel > tournamentState.config.blindEveryHands &&
                    tournamentState.blindLevel < BLIND_LEVELS.length - 1) {
                    tournamentState.blindLevel++;
                    tournamentState.handsThisLevel = 1;
                    flashBlindsUp();
                }
                gameState.minBet = BLIND_LEVELS[tournamentState.blindLevel].sb;
                ante = tournamentState.config.ante;
                updateBlindsHud();
            }

            gameState.phase = 'preflop';
            gameState.pot = 0;
            gameState.currentBet = gameState.minBet * 2; // Big blind

            // Deal cards (embaralha, distribui e reseta as apostas/dobras de todos)
            dealCards();

            // TASK_003: Ante — deduz de todos os jogadores ativos e soma ao pote
            if (ante > 0) {
                gameState.players.forEach(p => { const a = Math.min(ante, p.chips); p.chips -= a; gameState.pot += a; });
            }

            // Collect blinds
            const smallBlindIdx = 0;
            const bigBlindIdx = 1 % gameState.players.length;

            gameState.players[smallBlindIdx].chips -= gameState.minBet;
            gameState.players[smallBlindIdx].bet = gameState.minBet;

            gameState.players[bigBlindIdx].chips -= gameState.minBet * 2;
            gameState.players[bigBlindIdx].bet = gameState.minBet * 2;

            gameState.pot += gameState.minBet * 3;

            // Marca os papéis de Dealer/SB/BB para os tokens (TASK_003)
            gameState.players.forEach((p, i) => { p._blindRole = i === smallBlindIdx ? 'SB' : (i === bigBlindIdx ? 'BB' : null); });
            const dealerIdx = (smallBlindIdx - 1 + gameState.players.length) % gameState.players.length;
            if (gameState.players[dealerIdx]) gameState.players[dealerIdx]._blindRole = gameState.players[dealerIdx]._blindRole || 'D';

            // Dealer is after big blind
            gameState.currentPlayerIndex = (bigBlindIdx + 1) % gameState.players.length;
            
            // Atualiza a UI para refletir as apostas dos blinds
            updateUI();
            
            showGameMessage(msg, 3000);
            
            if (gameState.players[gameState.currentPlayerIndex].isAI) {
                setTimeout(playAITurn, 1500);
            }
        }

        function nextPhase() {
            switch (gameState.phase) {
                case 'preflop':
                    gameState.phase = 'flop';
                    // Deal the flop - 3 community cards
                    gameState.communityCards = [
                        gameState.deck.pop(),
                        gameState.deck.pop(),
                        gameState.deck.pop()
                    ];
                    showGameMessage('Flop!', 2000);
                    break;
                case 'flop':
                    gameState.phase = 'turn';
                    // Deal the turn - 1 more community card
                    gameState.communityCards.push(gameState.deck.pop());
                    showGameMessage('Turn!', 2000);
                    break;
                case 'turn':
                    gameState.phase = 'river';
                    // Deal the river - final community card
                    gameState.communityCards.push(gameState.deck.pop());
                    showGameMessage('River!', 2000);
                    break;
                case 'river':
                    gameState.phase = 'showdown';
                    handleShowdown();
                    return;
            }
            
            // Reset for new betting round
            gameState.currentBet = 0;
            gameState.players.forEach(player => {
                player.bet = 0;
            });
            
            // Start with first active player
            gameState.currentPlayerIndex = 0;
            while (
                gameState.currentPlayerIndex < gameState.players.length && 
                gameState.players[gameState.currentPlayerIndex].folded
            ) {
                gameState.currentPlayerIndex++;
            }
            
            if (gameState.currentPlayerIndex >= gameState.players.length) {
                gameState.currentPlayerIndex = 0;
            }
            
            updateUI();
            
            if (gameState.players[gameState.currentPlayerIndex].isAI) {
                setTimeout(playAITurn, 1500);
            }
        }

        function handleShowdown() {
            // Revelar todas as cartas
            gameState.players.forEach(player => {
                if (!player.isAI) {
                    player.showCards = true;
                }
            });
            
            // Determinar o vencedor e distribuir o pot
            determineWinner();
            
            // Atualizar a UI
            updateUI();
        }

        function determineWinner() {
            // Filtrar apenas jogadores que não desistiram
            const activePlayers = gameState.players.filter(player => !player.folded);
            
            // Se apenas um jogador restou (todos os outros desistiram), ele é o vencedor
            console.log("activePlayers.length: " + activePlayers.length)
            if (activePlayers.length === 1) {
                const winner = activePlayers[0];
                const winAmount = gameState.pot;
                winner.chips += winAmount;
                recordHandResult(winner.isHuman, winAmount, winner.isHuman && !!gameState._humanBluff); // TASK_003

                // Animar a vitória
                animateWinner(winner, winAmount);
                
                // Adicionar ao histórico - sem informação da mão
                addToHistory({
                    winners: [winner],
                    amount: winAmount,
                    hand: "todos desistiram", // Indicação clara de que venceu por desistência
                    type: 'fold'
                });
                
                showGameMessage(`${winner.name} vence $${winAmount} (todos os outros jogadores desistiram)!`);
                gameState.pot = 0;
                
                // Iniciar nova mão após um atraso
                setTimeout(() => {
                    startNewHand();
                }, 3000);
                
                return winner;
            }
            
            // Avaliar as mãos de todos os jogadores ativos com informações detalhadas
            activePlayers.forEach(player => {
                const cards = [...player.cards, ...gameState.communityCards];
                const handResult = evaluateHand(cards);
                player.handRanking = handResult.name;
                player.handRank = handResult.rank;
                player.handDetails = {
                    primaryValue: handResult.primaryValue,
                    secondaryValue: handResult.secondaryValue,
                    kickers: handResult.kickers
                };
            });
            
            // Ordenar jogadores pelo ranking da mão (do maior para o menor)
            activePlayers.sort((a, b) => {
                // Primeiro, comparar pelo rank da mão
                if (b.handRank !== a.handRank) {
                    return b.handRank - a.handRank;
                }
                
                // Se o rank for igual, comparar pelo valor primário
                if (b.handDetails.primaryValue !== a.handDetails.primaryValue) {
                    return b.handDetails.primaryValue - a.handDetails.primaryValue;
                }
                
                // Se o valor primário for igual, comparar pelo valor secundário
                if (b.handDetails.secondaryValue !== a.handDetails.secondaryValue) {
                    return b.handDetails.secondaryValue - a.handDetails.secondaryValue;
                }
                
                // Se o valor secundário for igual, comparar pelos kickers
                const aKickers = a.handDetails.kickers || [];
                const bKickers = b.handDetails.kickers || [];
                
                // Comparar cada kicker em ordem
                for (let i = 0; i < Math.min(aKickers.length, bKickers.length); i++) {
                    if (bKickers[i] !== aKickers[i]) {
                        return bKickers[i] - aKickers[i];
                    }
                }
                
                // Se todos os kickers forem iguais, é um empate perfeito
                return 0;
            });
            
            // O jogador com o maior ranking é o vencedor, mas pode haver empate perfeito
            const winner = activePlayers[0];
            
            // Verificar se há empate perfeito (todos os critérios de desempate são iguais)
            const tiedPlayers = activePlayers.filter(player => {
                if (player.handRank !== winner.handRank) return false;
                if (player.handDetails.primaryValue !== winner.handDetails.primaryValue) return false;
                if (player.handDetails.secondaryValue !== winner.handDetails.secondaryValue) return false;
                
                // Comparar kickers
                const playerKickers = player.handDetails.kickers || [];
                const winnerKickers = winner.handDetails.kickers || [];
                
                if (playerKickers.length !== winnerKickers.length) return false;
                
                for (let i = 0; i < playerKickers.length; i++) {
                    if (playerKickers[i] !== winnerKickers[i]) return false;
                }
                
                // Se chegou aqui, é um empate perfeito
                return true;
            });

            const totalPot = gameState.pot;
            const handNamePT = HAND_NAME_PT[winner.handRanking] || winner.handRanking;
            
            if (tiedPlayers.length === 1) {
                // Vencedor único no Showdown
                winner.chips += totalPot;
                recordHandResult(winner.isHuman, totalPot, winner.isHuman && winner.handRank < 1); // TASK_003: blefe = venceu showdown sem par
                animateWinner(winner, totalPot);
                
                addToHistory({
                    winners: [winner],
                    amount: totalPot,
                    hand: handNamePT,
                    type: 'showdown'
                });
                
                showGameMessage(`${winner.name} vence $${totalPot} com ${handNamePT}!`);
            } else {
                // Divisão de pote (Split Pot) em caso de empate perfeito
                const share = Math.floor(totalPot / tiedPlayers.length);
                const remainder = totalPot % tiedPlayers.length;
                
                tiedPlayers.forEach((player, idx) => {
                    const amount = share + (idx === 0 ? remainder : 0);
                    player.chips += amount;
                    animateWinner(player, amount);
                });
                
                addToHistory({
                    winners: tiedPlayers,
                    amount: totalPot,
                    hand: handNamePT,
                    type: 'showdown'
                });
                
                const winnerNames = tiedPlayers.map(p => p.name).join(' e ');
                showGameMessage(`Empate! ${winnerNames} dividem $${totalPot} com ${handNamePT}!`);
            }
            
            gameState.pot = 0;
            
            // Iniciar nova mão após um atraso (4000ms para dar tempo de visualizar o showdown)
            setTimeout(() => {
                startNewHand();
            }, 4000);
            
            return winner;
        }

        // Função para animar o vencedor e o movimento de fichas
        function animateWinner(player, amount) {
            // Encontrar o elemento do jogador
            const playerIndex = gameState.players.indexOf(player);
            const playerElement = document.querySelector(`.player:nth-child(${playerIndex + 1})`);
            
            if (!playerElement) return;
            
            // Destacar o jogador vencedor
            playerElement.classList.add('winner-highlight');
            
            // Encontrar a posição do pot e do jogador usando getBoundingClientRect para suportar transformações CSS
            const tableElement = document.querySelector('.table');
            const tableRect = tableElement.getBoundingClientRect();
            const playerRect = playerElement.getBoundingClientRect();
            
            const potCenter = {
                x: tableRect.left + tableRect.width / 2,
                y: tableRect.top + tableRect.height / 2
            };
            
            const playerCenter = {
                x: playerRect.left + playerRect.width / 2,
                y: playerRect.top + playerRect.height / 2
            };
            
            // A posição inicial do chip (no pot) dentro de tableElement
            const potPosition = {
                x: tableElement.offsetWidth / 2,
                y: tableElement.offsetHeight / 2
            };
            
            // Criar animação de fichas voando do pot para o jogador
            const chipCount = Math.min(10, Math.max(3, Math.floor(amount / 100)));
            
            for (let i = 0; i < chipCount; i++) {
                setTimeout(() => {
                    const chip = document.createElement('div');
                    chip.className = 'pot-chip';
                    chip.textContent = '$';
                    chip.style.left = `${potPosition.x}px`;
                    chip.style.top = `${potPosition.y}px`;
                    
                    // Calcular a direção para o jogador usando coordenadas globais
                    const targetX = playerCenter.x - potCenter.x;
                    const targetY = playerCenter.y - potCenter.y;
                    
                    chip.style.setProperty('--target-x', `${targetX}px`);
                    chip.style.setProperty('--target-y', `${targetY}px`);
                    
                    tableElement.appendChild(chip);
                    
                    // Remover o chip após a animação
                    setTimeout(() => {
                        chip.remove();
                    }, 1500);
                }, i * 100);
            }
            
            // Mostrar o valor ganho (renderizado relativo ao jogador)
            const winAmount = document.createElement('div');
            winAmount.className = 'win-amount';
            winAmount.textContent = `+$${amount}`;
            winAmount.style.left = '50%';
            winAmount.style.top = '-40px';
            winAmount.style.transform = 'translateX(-50%)';
            winAmount.style.position = 'absolute';
            
            playerElement.appendChild(winAmount);
            
            // Remover o destaque e o valor após um tempo
            setTimeout(() => {
                playerElement.classList.remove('winner-highlight');
                winAmount.remove();
            }, 3000);
        }

        // Ações do jogador
        function handleCheckCall() {
            const player = gameState.players[gameState.currentPlayerIndex];
            
            if (gameState.currentBet > player.bet) {
                // Call
                const callAmount = gameState.currentBet - player.bet;
                player.chips -= callAmount;
                player.bet = gameState.currentBet;
                gameState.pot += callAmount;
                showGameMessage(`${player.name} calls $${callAmount}`, 2000);
            } else {
                // Check
                showGameMessage(`${player.name} checks`, 2000);
            }
            
            nextPlayerTurn();
        }

        function handleBetRaise() {
            const player = gameState.players[gameState.currentPlayerIndex];
            const betAmount = parseInt(betAmountInput.value);
            
            if (isNaN(betAmount) || betAmount < gameState.currentBet + gameState.minBet || betAmount > player.chips) {
                alert('Aposta inválida!');
                return;
            }
            
            // Remove previous bet from chips
            player.chips -= (betAmount - player.bet);
            
            // Add to pot
            gameState.pot += (betAmount - player.bet);
            
            // Update current bet
            gameState.currentBet = betAmount;
            player.bet = betAmount;

            // TASK_003: marca blefe do humano (aposta agressiva no river com mão fraca)
            if (player.isHuman && (gameState.phase === 'river' || gameState.phase === 'turn')) {
                const handRank = evaluateHand([...player.cards, ...gameState.communityCards.filter(Boolean)]).rank;
                if (handRank < 1) gameState._humanBluff = true;
            }
            if (player.chips === 0) triggerAllInJuice(); // TASK_003: all-in do humano

            if (gameState.currentBet === 0) {
                showGameMessage(`${player.name} bets $${betAmount}`, 2000);
            } else {
                showGameMessage(`${player.name} raises to $${betAmount}`, 2000);
            }

            nextPlayerTurn();
        }

        function handleFold() {
            const player = gameState.players[gameState.currentPlayerIndex];
            player.folded = true;
            showGameMessage(`${player.name} folds`, 2000);
            
            // Check if only one player left
            const activePlayers = gameState.players.filter(p => !p.folded);
            if (activePlayers.length === 1) {
                const winner = activePlayers[0];
                const winAmount = gameState.pot;

                // Award pot to last player
                winner.chips += winAmount;
                recordHandResult(winner.isHuman, winAmount, winner.isHuman && !!gameState._humanBluff); // TASK_003

                // Animar a vitória
                animateWinner(winner, winAmount);

                // Adicionar ao histórico
                addToHistory({
                    winners: [winner],
                    amount: winAmount,
                    hand: "todos desistiram",
                    type: 'fold'
                });

                showGameMessage(`${winner.name} vence $${winAmount} (todos os outros jogadores desistiram)!`);
                gameState.pot = 0;

                // Start new hand after delay
                setTimeout(() => {
                    startNewHand();
                }, 3000);
                return;
            }

            nextPlayerTurn();
        }

        function nextPlayerTurn() {
            // Check if betting round is complete
            let allPlayersBetEqual = true;
            const activePlayers = gameState.players.filter(p => !p.folded);
            
            for (const player of activePlayers) {
                if (player.bet !== gameState.currentBet) {
                    allPlayersBetEqual = false;
                    break;
                }
            }
            
            if (allPlayersBetEqual) {
                // Move to next phase
                nextPhase();
                return;
            }
            
            // Move to next player
            do {
                gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
            } while (gameState.players[gameState.currentPlayerIndex].folded);
            
            updateUI();
            if (gameState.players[gameState.currentPlayerIndex].isAI) {
                setTimeout(playAITurn, 1500);
            }
        }

        // === TASK_002: Diálogos / Balões de fala das IAs ===
        function pickDialogue(profile, category) {
            const list = profile.dialogues[category];
            if (!list || list.length === 0) return null;
            return list[Math.floor(Math.random() * list.length)];
        }

        function showAIDialogue(player, text) {
            if (!text) return;
            player._dialogue = text;
            updatePlayers();
            clearTimeout(player._dialogueTimer);
            player._dialogueTimer = setTimeout(() => {
                player._dialogue = null;
                // Só re-renderiza se o jogo ainda estiver ativo
                if (gameState.phase !== 'waiting') updatePlayers();
            }, 3500);
        }

        // AI logic - tomada de decisão baseada em personalidade + blefe
        function playAITurn() {
            if (gameState.phase === 'waiting' || gameState.phase === 'showdown') return;

            const aiPlayer = gameState.players[gameState.currentPlayerIndex];
            if (!aiPlayer.isAI || aiPlayer.folded) return;

            const profile = aiPlayer.profileKey ? AI_PROFILES[aiPlayer.profileKey] : null;

            // Fallback defensivo: IA sem perfil definido apenas paga/dá check
            if (!profile) {
                handleAIAction('call');
                return;
            }

            const aiCards = [...aiPlayer.cards, ...gameState.communityCards.filter(card => card)];

            // 1. Força real da mão (0.0 a 1.0)
            const handResult = evaluateHand(aiCards);
            const handStrength = handResult.rank / 9.0;

            // 2. Potencial de blefe da mesa (flush draw visível no board)
            let tableBluffPotential = 0;
            if (gameState.communityCards.length >= 3) {
                const suitsCount = {};
                gameState.communityCards.forEach(c => { if (c) suitsCount[c.suit] = (suitsCount[c.suit] || 0) + 1; });
                const maxSuit = Math.max(...Object.values(suitsCount));
                if (maxSuit >= 3) tableBluffPotential = 0.5;
            }

            // 3. Fator de blefe individual baseado na personalidade
            let bluffFactor = 0;
            let isBluffing = false;
            if (Math.random() < profile.bluffFrequency) {
                bluffFactor = (0.3 * tableBluffPotential) + (0.7 * Math.random()) * profile.aggressiveness;
                isBluffing = bluffFactor > 0.4;
            }

            // TASK_003: Diana "The Adaptable" — ajusta blefe pelo tamanho do pote
            if (profile.adaptive) {
                const isPotSmall = gameState.pot < aiPlayer.chips * 0.3;
                const bf = isPotSmall ? 0.45 : 0.08; // pote pequeno: rouba blinds; grande: cautela
                isBluffing = Math.random() < bf;
                bluffFactor = isBluffing ? (0.5 + Math.random() * 0.3) : (isPotSmall ? bluffFactor : 0);
            }
            // TASK_003: Erik "The Legend" — nunca blefa antes do river; all-in de blefe no river vendo fraqueza
            if (profile.legendary) {
                if (gameState.phase === 'river' && handStrength < 0.4 && gameState.currentBet === 0) {
                    isBluffing = true; bluffFactor = 0.9; // sente fraqueza (checks) -> blefa pesado
                } else if (gameState.phase !== 'river') {
                    isBluffing = false; bluffFactor = 0;
                }
            }

            // 4. Score de decisão final (combina força real + fator de blefe)
            const decisionScore = (handStrength * 0.6) + (bluffFactor * 0.4);

            // 5. Determinar ação com base no score e na personalidade
            const callAmount = gameState.currentBet - aiPlayer.bet;
            const aiChips = aiPlayer.chips;

            let action = 'call';
            let betAmount = 0;

            if (callAmount > 0) {
                // Há uma aposta na mesa: fold, call ou raise
                const foldThreshold = 0.25 - (profile.callingRate * 0.15) - (profile.aggressiveness * 0.1);
                const raiseThreshold = 0.65 - (profile.aggressiveness * 0.25);

                if (decisionScore < foldThreshold && callAmount > aiChips * 0.15) {
                    action = 'fold';
                } else if (decisionScore > raiseThreshold && aiChips > callAmount + gameState.minBet) {
                    action = 'raise';
                    const multiplier = profile.aggressiveness * (0.8 + Math.random() * 0.4);
                    betAmount = gameState.currentBet + Math.floor(gameState.minBet * multiplier * 5);
                    betAmount = Math.max(gameState.currentBet + gameState.minBet, Math.min(aiChips, betAmount));
                } else {
                    action = 'call';
                }
            } else {
                // Ninguém apostou ainda: check ou bet (tratado como raise sobre 0)
                const betThreshold = 0.45 - (profile.aggressiveness * 0.2);
                if (decisionScore > betThreshold && aiChips > gameState.minBet) {
                    action = 'raise';
                    const multiplier = profile.aggressiveness * (0.5 + Math.random() * 0.5);
                    betAmount = Math.max(gameState.minBet, Math.floor(aiChips * 0.05 * multiplier));
                    betAmount = Math.min(aiChips, betAmount);
                } else {
                    action = 'call'; // Check
                }
            }

            // Selecionar a categoria de diálogo correspondente
            let dialogueCategory = action;
            if (action === 'raise') {
                if (isBluffing) dialogueCategory = 'bluff';
                else if (handStrength > 0.6) dialogueCategory = 'strongHand';
                else dialogueCategory = 'raise';
            }
            showAIDialogue(aiPlayer, pickDialogue(profile, dialogueCategory));

            // === TASK_003: Tells psicológicos — emoji + atraso + barra de tensão ===
            let delay = 800;
            let tell = null;
            aiPlayer._tension = 0;
            if (action === 'raise' && isBluffing) {
                delay = 2000 + Math.random() * 1000;              // hesitação longa = blefe tenso
                tell = Math.random() > 0.5 ? '😰' : '🤫';
                aiPlayer._tension = 70 + Math.random() * 30;
            } else if (handStrength > 0.66 && (action === 'call' || action === 'raise')) {
                delay = 350;                                      // decisão instantânea = força (armadilha)
                tell = '😈';
            } else if (profile.adaptive && action === 'raise' && isBluffing) {
                tell = '😏';                                      // Diana roubando blinds
            }
            // Cartas de perigo no board + hesitação => enche a barra de tensão (pista p/ o humano)
            if (tableBluffPotential > 0 && isBluffing) aiPlayer._tension = Math.max(aiPlayer._tension, 85);

            if (tell || aiPlayer._tension > 0) { aiPlayer._tellEmoji = tell; updatePlayers(); }

            setTimeout(() => {
                aiPlayer._tellEmoji = null;
                aiPlayer._tension = 0;
                handleAIAction(action, betAmount);
            }, delay);
        }

        function handleAIAction(action, amount = 0) {
            const aiPlayer = gameState.players[gameState.currentPlayerIndex];
            
            switch (action) {
                case 'fold':
                    aiPlayer.folded = true;
                    showGameMessage(`${aiPlayer.name} folds`, 2000);
                    break;
                case 'call':
                    if (gameState.currentBet > aiPlayer.bet) {
                        const callAmount = gameState.currentBet - aiPlayer.bet;
                        aiPlayer.chips -= callAmount;
                        aiPlayer.bet = gameState.currentBet;
                        gameState.pot += callAmount;
                        showGameMessage(`${aiPlayer.name} calls $${callAmount}`, 2000);
                    } else {
                        showGameMessage(`${aiPlayer.name} checks`, 2000);
                    }
                    break;
                case 'raise':
                    const raiseAmount = amount;
                    aiPlayer.chips -= (raiseAmount - aiPlayer.bet);
                    gameState.pot += (raiseAmount - aiPlayer.bet);
                    gameState.currentBet = raiseAmount;
                    aiPlayer.bet = raiseAmount;
                    
                    if (aiPlayer.chips === 0) {
                        showGameMessage(`${aiPlayer.name} goes all-in $${raiseAmount}!`, 2000);
                        triggerAllInJuice(); // TASK_003
                    } else if (gameState.currentBet === raiseAmount) {
                        showGameMessage(`${aiPlayer.name} bets $${raiseAmount}`, 2000);
                    } else {
                        showGameMessage(`${aiPlayer.name} raises to $${raiseAmount}`, 2000);
                    }
                    break;
            }
            
            // Check if only one player left
            const activePlayers = gameState.players.filter(p => !p.folded);
            if (activePlayers.length === 1) {
                const winner = activePlayers[0];
                const winAmount = gameState.pot;
                
                // Award pot to last player
                winner.chips += winAmount;
                
                // Animar a vitória
                animateWinner(winner, winAmount);
                
                // Adicionar ao histórico
                addToHistory({
                    winners: [winner],
                    amount: winAmount,
                    hand: "todos desistiram",
                    type: 'fold'
                });
                
                showGameMessage(`${winner.name} vence $${winAmount} (todos os outros jogadores desistiram)!`);
                gameState.pot = 0;
                
                // Start new hand after delay
                setTimeout(() => {
                    startNewHand();
                }, 3000);
                updateUI();
                return;
            }
            
            nextPlayerTurn();
        }

        // Handlers para os botões de aposta
        function handleMinBet() {
            const minRaise = gameState.currentBet + gameState.minBet;
            betAmountInput.value = minRaise;
        }

        function handleMaxBet() {
            const player = gameState.players[gameState.currentPlayerIndex];
