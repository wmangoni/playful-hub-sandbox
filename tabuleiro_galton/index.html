<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuleiro de Galton (Simulador Estatístico)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #18191e 0%, #0d0e12 100%);
            color: #f1f3f9;
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 1000px;
            width: 100%;
        }
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                align-items: center;
            }
        }
        .canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        canvas {
            background-color: #0d0e12;
            display: block;
        }
        .sidebar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            margin: 0 0 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        button {
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.06);
            color: #f1f3f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            background: rgba(0, 255, 204, 0.15);
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }
        #resetBtn {
            background: rgba(255, 51, 102, 0.1);
            border-color: rgba(255, 51, 102, 0.3);
            color: #ff3366;
        }
        #resetBtn:hover {
            background: rgba(255, 51, 102, 0.25);
            border-color: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.3);
        }
        .control-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0b3b8;
        }
        .control-value {
            font-weight: 600;
            color: #00ffcc;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 0.85rem;
            background: #14151a;
            color: #f1f3f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:hover {
            border-color: #00ffcc;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            accent-color: #00ffcc;
            margin: 4px 0;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #b0b3b8;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-row input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #00ffcc;
        }
        .stats-card {
            background: rgba(0, 255, 204, 0.04);
            border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
        }
        #totalBalls {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="canvas-container">
            <canvas id="galtonCanvas"></canvas>
        </div>
        <div class="sidebar-container">
            <div class="stats-card">
                <span>Esferas Simuladas</span>
                <span id="totalBalls">Total: 0</span>
            </div>
            
            <div class="control-card">
                <div class="section-title">Controles Principais</div>
                <div class="button-group">
                    <button id="addBallBtn">+1 Esfera</button>
                    <button id="add10BallsBtn">+10 Esferas</button>
                    <button id="resetBtn">Resetar</button>
                </div>
                
                <div class="control-row">
                    <div class="control-header">
                        <label for="layoutSelector">Configuração do Tabuleiro</label>
                    </div>
                    <select id="layoutSelector">
                        <option value="triangle">Triangular (Normal)</option>
                        <option value="bimodal">Bimodal (Dois Triângulos)</option>
                        <option value="uniform">Uniforme (Grade Regular)</option>
                    </select>
                </div>
                
                <div class="control-row">
                    <div class="control-header">
                        <label for="speedSlider">Velocidade</label>
                        <span class="control-value" id="speedVal">1.0x</span>
                    </div>
                    <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1">
                </div>
            </div>

            <div class="control-card">
                <div class="section-title">Parâmetros Probabilísticos</div>
                <div class="control-row">
                    <div class="control-header">
                        <label for="probSlider">Binomial Assimétrica (Chance Direita)</label>
                        <span class="control-value" id="probVal">50%</span>
                    </div>
                    <input type="range" id="probSlider" min="0.1" max="0.9" step="0.01" value="0.5">
                </div>
            </div>

            <div class="control-card">
                <div class="section-title">Física Experimental</div>
                <div class="control-row">
                    <div class="control-header">
                        <label for="gravitySlider">Gravidade</label>
                        <span class="control-value" id="gravityVal">1.0x</span>
                    </div>
                    <input type="range" id="gravitySlider" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>

                <div class="control-row">
                    <div class="control-header">
                        <label for="elasticitySlider">Elasticidade (Rebote)</label>
                        <span class="control-value" id="elasticityVal">60%</span>
                    </div>
                    <input type="range" id="elasticitySlider" min="0" max="100" step="5" value="60">
                </div>

                <div class="control-row">
                    <div class="control-header">
                        <label for="radiusSlider">Tamanho da Esfera</label>
                        <span class="control-value" id="radiusVal">5px</span>
                    </div>
                    <input type="range" id="radiusSlider" min="3" max="10" step="1" value="5">
                </div>
            </div>

            <div class="control-card">
                <div class="section-title">Visual & Interação</div>
                <label class="checkbox-row">
                    <input type="checkbox" id="showGaussCheck" checked>
                    <span>Exibir Curva de Gauss</span>
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="ballCollisionCheck">
                    <span>Colisão entre Esferas</span>
                </label>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galtonCanvas');
        const ctx = canvas.getContext('2d');
        const addBallBtn = document.getElementById('addBallBtn');
        const add10BallsBtn = document.getElementById('add10BallsBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const layoutSelector = document.getElementById('layoutSelector');
        const probSlider = document.getElementById('probSlider');
        const probVal = document.getElementById('probVal');
        const gravitySlider = document.getElementById('gravitySlider');
        const gravityVal = document.getElementById('gravityVal');
        const elasticitySlider = document.getElementById('elasticitySlider');
        const elasticityVal = document.getElementById('elasticityVal');
        const radiusSlider = document.getElementById('radiusSlider');
        const radiusVal = document.getElementById('radiusVal');
        const showGaussCheck = document.getElementById('showGaussCheck');
        const ballCollisionCheck = document.getElementById('ballCollisionCheck');
        const totalBallsSpan = document.getElementById('totalBalls');

        // --- Configurações & Parâmetros Físicos ---
        let canvasWidth = 600;
        let canvasHeight = 600;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        let ballRadius = 5;
        const pegRadius = 4;
        const numRowsTriangle = 15; // Específico para o layout triangular/normal
        const baseGravity = 0.15;
        let gravityMultiplier = 1.0;
        let restitution = 0.6; // Elasticidade (0 a 1)
        let probabilityRight = 0.5; // Probabilidade binomial (0.1 a 0.9)
        const horizontalRandomness = 0.4;
        const binHeight = 80;
        const topOffset = 60; // Espaço no topo antes dos pinos

        // Cores Tema Dark Neon
        const pegColor = '#aaa';
        const ballColor = '#00ccff';
        const ballShadowColor = 'rgba(0, 204, 255, 0.7)';
        const binColor = 'rgba(255, 255, 255, 0.1)';
        const histogramColor = '#ff3366';
        const histogramShadowColor = 'rgba(255, 51, 102, 0.6)';

        let balls = [];
        let pegs = [];
        let bins = [];
        let simulationSpeed = 1;
        let totalBallCount = 0;
        let showGauss = true;
        let ballCollisionEnabled = false;

        // --- Funções ---

        function setup() {
            balls = [];
            pegs = []; // Limpa os pinos existentes
            bins = [];
            totalBallCount = 0;
            updateTotalBallsDisplay();

            const selectedLayout = layoutSelector.value;
            const availableHeight = canvasHeight - binHeight - topOffset - 30; // Altura disponível para pinos

            if (selectedLayout === 'triangle') {
                // Layout Triangular (normal)
                const numRows = numRowsTriangle;
                const rowSpacing = availableHeight / (numRows + 1);

                for (let i = 0; i < numRows; i++) {
                    const numPegsInRow = i + 1;
                    const y = topOffset + (i + 1) * rowSpacing;
                    let currentHorizontalSpacing = Math.max(pegRadius * 3, (canvasWidth * 0.8) / Math.max(1, numPegsInRow));
                    currentHorizontalSpacing = Math.max(currentHorizontalSpacing, pegRadius * 2.5);

                    const totalWidthForRow = (numPegsInRow - 1) * currentHorizontalSpacing;
                    let startX = (canvasWidth - totalWidthForRow) / 2;
                    startX = Math.max(startX, pegRadius * 2 + 10);

                    for (let j = 0; j < numPegsInRow; j++) {
                        const x = startX + j * currentHorizontalSpacing;
                        if (x < canvasWidth - (pegRadius * 2 + 10)) {
                            pegs.push({ x, y, radius: pegRadius });
                        }
                    }
                }
            } else if (selectedLayout === 'bimodal') {
                // Dois triângulos menores lado a lado
                const numRows = 11;
                const rowSpacing = availableHeight / (numRows + 1);
                
                for (let i = 0; i < numRows; i++) {
                    const numPegsInRow = i + 1;
                    const y = topOffset + (i + 1) * rowSpacing;
                    
                    let spacing = Math.max(pegRadius * 2.5, (canvasWidth * 0.38) / Math.max(1, numPegsInRow));
                    const totalWidth = (numPegsInRow - 1) * spacing;
                    
                    // Triângulo da esquerda (centro em 26% da largura)
                    const startX1 = (canvasWidth * 0.26) - totalWidth / 2;
                    for (let j = 0; j < numPegsInRow; j++) {
                        const x = startX1 + j * spacing;
                        if (x > 15 && x < canvasWidth / 2 - 15) {
                            pegs.push({ x, y, radius: pegRadius });
                        }
                    }
                    
                    // Triângulo da direita (centro em 74% da largura)
                    const startX2 = (canvasWidth * 0.74) - totalWidth / 2;
                    for (let j = 0; j < numPegsInRow; j++) {
                        const x = startX2 + j * spacing;
                        if (x > canvasWidth / 2 + 15 && x < canvasWidth - 15) {
                            pegs.push({ x, y, radius: pegRadius });
                        }
                    }
                }
                
                // Divisor central no topo: V invertido para separar a queda central para os funis laterais
                const divRows = 6;
                const divSpacingY = rowSpacing;
                for (let i = 0; i < divRows; i++) {
                    const y = topOffset + i * divSpacingY;
                    const spread = i * 16;
                    pegs.push({ x: canvasWidth / 2 - spread, y, radius: pegRadius });
                    if (spread > 0) {
                        pegs.push({ x: canvasWidth / 2 + spread, y, radius: pegRadius });
                    }
                }
            } else if (selectedLayout === 'uniform') {
                // Layout Uniforme: Grade regular (sem deslocamento de linhas)
                const gridRows = 11;
                const gridCols = 13;
                const rowSpacing = availableHeight / (gridRows + 1);
                const colSpacing = canvasWidth / (gridCols + 1);
                
                for (let i = 0; i < gridRows; i++) {
                    const y = topOffset + (i + 1) * rowSpacing;
                    for (let j = 0; j < gridCols; j++) {
                        const x = (j + 1) * colSpacing;
                        pegs.push({ x, y, radius: pegRadius });
                    }
                }
            }

            // Inicializar colunas receptoras (bins)
            const numBins = numRowsTriangle + 1; // 16 bins
            const binWidth = canvasWidth / numBins;
            for (let i = 0; i < numBins; i++) {
                bins.push({
                    x: i * binWidth,
                    y: canvasHeight - binHeight,
                    width: binWidth,
                    height: binHeight,
                    count: 0
                });
            }

            updateUI();
        }

        function createBall() {
            totalBallCount++;
            updateTotalBallsDisplay();

            const selectedLayout = layoutSelector.value;
            let startX;
            if (selectedLayout === 'uniform') {
                // Queda aleatória/uniforme ao longo de toda a largura
                startX = 0.1 * canvasWidth + Math.random() * (0.8 * canvasWidth);
            } else if (selectedLayout === 'bimodal') {
                // Alterna entre cair sobre o triângulo da esquerda e da direita
                startX = Math.random() < 0.5 ? (canvasWidth * 0.26) : (canvasWidth * 0.74);
                startX += (Math.random() - 0.5) * 6;
            } else {
                // Triangular clássico: cai no centro geométrico
                startX = canvasWidth / 2 + (Math.random() - 0.5) * 5;
            }

            balls.push({
                x: startX,
                y: ballRadius + 10,
                vx: (Math.random() - 0.5) * 1,
                vy: 0,
                radius: ballRadius,
                active: true
            });
        }

        function update(dt) {
            const effectiveDt = dt * simulationSpeed;
            if (effectiveDt <= 0) return;

            // 1. Resolver colisões elásticas círculo-círculo entre as esferas (se ativado)
            if (ballCollisionEnabled) {
                for (let i = 0; i < balls.length; i++) {
                    const b1 = balls[i];
                    if (!b1.active) continue;
                    for (let j = i + 1; j < balls.length; j++) {
                        const b2 = balls[j];
                        if (!b2.active) continue;

                        const dx = b2.x - b1.x;
                        const dy = b2.y - b1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = b1.radius + b2.radius;

                        if (dist < minDist) {
                            const nx = dx / (dist || 1);
                            const ny = dy / (dist || 1);

                            // Velocidade relativa ao longo da normal
                            const kx = b1.vx - b2.vx;
                            const ky = b1.vy - b2.vy;
                            const vn = kx * nx + ky * ny;

                            if (vn > 0) {
                                // Coeficiente de restituição aplicado à colisão entre bolinhas
                                const impulse = (1 + restitution) * vn / 2;
                                b1.vx -= impulse * nx;
                                b1.vy -= impulse * ny;
                                b2.vx += impulse * nx;
                                b2.vy += impulse * ny;

                                // Empurrar para resolver interpenetração
                                const overlap = minDist - dist;
                                b1.x -= nx * overlap * 0.51;
                                b1.y -= ny * overlap * 0.51;
                                b2.x += nx * overlap * 0.51;
                                b2.y += ny * overlap * 0.51;
                            }
                        }
                    }
                }
            }

            // 2. Integração cinemática e colisões com obstáculos estáticos
            balls.forEach((ball) => {
                if (!ball.active) return;

                // Aplica gravidade parametrizada
                ball.vy += baseGravity * gravityMultiplier * effectiveDt;
                ball.x += ball.vx * effectiveDt;
                ball.y += ball.vy * effectiveDt;

                // Colisão com as paredes laterais
                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.vx *= -restitution;
                } else if (ball.x + ball.radius > canvasWidth) {
                    ball.x = canvasWidth - ball.radius;
                    ball.vx *= -restitution;
                }

                // Colisão com os pinos (obstáculos circulares estáticos)
                pegs.forEach(peg => {
                    const dx = ball.x - peg.x;
                    const dy = ball.y - peg.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = ball.radius + peg.radius;

                    if (distance < minDistance) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const relativeVelocity = ball.vx * nx + ball.vy * ny;

                        if (relativeVelocity < 0) {
                            // Viés probabilístico lateral (Binomial Assimétrica)
                            const goRight = Math.random() < probabilityRight;
                            const driftSign = goRight ? 1 : -1;

                            // Atualização de velocidade física com restituição (elasticidade)
                            const impulse = -(1 + restitution) * relativeVelocity;
                            ball.vx += impulse * nx;
                            ball.vy += impulse * ny;

                            // Aplica a força probabilística lateral direcionada
                            ball.vx += driftSign * horizontalRandomness * (0.6 + Math.random() * 0.8);

                            // Resolve interpenetração
                            const overlap = minDistance - distance;
                            ball.x += nx * overlap * 0.51;
                            ball.y += ny * overlap * 0.51;
                        }
                    }
                });

                // Verificar entrada nas colunas receptoras (bins)
                if (ball.y + ball.radius > canvasHeight - binHeight && ball.y < canvasHeight + ball.radius) {
                    let collected = false;
                    for (let i = 0; i < bins.length; i++) {
                        if (ball.x >= bins[i].x && ball.x < bins[i].x + bins[i].width) {
                            if (ball.y + ball.radius >= canvasHeight - 1) {
                                bins[i].count++;
                                ball.active = false;
                                collected = true;
                                break;
                            }
                        }
                    }
                    if (!collected && ball.y + ball.radius > canvasHeight - 1) {
                        let closestBin = 0;
                        let minDist = Infinity;
                        for (let i = 0; i < bins.length; i++) {
                            const binCenterX = bins[i].x + bins[i].width / 2;
                            const dist = Math.abs(ball.x - binCenterX);
                            if (dist < minDist) {
                                minDist = dist;
                                closestBin = i;
                            }
                        }
                        if (bins[closestBin]) {
                            bins[closestBin].count++;
                        }
                        ball.active = false;
                    }
                } else if (ball.y - ball.radius > canvasHeight) {
                    ball.active = false;
                }
            });
        }

        // Desenhar a curva teórica de Gauss sobre as colunas
        function drawGaussianCurve() {
            const collectedBalls = bins.reduce((sum, b) => sum + b.count, 0);
            if (collectedBalls === 0) return;

            const M = bins.length;
            const p = probabilityRight;
            const mean = (M - 1) * p;
            const variance = (M - 1) * p * (1 - p);
            const sigma = Math.sqrt(variance);

            // Prevenção de divisão por zero
            if (sigma < 0.01) return;

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#00ffcc'; // Verde Neon brilhante
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(0, 255, 204, 0.8)';

            const maxCount = Math.max(1, ...bins.map(b => b.count));
            const scaleY = (binHeight - 5) / maxCount;

            for (let xCanvas = 0; xCanvas <= canvasWidth; xCanvas += 2) {
                // Mapeia coordenada do Canvas para o espaço normal binomial [0, M-1]
                const xStat = (xCanvas / canvasWidth) * M - 0.5;

                // Densidade de probabilidade normal
                const exponent = -Math.pow(xStat - mean, 2) / (2 * Math.pow(sigma, 2));
                const pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(exponent);

                // Altura proporcional calculada
                const expectedHeight = collectedBalls * pdf * scaleY;
                const yCanvas = (canvasHeight - binHeight) + binHeight - expectedHeight;

                if (xCanvas === 0) {
                    ctx.moveTo(xCanvas, yCanvas);
                } else {
                    ctx.lineTo(xCanvas, yCanvas);
                }
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset do glow
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            // 1. Desenhar pinos
            ctx.fillStyle = pegColor;
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Desenhar divisórias dos coletores (bins)
            ctx.strokeStyle = binColor;
            ctx.lineWidth = 1;
            for (let i = 1; i < bins.length; i++) {
                const x = bins[i].x;
                ctx.beginPath();
                ctx.moveTo(x, canvasHeight - binHeight);
                ctx.lineTo(x, canvasHeight);
                ctx.stroke();
            }
            // Bordas laterais
            ctx.beginPath();
            ctx.moveTo(1, canvasHeight - binHeight);
            ctx.lineTo(1, canvasHeight);
            ctx.moveTo(canvasWidth - 1, canvasHeight - binHeight);
            ctx.lineTo(canvasWidth - 1, canvasHeight);
            ctx.stroke();

            // 3. Desenhar histograma como bolinhas empilhadas (ilusão analógica)
            const maxCount = Math.max(1, ...bins.map(b => b.count));
            
            // Fundo sutil para marcar as colunas ativas
            ctx.fillStyle = 'rgba(255, 51, 102, 0.04)';
            bins.forEach(bin => {
                if (bin.count > 0) {
                    const barHeight = (bin.count / maxCount) * (binHeight - 5);
                    ctx.fillRect(bin.x + 1, canvasHeight - barHeight, bin.width - 2, barHeight);
                }
            });

            // Empilhamento dinâmico de partículas simuladas
            ctx.fillStyle = histogramColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = histogramShadowColor;
            
            bins.forEach(bin => {
                if (bin.count > 0) {
                    const diameter = ballRadius * 2;
                    const ballsPerRow = Math.max(1, Math.floor((bin.width - 2) / diameter));
                    const maxRowCount = Math.max(1, ...bins.map(b => Math.ceil(b.count / ballsPerRow)));
                    
                    // O espaçamento vertical encolhe dinamicamente se o número de linhas crescer demais
                    const rowSpacing = Math.min(diameter, (binHeight - 6) / maxRowCount);
                    
                    for (let i = 0; i < bin.count; i++) {
                        const row = Math.floor(i / ballsPerRow);
                        const col = i % ballsPerRow;
                        
                        // Centraliza bolinhas na última linha incompleta
                        const rowCountInThisLine = Math.min(ballsPerRow, bin.count - row * ballsPerRow);
                        const startX = bin.x + (bin.width - rowCountInThisLine * diameter) / 2 + ballRadius;
                        
                        const x = startX + col * diameter;
                        const y = canvasHeight - 1 - ballRadius - row * rowSpacing;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, ballRadius * 0.9, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // 4. Desenhar curva teórica de Gauss se ativado
            if (showGauss) {
                drawGaussianCurve();
            }

            // 5. Desenhar bolinhas em queda livre (glowing active spheres)
            ctx.fillStyle = ballColor;
            ctx.shadowBlur = 8;
            ctx.shadowColor = ballShadowColor;

            balls.forEach(ball => {
                if (!ball.active) return;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 16.67;
            lastTime = timestamp;
            const maxDt = 3;
            const effectiveDt = Math.min(dt, maxDt);
            update(effectiveDt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateTotalBallsDisplay() {
            totalBallsSpan.textContent = `Total: ${totalBallCount}`;
        }

        function updateUI() {
            speedVal.textContent = `${simulationSpeed.toFixed(1)}x`;
            probVal.textContent = `${Math.round(probabilityRight * 100)}%`;
            gravityVal.textContent = `${gravityMultiplier.toFixed(1)}x`;
            elasticityVal.textContent = `${Math.round(restitution * 100)}%`;
            radiusVal.textContent = `${ballRadius}px`;
        }

        // --- Event Listeners ---
        addBallBtn.addEventListener('click', createBall);
        
        add10BallsBtn.addEventListener('click', () => {
            let count = 0;
            const intervalId = setInterval(() => {
                if (count < 10) {
                    createBall();
                    count++;
                } else {
                    clearInterval(intervalId);
                }
            }, 60);
        });

        resetBtn.addEventListener('click', setup);
        layoutSelector.addEventListener('change', setup);

        speedSlider.addEventListener('input', (e) => {
            simulationSpeed = parseFloat(e.target.value);
            updateUI();
        });

        probSlider.addEventListener('input', (e) => {
            probabilityRight = parseFloat(e.target.value);
            updateUI();
        });

        gravitySlider.addEventListener('input', (e) => {
            gravityMultiplier = parseFloat(e.target.value);
            updateUI();
        });

        elasticitySlider.addEventListener('input', (e) => {
            restitution = parseFloat(e.target.value) / 100;
            updateUI();
        });

        radiusSlider.addEventListener('input', (e) => {
            ballRadius = parseInt(e.target.value);
            updateUI();
        });

        showGaussCheck.addEventListener('change', (e) => {
            showGauss = e.target.checked;
        });

        ballCollisionCheck.addEventListener('change', (e) => {
            ballCollisionEnabled = e.target.checked;
        });

        // --- Inicialização ---
        setup();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
