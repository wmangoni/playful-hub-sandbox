<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Pular Obstáculos com IA (ES)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;800;900&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #080810;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 24, 48, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(30, 20, 60, 0.4) 0px, transparent 50%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        #appWrapper {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 30px;
            justify-content: center;
        }
        canvas {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background-color: #0d0d1a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            margin: 5px 0;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 650px;
            background: rgba(18, 18, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }
        #visContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(18, 18, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }
        #gameContainer:hover, #visContainer:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.15);
        }
        h1, h3 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            margin-top: 0;
            margin-bottom: 16px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00f0ff, #39ff14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        #info {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        #eliteInfo {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #8a8f98;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: left;
        }
        
        /* Custom Cyber Button Style */
        .btn-cyber {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 600;
            color: #00f0ff;
            background: transparent;
            border: 1px solid #00f0ff;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
        }
        .btn-cyber:hover {
            color: #080810;
            background: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-1px);
        }
        .btn-cyber:active {
            transform: translateY(1px);
        }
        .btn-cyber-success {
            color: #39ff14;
            border-color: #39ff14;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.1);
        }
        .btn-cyber-success:hover {
            color: #080810;
            background: #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }
        .btn-cyber-purple {
            color: #d946ef;
            border-color: #d946ef;
            box-shadow: 0 0 8px rgba(217, 70, 239, 0.1);
        }
        .btn-cyber-purple:hover {
            color: #080810;
            background: #d946ef;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.5);
        }

        /* Estilos para syntax highlighting do JSON */
        #savedJsonContent .string { color: #39ff14; }
        #savedJsonContent .number { color: #ff9f1c; }
        #savedJsonContent .boolean { color: #00f0ff; }
        #savedJsonContent .null { color: #ff007f; }
        #savedJsonContent .key { color: #d946ef; }
        
        #jsonViewer {
            background: rgba(13, 13, 26, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        #savedJsonInfo {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        /* Toast Notification */
        .cyber-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(13, 13, 26, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(0, 240, 255, 0.2);
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .cyber-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .cyber-toast.error {
            border-color: #ff0055;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255, 0, 85, 0.2);
        }
        .cyber-toast.success {
            border-color: #39ff14;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(57, 255, 20, 0.2);
        }
        
        /* New Cyberpunk Panels and Controls */
        .cyber-panel {
            background: rgba(18, 18, 30, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .cyber-panel h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 6px;
            text-align: left;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #8a8f98;
        }
        .control-row:last-child {
            margin-bottom: 0;
        }
        .control-row label {
            flex: 1;
            text-align: left;
        }
        .control-row input[type="range"] {
            flex: 1.2;
            margin: 0 8px;
            accent-color: #00f0ff;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .control-row select {
            background: rgba(13,13,26,0.85);
            border: 1px solid rgba(0,240,255,0.3);
            color: #00f0ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(0,240,255,0.1);
        }
        .control-row span.val-display {
            width: 50px;
            text-align: right;
            color: #00f0ff;
            font-weight: bold;
        }
        .btn-cyber-danger {
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.1);
        }
        .btn-cyber-danger:hover {
            color: #080810;
            background: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }
        
        /* Screen shake animation */
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-4px, -4px) rotate(-0.5deg); }
            20% { transform: translate(4px, 4px) rotate(0.5deg); }
            30% { transform: translate(-4px, 4px) rotate(0deg); }
            40% { transform: translate(4px, -4px) rotate(0.5deg); }
            50% { transform: translate(-4px, -4px) rotate(-0.5deg); }
            60% { transform: translate(4px, 4px) rotate(0deg); }
            70% { transform: translate(-4px, 4px) rotate(0.5deg); }
            80% { transform: translate(4px, -4px) rotate(-0.5deg); }
            90% { transform: translate(-4px, -4px) rotate(0.5deg); }
            100% { transform: translate(0, 0); }
        }
        .shake-canvas {
            animation: screenShake 0.6s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="appWrapper">
        <div id="gameContainer">
            <h1>REDE NEURAL EVOLUTIVA</h1>
            <div id="info">
                <div>Geração: <span id="generation" style="color: #00f0ff; font-weight: bold;">1</span></div>
                <div>Melhor Geração: <span id="bestScore" style="color: #39ff14; font-weight: bold;">0</span></div>
            </div>
            <div id="controlPanel" style="margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px; width: 100%; justify-content: flex-start; align-items: center;">
                <button id="saveBestBtn" class="btn-cyber btn-cyber-success">Copiar Melhor</button>
                <button id="loadBestBtn" class="btn-cyber">Adicionar Salvo</button>
                <button id="exportBrainBtn" class="btn-cyber btn-cyber-purple">Exportar Cérebro</button>
                <button id="importBrainBtn" class="btn-cyber">Importar Cérebro</button>
                <input type="file" id="importFileInput" accept=".json" style="display: none;">
                
                <span style="display: flex; align-items: center; gap: 6px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: #8a8f98; margin-left: auto;">
                    Focar Agente:
                    <select id="focusAgentSelect" style="background: rgba(13,13,26,0.85); border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; padding: 5px 10px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 11px; cursor: pointer; outline: none; transition: border-color 0.2s; box-shadow: 0 0 10px rgba(0,240,255,0.1);">
                        <option value="auto">Melhor Sobrevivente (Auto)</option>
                    </select>
                </span>
            </div>
            <div id="eliteInfo">Jogadores Elite: 0 ouro, 0 prata</div>
            <canvas id="gameCanvas" width="600" height="300"></canvas>
            
            <div style="display: flex; gap: 15px; width: 100%; margin-top: 15px; margin-bottom: 15px; box-sizing: border-box;">
                <!-- Painel de Hiperparâmetros da Evolução -->
                <div class="cyber-panel" style="flex: 1; margin-top: 0;">
                    <h4>Evolução</h4>
                    <div class="control-row">
                        <label for="mutationRateSlider">Mutação Taxa:</label>
                        <input type="range" id="mutationRateSlider" min="0.0" max="1.0" step="0.01" value="0.20">
                        <span id="mutationRateVal" class="val-display">0.20</span>
                    </div>
                    <div class="control-row">
                        <label for="mutationAmountSlider">Mutação Intens.:</label>
                        <input type="range" id="mutationAmountSlider" min="0.05" max="2.0" step="0.05" value="0.99">
                        <span id="mutationAmountVal" class="val-display">0.99</span>
                    </div>
                    <div class="control-row">
                        <label for="eliteRateSlider">Elitismo Taxa:</label>
                        <input type="range" id="eliteRateSlider" min="0.05" max="0.5" step="0.01" value="0.20">
                        <span id="eliteRateVal" class="val-display">0.20</span>
                    </div>
                    <div class="control-row">
                        <label for="speedSlider">Aceleração:</label>
                        <input type="range" id="speedSlider" min="1" max="5" step="1" value="1">
                        <span id="speedVal" class="val-display">1x</span>
                    </div>
                    <div class="control-row">
                        <label for="activationSelect">Ativação Oculta:</label>
                        <select id="activationSelect">
                            <option value="relu">ReLU</option>
                            <option value="sigmoid">Sigmoid</option>
                            <option value="tanh">Tanh</option>
                        </select>
                    </div>
                    <button id="extinctionBtn" class="btn-cyber btn-cyber-danger" style="width: 100%; margin-top: 12px; font-weight: bold; border-width: 2px;">Extinção em Massa</button>
                </div>
                
                <!-- Modo Sandbox -->
                <div class="cyber-panel" style="flex: 1; margin-top: 0;">
                    <h4>Modo Sandbox</h4>
                    <button id="sandboxToggleBtn" class="btn-cyber" style="width: 100%; margin-bottom: 12px;">Ativar Modo Sandbox</button>
                    <div id="sandboxControlsPanel" style="opacity: 0.5; pointer-events: none; transition: opacity 0.3s ease;">
                        <div class="control-row">
                            <label for="sandboxWidth">Largura Obs:</label>
                            <input type="range" id="sandboxWidth" min="20" max="100" step="5" value="30">
                            <span id="sandboxWidthVal" class="val-display">30px</span>
                        </div>
                        <div class="control-row">
                            <label for="sandboxHeight">Altura Obs:</label>
                            <input type="range" id="sandboxHeight" min="30" max="100" step="5" value="50">
                            <span id="sandboxHeightVal" class="val-display">50px</span>
                        </div>
                        <div class="control-row">
                            <label for="sandboxSpeed">Velocidade Obs:</label>
                            <input type="range" id="sandboxSpeed" min="0.0" max="10.0" step="0.5" value="5.0">
                            <span id="sandboxSpeedVal" class="val-display">5.0</span>
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: 12px;">
                            <button id="resumeSandboxBtn" class="btn-cyber" style="flex: 1; font-size: 9px; padding: 6px 4px;">Retomar Simulação</button>
                            <button id="clearSandboxBtn" class="btn-cyber btn-cyber-danger" style="flex: 1; font-size: 9px; padding: 6px 4px;">Limpar Nível</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="graphContainer" style="margin-top: 20px; width: 100%;">
                 <h3>Convergência Evolutiva (Fitness)</h3>
                 <canvas id="graphCanvas" width="600" height="350"></canvas>
            </div>
        </div>
        <div id="visContainer">
             <h3>Rede Neural (Selecione um Agente)</h3>
             <canvas id="nnCanvas" width="400" height="800"></canvas>
             
             <div id="jsonViewer" style="margin-top: 20px; width: 400px; border-radius: 8px; padding: 12px; box-sizing: border-box;">
                 <h3>Melhor Indivíduo Salvo</h3>
                 <div id="savedJsonInfo" style="margin-bottom: 10px; font-size: 11px; color: #8a8f98; font-family: monospace; padding: 6px; border-radius: 4px;">Carregando...</div>
                 <pre id="savedJsonContent" style="background: rgba(0,0,0,0.4); padding: 10px; border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; height: 180px; overflow: auto; font-size: 10px; line-height: 1.3; font-family: monospace; color: #e2e8f0; margin: 0;"></pre>
             </div>
        </div>
    </div>

    <script>
        // --- Configurações Globais ---
        const gameCanvas = document.getElementById('gameCanvas');
        const gameCtx = gameCanvas.getContext('2d');
        const nnCanvas = document.getElementById('nnCanvas');
        const nnCtx = nnCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // Comment out or remove the old genesP1, as it's the wrong size now
        /*
        const genesP1 = [
            "-0.915",
            "0.799",
            "-0.754",
            "-0.092",
            "-0.086",
            "-0.680",
            "-0.593",
            "-0.585",
            "0.311",
            "0.608",
            "-0.143",
            "0.360",
            "0.087",
            "0.472",
            "0.217",
            "-0.262",
            "0.630",
            "-0.325",
            "-0.371",
            "0.248",
            "0.170"
        ];
        */
        let genesP1 = null; // Set to null or an empty array initially

        const GAME_WIDTH = gameCanvas.width;
        const GAME_HEIGHT = gameCanvas.height;
        const GROUND_Y = GAME_HEIGHT - 50;
        const GRAVITY = 0.6;
        const JUMP_STRENGTH = -13;
        const OBSTACLE_SPEED = 5;
        const OBSTACLE_COLOR = 'darkred';
        const PLAYER_COLORS = [
            'blue', 'green', 'orange', 'purple', 'red', 'magenta', 
            'yellow', 'black-green', 'pink', 'teal', 'crimson', 'indigo', 
            'coral', 'maroon', 'olive', 'navy', 'turquoise', 'gold', 
            'plum', 'sienna'
        ];

        const NUM_PLAYERS = 20; // Número de indivíduos na população da ES
        let MUTATION_RATE = 0.2; // Taxa de mutação
        let MUTATION_AMOUNT = 0.99; // Magnitude da mutação
        let ELITE_RATE = 0.20; // Taxa de elitismo
        window.simulationSpeed = 1;
        window.globalActivationType = 'relu';
        window.isSandboxActive = false;
        window.sandboxPaused = false;
        window.extinctionOccurredGlobal = false;
        let extinctionFlashActive = false;
        let generationsWithoutImprovement = 0;
        const HIDDEN_UNITS_1 = 8; // Renamed from HIDDEN_UNITS
        const HIDDEN_UNITS_2 = 4; // Size of the new second hidden layer
        const NUM_INPUTS = 3;
        const NUM_OUTPUTS = 1;

        let players = [];
        let obstacles = [];
        let frameCount = 0;
        let generation = 1;
        let activePlayers = NUM_PLAYERS;
        let nextObstacleFrame = 100; // Quando o próximo obstáculo aparece
        let evolutionaryStrategy;
        let bestScoresHistory = []; // Armazena as melhores pontuações de cada geração
        let worstScoresHistory = []; // Armazena as piores pontuações de cada geração
        let averageScoresHistory = []; // Armazena a média de fitness por geração
        let selectedPlayer = null; // Jogador selecionado por clique
        let importedGenomeGlobal = null; // Cérebro importado via arquivo

        // Variáveis para armazenar o melhor indivíduo
        let bestEverFitness = 0;
        let bestEverNeuralNetwork = null;
        let bestEverGeneration = 0;

        // --- Classe Perceptron (Rede Neural) ---
        class MLP {
            constructor(numInputs, hiddenUnits1, hiddenUnits2, numOutputs) {
                // Use constants directly for consistency, ignore constructor args for now
                numInputs = NUM_INPUTS;
                hiddenUnits1 = HIDDEN_UNITS_1;
                hiddenUnits2 = HIDDEN_UNITS_2; // Use the new constant
                numOutputs = NUM_OUTPUTS;

                // Remove old single-layer properties if they exist
                // delete this.weights;
                // delete this.bias;
                // delete this.lastActivation;

                this.numInputs = numInputs;
                this.hiddenUnits1 = hiddenUnits1;
                this.hiddenUnits2 = hiddenUnits2; // Store the size
                this.numOutputs = numOutputs;

                // --- Initialization with Xavier ---
                const xavier = (fanIn, fanOut) => Math.sqrt(6 / (fanIn + fanOut));

                // Layer 1 (Input -> Hidden1)
                this.weights_in_h1 = Array.from({length: numInputs}, () =>
                    Array.from({length: hiddenUnits1}, () => (Math.random() * 2 - 1) * xavier(numInputs, hiddenUnits1)));
                this.bias_h1 = Array.from({length: hiddenUnits1}, () => (Math.random() * 2 - 1) * xavier(numInputs, hiddenUnits1) * 0.01);

                // Layer 2 (Hidden1 -> Hidden2)
                this.weights_h1_h2 = Array.from({length: hiddenUnits1}, () =>
                    Array.from({length: hiddenUnits2}, () => (Math.random() * 2 - 1) * xavier(hiddenUnits1, hiddenUnits2)));
                this.bias_h2 = Array.from({length: hiddenUnits2}, () => (Math.random() * 2 - 1) * xavier(hiddenUnits1, hiddenUnits2) * 0.01);

                // Layer 3 (Hidden2 -> Output)
                this.weights_h2_out = Array.from({length: hiddenUnits2}, () =>
                    Array.from({length: numOutputs}, () => (Math.random() * 2 - 1) * xavier(hiddenUnits2, numOutputs)));
                this.bias_out = Array.from({length: numOutputs}, () => (Math.random() * 2 - 1) * xavier(hiddenUnits2, numOutputs) * 0.01);


                // --- Store activations for visualization ---
                this.lastInputs = Array(numInputs).fill(0);
                this.hiddenActivations1 = Array(hiddenUnits1).fill(0);
                this.hiddenActivations2 = Array(hiddenUnits2).fill(0); // For the second hidden layer
                this.lastOutput = Array(numOutputs).fill(0);
            }

            // Usar ReLU para evitar vanishing gradient
            relu(x) {
                return Math.max(0, x);
            }

            sigmoid(x) {
                return 1 / (1 + Math.exp(-x));
            }

            tanh(x) {
                return Math.tanh(x);
            }

            activation(x, type) {
                switch(type) {
                    case 'sigmoid': return 1 / (1 + Math.exp(-x));
                    case 'tanh':    return Math.tanh(x);
                    case 'relu':
                    default:        return Math.max(0, x);
                }
            }

            feedForward(inputs) {
                if (inputs.length !== this.numInputs) {
                    console.error(`Input length mismatch: expected ${this.numInputs}, got ${inputs.length}`);
                    // Pad or truncate inputs as a fallback, or return an error/default value
                    inputs = inputs.slice(0, this.numInputs);
                    while (inputs.length < this.numInputs) inputs.push(0);
                }
                this.lastInputs = inputs;

                // Camada oculta 1 com a ativação selecionada
                this.hiddenActivations1 = this.bias_h1.map((bias, i) => {
                    const sum = inputs.reduce((acc, val, j) => acc + val * this.weights_in_h1[j][i], bias);
                    return this.activation(sum, window.globalActivationType || 'relu');
                });

                // Camada oculta 2 com a ativação selecionada
                this.hiddenActivations2 = this.bias_h2.map((bias, i) => {
                    const sum = this.hiddenActivations1.reduce((acc, val, j) => acc + val * this.weights_h1_h2[j][i], bias);
                    return this.activation(sum, window.globalActivationType || 'relu');
                });

                // Camada de saída com sigmoid
                const outputs = this.bias_out.map((bias, i) => {
                    // Use hiddenActivations2 as input for the output layer
                    const sum = this.hiddenActivations2.reduce((acc, val, j) => acc + val * this.weights_h2_out[j][i], bias);
                    return this.sigmoid(sum);
                });

                this.lastOutput = outputs; // Store the array
                // Return 1 if the first output neuron is > 0.5, else 0
                return (outputs.length > 0 && outputs[0] > 0.5) ? 1 : 0;
            }

            getGenes() {
                const genes = [];
                // Layer 1
                this.weights_in_h1.forEach(row => genes.push(...row));
                genes.push(...this.bias_h1);
                // Layer 2
                this.weights_h1_h2.forEach(row => genes.push(...row));
                genes.push(...this.bias_h2);
                // Layer 3
                this.weights_h2_out.forEach(row => genes.push(...row));
                genes.push(...this.bias_out);
                return genes;
            }

            setGenes(genes) {
                let idx = 0;
                try {
                    // Layer 1 (Input -> Hidden1)
                    for(let i = 0; i < this.numInputs; i++) {
                        for(let j = 0; j < this.hiddenUnits1; j++) {
                            if (idx >= genes.length) throw new Error("Gene array too short");
                            this.weights_in_h1[i][j] = parseFloat(genes[idx++]);
                        }
                    }
                    for(let i = 0; i < this.hiddenUnits1; i++) {
                         if (idx >= genes.length) throw new Error("Gene array too short");
                        this.bias_h1[i] = parseFloat(genes[idx++]);
                    }
                    // Layer 2 (Hidden1 -> Hidden2)
                    for(let i = 0; i < this.hiddenUnits1; i++) {
                        for(let j = 0; j < this.hiddenUnits2; j++) {
                             if (idx >= genes.length) throw new Error("Gene array too short");
                            this.weights_h1_h2[i][j] = parseFloat(genes[idx++]);
                        }
                    }
                    for(let i = 0; i < this.hiddenUnits2; i++) {
                         if (idx >= genes.length) throw new Error("Gene array too short");
                        this.bias_h2[i] = parseFloat(genes[idx++]);
                    }
                    // Layer 3 (Hidden2 -> Output)
                    for(let i = 0; i < this.hiddenUnits2; i++) {
                        for(let j = 0; j < this.numOutputs; j++) {
                             if (idx >= genes.length) throw new Error("Gene array too short");
                            this.weights_h2_out[i][j] = parseFloat(genes[idx++]);
                        }
                    }
                    for(let i = 0; i < this.numOutputs; i++) {
                         if (idx >= genes.length) throw new Error("Gene array too short");
                        this.bias_out[i] = parseFloat(genes[idx++]);
                    }

                     if (idx !== this.getNumGenes()) {
                         console.warn(`Gene count mismatch after setting: expected ${this.getNumGenes()}, processed ${idx}`);
                     }

                } catch (e) {
                    console.error("Error setting genes:", e, "Index:", idx, "Gene Array Length:", genes.length);
                     // Optionally reset weights to default random if loading fails critically
                }
            }

            getNumGenes() {
                // Este método calcula o número total de genes (pesos e vieses) na rede neural
                
                // Cálculo para a primeira camada:
                // - Pesos entre camada de entrada e primeira camada oculta: numInputs * hiddenUnits1
                // - Vieses da primeira camada oculta: hiddenUnits1
                const genesLayer1 = (this.numInputs * this.hiddenUnits1) + this.hiddenUnits1;
                
                // Cálculo para a segunda camada:
                // - Pesos entre primeira e segunda camada oculta: hiddenUnits1 * hiddenUnits2
                // - Vieses da segunda camada oculta: hiddenUnits2
                const genesLayer2 = (this.hiddenUnits1 * this.hiddenUnits2) + this.hiddenUnits2;
                
                // Cálculo para a camada de saída:
                // - Pesos entre segunda camada oculta e camada de saída: hiddenUnits2 * numOutputs
                // - Vieses da camada de saída: numOutputs
                const genesLayer3 = (this.hiddenUnits2 * this.numOutputs) + this.numOutputs;
                
                // Retorna o número total de genes somando todas as camadas
                // Isso é essencial para o algoritmo evolutivo saber quantos genes precisa gerar
                return genesLayer1 + genesLayer2 + genesLayer3;
            }
        }

        // --- Classe Jogador ---
        class Player {
            constructor(color, brain, height) {
                this.width = Math.random() * 5 + 25;
                this.height = height ? height : Math.random() * 10 + 40;
                this.x = Math.random() * 2 + 48;
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.isJumping = false;
                this.color = color;
                this.isAlive = true;
                this.score = 0;
                this.brain = brain; // Instância do Perceptron
            }

            getInputs(obstacles) {
                let closestObstacle = null;
                let minDistance = Infinity;

                for (const obstacle of obstacles) {
                    const distance = obstacle.x - (this.x + this.width);
                    if (distance >= 0 && distance < minDistance) {
                        minDistance = distance;
                        closestObstacle = obstacle;
                    }
                }

                if (!closestObstacle) {
                    return [1.0, 0.5, 0]; // Distância máxima, altura obstáculo e velocidade obstáculo 0
                }

                const inputDistance = minDistance / GAME_WIDTH;
                //const inputPlayerY = (GROUND_Y - (this.y + this.height)) / GROUND_Y;
                const inputObstacleHeight = closestObstacle.height / GROUND_Y;
                const inputObstacleSpeed = (closestObstacle.speed - 5) / 5; // Normaliza velocidade (0.5-0.9)

                return [inputDistance, inputObstacleHeight, inputObstacleSpeed];
            }

            think() {
                const inputs = this.getInputs(obstacles);
                const output = this.brain.feedForward(inputs);
                if (output === 1) {
                    this.jump();
                }
            }

            jump() {
                if (!this.isJumping) {
                    this.velocityY = JUMP_STRENGTH;
                    this.isJumping = true;
                    // Toca som de pulo apenas se for o jogador focado/selecionado
                    if (this === selectedPlayer) {
                        playSynthJump();
                    }
                }
            }

            update() {
                if (!this.isAlive) return;

                // Aplica gravidade
                this.velocityY += GRAVITY;
                this.y += this.velocityY;


                // Bonus por se manter próximo ao chão
                const groundBonus = (GROUND_Y - (this.y + this.height)) < 10 ? 0.5 : 0;

                // Penalidade por pular desnecessariamente
                const jumpPenalty = this.isJumping ? -0.6 : 0;

                const weightPenalty = this.brain.getGenes().reduce((sum, gene) => sum + Math.abs(gene), 0) * -0.02;
                this.score += 1 + groundBonus + jumpPenalty + weightPenalty;

                //console.log("Ativações ocultas:", this.brain.hiddenActivations);
                //console.log("Saída:", this.brain.lastOutput);


                // Verifica colisão com o chão
                if (this.y + this.height > GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // Lógica da IA para decidir pular
                this.think();
            }


            draw(ctx) {
                if (!this.isAlive) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Add a subtle glowing border matching player color or white
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }

            checkCollision(obstacle) {
                // Verificação simples de colisão AABB (Axis-Aligned Bounding Box)
                return (
                    this.x < obstacle.x + obstacle.width &&
                    this.x + this.width > obstacle.x &&
                    this.y < obstacle.y + obstacle.height &&
                    this.y + this.height > obstacle.y
                );
            }
        }

        // --- Classe Obstáculo ---
        class Obstacle {
            constructor(x, y, width, height, speed) {
                this.height = height !== undefined ? height : (30 + Math.random() * 60); // Altura entre 30-100
                this.width = width !== undefined ? width : (20 + Math.random() * 40); // Largura entre 20-70
                this.speed = speed !== undefined ? speed : (OBSTACLE_SPEED + Math.random() * 5); // Velocidade 5-7
                this.x = x !== undefined ? x : GAME_WIDTH;
                this.y = y !== undefined ? y : (GROUND_Y - this.height); // Sempre no chão
                this.color = OBSTACLE_COLOR;
            }

            update() {
                this.x -= this.speed;
            }

            draw(ctx) {
                // Glow neon red
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                ctx.strokeStyle = '#ff9f1c';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                // Scanlines on obstacle
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let y = this.y + 4; y < this.y + this.height; y += 8) {
                    ctx.fillRect(this.x, y, this.width, 2);
                }
            }

            isOffscreen() {
                return this.x + this.width < 0;
            }
        }

        // --- Classe Estratégia Evolutiva (ES) ---
        class EvolutionaryStrategy {
            constructor(populationSize, mutationRate, mutationAmount, numGenes) {
                this.populationSize = populationSize;
                this.numGenes = numGenes;
                this.population = this.initializePopulation();
                this.mutationRate = mutationRate;
                this.mutationAmount = mutationAmount;
            }
            
            selection() {
                // Manter a proporção elite baseada no slider em tempo real
                const eliteCount = Math.ceil(this.populationSize * (window.ELITE_RATE !== undefined ? window.ELITE_RATE : 0.2));
                return this.population.slice(0, eliteCount);
            }
            
            // Adicionar método de crossover (recombinação)
            crossover(parent1, parent2) {
                const childGenes = [];
                for (let i = 0; i < this.numGenes; i++) {
                    childGenes.push(Math.random() < 0.5 ? parent1.genes[i] : parent2.genes[i]);
                }
                return childGenes;
            }
            
            // Modificar o método de geração de nova população para incluir crossover e choque de mutação pós-extinção
            generateNewPopulation() {
                // Reduzir mutação mais lentamente (decaimento herdado)
                this.mutationAmount *= 0.995; // Decaimento de 0.5% por geração
                this.mutationRate *= 0.998; // Decaimento de 0.2% por geração
                
                // Limites mínimos mais altos
                this.mutationAmount = Math.max(0.15, this.mutationAmount);
                this.mutationRate = Math.max(0.08, this.mutationRate);
                
                // Determinar taxas para a geração atual considerando choque de extinção em massa
                let currentMutationAmount = this.mutationAmount;
                let currentMutationRate = this.mutationRate;
                
                if (window.extinctionOccurredGlobal) {
                    // Dobrar intensidade e expandir taxa para a próxima rodada
                    currentMutationAmount = Math.min(2.5, this.mutationAmount * 2.0);
                    currentMutationRate = Math.min(0.8, this.mutationRate * 1.5);
                    
                    // Consumir a flag
                    window.extinctionOccurredGlobal = false;
                    
                    showNotification("Genes da elite desestabilizados! Mutação temporariamente acelerada.", "success");
                }
                
                // Selecionar pais
                const parents = this.selection();
                const newPopulation = [];
                
                // Adicionar elites diretamente (metade da taxa de elitismo, sem mutação)
                const eliteCount = Math.ceil(this.populationSize * (window.ELITE_RATE !== undefined ? window.ELITE_RATE : 0.2) * 0.5);
                for (let i = 0; i < eliteCount; i++) {
                    if (this.population[i]) {
                        newPopulation.push(this.createIndividual([...this.population[i].genes]));
                    }
                }
                
                // Gerar o resto da população com crossover e mutação
                while (newPopulation.length < this.populationSize) {
                    // Selecionar dois pais aleatórios do grupo de selecionados
                    const parent1 = parents[Math.floor(Math.random() * parents.length)];
                    const parent2 = parents[Math.floor(Math.random() * parents.length)];
                    
                    // Aplicar crossover
                    let childGenes = this.crossover(parent1, parent2);
                    
                    // Aplicar mutação usando taxas calculadas
                    childGenes = this.mutate(childGenes, currentMutationRate, currentMutationAmount);
                    
                    // Adicionar à nova população
                    newPopulation.push(this.createIndividual(childGenes));
                }
                
                this.population = newPopulation;
            }

            // Inicializa a população com genes aleatórios [-1, 1]
            initializePopulation() {
                // O fitness é a pontuação que cada indivíduo (jogador) consegue no jogo
                // Quanto maior o fitness, melhor o jogador se saiu e mais chances ele tem
                // de passar seus genes para a próxima geração
                const pop = [];
                for (let i = 0; i < this.populationSize; i++) {
                    pop.push({
                        genes: Array(this.numGenes).fill(0).map(() => Math.random() * 2 - 1),
                        fitness: 0 // Começa com 0 pois ainda não jogou
                    });
                }
                return pop;
            }

            // Cria um novo indivíduo (usado na geração)
            createIndividual(genes) {
                return { genes: genes, fitness: 0 };
            }

            // Avalia a população com base nas pontuações (fitness)
            evaluate(fitnessScores) {
                // Verificar se os dados de fitness são válidos
                if (!fitnessScores || fitnessScores.length === 0) {
                    console.error("Array de fitness inválido ou vazio");
                    return;
                }
                
                // Verificar compatibilidade de tamanho
                if (fitnessScores.length !== this.populationSize) {
                    console.warn(`Tamanho do array de fitness (${fitnessScores.length}) não corresponde ao tamanho da população (${this.populationSize})!`);
                    // Ajustar o tamanho do array de fitness se necessário
                    fitnessScores = fitnessScores.slice(0, this.populationSize);
                    while (fitnessScores.length < this.populationSize) {
                        fitnessScores.push(0); // Preencher com zeros se faltar
                    }
                }
                
                // Atribuir fitness aos indivíduos
                for (let i = 0; i < this.populationSize; i++) {
                    // Garante que o indivíduo existe antes de atribuir fitness
                    if (this.population[i]) {
                        this.population[i].fitness = fitnessScores[i] || 0; // Usa 0 se score for undefined/null
                    } else {
                        console.warn(`Indivíduo ${i} não encontrado na população durante avaliação.`);
                    }
                }
                
                // Ordena a população por fitness (do maior para o menor)
                this.population.sort((a, b) => b.fitness - a.fitness);
                
                // Imprime o primeiro (melhor) e último (pior) indivíduo da população ordenada
                if (this.population.length > 0) {
                    console.log("Melhor indivíduo:", {
                        fitness: this.population[0].fitness.toFixed(2),
                        genes: this.population[0].genes.map(g => g.toFixed(3))
                    });
                    
                    if (this.population.length > 1) {
                        console.log("Pior indivíduo:", {
                            fitness: this.population[this.population.length-1].fitness.toFixed(2), 
                            genes: this.population[this.population.length-1].genes.map(g => g.toFixed(3))
                        });
                    }
                }
            }

            // Aplica mutação a um conjunto de genes com parâmetros dinâmicos
            mutate(genes, rate, amount) {
                const mutRate = rate !== undefined ? rate : this.mutationRate;
                const mutAmount = amount !== undefined ? amount : this.mutationAmount;
                const mutatedGenes = [...genes];
                for (let i = 0; i < this.numGenes; i++) {
                    if (Math.random() < mutRate) {
                        // Mutação adaptativa (maior impacto em genes extremos)
                        const scale = 1.2 - Math.abs(mutatedGenes[i]);
                        const mutation = (Math.random() * 1.4 - 1) * mutAmount * scale;
                        mutatedGenes[i] += mutation;
                        
                        // Limitar valores entre -2 e 2
                        mutatedGenes[i] = Math.max(-2, Math.min(2, mutatedGenes[i]));
                    }
                }
                return mutatedGenes;
            }

            // Retorna os genes de um indivíduo específico
            getIndividualGenes(index) {
                 if (index >= 0 && index < this.population.length) {
                     return this.population[index].genes;
                 } else {
                     console.error(`Índice de indivíduo inválido: ${index}`);
                     // Retorna genes aleatórios como fallback para evitar crash total
                     return Array(this.numGenes).fill(0).map(() => Math.random() * 2 - 1);
                 }
            }

            getBestFitness() {
                return this.population[0] ? this.population[0].fitness : 0;
            }
        }

        // --- Funções de Visualização ---

        function drawNeuralNetwork(ctx, nn) {
            const hiddenActivations2 = nn.hiddenActivations2 || [];

            const layers = [
                { neurons: nn.lastInputs || [0, 0, 0], labels: ["Distância", "Alt Obst", "Veloc Obst"] },
                { neurons: nn.hiddenActivations1 || Array(8).fill(0), labels: [] },
                { neurons: hiddenActivations2 || Array(4).fill(0), labels: [] },
                { neurons: nn.lastOutput || [0], labels: ["Pular?"] }
            ];

            const neuronRadius = 12;
            const layerSpacing = 100; // X coordinates: 50, 150, 250, 350
            const H = ctx.canvas.height;
            const W = ctx.canvas.width;

            // Clear with dark-mode canvas bg
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, W, H);

            // Centering helper
            function getNeuronCoords(layerIdx, neuronIdx, numNeurons) {
                const x = 50 + layerIdx * layerSpacing;
                const S = 65; // Vertical spacing
                const totalHeight = (numNeurons - 1) * S;
                const startY = (H - totalHeight) / 2;
                const y = startY + neuronIdx * S;
                return { x, y };
            }

            // Draw Connections (Synapses) first
            layers.forEach((layer, layerIdx) => {
                if (layerIdx < layers.length - 1) {
                    const nextLayer = layers[layerIdx + 1];
                    const numNeurons = layer.neurons.length;
                    const numNextNeurons = nextLayer.neurons.length;

                    for (let i = 0; i < numNeurons; i++) {
                        const pt1 = getNeuronCoords(layerIdx, i, numNeurons);
                        for (let j = 0; j < numNextNeurons; j++) {
                            const pt2 = getNeuronCoords(layerIdx + 1, j, numNextNeurons);

                            let weight = 0;
                            try {
                                if (layerIdx === 0) weight = nn.weights_in_h1[i][j];
                                else if (layerIdx === 1) weight = nn.weights_h1_h2[i][j];
                                else if (layerIdx === 2) weight = nn.weights_h2_out[i][j];
                            } catch (e) {}

                            const absWeight = Math.abs(weight);
                            ctx.beginPath();
                            ctx.moveTo(pt1.x, pt1.y);
                            ctx.lineTo(pt2.x, pt2.y);

                            ctx.lineWidth = Math.max(0.3, Math.min(absWeight * 2.5, 3.5));
                            ctx.strokeStyle = weight > 0 
                                ? `rgba(57, 255, 20, ${0.15 + absWeight * 0.4})` // Green
                                : `rgba(255, 0, 127, ${0.15 + absWeight * 0.4})`; // Red/Magenta
                            ctx.stroke();

                            // Small neon signal flow particles
                            const sourceActivation = layer.neurons[i] || 0;
                            if (sourceActivation > 0.05 && absWeight > 0.1) {
                                const speedScale = 1.0 + absWeight * 0.5;
                                const t = ((Date.now() / 1500) * speedScale + (i * 0.2 + j * 0.1)) % 1.0;
                                const px = pt1.x + (pt2.x - pt1.x) * t;
                                const py = pt1.y + (pt2.y - pt1.y) * t;

                                ctx.beginPath();
                                ctx.arc(px, py, 2.0, 0, Math.PI * 2);
                                ctx.fillStyle = weight > 0 ? '#39ff14' : '#ff007f';
                                
                                ctx.shadowBlur = 8;
                                ctx.shadowColor = weight > 0 ? '#39ff14' : '#ff007f';
                                ctx.fill();
                                ctx.shadowBlur = 0; // reset
                            }
                        }
                    }
                }
            });

            // Draw Neurons (Nodes) on top
            layers.forEach((layer, layerIdx) => {
                const numNeurons = layer.neurons.length;
                layer.neurons.forEach((neuronVal, neuronIdx) => {
                    const pt = getNeuronCoords(layerIdx, neuronIdx, numNeurons);
                    const v = neuronVal || 0;

                    // Color based on activation
                    let nodeColor = '#1b1b3a';
                    if (v > 0.05) {
                        const r = Math.round(27 * (1 - Math.min(v, 1)));
                        const g = Math.round(27 * (1 - Math.min(v, 1)) + 240 * Math.min(v, 1));
                        const b = Math.round(58 * (1 - Math.min(v, 1)) + 255 * Math.min(v, 1));
                        nodeColor = `rgb(${r}, ${g}, ${b})`;
                    }

                    // Shadow/Glow
                    if (v > 0.05) {
                        ctx.shadowBlur = Math.min(v * 15, 20);
                        ctx.shadowColor = '#00f0ff';
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    // Node Circle
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, neuronRadius, 0, Math.PI * 2);
                    ctx.fillStyle = nodeColor;
                    ctx.fill();

                    ctx.shadowBlur = 0; // Reset shadow for outline
                    ctx.strokeStyle = v > 0.05 ? '#00f0ff' : '#4a5568';
                    ctx.lineWidth = v > 0.05 ? 2 : 1;
                    ctx.stroke();

                    // Text value
                    ctx.fillStyle = v > 0.05 ? '#ffffff' : '#a0aec0';
                    ctx.font = 'bold 8px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.fillText(v.toFixed(2), pt.x, pt.y + 3);

                    // Draw labels for Inputs and Outputs
                    if (layer.labels && layer.labels[neuronIdx]) {
                        ctx.fillStyle = layerIdx === 0 ? '#8a8f98' : '#00f0ff';
                        ctx.font = 'bold 9px Orbitron';
                        if (layerIdx === 0) {
                            ctx.textAlign = 'right';
                            ctx.fillText(layer.labels[neuronIdx], pt.x - 18, pt.y + 3);
                        } else {
                            ctx.textAlign = 'left';
                            ctx.fillText(layer.labels[neuronIdx], pt.x + 18, pt.y + 3);
                        }
                    }
                });
            });
        }

        let hoveredGenIndex = -1;

        function drawFitnessGraph(ctx, bestHistory, averageHistory) {
            const canvasWidth = ctx.canvas.width;
            const canvasHeight = ctx.canvas.height;
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Background
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            if (!bestHistory || bestHistory.length === 0) {
                ctx.fillStyle = '#6f7e94';
                ctx.font = '13px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText('AGUARDANDO CONVERGÊNCIA EVOLUTIVA...', canvasWidth / 2, canvasHeight / 2);
                return;
            }

            const paddingLeft = 60;
            const paddingRight = 40;
            const paddingTop = 50;
            const paddingBottom = 40;
            
            const chartWidth = canvasWidth - paddingLeft - paddingRight;
            const chartHeight = canvasHeight - paddingTop - paddingBottom;

            // Auto-scale Y
            const maxScore = Math.max(...bestHistory, 100);
            
            // Grid Lines
            ctx.strokeStyle = '#1e1f32';
            ctx.lineWidth = 1;
            const gridLines = 5;
            for (let i = 0; i <= gridLines; i++) {
                const y = paddingTop + (chartHeight * i) / gridLines;
                ctx.beginPath();
                ctx.moveTo(paddingLeft, y);
                ctx.lineTo(canvasWidth - paddingRight, y);
                ctx.stroke();
                
                // Y values label
                const val = maxScore - (maxScore * i) / gridLines;
                ctx.fillStyle = '#5c6370';
                ctx.font = '10px Orbitron';
                ctx.textAlign = 'right';
                ctx.fillText(val.toFixed(0), paddingLeft - 10, y + 4);
            }

            // We show all history if length is small, or limit to the last 50 points
            const maxPoints = 50;
            const startIdx = Math.max(0, bestHistory.length - maxPoints);
            const bestSlice = bestHistory.slice(startIdx);
            const avgSlice = averageHistory.slice(startIdx);
            const pointsLen = bestSlice.length;

            // Helper to get coordinates
            function getCoords(index, value) {
                const x = paddingLeft + (index / Math.max(1, pointsLen - 1)) * chartWidth;
                const y = paddingTop + chartHeight - (value / maxScore) * chartHeight;
                return { x, y };
            }

            // Draw Average Fitness line (Neon Purple #8b5cf6)
            if (pointsLen > 1) {
                ctx.strokeStyle = '#8b5cf6';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                const first = getCoords(0, avgSlice[0]);
                ctx.moveTo(first.x, first.y);
                for (let i = 1; i < pointsLen; i++) {
                    const pt = getCoords(i, avgSlice[i]);
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
                
                // Glow effect
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#8b5cf6';
                ctx.stroke();
                ctx.shadowBlur = 0; // reset
            }

            // Draw Best Fitness line (Lime Green #39ff14)
            if (pointsLen > 1) {
                ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 3;
                ctx.beginPath();
                const first = getCoords(0, bestSlice[0]);
                ctx.moveTo(first.x, first.y);
                for (let i = 1; i < pointsLen; i++) {
                    const pt = getCoords(i, bestSlice[i]);
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
                
                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#39ff14';
                ctx.stroke();
                ctx.shadowBlur = 0; // reset
            }

            // Draw markers
            for (let i = 0; i < pointsLen; i++) {
                const bestCoords = getCoords(i, bestSlice[i]);
                const avgCoords = getCoords(i, avgSlice[i]);
                
                // Max Fitness dot
                ctx.beginPath();
                ctx.arc(bestCoords.x, bestCoords.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#39ff14';
                ctx.fill();
                
                // Avg Fitness dot
                ctx.beginPath();
                ctx.arc(avgCoords.x, avgCoords.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#8b5cf6';
                ctx.fill();
            }

            // Draw X Axis Generation labels
            ctx.fillStyle = '#5c6370';
            ctx.font = '10px Orbitron';
            ctx.textAlign = 'center';
            for (let i = 0; i < pointsLen; i++) {
                const labelFrequency = Math.ceil(pointsLen / 6);
                if (i % labelFrequency === 0 || i === pointsLen - 1) {
                    const pt = getCoords(i, 0);
                    const actualGen = startIdx + i + 1;
                    ctx.fillText(`G${actualGen}`, pt.x, paddingTop + chartHeight + 18);
                }
            }

            // Draw Legend (top right)
            ctx.font = '10px Orbitron';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#39ff14';
            ctx.beginPath();
            ctx.arc(canvasWidth - paddingRight - 150, paddingTop - 25, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e2e8f0';
            ctx.fillText('Max Fitness', canvasWidth - paddingRight - 80, paddingTop - 22);

            ctx.fillStyle = '#8b5cf6';
            ctx.beginPath();
            ctx.arc(canvasWidth - paddingRight - 70, paddingTop - 25, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e2e8f0';
            ctx.fillText('Avg Fitness', canvasWidth - paddingRight, paddingTop - 22);

            // Draw Hover Tooltip Guide Line and tooltip
            if (hoveredGenIndex >= 0 && hoveredGenIndex < pointsLen) {
                const bestCoords = getCoords(hoveredGenIndex, bestSlice[hoveredGenIndex]);
                const avgCoords = getCoords(hoveredGenIndex, avgSlice[hoveredGenIndex]);
                
                // Hover Line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(bestCoords.x, paddingTop);
                ctx.lineTo(bestCoords.x, paddingTop + chartHeight);
                ctx.stroke();
                ctx.setLineDash([]); // Reset line dash

                // Highlight dots on hover
                ctx.beginPath();
                ctx.arc(bestCoords.x, bestCoords.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#39ff14';
                ctx.strokeStyle = '#0a0a14';
                ctx.lineWidth = 2;
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(avgCoords.x, avgCoords.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#8b5cf6';
                ctx.strokeStyle = '#0a0a14';
                ctx.lineWidth = 1.5;
                ctx.fill();
                ctx.stroke();

                // Tooltip box
                const genNumber = startIdx + hoveredGenIndex + 1;
                const maxVal = bestSlice[hoveredGenIndex].toFixed(1);
                const avgVal = avgSlice[hoveredGenIndex].toFixed(1);

                const tooltipText = `Geração: ${genNumber} | Max: ${maxVal} | Média: ${avgVal}`;
                ctx.font = '10px Orbitron';
                const textWidth = ctx.measureText(tooltipText).width;
                
                const tooltipW = textWidth + 20;
                const tooltipH = 26;
                
                let tooltipX = bestCoords.x - tooltipW / 2;
                if (tooltipX < paddingLeft) tooltipX = paddingLeft;
                if (tooltipX + tooltipW > canvasWidth - paddingRight) tooltipX = canvasWidth - paddingRight - tooltipW;
                
                let tooltipY = Math.min(bestCoords.y, avgCoords.y) - 35;
                if (tooltipY < 10) tooltipY = Math.max(bestCoords.y, avgCoords.y) + 15;

                // Box
                ctx.fillStyle = 'rgba(18, 18, 30, 0.9)';
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(tooltipX, tooltipY, tooltipW, tooltipH, 4);
                ctx.fill();
                ctx.stroke();

                // Text inside box
                ctx.fillStyle = '#00f0ff';
                ctx.textAlign = 'center';
                ctx.fillText(tooltipText, tooltipX + tooltipW / 2, tooltipY + 16);
            }
        }

        // --- Lógica Principal do Jogo ---

        function spawnObstacle() {
            obstacles.push(new Obstacle());
            // Intervalo entre obstáculos proporcional à pontuação
            const minInterval = Math.max(40, 100 - players[0].score / 10);
            nextObstacleFrame = frameCount + minInterval + Math.random() * 50;
        }

        function resetGame() {
            console.log(`Fim da Geração ${generation}. Avaliando...`);

            // 1. Identificar os 2 melhores jogadores da geração atual
            const bestPlayers = [...players]
                .sort((a, b) => b.score - a.score) // Ordenar por pontuação (maior primeiro)
                .slice(0, 2); // Pegar os 2 primeiros (melhores)
            
            // Salvar os dados dos cérebros dos melhores jogadores
            const bestPlayersBrains = bestPlayers.map(player => ({
                brain: brainToStructuredFormat(player.brain),
                score: player.score
            }));
            
            // 2. Coleta Fitness (Scores) - Usar apenas os primeiros NUM_PLAYERS jogadores
            // para evitar "tamanho do array de fitness não corresponde ao tamanho da população"
            const fitnessScores = players.slice(0, NUM_PLAYERS).map(p => p.score);

            // Armazena a melhor e média pontuação desta geração para os gráficos
            const bestFitnessThisGen = Math.max(...fitnessScores, 1); // Use 1 if empty
            const averageFitnessThisGen = fitnessScores.reduce((sum, val) => sum + val, 0) / Math.max(1, fitnessScores.length);
            
            bestScoresHistory.push(bestFitnessThisGen);
            averageScoresHistory.push(averageFitnessThisGen);
            document.getElementById('bestScore').textContent = bestFitnessThisGen.toFixed(0);

            // Atualiza o gráfico
            drawFitnessGraph(graphCtx, bestScoresHistory, averageScoresHistory);

            // 3. Avalia e Gera Nova População na ES
            evolutionaryStrategy.evaluate(fitnessScores);
            evolutionaryStrategy.generateNewPopulation();

            // Injeta o genoma importado se estiver disponível
            if (importedGenomeGlobal) {
                try {
                    const tempBrain = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);
                    applyStructuredFormatToBrain(tempBrain, importedGenomeGlobal);
                    const importedGenes = tempBrain.getGenes();
                    
                    // Injetar em 20% da população
                    const injectCount = Math.max(1, Math.ceil(NUM_PLAYERS * 0.2));
                    const pop = evolutionaryStrategy.population;
                    
                    for (let i = 0; i < injectCount; i++) {
                        if (i < pop.length) {
                            if (i === 0) {
                                pop[i].genes = [...importedGenes];
                            } else {
                                pop[i].genes = importedGenes.map(g => g + (Math.random() * 2 - 1) * 0.05);
                            }
                            pop[i].fitness = 0;
                        }
                    }
                    console.log(`Genoma importado injetado em ${injectCount} indivíduos da população.`);
                    showNotification(`Genoma importado injetado em ${injectCount} indivíduos!`, "success");
                    importedGenomeGlobal = null; // Consumido
                } catch (e) {
                    console.error("Erro ao injetar genoma importado:", e);
                }
            }

            // 4. Reseta o estado do jogo
            obstacles = [];
            frameCount = 0;
            generation++;
            document.getElementById('generation').textContent = generation;
            nextObstacleFrame = 100; // Reseta timer do obstáculo

            // 5. Cria novos jogadores com os genes da nova população (sem reinstanciar ES!)
            players = [];
            for (let i = 0; i < NUM_PLAYERS; i++) {
                const brain = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);
                var genes = evolutionaryStrategy.getIndividualGenes(i);
                brain.setGenes(genes);
                players.push(new Player(PLAYER_COLORS[i % PLAYER_COLORS.length], brain));
            }
            
            // Inicializa activePlayers com a população base
            activePlayers = NUM_PLAYERS;
            
            // 6. NOVO: Adiciona os 2 melhores jogadores da geração anterior
            if (bestPlayersBrains.length > 0) {
                bestPlayersBrains.forEach((playerData, index) => {
                    const eliteBrain = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);
                    applyStructuredFormatToBrain(eliteBrain, playerData.brain);
                    
                    const eliteColor = index === 0 ? 'gold' : 'silver';
                    const elitePlayer = new Player(eliteColor, eliteBrain);
                    players.push(elitePlayer);
                    activePlayers++;
                    
                    console.log(`Adicionado jogador elite #${index+1} da geração anterior (pontuação: ${playerData.score.toFixed(2)})`);
                });
            }

            console.log(`Iniciando Geração ${generation} com nova população.`);

            // Atualiza o dropdown de foco
            updateFocusDropdown();

            // Atualiza a visualização dos jogadores de elite
            updateEliteStatusDisplay();
            
            // Atualiza a visualização do JSON do melhor jogador
            updateJsonViewer();
        }

        function updateEliteStatusDisplay() {
            // Contar quantos jogadores dourados e prateados existem
            const goldCount = players.filter(p => p.color === 'gold').length;
            const silverCount = players.filter(p => p.color === 'silver').length;
            
            // Verificar se o elemento existe
            const infoElement = document.getElementById('eliteInfo');
            
            if (infoElement) {
                // Atualizar o texto do elemento existente
                infoElement.textContent = `Jogadores Elite: ${goldCount} ouro, ${silverCount} prata`;
            } else {
                // Criar um novo elemento para mostrar a informação
                const infoDiv = document.createElement('div');
                infoDiv.id = 'eliteInfo';
                infoDiv.style.fontSize = '14px';
                infoDiv.style.marginBottom = '5px';
                infoDiv.textContent = `Jogadores Elite: ${goldCount} ouro, ${silverCount} prata`;
                
                // Inserir após a div 'info'
                const infoElement = document.getElementById('info');
                if (infoElement && infoElement.parentNode) {
                    infoElement.parentNode.insertBefore(infoDiv, infoElement.nextSibling);
                }
            }

            // Atualiza status de vivo/morto no select de foco
            const select = document.getElementById('focusAgentSelect');
            if (select) {
                players.forEach((player, idx) => {
                    const option = select.options[idx + 1]; // +1 porque index 0 é "auto"
                    if (option) {
                        let label = `Agente #${idx+1}`;
                        if (player.color === 'gold') label = `🏆 Elite Ouro`;
                        else if (player.color === 'silver') label = `🥈 Elite Prata`;
                        
                        const status = player.isAlive ? "Vivo" : "Morto";
                        option.textContent = `${label} (${player.color}) - ${status}`;
                        if (!player.isAlive) {
                            option.style.color = '#718096';
                        } else {
                            option.style.color = '#00f0ff';
                        }
                    }
                });
            }
        }

        function update() {
            if (window.isSandboxActive && window.sandboxPaused) {
                return false;
            }

            frameCount++;
            activePlayers = 0; // Recalcula a cada frame

            // Atualiza Jogadores
            players.forEach(player => {
                if (player.isAlive) {
                    player.update();
                    activePlayers++;
                }
            });

            // Atualiza Obstáculos - Desativado no modo Sandbox
            if (!window.isSandboxActive && frameCount >= nextObstacleFrame && activePlayers > 0) {
                spawnObstacle();
            }

            // Move e remove obstáculos fora da tela
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                if (obstacles[i].isOffscreen()) {
                    obstacles.splice(i, 1);
                }
            }

            // Verifica Colisões
            players.forEach(player => {
                if (!player.isAlive) return; // Não verifica colisão se já estiver morto

                for (const obstacle of obstacles) {
                    if (player.checkCollision(obstacle)) {
                        player.isAlive = false;
                        // Toca som se for o jogador selecionado
                        if (player === selectedPlayer) {
                            playSynthCollision();
                        }
                        break; // Um obstáculo é suficiente para matar
                    }
                }
            });

            // Verifica se todos os jogadores morreram
            if (activePlayers === 0) {
                resetGame();
                return true; // Indica que ocorreu um reset na simulação
            }
            return false;
        }

        function draw() {
            // Limpa o Canvas do Jogo
            gameCtx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Desenha Céu Cyberpunk
            gameCtx.fillStyle = '#0f0f1b';
            gameCtx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);
            
            // Grid lines on sky - pisca em vermelho neon na extinção
            if (extinctionFlashActive) {
                gameCtx.strokeStyle = `rgba(255, 0, 85, ${0.15 + Math.sin(Date.now() / 50) * 0.1})`;
                gameCtx.lineWidth = 1.5;
            } else {
                gameCtx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
                gameCtx.lineWidth = 1;
            }
            
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                gameCtx.beginPath();
                gameCtx.moveTo(i, 0);
                gameCtx.lineTo(i, GROUND_Y);
                gameCtx.stroke();
            }
            for (let i = 0; i < GROUND_Y; i += 40) {
                gameCtx.beginPath();
                gameCtx.moveTo(0, i);
                gameCtx.lineTo(GAME_WIDTH, i);
                gameCtx.stroke();
            }

            // Desenha o Chão Cyberpunk
            gameCtx.fillStyle = '#1b1b2f';
            gameCtx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
            
            // Neon dividing line - pisca em vermelho neon na extinção
            if (extinctionFlashActive) {
                gameCtx.strokeStyle = '#ff0055';
            } else {
                gameCtx.strokeStyle = '#00f0ff';
            }
            gameCtx.lineWidth = 3;
            gameCtx.beginPath();
            gameCtx.moveTo(0, GROUND_Y);
            gameCtx.lineTo(GAME_WIDTH, GROUND_Y);
            gameCtx.stroke();

            // Desenha Obstáculos
            obstacles.forEach(obstacle => obstacle.draw(gameCtx));

            // Desenha Jogadores
            players.forEach(player => {
                player.draw(gameCtx);
                if (player === selectedPlayer && player.isAlive) {
                    // Highlight selected player
                    gameCtx.strokeStyle = '#00f0ff';
                    gameCtx.lineWidth = 2.5;
                    gameCtx.strokeRect(player.x - 3, player.y - 3, player.width + 6, player.height + 6);
                    
                    // Floating indicator
                    gameCtx.fillStyle = '#00f0ff';
                    gameCtx.font = 'bold 8px Orbitron';
                    gameCtx.textAlign = 'center';
                    gameCtx.fillText('FOCADO', player.x + player.width / 2, player.y - 6);
                }
            });

            // Determinar qual cérebro desenhar
            let activeSelected = selectedPlayer;
            if (!activeSelected || !activeSelected.isAlive) {
                let bestAlive = null;
                for (const player of players) {
                    if (player.isAlive) {
                        if (!bestAlive || player.score > bestAlive.score) {
                            bestAlive = player;
                        }
                    }
                }
                activeSelected = bestAlive;
                selectedPlayer = bestAlive; // Atualiza seleção automática
            }

            if (activeSelected && activeSelected.brain) {
                drawNeuralNetwork(nnCtx, activeSelected.brain);
                
                // Atualizar cabeçalho da Rede Neural com cor
                const nnHeader = document.querySelector('#visContainer h3');
                if (nnHeader) {
                    const colorHex = activeSelected.color;
                    nnHeader.innerHTML = `Cérebro do Agente (<span style="color: ${colorHex}; text-shadow: 0 0 5px ${colorHex}; font-weight: bold; text-transform: uppercase;">${colorHex}</span>)`;
                }
            } else {
                nnCtx.clearRect(0, 0, nnCanvas.width, nnCanvas.height);
                const nnHeader = document.querySelector('#visContainer h3');
                if (nnHeader) {
                    nnHeader.textContent = "Rede Neural (Selecione um Agente)";
                }
            }

            // NOVO: Atualiza informações de jogadores elite a cada frame
            updateEliteStatusDisplay();

            // NOVO: Alerta visual de Extinção em Massa na tela
            if (extinctionFlashActive) {
                gameCtx.fillStyle = 'rgba(255, 0, 85, 0.15)';
                gameCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                const opacity = 0.5 + Math.sin(Date.now() / 80) * 0.4;
                gameCtx.font = '900 13px Orbitron';
                gameCtx.fillStyle = `rgba(255, 0, 85, ${opacity})`;
                gameCtx.textAlign = 'center';
                gameCtx.fillText('CRITICAL WARNING: MASS EXTINCTION EVENT', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
            }
        }

        // Controle de FPS
        let lastFrameTime = 0;
        const targetFPS = 120; // FPS alvo (pode ser ajustado)
        const frameInterval = 1000 / targetFPS; // Intervalo entre frames em ms

        function gameLoop(timestamp) {
            // Calcula o tempo desde o último frame
            const deltaTime = timestamp - lastFrameTime;
            
            // Verifica se é hora de renderizar um novo frame
            if (deltaTime >= frameInterval) {
                // Atualiza o tempo do último frame
                lastFrameTime = timestamp - (deltaTime % frameInterval);
                
                // Atualiza o jogo com base no fator de aceleração (substepping)
                const loops = window.simulationSpeed || 1;
                for (let i = 0; i < loops; i++) {
                    const resetOccurred = update();
                    if (resetOccurred) break; // Interrompe loops se a simulação reiniciar
                }
                draw();
            }
            
            // Agenda o próximo frame
            requestAnimationFrame(gameLoop);
        }

        // --- Inicialização ---
        function init() {
            const brainTemplate = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);
            const numGenes = brainTemplate.getNumGenes();
            
            evolutionaryStrategy = new EvolutionaryStrategy(
                NUM_PLAYERS, MUTATION_RATE, MUTATION_AMOUNT, numGenes
            );

            // Cria os jogadores iniciais com genes da primeira população aleatória
            players = [];
            for (let i = 0; i < NUM_PLAYERS; i++) {
                const brain = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);

                players.push(new Player(PLAYER_COLORS[i % PLAYER_COLORS.length], brain));
            }
