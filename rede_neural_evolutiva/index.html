        // Função para converter o cérebro da rede neural para o formato estruturado
        function brainToStructuredFormat(brain) {
            return {
                // Pesos e biases da primeira camada oculta
                hiddenLayer1: {
                    weights: Array.from({ length: NUM_INPUTS }, (_, i) => 
                        Array.from({ length: HIDDEN_UNITS_1 }, (_, j) => brain.weights_in_h1[i][j])
                    ),
                    biases: [...brain.bias_h1]
                },
                // Pesos e biases da segunda camada oculta
                hiddenLayer2: {
                    weights: Array.from({ length: HIDDEN_UNITS_1 }, (_, i) => 
                        Array.from({ length: HIDDEN_UNITS_2 }, (_, j) => brain.weights_h1_h2[i][j])
                    ),
                    biases: [...brain.bias_h2]
                },
                // Pesos e biases da camada de saída
                outputLayer: {
                    weights: Array.from({ length: HIDDEN_UNITS_2 }, (_, i) => 
                        Array.from({ length: NUM_OUTPUTS }, (_, j) => brain.weights_h2_out[i][j])
                    ),
                    biases: [...brain.bias_out]
                }
            };
        }

        // Função para aplicar os pesos estruturados a um cérebro
        function applyStructuredFormatToBrain(brain, data) {
            // Camada oculta 1
            for (let i = 0; i < NUM_INPUTS; i++) {
                for (let j = 0; j < HIDDEN_UNITS_1; j++) {
                    brain.weights_in_h1[i][j] = data.hiddenLayer1.weights[i][j];
                }
            }
            for (let i = 0; i < HIDDEN_UNITS_1; i++) {
                brain.bias_h1[i] = data.hiddenLayer1.biases[i];
            }
            
            // Camada oculta 2
            for (let i = 0; i < HIDDEN_UNITS_1; i++) {
                for (let j = 0; j < HIDDEN_UNITS_2; j++) {
                    brain.weights_h1_h2[i][j] = data.hiddenLayer2.weights[i][j];
                }
            }
            for (let i = 0; i < HIDDEN_UNITS_2; i++) {
                brain.bias_h2[i] = data.hiddenLayer2.biases[i];
            }
            
            // Camada de saída
            for (let i = 0; i < HIDDEN_UNITS_2; i++) {
                for (let j = 0; j < NUM_OUTPUTS; j++) {
                    brain.weights_h2_out[i][j] = data.outputLayer.weights[i][j];
                }
            }
            for (let i = 0; i < NUM_OUTPUTS; i++) {
                brain.bias_out[i] = data.outputLayer.biases[i];
            }
        }

        // Função para salvar e copiar o melhor indivíduo (sem adicionar no jogo)
        function saveBestIndividual() {
            // Encontrar o melhor jogador vivo
            let bestPlayer = null;
            let bestScore = -Infinity;
            
            // Primeiro, procura entre jogadores vivos
            for (const player of players) {
                if (player.isAlive && player.score > bestScore) {
                    bestScore = player.score;
                    bestPlayer = player;
                }
            }
            
            // Se não tiver jogadores vivos, procurar entre todos
            if (!bestPlayer) {
                for (const player of players) {
                    if (player.score > bestScore) {
                        bestScore = player.score;
                        bestPlayer = player;
                    }
                }
            }
            
            if (!bestPlayer) {
                alert('Nenhum jogador encontrado para salvar!');
                return;
            }
            
            // Converter o cérebro para o formato estruturado
            const neuralNetworkData = brainToStructuredFormat(bestPlayer.brain);
            
            // Salvar no localStorage com metadados
            const saveData = {
                neuralNetworkData: neuralNetworkData,
                fitness: bestPlayer.score,
                generation: generation,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('bestIndividual', JSON.stringify(saveData));
            
            // Atualizar variáveis globais
            bestEverFitness = bestPlayer.score;
            bestEverNeuralNetwork = neuralNetworkData;
            bestEverGeneration = generation;
            
            // Exibir mensagem de confirmação e copiar para a área de transferência
            const dataString = JSON.stringify(neuralNetworkData, null, 2);
            navigator.clipboard.writeText(dataString)
                .then(() => {
                    alert(`Melhor indivíduo salvo e copiado para a área de transferência!\nPontuação: ${bestPlayer.score.toFixed(2)}`);
                })
                .catch(() => {
                    alert(`Melhor indivíduo salvo com sucesso!\nPontuação: ${bestPlayer.score.toFixed(2)}\nVeja o console para detalhes.`);
                    console.log('Dados do melhor indivíduo:', dataString);
                });
            
            // Atualizar visualização do JSON
            updateJsonViewer();
        }

        // Nova função para carregar e adicionar um jogador a partir do localStorage
        function loadAndAddSavedIndividual() {
            const savedData = localStorage.getItem('bestIndividual');
            if (!savedData) {
                alert('Nenhum indivíduo salvo encontrado no localStorage!');
                return;
            }
            
            try {
                const data = JSON.parse(savedData);
                
                // Criar um novo cérebro e aplicar os pesos do indivíduo salvo
                const newBrain = new MLP(NUM_INPUTS, HIDDEN_UNITS_1, HIDDEN_UNITS_2, NUM_OUTPUTS);
                applyStructuredFormatToBrain(newBrain, data.neuralNetworkData);
                
                // Criar o novo jogador com cor dourada para destacar
                const newPlayer = new Player('darkgoldenrod', newBrain);
                newPlayer.x -= 12;
                
                // Adicionar ao array de jogadores
                players.push(newPlayer);
                activePlayers++; // Incrementar o contador de jogadores ativos
                
                alert(`Indivíduo adicionado com sucesso!\nGeração original: ${data.generation}\nPontuação original: ${data.fitness.toFixed(2)}`);
                
                // Atualizar visualização do JSON
                updateJsonViewer();
                
            } catch (e) {
                console.error("Erro ao adicionar indivíduo do localStorage:", e);
                alert('Erro ao adicionar indivíduo. Verifique o console para detalhes.');
            }
        }

        // Função para carregar o melhor indivíduo do localStorage (apenas para referência, não adiciona ao jogo)
        function loadBestIndividual() {
            const savedData = localStorage.getItem('bestIndividual');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    bestEverFitness = data.fitness;
                    bestEverNeuralNetwork = data.neuralNetworkData;
                    bestEverGeneration = data.generation;
                    
                    console.log(`Melhor indivíduo carregado na memória! Fitness: ${bestEverFitness.toFixed(2)}, Geração: ${bestEverGeneration}`);
                    
                    // Atualizar visualização do JSON
                    updateJsonViewer();
                    
                    return data.neuralNetworkData;
                } catch (e) {
                    console.error("Erro ao carregar o melhor indivíduo:", e);
                    return null;
                }
            }
            return null;
        }

        function setupButtons() {
            // Configurar botão de salvar/copiar
            const saveButton = document.getElementById('saveBestBtn');
            if (saveButton) {
                saveButton.addEventListener('click', saveBestIndividual);
            } else {
                console.error('Botão de salvar não encontrado!');
            }
            
            // Configurar botão de carregar/adicionar
            const loadButton = document.getElementById('loadBestBtn');
            if (loadButton) {
                loadButton.addEventListener('click', loadAndAddSavedIndividual);
            } else {
                console.error('Botão de carregar não encontrado!');
            }
            
            // Configurar botão de exportar cérebro
            const exportButton = document.getElementById('exportBrainBtn');
            if (exportButton) {
                exportButton.addEventListener('click', exportChampionBrain);
            }
            
            // Configurar botão de importar cérebro
            const importButton = document.getElementById('importBrainBtn');
            const importFileInput = document.getElementById('importFileInput');
            if (importButton && importFileInput) {
                importButton.addEventListener('click', () => importFileInput.click());
                importFileInput.addEventListener('change', handleImportFile);
            }
            
            // Configurar dropdown de foco
            const focusSelect = document.getElementById('focusAgentSelect');
            if (focusSelect) {
                focusSelect.addEventListener('change', (e) => {
                    const val = e.target.value;
                    if (val === 'auto') {
                        selectedPlayer = null;
                        showNotification("Foco automático no melhor sobrevivente", "info");
                    } else {
                        const idx = parseInt(val);
                        if (idx >= 0 && idx < players.length) {
                            selectedPlayer = players[idx];
                            showNotification(`Focado no Agente #${idx+1} (${selectedPlayer.color})`, "info");
                        }
                    }
                });
            }
            
            // Configurar clique no Canvas de Jogo para focar no agente
            gameCanvas.addEventListener('click', (e) => {
                const rect = gameCanvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) * (GAME_WIDTH / rect.width);
                const mouseY = (e.clientY - rect.top) * (GAME_HEIGHT / rect.height);
                
                let clickedPlayer = null;
                for (const player of players) {
                    if (player.isAlive && 
                        mouseX >= player.x && mouseX <= player.x + player.width &&
                        mouseY >= player.y && mouseY <= player.y + player.height) {
                        clickedPlayer = player;
                        break;
                    }
                }
                
                if (clickedPlayer) {
                    selectedPlayer = clickedPlayer;
                    if (focusSelect) {
                        const idx = players.indexOf(clickedPlayer);
                        focusSelect.value = idx;
                    }
                    showNotification(`Focado no Agente (${clickedPlayer.color})`, "info");
                }
            });

            // Configurar interatividade do Gráfico de Fitness
            graphCanvas.addEventListener('mousemove', (e) => {
                const rect = graphCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                
                const paddingLeft = 60;
                const paddingRight = 40;
                const chartWidth = graphCanvas.width - paddingLeft - paddingRight;
                
                if (bestScoresHistory.length === 0) return;
                
                const maxPoints = 50;
                const startIdx = Math.max(0, bestScoresHistory.length - maxPoints);
                const bestSlice = bestScoresHistory.slice(startIdx);
                const pointsLen = bestSlice.length;
                
                if (pointsLen <= 1) return;
                
                let closestIndex = -1;
                let minDistance = Infinity;
                
                for (let i = 0; i < pointsLen; i++) {
                    const x = paddingLeft + (i / (pointsLen - 1)) * chartWidth;
                    const dist = Math.abs(x - mouseX);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestIndex = i;
                    }
                }
                
                if (minDistance < 20 && mouseX >= paddingLeft - 10 && mouseX <= graphCanvas.width - paddingRight + 10) {
                    if (hoveredGenIndex !== closestIndex) {
                        hoveredGenIndex = closestIndex;
                        drawFitnessGraph(graphCtx, bestScoresHistory, averageScoresHistory);
                    }
                } else {
                    if (hoveredGenIndex !== -1) {
                        hoveredGenIndex = -1;
                        drawFitnessGraph(graphCtx, bestScoresHistory, averageScoresHistory);
                    }
                }
            });
            
            graphCanvas.addEventListener('mouseleave', () => {
                if (hoveredGenIndex !== -1) {
                    hoveredGenIndex = -1;
                    drawFitnessGraph(graphCtx, bestScoresHistory, averageScoresHistory);
                }
            });
            
            // Carregar o melhor indivíduo para referência (não adiciona ao jogo)
            loadBestIndividual();
            
            // Atualizar visualização do JSON
            updateJsonViewer();
        }

        function exportChampionBrain() {
            let bestPlayer = null;
            let bestScore = -Infinity;
            for (const player of players) {
                if (player.score > bestScore) {
                    bestScore = player.score;
                    bestPlayer = player;
                }
            }
            
            if (!bestPlayer) {
                showNotification("Nenhum jogador encontrado para exportar.", "error");
                return;
            }
            
            const brain = bestPlayer.brain;
            const exportData = {
                metadata: {
                    game: "Rede Neural Evolutiva (ES)",
                    generation: generation,
                    fitness: parseFloat(bestPlayer.score.toFixed(2)),
                    timestamp: new Date().toISOString(),
                    architecture: {
                        inputs: NUM_INPUTS,
                        hidden1: HIDDEN_UNITS_1,
                        hidden2: HIDDEN_UNITS_2,
                        outputs: NUM_OUTPUTS
                    }
                },
                genome: {
                    weights_in_h1: brain.weights_in_h1,
                    bias_h1: brain.bias_h1,
                    weights_h1_h2: brain.weights_h1_h2,
                    bias_h2: brain.bias_h2,
                    weights_h2_out: brain.weights_h2_out,
                    bias_out: brain.bias_out
                }
            };
            
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `champion_brain_gen${generation}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showNotification("Cérebro do Campeão exportado com sucesso!", "success");
        }

        function handleImportFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    const error = validateImportedBrain(data);
                    
                    if (error) {
                        showNotification(`Falha na validação: ${error}`, "error");
                        alert(`Erro na validação do Cérebro:\n\n${error}`);
                        return;
                    }
                    
                    const m = data.metadata || {};
                    const fitnessMsg = m.fitness ? `\nFitness: ${m.fitness}` : "";
                    const genMsg = m.generation ? `\nGeração original: ${m.generation}` : "";
                    
                    if (confirm(`Deseja carregar este cérebro? Ele será injetado em 20% da população na próxima geração.${fitnessMsg}${genMsg}`)) {
                        const structured = {
                            hiddenLayer1: {
                                weights: data.genome.weights_in_h1.map(row => row.map(Number)),
                                biases: data.genome.bias_h1.map(Number)
                            },
                            hiddenLayer2: {
                                weights: data.genome.weights_h1_h2.map(row => row.map(Number)),
                                biases: data.genome.bias_h2.map(Number)
                            },
                            outputLayer: {
                                weights: data.genome.weights_h2_out.map(row => row.map(Number)),
                                biases: data.genome.bias_out.map(Number)
                            }
                        };
                        
                        importedGenomeGlobal = structured;
                        showNotification("Cérebro importado com sucesso! Iniciando injeção...", "success");
                        resetGame();
                    }
                } catch (err) {
                    console.error("Erro ao analisar arquivo JSON:", err);
                    showNotification("Erro ao analisar arquivo JSON de cérebro.", "error");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function validateImportedBrain(data) {
            if (!data || typeof data !== 'object') return "JSON inválido.";
            if (!data.metadata || !data.genome) return "Formato inválido. Chaves 'metadata' ou 'genome' não encontradas.";
            
            const g = data.genome;
            
            function checkMatrix(matrix, rows, cols) {
                if (!Array.isArray(matrix) || matrix.length !== rows) return false;
                for (let i = 0; i < rows; i++) {
                    if (!Array.isArray(matrix[i]) || matrix[i].length !== cols) return false;
                    for (let j = 0; j < cols; j++) {
                        const val = parseFloat(matrix[i][j]);
                        if (typeof matrix[i][j] !== 'number' && isNaN(val)) return false;
                    }
                }
                return true;
            }
            
            function checkVector(vector, len) {
                if (!Array.isArray(vector) || vector.length !== len) return false;
                for (let i = 0; i < len; i++) {
                    const val = parseFloat(vector[i]);
                    if (typeof vector[i] !== 'number' && isNaN(val)) return false;
                }
                return true;
            }
            
            if (!g.weights_in_h1 || !checkMatrix(g.weights_in_h1, 3, 8)) return "Dimensões inválidas em weights_in_h1. Esperado matriz [3 x 8].";
            if (!g.bias_h1 || !checkVector(g.bias_h1, 8)) return "Dimensões inválidas em bias_h1. Esperado vetor de tamanho 8.";
            if (!g.weights_h1_h2 || !checkMatrix(g.weights_h1_h2, 8, 4)) return "Dimensões inválidas em weights_h1_h2. Esperado matriz [8 x 4].";
            if (!g.bias_h2 || !checkVector(g.bias_h2, 4)) return "Dimensões inválidas em bias_h2. Esperado vetor de tamanho 4.";
            if (!g.weights_h2_out || !checkMatrix(g.weights_h2_out, 4, 1)) return "Dimensões inválidas em weights_h2_out. Esperado matriz [4 x 1].";
            if (!g.bias_out || !checkVector(g.bias_out, 1)) return "Dimensões inválidas em bias_out. Esperado vetor de tamanho 1.";
            
            return null;
        }

        function updateFocusDropdown() {
            const select = document.getElementById('focusAgentSelect');
            if (!select) return;
            
            const currentVal = select.value;
            select.innerHTML = '<option value="auto">Melhor Sobrevivente (Auto)</option>';
            
            players.forEach((player, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                
                let label = `Agente #${idx+1}`;
                if (player.color === 'gold') {
                    label = `🏆 Elite Ouro`;
                } else if (player.color === 'silver') {
                    label = `🥈 Elite Prata`;
                }
                
                opt.textContent = `${label} (${player.color})`;
                select.appendChild(opt);
            });
            
            select.value = currentVal;
            if (select.value !== currentVal) {
                select.value = "auto";
                selectedPlayer = null;
            }
        }

        function showNotification(message, type = 'info') {
            let toast = document.querySelector('.cyber-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'cyber-toast';
                document.body.appendChild(toast);
            }
            
            toast.textContent = message;
            toast.className = `cyber-toast ${type} show`;
            
            clearTimeout(toast.timeoutId);
            toast.timeoutId = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Função para atualizar a visualização do JSON salvo
        function updateJsonViewer() {
            const savedJsonInfo = document.getElementById('savedJsonInfo');
            const savedJsonContent = document.getElementById('savedJsonContent');
            
            if (!savedJsonInfo || !savedJsonContent) return;
            
            const savedData = localStorage.getItem('bestIndividual');
            
            if (!savedData) {
                savedJsonInfo.textContent = "Nenhum indivíduo salvo encontrado.";
                savedJsonContent.textContent = "";
                return;
            }
            
            try {
                const data = JSON.parse(savedData);
                
                // Mostrar informações resumidas
                savedJsonInfo.innerHTML = `
                    <strong>Geração:</strong> ${data.generation} | 
                    <strong>Fitness:</strong> ${data.fitness.toFixed(2)} | 
                    <strong>Data:</strong> ${new Date(data.timestamp).toLocaleString()}
                `;
                
                // Exibir em formato JSON com indentação e cores
                const jsonString = JSON.stringify(data, null, 2);
                savedJsonContent.innerHTML = formatJsonWithColors(jsonString);
                
            } catch (e) {
                savedJsonInfo.textContent = "Erro ao carregar os dados salvos.";
                savedJsonContent.textContent = "Erro: " + e.message;
                console.error("Erro ao atualizar visualização do JSON:", e);
            }
        }

        // Função para formatar JSON com cores (opcional)
        function formatJsonWithColors(json) {
            if (!json) return '';
            
            // Substitui valores por cores
            return json
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    let cls = 'number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'key';
                        } else {
                            cls = 'string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'boolean';
                    } else if (/null/.test(match)) {
                        cls = 'null';
                    }
                    
                    // Retorna valores com span colorido
                    return '<span class="' + cls + '">' + match + '</span>';
                });
        }

        // Inicia o jogo quando a página carregar
        window.onload = init;

    </script>
