    <script>
        // ==============================================================
        // PLAYFULHUB RETRO MUSEUM - MOTOR 2D DE EXPOSIÇÃO

        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const miniCtx = minimapCanvas.getContext('2d');

        const visitedCounterEl = document.getElementById('visited-counter');
        const interactionPrompt = document.getElementById('interaction-prompt');
        const promptGameTitle = document.getElementById('prompt-game-title');
        const gameModal = document.getElementById('game-modal');
        const crtOverlay = document.getElementById('crt-overlay');
        const minimapCard = document.getElementById('minimap-card');

        // Modal Elements
        const modalCategory = document.getElementById('modal-category');
        const modalTech = document.getElementById('modal-tech');
        const modalPreviewImg = document.getElementById('modal-preview-img');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalPlayBtn = document.getElementById('modal-play-btn');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalCloseX = document.getElementById('modal-close-x');

        // Global Museum Dimensions
        const museum = {
            width: 2400,
            height: 2000,
            tileSize: 32
        };

        // Camera
        const camera = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height
        };

        // Player
        const player = {
            x: 1200,
            y: 1050,
            width: 22,
            height: 32,
            speed: 4,
            direction: 'down',
            animFrame: 0,
            animTimer: 0,
            isMoving: false
        };

        // Audio System (Web Audio API)
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) audioCtx = new AudioClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playStepSound() {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(110 + Math.random() * 20, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playChimeSound() {
            if (isMuted || !audioCtx) return;
            try {
                const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
                freqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.05);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.05 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.05);
                    osc.stop(audioCtx.currentTime + idx * 0.05 + 0.2);
                });
            } catch (e) {}
        }

        function playWarpSound() {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        let currentInteractable = null;

        function getZoneName(x, y) {
            if (y < 780) return 'Ala Norte: 3D & WebGL Expo';
            if (y > 1300) return 'Ala Sul: Simulações & Ciência';
            if (x < 780) return 'Ala Oeste: Ação & Arcade';
            if (x > 1620) return 'Ala Leste: Puzzles & Estratégia';
            return 'Grande Salão Central (Lobby)';
        }

        function checkRectCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        function update() {
            if (gameModal.classList.contains('active')) return;

            const isUp = keys.ArrowUp || keys.w || keys.W;
            const isDown = keys.ArrowDown || keys.s || keys.S;
            const isLeft = keys.ArrowLeft || keys.a || keys.A;
            const isRight = keys.ArrowRight || keys.d || keys.D;

            player.isMoving = isUp || isDown || isLeft || isRight;

            let dx = 0;
            let dy = 0;

            if (isUp) { dy -= player.speed; player.direction = 'up'; }
            if (isDown) { dy += player.speed; player.direction = 'down'; }
            if (isLeft) { dx -= player.speed; player.direction = 'left'; }
            if (isRight) { dx += player.speed; player.direction = 'right'; }

            // Normalize diagonal speed
            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            // Move X and test collisions
            player.x += dx;
            for (const wall of walls) {
                if (checkRectCollision(player, wall)) {
                    player.x -= dx;
                    break;
                }
            }

            // Move Y and test collisions
            player.y += dy;
            for (const wall of walls) {
                if (checkRectCollision(player, wall)) {
                    player.y -= dy;
                    break;
                }
            }

            // Clamp inside museum
            player.x = Math.max(40, Math.min(museum.width - 40 - player.width, player.x));
            player.y = Math.max(40, Math.min(museum.height - 40 - player.height, player.y));

            // Animate Player & Audio Footsteps
            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer > 8) {
                    player.animFrame = (player.animFrame + 1) % 4;
                    player.animTimer = 0;
                    if (player.animFrame % 2 === 0) playStepSound();
                }
            } else {
                player.animFrame = 0;
            }

            // Smooth Camera Follow
            const targetCamX = player.x + player.width / 2 - camera.width / 2;
            const targetCamY = player.y + player.height / 2 - camera.height / 2;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            camera.x = Math.max(0, Math.min(museum.width - camera.width, camera.x));
            camera.y = Math.max(0, Math.min(museum.height - camera.height, camera.y));

            // Update Current Zone in HUD
            const zoneName = getZoneName(player.x + player.width / 2, player.y + player.height / 2);
            if (currentZoneEl.textContent !== zoneName) {
                currentZoneEl.textContent = zoneName;
            }

            // Check Exhibit / Landmark Proximity
            let nearest = null;
            let nearestDist = Infinity;

            const allInteractables = [...exhibits, centralMonument, portalHome];

            for (const item of allInteractables) {
                const centerX = item.x + item.width / 2;
                const centerY = item.y + item.height / 2;
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;

                const dist = Math.hypot(playerCenterX - centerX, playerCenterY - centerY);
                if (dist < 95 && dist < nearestDist) {
                    nearest = item;
                    nearestDist = dist;
                }
            }

            if (nearest !== currentInteractable) {
                currentInteractable = nearest;
                if (currentInteractable) {
                    playChimeSound();
                    interactionPrompt.style.display = 'flex';
                    promptGameTitle.textContent = currentInteractable.game ? currentInteractable.game.title : currentInteractable.title;
                } else {
                    interactionPrompt.style.display = 'none';
                }
            }

            // Trigger Modal with Space or E
            if ((keys[' '] || keys.e || keys.E) && currentInteractable) {
                keys[' '] = false;
                keys.e = false;
                keys.E = false;
                openInteractableModal(currentInteractable);
            }

            // Update dust particles
            dustParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = museum.width;
                if (p.x > museum.width) p.x = 0;
                if (p.y < 0) p.y = museum.height;
                if (p.y > museum.height) p.y = 0;
            });
        }

        function openInteractableModal(item) {
            initAudio();
            playChimeSound();

            if (item.isMonument) {
                modalCategory.textContent = 'MONUMENTO';
                modalTech.textContent = 'PlayfulHub';
                modalPreviewImg.src = './assets/images/bg_neon_game.jpeg';
                modalIcon.textContent = '🏛️';
                modalTitle.textContent = item.title;
                modalDesc.textContent = item.description;
                modalPlayBtn.style.display = 'none';
                gameModal.classList.add('active');
                return;
            }

            if (item.isPortal) {
                modalCategory.textContent = 'PORTAL';
                modalTech.textContent = 'Página Inicial';
                modalPreviewImg.src = './assets/images/bg_neon_game.jpeg';
                modalIcon.textContent = '🚪';
                modalTitle.textContent = item.title;
                modalDesc.textContent = item.description;
                modalPlayBtn.style.display = 'flex';
                modalPlayBtn.textContent = 'Voltar para a Home';
                modalPlayBtn.href = './index.html';
                gameModal.classList.add('active');
                return;
            }

            const g = item.game;
            visitedGames.add(g.id);
            updateVisitedCounter();

            modalCategory.textContent = g.categoryLabel || g.category.toUpperCase();
            modalTech.textContent = g.techTag || 'PlayfulHub';
            modalPreviewImg.src = g.previewImg || './assets/images/bg_neon_game.jpeg';
            modalIcon.textContent = g.icon || '🎮';
            modalTitle.textContent = g.title;
            modalDesc.textContent = g.description;

            modalPlayBtn.style.display = 'flex';
            modalPlayBtn.textContent = '▶ JOGAR AGORA';
            modalPlayBtn.href = g.path;

            modalPlayBtn.onclick = () => {
                playWarpSound();
            };

            gameModal.classList.add('active');
        }

        // ==============================================================
        // RENDERIZAÇÃO GRÁFICA EM CANVAS
        // ==============================================================

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Thematic Floor
            drawThemedFloor();

            // 2. Draw Room Labels & Directional Floor Signage
            drawFloorSignage();

            // 3. Draw Walls
            drawWalls();

            // 4. Draw Exhibits and Landmarks
            drawExhibitsAndLandmarks();

            // 5. Draw Player Character
            drawPlayer();

            // 6. Draw Ambient Atmosphere & Dust
            drawLightingAndDust();

            // 7. Render Minimap
            drawMinimap();
        }

        function drawThemedFloor() {
            const startCol = Math.floor(camera.x / museum.tileSize);
            const startRow = Math.floor(camera.y / museum.tileSize);
            const endCol = Math.ceil((camera.x + camera.width) / museum.tileSize);
            const endRow = Math.ceil((camera.y + camera.height) / museum.tileSize);

            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    const worldX = c * museum.tileSize;
                    const worldY = r * museum.tileSize;
                    const screenX = worldX - camera.x;
                    const screenY = worldY - camera.y;

                    // Determine Zone Theme
                    const zone = getZoneName(worldX + 16, worldY + 16);

                    if (zone.includes('Lobby')) {
                        // Polished Marble with Red Carpet Runner in cross
                        const isCarpetX = worldX >= 1140 && worldX <= 1260;
                        const isCarpetY = worldY >= 900 && worldY <= 1200;

                        if (isCarpetX || isCarpetY) {
                            ctx.fillStyle = (c + r) % 2 === 0 ? '#7a0016' : '#96001d';
                        } else {
                            ctx.fillStyle = (c + r) % 2 === 0 ? '#263238' : '#37474f';
                        }
                    } else if (zone.includes('3D')) {
                        // Cybernetic Grid with Cyan Conduits
                        ctx.fillStyle = (c + r) % 2 === 0 ? '#0b1622' : '#081018';
                        ctx.fillRect(screenX, screenY, museum.tileSize, museum.tileSize);
                        if (c % 4 === 0 || r % 4 === 0) {
                            ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
                            ctx.fillRect(screenX, screenY, museum.tileSize, 2);
                        }
                        continue;
                    } else if (zone.includes('Arcade')) {
                        // Starry Retro Arcade Carpet
                        ctx.fillStyle = (c + r) % 2 === 0 ? '#120d24' : '#191233';
                        ctx.fillRect(screenX, screenY, museum.tileSize, museum.tileSize);
                        if ((c * 3 + r * 5) % 11 === 0) {
                            ctx.fillStyle = 'rgba(255, 0, 128, 0.2)';
                            ctx.fillRect(screenX + 12, screenY + 12, 6, 6);
                        }
                        continue;
                    } else if (zone.includes('Puzzles')) {
                        // Warm Oak Parquet Wood
                        ctx.fillStyle = (c + r) % 2 === 0 ? '#3e2723' : '#4e342e';
                        ctx.fillRect(screenX, screenY, museum.tileSize, museum.tileSize);
                        ctx.fillStyle = 'rgba(255, 215, 0, 0.04)';
                        ctx.fillRect(screenX + 2, screenY + 2, museum.tileSize - 4, museum.tileSize - 4);
                        continue;
                    } else {
                        // Simulation Cleanroom Tile
                        ctx.fillStyle = (c + r) % 2 === 0 ? '#1e293b' : '#0f172a';
                        ctx.fillRect(screenX, screenY, museum.tileSize, museum.tileSize);
                        if (c % 3 === 0 && r % 3 === 0) {
                            ctx.fillStyle = 'rgba(0, 255, 136, 0.08)';
                            ctx.fillRect(screenX + 8, screenY + 8, 16, 16);
                        }
                        continue;
                    }

                    ctx.fillRect(screenX, screenY, museum.tileSize, museum.tileSize);
                }
            }
        }

        function drawFloorSignage() {
            // Directional Signs in Central Lobby
            ctx.save();
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // North Sign
            let sx = 1200 - camera.x;
            let sy = 830 - camera.y;
            if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                ctx.fillStyle = 'rgba(0, 229, 255, 0.85)';
                ctx.fillText('▲ ALA NORTE: 3D & WEBGL', sx, sy);
            }

            // South Sign
            sy = 1270 - camera.y;
            if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                ctx.fillStyle = 'rgba(0, 255, 136, 0.85)';
                ctx.fillText('▼ ALA SUL: SIMULAÇÕES & IA', sx, sy);
            }

            // West Sign
            sx = 800 - camera.x;
            sy = 1050 - camera.y;
            if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                ctx.fillStyle = 'rgba(255, 0, 128, 0.85)';
                ctx.fillText('◀ ALA AÇÃO & ARCADE', sx, sy);
            }

            // East Sign
            sx = 1600 - camera.x;
            sy = 1050 - camera.y;
            if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                ctx.fillText('ALA PUZZLES & ESTRATÉGIA ▶', sx, sy);
            }

            ctx.restore();
        }

        function drawWalls() {
            walls.forEach(w => {
                const sx = w.x - camera.x;
                const sy = w.y - camera.y;

                if (sx + w.width < 0 || sx > canvas.width || sy + w.height < 0 || sy > canvas.height) return;

                // Wall Base
                ctx.fillStyle = '#1e2430';
                ctx.fillRect(sx, sy, w.width, w.height);

                // Wall Bevel Top
                ctx.fillStyle = '#334155';
                ctx.fillRect(sx, sy, w.width, 3);
                ctx.fillRect(sx, sy, 3, w.height);

                // Wall Shadow Bottom
                ctx.fillStyle = '#0a0d14';
                ctx.fillRect(sx, sy + w.height - 3, w.width, 3);
                ctx.fillRect(sx + w.width - 3, sy, 3, w.height);

                // Brick Trim Details
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                for (let bx = sx + 8; bx < sx + w.width - 8; bx += 24) {
                    ctx.fillRect(bx, sy + 6, 16, 6);
                }
            });
        }

        function drawExhibitsAndLandmarks() {
            const time = performance.now() * 0.003;

            // Draw Central Monument
            drawSpecialPedestal(centralMonument, '#ffd700', '🏛️', 'MARCO PLAYFULHUB', time);

            // Draw Exit Portal
            drawSpecialPedestal(portalHome, '#00e5ff', '🚪', 'SAIR DO MUSEU', time);

            // Draw 27 Game Exhibits
            exhibits.forEach((ex, idx) => {
                const sx = ex.x - camera.x;
                const sy = ex.y - camera.y;

                if (sx + ex.width < -100 || sx > canvas.width + 100 || sy + ex.height < -100 || sy > canvas.height + 100) return;

                const isNear = currentInteractable === ex;
                const isVisited = visitedGames.has(ex.game.id);

                // 1. Floor Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(sx + ex.width / 2, sy + ex.height + 4, ex.width * 0.55, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // 2. Proximity Light Halo
                if (isNear) {
                    const glowGrad = ctx.createRadialGradient(
                        sx + ex.width / 2, sy + ex.height / 2, 10,
                        sx + ex.width / 2, sy + ex.height / 2, 90
                    );
                    glowGrad.addColorStop(0, 'rgba(0, 255, 136, 0.35)');
                    glowGrad.addColorStop(0.7, 'rgba(0, 255, 136, 0.1)');
                    glowGrad.addColorStop(1, 'rgba(0, 255, 136, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(sx + ex.width / 2, sy + ex.height / 2, 90, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. Arcade Cabinet / Museum Pedestal 2.5D
                // Base
                ctx.fillStyle = ex.game.color || '#333';
                ctx.fillRect(sx, sy + 18, ex.width, ex.height - 18);

                // Front Panel shading
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(sx + 4, sy + 24, ex.width - 8, ex.height - 30);

                // Pedestal Top Surface
                ctx.fillStyle = '#2a3342';
                ctx.fillRect(sx, sy, ex.width, 20);
                ctx.fillStyle = '#475569';
                ctx.fillRect(sx + 2, sy + 2, ex.width - 4, 16);

                // Gold or Neon Rim
                ctx.strokeStyle = isNear ? '#00ff88' : (isVisited ? '#ffd700' : 'rgba(255, 255, 255, 0.25)');
                ctx.lineWidth = isNear ? 2 : 1.5;
                ctx.strokeRect(sx, sy, ex.width, ex.height);

                // 4. Floating Holographic Game Icon
                const bobbing = Math.sin(time + idx * 0.7) * 5;
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ex.game.icon, sx + ex.width / 2, sy - 8 + bobbing);

                // 5. Game Name Plaque
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = isNear ? '#00ff88' : '#e2e8f0';
                ctx.fillText(ex.game.title.substring(0, 14), sx + ex.width / 2, sy + ex.height + 18);
            });
        }

        function drawSpecialPedestal(item, accentColor, icon, label, time) {
            const sx = item.x - camera.x;
            const sy = item.y - camera.y;

            if (sx + item.width < -100 || sx > canvas.width + 100 || sy + item.height < -100 || sy > canvas.height + 100) return;

            const isNear = currentInteractable === item;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.beginPath();
            ctx.ellipse(sx + item.width / 2, sy + item.height + 6, item.width * 0.6, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Halo
            const glowGrad = ctx.createRadialGradient(
                sx + item.width / 2, sy + item.height / 2, 10,
                sx + item.width / 2, sy + item.height / 2, 80
            );
            glowGrad.addColorStop(0, accentColor + '55');
            glowGrad.addColorStop(1, accentColor + '00');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(sx + item.width / 2, sy + item.height / 2, 80, 0, Math.PI * 2);
            ctx.fill();

            // Pedestal Body
            ctx.fillStyle = '#1e2430';
            ctx.fillRect(sx, sy + 15, item.width, item.height - 15);
            ctx.fillStyle = accentColor;
            ctx.fillRect(sx + 4, sy + 22, item.width - 8, item.height - 28);

            ctx.fillStyle = '#334155';
            ctx.fillRect(sx, sy, item.width, 18);

            ctx.strokeStyle = isNear ? '#ffffff' : accentColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(sx, sy, item.width, item.height);

            // Icon
            const bobbing = Math.sin(time * 1.5) * 6;
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, sx + item.width / 2, sy - 12 + bobbing);

            // Label
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = accentColor;
            ctx.fillText(label, sx + item.width / 2, sy + item.height + 20);
        }

        function drawPlayer() {
            const sx = player.x - camera.x;
            const sy = player.y - camera.y;

            // Player Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(sx + player.width / 2, sy + player.height + 2, 10, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Coat / Body (Pixel Art Explorer)
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(sx + 3, sy + 10, player.width - 6, 14);

            // Belt & Accent
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(sx + 3, sy + 18, player.width - 6, 2);

            // Head / Skin
            ctx.fillStyle = '#ffcc80';
            ctx.fillRect(sx + 5, sy + 2, player.width - 10, 9);

            // Explorer Hat
            ctx.fillStyle = '#b45309';
            ctx.fillRect(sx + 2, sy - 2, player.width - 4, 4);
            ctx.fillRect(sx + 4, sy - 6, player.width - 8, 5);

            // Directional Face Features
            ctx.fillStyle = '#0f172a';
            if (player.direction === 'down') {
                ctx.fillRect(sx + 7, sy + 5, 2, 2);
                ctx.fillRect(sx + 13, sy + 5, 2, 2);
            } else if (player.direction === 'up') {
                ctx.fillStyle = '#78350f';
                ctx.fillRect(sx + 5, sy + 1, player.width - 10, 4);
            } else if (player.direction === 'left') {
                ctx.fillRect(sx + 5, sy + 5, 2, 2);
            } else if (player.direction === 'right') {
                ctx.fillRect(sx + 15, sy + 5, 2, 2);
            }

            // Animated Boots
            ctx.fillStyle = '#451a03';
            if (player.isMoving) {
                if (player.animFrame % 2 === 0) {
                    ctx.fillRect(sx + 4, sy + 24, 4, 8);
                    ctx.fillRect(sx + 14, sy + 22, 4, 6);
                } else {
                    ctx.fillRect(sx + 4, sy + 22, 4, 6);
                    ctx.fillRect(sx + 14, sy + 24, 4, 8);
                }
            } else {
                ctx.fillRect(sx + 4, sy + 24, 4, 8);
                ctx.fillRect(sx + 14, sy + 24, 4, 8);
            }
        }

        function drawLightingAndDust() {
            // Ambient Radial Light around player
            const px = player.x + player.width / 2 - camera.x;
            const py = player.y + player.height / 2 - camera.y;

            const lightGrad = ctx.createRadialGradient(px, py, 40, px, py, 380);
            lightGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            lightGrad.addColorStop(0.7, 'rgba(5, 8, 14, 0.45)');
            lightGrad.addColorStop(1, 'rgba(5, 8, 14, 0.85)');

            ctx.fillStyle = lightGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Floating Dust Motes
            ctx.save();
            dustParticles.forEach(p => {
                const sx = p.x - camera.x;
                const sy = p.y - camera.y;
                if (sx > 0 && sx < canvas.width && sy > 0 && sy < canvas.height) {
                    ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.restore();
        }

        function drawMinimap() {
            miniCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            const scaleX = minimapCanvas.width / museum.width;
            const scaleY = minimapCanvas.height / museum.height;

            // Background
            miniCtx.fillStyle = '#080d14';
            miniCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            // Walls
            miniCtx.fillStyle = '#334155';
            walls.forEach(w => {
                miniCtx.fillRect(w.x * scaleX, w.y * scaleY, Math.max(1, w.width * scaleX), Math.max(1, w.height * scaleY));
            });

            // Exhibits
            exhibits.forEach(ex => {
                const isVisited = visitedGames.has(ex.game.id);
                miniCtx.fillStyle = isVisited ? '#00ff88' : '#64748b';
                miniCtx.beginPath();
                miniCtx.arc((ex.x + ex.width / 2) * scaleX, (ex.y + ex.height / 2) * scaleY, isVisited ? 2.5 : 2, 0, Math.PI * 2);
                miniCtx.fill();
            });

            // Player Blip (Pulsing Yellow)
            const blink = Math.sin(performance.now() * 0.01) > 0;
            miniCtx.fillStyle = blink ? '#ffd700' : '#ffffff';
            const plX = (player.x + player.width / 2) * scaleX;
            const plY = (player.y + player.height / 2) * scaleY;
            miniCtx.beginPath();
            miniCtx.arc(plX, plY, 3.5, 0, Math.PI * 2);
            miniCtx.fill();
        }

        // ==============================================================
        // MAIN GAME LOOP
        // ==============================================================

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start
        requestAnimationFrame(gameLoop);

        // Hook de depuração e testes QA
        window.__museum = {
            getPlayer: () => player,
            getGames: () => MUSEUM_GAMES,
            getVisitedCount: () => visitedGames.size,
            getCurrentZone: () => currentZoneEl.textContent,
            getCurrentInteractable: () => currentInteractable,
            openModal: openInteractableModal,
            closeModal: closeModal,
            teleportPlayer: (x, y) => { player.x = x; player.y = y; },
            simulateInteract: () => {
                if (currentInteractable) openInteractableModal(currentInteractable);
            }
        };
    </script>
