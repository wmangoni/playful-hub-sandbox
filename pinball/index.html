    <title>Pimbal - Enhanced Pinball</title>
    <!-- TASK_001: fontes retro-gamer (fallback gracioso se a CDN bloquear) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* === TASK_001: Estética Retro-Futurista Synthwave / Cyberpunk === */
        body {
            background-color: #0d0e15;
            background-image: radial-gradient(circle at 50% 0%, #1a1030 0%, #0d0e15 55%, #05060a 100%);
            color: #e0e0e0;
            font-family: 'Orbitron', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #09090e, #020204);
            border: 5px solid #1a1b26;
            border-radius: 16px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 20px rgba(255, 0, 127, 0.25),
                0 0 40px rgba(0, 240, 255, 0.15),
                inset 0 0 15px rgba(0, 0, 0, 0.8);
            transition: box-shadow 0.3s ease;
        }

        /* TASK_003: Efeito Glitch no Canvas */
        #gameCanvas.glitch-effect {
            animation: glitchAnim 0.1s steps(2) infinite;
        }
        @keyframes glitchAnim {
            0% { transform: translate(2px, -2px) skewX(2deg); filter: hue-rotate(90deg) contrast(150%); }
            50% { transform: translate(-2px, 2px) skewX(-2deg); filter: hue-rotate(-90deg) brightness(130%); }
            100% { transform: translate(0, 0) skewX(0deg); filter: none; }
        }

        #gameInfo {
            margin-top: 20px;
            background: rgba(18, 19, 32, 0.65);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 15px 30px;
            display: flex;
            gap: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: #aab;
        }
        #gameInfo span {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            margin-left: 5px;
        }
        #gameInfo #score { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }

        /* Animação de feedback de pontos */
        .score-bump { animation: scoreBumpAnimation 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scoreBumpAnimation {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.25); color: #ff007f !important; text-shadow: 0 0 12px #ff007f !important; }
            100% { transform: scale(1); }
        }

        h1 {
            margin-bottom: 18px;
            font-family: 'Press Start 2P', monospace;
            color: #ff2e97;
            font-size: 2em;
            text-shadow: 0 0 10px #ff007f, 0 0 22px rgba(0, 240, 255, 0.5);
            letter-spacing: 4px;
        }

    <h1>PIMBAL</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="gameInfo">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Multiplier: <span id="multiplier">1x</span></div>
    </div>

    <script>
        // === TASK_003: Sintetizador de Áudio Procedural (Web Audio API) ===
        class SoundSynth {
            constructor() {
                this.ctx = null;
                this.masterVolume = null;
                this.ambientGain = null;
                this.ambientOsc = null;
                this.ambientFilter = null;
                this.lastSoundTime = {};
            }

            init() {
                if (this.ctx) return;
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                    this.masterVolume = this.ctx.createGain();
                    this.masterVolume.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    this.masterVolume.connect(this.ctx.destination);
                    this.startAmbientDrone();
                } catch (e) {
                    console.warn('AudioContext failed to initialize:', e);
                }
            }

            throttle(key, minMs) {
                const now = performance.now();
                if (this.lastSoundTime[key] && (now - this.lastSoundTime[key] < minMs)) {
                    return true;
                }
                this.lastSoundTime[key] = now;
                return false;
            }

            playFlipperFlip() {
                if (!this.ctx) return;
                if (this.throttle('flipper', 40)) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(this.masterVolume);
                osc.start(now);
                osc.stop(now + 0.05);
                osc.onended = () => { osc.disconnect(); gain.disconnect(); };
            }

            playBumperHit(freq) {
                if (!this.ctx) return;
                if (this.throttle('bumper_' + freq, 60)) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq || 440, now);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.masterVolume);
                osc.start(now);
                osc.stop(now + 0.35);
                osc.onended = () => { osc.disconnect(); gain.disconnect(); };
            }

            playBossDamage() {
                if (!this.ctx) return;
                if (this.throttle('bossDamage', 60)) return;
                const now = this.ctx.currentTime;
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.15);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = buffer;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.4, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                const oscGain = this.ctx.createGain();
                oscGain.gain.setValueAtTime(0.3, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                noiseNode.connect(noiseGain);
                noiseGain.connect(this.masterVolume);
                osc.connect(oscGain);
                oscGain.connect(this.masterVolume);

                noiseNode.start(now);
                osc.start(now);
                osc.stop(now + 0.15);
                noiseNode.onended = () => { noiseNode.disconnect(); noiseGain.disconnect(); };
                osc.onended = () => { osc.disconnect(); oscGain.disconnect(); };
            }

            playBossDefeat() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.5, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.masterVolume);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.45);
                    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
                });
            }

            playSkillShot() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.4, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.masterVolume);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.35);
                    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
                });
            }

            startAmbientDrone() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    this.ambientOsc = this.ctx.createOscillator();
                    this.ambientGain = this.ctx.createGain();
                    this.ambientFilter = this.ctx.createBiquadFilter();

                    this.ambientOsc.type = 'triangle';
                    this.ambientOsc.frequency.setValueAtTime(55, now); // A1

                    this.ambientFilter.type = 'lowpass';
                    this.ambientFilter.frequency.setValueAtTime(300, now);

                    this.ambientGain.gain.setValueAtTime(0.08, now);

                    this.ambientOsc.connect(this.ambientFilter);
                    this.ambientFilter.connect(this.ambientGain);
                    this.ambientGain.connect(this.masterVolume);

                    this.ambientOsc.start(now);
                } catch (e) {
                    console.warn('Ambient drone start failed:', e);
                }
            }

            updateAmbient(ballSpeed, isGameActive) {
                if (!this.ctx || !this.ambientFilter || !this.ambientGain) return;
                const now = this.ctx.currentTime;
                if (!isGameActive) {
                    this.ambientGain.gain.setTargetAtTime(0.015, now, 0.1);
                    this.ambientFilter.frequency.setTargetAtTime(150, now, 0.1);
                } else {
                    const targetFreq = Math.min(1000, 200 + ballSpeed * 80);
                    this.ambientGain.gain.setTargetAtTime(0.08, now, 0.1);
                    this.ambientFilter.frequency.setTargetAtTime(targetFreq, now, 0.1);
                }
            }
        }
        const soundSynth = new SoundSynth();

        // Game Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWidth = canvas.width;
        const canvasHeight = canvas.height;

        // Game variables
        let score = 0;
        let lives = 3;
        let currentMultiplier = 1;
        let gameActive = true;
        let gameStarted = false;
        let particles = []; // For visual effects
        let floatingTexts = []; // TASK_003: Popups neon flutuantes

        // --- Variáveis de Segurança da Bola ---
        let ballStuckTimer = 0; // Timer para bola parada
        const MAX_STUCK_TIME_SECONDS = 6; // Tempo máximo parada (em segundos)
        const STUCK_VELOCITY_THRESHOLD = 0.15; // Velocidade abaixo da qual é considerada parada

        // --- Constants ---
        const BALL_RADIUS = 8;
        const GRAVITY = 0.2;
        const FRICTION = 0.995; // Air resistance / rolling friction
        const BUMPER_BOUNCE = 1.05; // How much speed increases on bumper hit
        const FLIPPER_STRENGTH = 10; // Base upward speed boost from flipper
        const FLIPPER_SIDE_STRENGTH = 4; // Sideways boost

        const LEFT_FLIPPER_REST_ANGLE = Math.PI / 6; // Point slightly up when resting
        const LEFT_FLIPPER_ACTIVE_ANGLE = -Math.PI / 4; // Angle when flipped up
        const RIGHT_FLIPPER_REST_ANGLE = Math.PI - Math.PI / 6; // Mirror rest angle
        const RIGHT_FLIPPER_ACTIVE_ANGLE = Math.PI + Math.PI / 4; // Mirror active angle

        // Ball properties
        function createBall(x, y, launched = false) {
            return {
                xInitial: canvasWidth - 24,
                yInitial: canvasHeight - 89,
                x: x, y: y,
                radius: BALL_RADIUS,
                speedX: 0, speedY: 0,
                isLaunched: launched,
                trail: [],
                maxTrailLength: 12,
                stuckTimer: 0,
                hasTriggeredSkillShot: false
            };
        }
        let ball = createBall(canvasWidth - 24, canvasHeight - 89, false); // bola "corrente" (ponteiro)

        // === TASK_002: Multibola, gravidade mutável e missões ciber-sintéticas ===
        let activeBalls = [ball];
        let currentGravity = GRAVITY;
        let currentFriction = FRICTION;
        let activePhysicsMode = 'normal'; // 'normal' | 'low_gravity' | 'overdrive'
        let physicsModeTimer = 0;
        let bounceBoost = 1;              // amplifica rebotes no overdrive
        let globalScoreMultiplier = 1;   // 2x durante o OVERCLOCK
        let frameFlashTimer = 0;         // flash vermelho da moldura ao perder uma bola no multiball

        // === TASK_003: Estrutura do Chefe (Rogue AI Core) e Skill Shot ===
        const bossState = {
            active: false,
            hp: 300,
            maxHp: 300,
            x: 200,
            y: 80,
            radius: 25,
            angle: 0,
            rotationSpeed: 0.02,
            shields: [], // [{ id, hp, maxHp, angle, radius }]
            activeEmpFlipper: null, // 'left' | 'right' | null
            empTimer: 12.0,
            empDurationTimer: 0,
            glitchPulseTimer: 8.0,
            glitchRingActive: false,
            glitchRingRadius: 0,
            activeFirewall: null, // { x, y, width, height, hp }
            upperCrossings: 0,
            goldSkinTimer: 0
        };

        const skillShotSensor = { x: 350, y: 40, radius: 15 };

        // Estado das missões
        const missionsState = { label: '', detail: '', barRatio: 0, accent: '#00f0ff' };
        let hackGridHits = new Set();    // índices 0,1,2 atingidos
        let hackGridTimer = 0;           // janela de 15s
        let hackGridDone = false;
        let overclockZoneTime = 0;       // tempo cumulativo em zona central
        let overclockTimer = 0;          // duração do bônus 2x
        let lowerBumperStreak = 0;       // hits sucessivos nos bumpers inferiores
        let firewallProgress = 0;        // 0..3 alvos em sequência

        // Alvos físicos da missão FIREWALL CRACK (laterais inferiores)
        const firewallTargets = [
            { x: 14,               y: 360, width: 22, height: 12, color: '#ff2e97' },
            { x: canvasWidth - 60, y: 400, width: 22, height: 12, color: '#00f0ff' },
            { x: 14,               y: 440, width: 22, height: 12, color: '#39ff14' }
        ];

        // Launcher properties
        const launcher = {
            x: canvasWidth - 25, // Positioned in the launcher lane
            y: canvasHeight - 80, // Bottom position
            width: 15,
            height: 70, // Total visual height
            pullDistance: 0, // How far it's pulled back
            maxPull: 60, // Max pixels it can be pulled
            springStiffness: 0.4, // Power based on pull distance
            charging: false,
            lastPlungerPull: 0,
            launchTimestamp: 0
        };

        // Flipper properties - Revised for Pivot Rotation
        const flipperHeight = 10;
        const flipperWidth = 70; // Adjusted size

        const leftFlipper = {
            pivotX: 110, // Pivot X (closer to center)
            pivotY: canvasHeight - 60, // Pivot Y
            width: flipperWidth,
            height: flipperHeight,
            restAngle: LEFT_FLIPPER_REST_ANGLE,
            activeAngle: LEFT_FLIPPER_ACTIVE_ANGLE,
            currentAngle: LEFT_FLIPPER_REST_ANGLE,
            angularVelocity: 0, // For smooth animation
            isActivating: false, // Is the key pressed?
            isUp: false, // Is it fully up? (Used for state checking)
            color: '#E0E0E0',
            isLeft: true
        };

        const rightFlipper = {
            pivotX: canvasWidth - 110, // Pivot X (mirror)
            pivotY: canvasHeight - 60, // Pivot Y
            width: flipperWidth,
            height: flipperHeight,
            restAngle: RIGHT_FLIPPER_REST_ANGLE,
            activeAngle: RIGHT_FLIPPER_ACTIVE_ANGLE,
            currentAngle: RIGHT_FLIPPER_REST_ANGLE,
            angularVelocity: 0,
            isActivating: false,
            isUp: false,
            color: '#E0E0E0',
            isLeft: false
        };
        const FLIPPER_ROTATE_SPEED = 0.5; // Radians per frame step

        // Obstacles - Bumpers
        const bumpers = [
            { x: 100, y: 150, radius: 18, points: 10, color: '#ff2e97', hitColor: '#ffffff', isHit: false, hitTimer: 0, freq: 440 },
            { x: 200, y: 200, radius: 22, points: 15, color: '#ffcc00', hitColor: '#ffffff', isHit: false, hitTimer: 0, freq: 523.25 },
            { x: 300, y: 150, radius: 18, points: 10, color: '#ff2e97', hitColor: '#ffffff', isHit: false, hitTimer: 0, freq: 587.33 },
            { x: 150, y: 300, radius: 15, points: 5, color: '#39ff14', hitColor: '#ffffff', isHit: false, hitTimer: 0, freq: 659.25 },
            { x: 250, y: 300, radius: 15, points: 5, color: '#00f0ff', hitColor: '#ffffff', isHit: false, hitTimer: 0, freq: 783.99 }
        ];
        const BUMPER_HIT_DURATION = 8; // Frames the hit color shows

        // Multiplier zones
        const multiplierZones = [
            { x: 50, y: 100, width: 60, height: 60, multiplier: 2, color: 'rgba(255, 46, 151, 0.2)', borderColor: 'rgba(255, 46, 151, 0.8)' },
            { x: 290, y: 100, width: 60, height: 60, multiplier: 2, color: 'rgba(255, 46, 151, 0.2)', borderColor: 'rgba(255, 46, 151, 0.8)' },
            { x: 170, y: 100, width: 60, height: 60, multiplier: 3, color: 'rgba(57, 255, 20, 0.2)', borderColor: 'rgba(57, 255, 20, 0.8)' },
            { x: 170, y: 250, width: 60, height: 60, multiplier: 5, color: 'rgba(0, 240, 255, 0.2)', borderColor: 'rgba(0, 240, 255, 0.8)' }
        ];

        // Walls and boundaries
        const walls = [
            { x1: 10, y1: 10, x2: 10, y2: canvasHeight - 80 },
            { x1: canvasWidth - 10, y1: 10, x2: canvasWidth - 10, y2: canvasHeight },
            { x1: 350, y1: 0, x2: canvasWidth - 10, y2: 50 },
            { x1: 10, y1: 0, x2: canvasWidth - 10, y2: 0 },

            { x1: 10, y1: canvasHeight - 80, x2: leftFlipper.pivotX - flipperWidth/3, y2: leftFlipper.pivotY + 10 },
            { x1: canvasWidth - 10, y1: canvasHeight - 80, x2: rightFlipper.pivotX + flipperWidth/3, y2: rightFlipper.pivotY + 10 },

            { x1: leftFlipper.pivotX + flipperWidth/1.5, y1: leftFlipper.pivotY+15, x2: canvasWidth/2 - 10, y2: canvasHeight},
            { x1: rightFlipper.pivotX - flipperWidth/1.5, y1: rightFlipper.pivotY+15, x2: canvasWidth/2 + 10, y2: canvasHeight},

            { x1: canvasWidth - 45, y1: 100, x2: canvasWidth - 45, y2: canvasHeight - launcher.height - 10 }
        ];

        // Event listeners
        const initAudio = () => soundSynth.init();
        document.addEventListener('pointerdown', initAudio, { once: true });
        document.addEventListener('keydown', initAudio, { once: true });

        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                launcher.charging = true;
            }
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'z') {
                if (bossState.activeEmpFlipper !== 'left') {
                    if (!leftFlipper.isActivating) soundSynth.playFlipperFlip();
                    leftFlipper.isActivating = true;
                }
            }
            if (e.key === 'ArrowRight' || e.key === '/') {
                if (bossState.activeEmpFlipper !== 'right') {
                    if (!rightFlipper.isActivating) soundSynth.playFlipperFlip();
                    rightFlipper.isActivating = true;
                }
            }
            if (e.key === 'Enter' && !gameActive) {
                resetGame();
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                if (launcher.charging && activeBalls.some(b => !b.isLaunched)) {
                    launchBall();
                }
                launcher.charging = false;
                launcher.pullDistance = 0;
            }
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'z') {
                leftFlipper.isActivating = false;
            }
            if (e.key === 'ArrowRight' || e.key === '/') {
                rightFlipper.isActivating = false;
            }
        });

        // Game functions
        function resetGame() {
            score = 0;
            lives = 3;
            currentMultiplier = 1;
            gameActive = true;
            gameStarted = false;
            particles = [];
            floatingTexts = [];

            resetBallToLauncher();
            setPhysicsMode('normal', 0);
            hackGridHits.clear(); hackGridTimer = 0; hackGridDone = false;
            overclockZoneTime = 0; overclockTimer = 0; globalScoreMultiplier = 1;
            lowerBumperStreak = 0; firewallProgress = 0; frameFlashTimer = 0;

            // Reset Boss
            bossState.active = false;
            bossState.hp = 300;
            bossState.shields = [];
            bossState.activeEmpFlipper = null;
            bossState.empTimer = 12.0;
            bossState.empDurationTimer = 0;
            bossState.glitchPulseTimer = 8.0;
            bossState.activeFirewall = null;
            bossState.upperCrossings = 0;
            bossState.goldSkinTimer = 0;

            leftFlipper.currentAngle = leftFlipper.restAngle;
            rightFlipper.currentAngle = rightFlipper.restAngle;
            leftFlipper.isActivating = false;
            rightFlipper.isActivating = false;

            updateScoreDisplay();
        }

        function resetBallPosition() {
            ball.x = ball.xInitial;
            ball.y = ball.yInitial;
            ball.speedX = 0;
            ball.speedY = 0;
            ball.isLaunched = false;
            ball.trail = [];
            launcher.pullDistance = 0;
            ball.stuckTimer = 0;
            createParticles(ball.x, ball.y, 5, '#8888FF');
        }

        function checkBallStuckOrOutOfBounds(deltaTime) {
            if (!ball.isLaunched || !gameActive) {
                ball.stuckTimer = 0;
                return;
            }

            const currentSpeedSq = ball.speedX * ball.speedX + ball.speedY * ball.speedY;
            if (currentSpeedSq < STUCK_VELOCITY_THRESHOLD * STUCK_VELOCITY_THRESHOLD) {
                ball.stuckTimer += deltaTime;
            } else {
                ball.stuckTimer = 0;
            }

            if (ball.stuckTimer > MAX_STUCK_TIME_SECONDS) {
                if (activeBalls.length > 1) {
                    createParticles(ball.x, ball.y, 10, '#00f0ff');
                    ball.x = 200; ball.y = 50;
                    ball.speedX = (Math.random() - 0.5) * 2; ball.speedY = 2;
                    ball.trail = [];
                    ball.stuckTimer = 0;
                    createParticles(ball.x, ball.y, 10, '#00f0ff');
                } else {
                    resetBallPosition();
                }
                return;
            }

            const safeMinX = 10 + ball.radius;
            const safeMaxX = canvasWidth - 10 - ball.radius;
            const safeMinY = 10 + ball.radius;
            const safeMaxY = canvasHeight - 20;

            if (ball.x < safeMinX || ball.x > safeMaxX || ball.y < safeMinY) {
                const isInLauncherArea = ball.x > canvasWidth - 45 - ball.radius && ball.y > canvasHeight - launcher.height - 10 - ball.radius;
                if (!isInLauncherArea && ball.y < safeMaxY) {
                     resetBallPosition();
                     return;
                 }
            }
        }

        function launchBall() {
            const b = activeBalls.find(x => !x.isLaunched);
            if (b && launcher.pullDistance > 5) {
                b.isLaunched = true;
                b.speedY = -(launcher.pullDistance * launcher.springStiffness * 1.4);
                b.speedX = -1 - Math.random();
                b.hasTriggeredSkillShot = false;
                launcher.lastPlungerPull = launcher.pullDistance;
                launcher.launchTimestamp = performance.now();
                launcher.pullDistance = 0;
                if (!gameStarted) gameStarted = true;
                createParticles(b.x, b.y + 10, 10, '#FFFF88');
            }
            launcher.charging = false;
        }

        function addScore(base) {
            score += Math.round(base * currentMultiplier * activeBalls.length * globalScoreMultiplier);
            if (!bossState.active && (score >= 15000 || bossState.upperCrossings >= 3)) {
                spawnBoss();
            }
        }

        function handleDrainCheck(b, index) {
            if (b.y > canvasHeight + b.radius * 2) {
                activeBalls.splice(index, 1);
                if (activeBalls.length === 0) {
                    if (lives > 1) {
                        lives--;
                        resetBallToLauncher();
                    } else {
                        lives = 0;
                        gameActive = false;
                    }
                    updateScoreDisplay();
                } else {
                    frameFlashTimer = 0.25;
                }
            }
        }

        function resetBallToLauncher() {
            const nb = createBall(canvasWidth - 24, canvasHeight - 89, false);
            activeBalls = [nb];
            ball = nb;
            launcher.pullDistance = 0;
            currentMultiplier = 1;
        }

        function spawnMultiball() {
            const spawns = [{ x: 150, y: 60 }, { x: 250, y: 60 }];
            spawns.forEach(s => {
                const nb = createBall(s.x, s.y, true);
                nb.speedX = (Math.random() - 0.5) * 4;
                nb.speedY = 2 + Math.random() * 2;
                activeBalls.push(nb);
                createParticles(s.x, s.y, 14, '#00f0ff');
            });
        }

        function checkBallToBallCollisions() {
            for (let i = 0; i < activeBalls.length; i++) {
                for (let j = i + 1; j < activeBalls.length; j++) {
                    const b1 = activeBalls[i], b2 = activeBalls[j];
                    const dx = b2.x - b1.x, dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = b1.radius + b2.radius;
                    if (dist < minDist && dist > 0) {
                        const overlap = minDist - dist;
                        const nX = dx / dist, nY = dy / dist;
                        b1.x -= nX * (overlap / 2); b1.y -= nY * (overlap / 2);
                        b2.x += nX * (overlap / 2); b2.y += nY * (overlap / 2);
                        const tX = -nY, tY = nX;
                        const v1n = b1.speedX * nX + b1.speedY * nY;
                        const v1t = b1.speedX * tX + b1.speedY * tY;
                        const v2n = b2.speedX * nX + b2.speedY * nY;
                        const v2t = b2.speedX * tX + b2.speedY * tY;
                        b1.speedX = v2n * nX + v1t * tX; b1.speedY = v2n * nY + v1t * tY;
                        b2.speedX = v1n * nX + v2t * tX; b2.speedY = v1n * nY + v2t * tY;
                        createParticles(b1.x + nX * b1.radius, b1.y + nY * b1.radius, 8, '#ffffff');
                    }
                }
            }
        }

        function setPhysicsMode(mode, duration) {
            activePhysicsMode = mode;
            physicsModeTimer = duration;
            if (mode === 'low_gravity') {
                currentGravity = GRAVITY * 0.5; currentFriction = 1.0; bounceBoost = 1;
            } else if (mode === 'overdrive') {
                currentGravity = GRAVITY * 1.35; currentFriction = FRICTION; bounceBoost = 1.4;
            } else {
                currentGravity = GRAVITY; currentFriction = FRICTION; bounceBoost = 1;
            }
        }

        function updatePhysicsMode(dt) {
            if (physicsModeTimer > 0) {
                physicsModeTimer -= dt;
                if (physicsModeTimer <= 0) setPhysicsMode('normal', 0);
            }
        }

        function updateMissions(dt) {
            if (hackGridTimer > 0 && !hackGridDone) {
                hackGridTimer -= dt;
                if (hackGridTimer <= 0) { hackGridHits.clear(); }
            }
            if (overclockTimer > 0) {
                overclockTimer -= dt;
                if (overclockTimer <= 0) { globalScoreMultiplier = 1; }
            }

            if (bossState.active) {
                missionsState.label = 'BOSS: ROGUE AI CORE';
                missionsState.detail = `HP: ${Math.max(0, bossState.hp)}/${bossState.maxHp}`;
                missionsState.barRatio = Math.max(0, bossState.hp / bossState.maxHp);
                missionsState.accent = '#ff0033';
            } else if (overclockTimer > 0) {
                missionsState.label = 'SYSTEM OVERCLOCK · 2x';
                missionsState.detail = `TIME LEFT: ${overclockTimer.toFixed(1)}s`;
                missionsState.barRatio = overclockTimer / 20;
                missionsState.accent = '#ff2e97';
            } else if (hackGridTimer > 0 && !hackGridDone) {
                missionsState.label = 'HACK THE GRID';
                missionsState.detail = `BUMPERS: ${hackGridHits.size}/3 · ${hackGridTimer.toFixed(1)}s`;
                missionsState.barRatio = hackGridTimer / 15;
                missionsState.accent = '#ff2e97';
            } else {
                missionsState.label = 'FIREWALL CRACK';
                missionsState.detail = `TARGETS: ${firewallProgress}/3`;
                missionsState.barRatio = firewallProgress / 3;
                missionsState.accent = '#39ff14';
            }
        }

        function registerBumperHitForMissions(index) {
            if (index <= 2) {
                if (hackGridHits.size === 0) { hackGridTimer = 15; hackGridDone = false; }
                if (hackGridTimer > 0) {
                    hackGridHits.add(index);
                    if (hackGridHits.size >= 3 && !hackGridDone) {
                        hackGridDone = true;
                        score += 500;
                        spawnMultiball();
                        createParticles(200, 60, 20, '#ff2e97');
                        hackGridHits.clear();
                        hackGridTimer = 0;
                    }
                }
            } else {
                lowerBumperStreak++;
                if (lowerBumperStreak >= 3) {
                    lowerBumperStreak = 0;
                    setPhysicsMode('overdrive', 8);
                }
            }
        }

        function checkFirewallTargets() {
            const target = firewallTargets[firewallProgress];
            if (!target) return;
            if (ball.x + ball.radius > target.x && ball.x - ball.radius < target.x + target.width &&
                ball.y + ball.radius > target.y && ball.y - ball.radius < target.y + target.height) {
                firewallProgress++;
                createParticles(target.x + target.width / 2, target.y + target.height / 2, 12, target.color);
                if (firewallProgress >= 3) {
                    score += 1000;
                    if (lives < 3) { lives++; }
                    firewallProgress = 0;
                    updateScoreDisplay();
                }
            }
        }

        // === TASK_003: Lógica do Chefe e Ataques ===
        function spawnBoss() {
            if (bossState.active) return;
            bossState.active = true;
            bossState.hp = 300;
            bossState.shields = [
                { id: 0, hp: 50, maxHp: 50 },
                { id: 1, hp: 50, maxHp: 50 },
                { id: 2, hp: 50, maxHp: 50 }
            ];
            bossState.activeEmpFlipper = null;
            bossState.empTimer = 12.0;
            bossState.glitchPulseTimer = 8.0;
            bossState.activeFirewall = null;
            createParticles(bossState.x, bossState.y, 35, '#ff0033');
            spawnFloatingText('ROGUE AI CORE AWAKENED!', canvasWidth / 2, 160, '#ff0033');
        }

        function updateBoss(dt) {
            if (!bossState.active) return;

            bossState.angle += bossState.rotationSpeed;

            // Atualiza escudos
            bossState.shields.forEach((shield, index) => {
                if (shield.hp > 0) {
                    const currentAngle = bossState.angle + (index * (Math.PI * 2 / 3));
                    shield.x = bossState.x + 45 * Math.cos(currentAngle);
                    shield.y = bossState.y + 45 * Math.sin(currentAngle);
                }
            });

            // Ataque 1: Glitch Pulse (a cada 8s)
            bossState.glitchPulseTimer -= dt;
            if (bossState.glitchPulseTimer <= 0) {
                bossState.glitchPulseTimer = 8.0;
                bossState.glitchRingActive = true;
                bossState.glitchRingRadius = 10;
            }

            if (bossState.glitchRingActive) {
                bossState.glitchRingRadius += 140 * dt;
                if (bossState.glitchRingRadius > 75) {
                    bossState.glitchRingActive = false;
                } else {
                    // Checa colisão da bola com o anel
                    activeBalls.forEach(b => {
                        const dist = Math.hypot(b.x - bossState.x, b.y - bossState.y);
                        if (Math.abs(dist - bossState.glitchRingRadius) < 15) {
                            b.speedX *= 0.7;
                            b.speedY *= 0.7;
                            canvas.classList.add('glitch-effect');
                            setTimeout(() => canvas.classList.remove('glitch-effect'), 500);
                        }
                    });
                }
            }

            // Ataque 2: EMP Shockwave (a cada 12s)
            if (bossState.empDurationTimer > 0) {
                bossState.empDurationTimer -= dt;
                if (bossState.empDurationTimer <= 0) {
                    bossState.activeEmpFlipper = null;
                }
            } else {
                bossState.empTimer -= dt;
                if (bossState.empTimer <= 0) {
                    bossState.empTimer = 12.0;
                    bossState.empDurationTimer = 2.0;
                    bossState.activeEmpFlipper = (Math.random() < 0.5) ? 'left' : 'right';
                    const flipper = bossState.activeEmpFlipper === 'left' ? leftFlipper : rightFlipper;
                    flipper.isActivating = false;
                    createParticles(flipper.pivotX, flipper.pivotY, 15, '#ffd700');
                    spawnFloatingText('EMP PULSE!', flipper.pivotX, flipper.pivotY - 20, '#ffd700');
                }
            }

            // Ataque 3: Firewall Barrier (se Boss HP < 150)
            if (bossState.hp < 150 && !bossState.activeFirewall) {
                bossState.activeFirewall = { x: 170, y: 290, width: 60, height: 16, hp: 2 };
                spawnFloatingText('FIREWALL DEPLOYED!', canvasWidth / 2, 270, '#ffaa00');
            }
        }

        function checkBossCollisions() {
            if (!bossState.active) return;

            const allShieldsDown = bossState.shields.every(s => s.hp <= 0);

            activeBalls.forEach(b => {
                // 1. Colisão com Escudos Orbitais
                bossState.shields.forEach(shield => {
                    if (shield.hp > 0) {
                        const dx = b.x - shield.x;
                        const dy = b.y - shield.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < b.radius + 8) {
                            shield.hp -= 15;
                            createParticles(shield.x, shield.y, 10, '#00f0ff');
                            soundSynth.playBossDamage();

                            // Reflete a bola
                            const nx = dx / (dist || 1);
                            const ny = dy / (dist || 1);
                            const reflected = reflectVelocity(b.speedX, b.speedY, nx, ny);
                            b.speedX = reflected.x * 1.1;
                            b.speedY = reflected.y * 1.1;

                            if (shield.hp <= 0) {
                                createParticles(shield.x, shield.y, 20, '#ff0033');
                                spawnFloatingText('SHIELD DOWN!', shield.x, shield.y - 10, '#00f0ff');
                            }
                        }
                    }
                });

                // 2. Colisão com o Núcleo do Chefe
                const cdx = b.x - bossState.x;
                const cdy = b.y - bossState.y;
                const cdist = Math.hypot(cdx, cdy);
                if (cdist < b.radius + bossState.radius) {
                    const nx = cdx / (cdist || 1);
                    const ny = cdy / (cdist || 1);

                    if (!allShieldsDown) {
                        // Invulnerável: repulsa sem dano
                        const reflected = reflectVelocity(b.speedX, b.speedY, nx, ny);
                        b.speedX = reflected.x * 1.1;
                        b.speedY = reflected.y * 1.1;
                        createParticles(b.x, b.y, 5, '#888888');
                    } else {
                        // Núcleo Vulnerável: Dano ao Chefe
                        bossState.hp -= 50;
                        createParticles(bossState.x, bossState.y, 18, '#ff0033');
                        soundSynth.playBossDamage();

                        const reflected = reflectVelocity(b.speedX, b.speedY, nx, ny);
                        b.speedX = reflected.x * 1.2;
                        b.speedY = reflected.y * 1.2;

                        if (bossState.hp <= 0) {
                            defeatBoss();
                        }
                    }
                }

                // 3. Colisão com a Firewall Barrier
                if (bossState.activeFirewall && bossState.activeFirewall.hp > 0) {
                    const fw = bossState.activeFirewall;
                    if (b.x + b.radius > fw.x && b.x - b.radius < fw.x + fw.width &&
                        b.y + b.radius > fw.y && b.y - b.radius < fw.y + fw.height) {

                        fw.hp -= 1;
                        createParticles(b.x, b.y, 12, '#ffaa00');
                        soundSynth.playBossDamage();
                        b.speedY = -Math.abs(b.speedY) * 0.8;

                        if (fw.hp <= 0) {
                            bossState.activeFirewall = null;
                            createParticles(fw.x + fw.width/2, fw.y + fw.height/2, 20, '#ff5500');
                        }
                    }
                }
            });
        }

        function defeatBoss() {
            bossState.active = false;
            bossState.hp = 0;
            addScore(15000);
            if (lives < 3) lives++;
            bossState.goldSkinTimer = 20.0;
            createParticles(bossState.x, bossState.y, 40, '#ffd700');
            soundSynth.playBossDefeat();
            spawnFloatingText('BOSS DEFEATED! +15,000', canvasWidth / 2, 180, '#ffd700');
            updateScoreDisplay();
        }

        // === TASK_003: Skill Shot e Sensor ===
        function checkSkillShotSensor(b) {
            if (!b.isLaunched || b.hasTriggeredSkillShot) return;

            const dx = b.x - skillShotSensor.x;
            const dy = b.y - skillShotSensor.y;
            const dist = Math.hypot(dx, dy);

            if (dist < b.radius + skillShotSensor.radius) {
                b.hasTriggeredSkillShot = true;
                bossState.upperCrossings++;

                const timeElapsed = (performance.now() - launcher.launchTimestamp) / 1000;
                const pullRatio = launcher.lastPlungerPull / launcher.maxPull;

                if (timeElapsed <= 1.5 && pullRatio >= 0.75 && pullRatio <= 0.85) {
                    triggerCriticalSkillShot();
                }
            }
        }

        function triggerCriticalSkillShot() {
            addScore(3000);
            currentMultiplier += 1;
            soundSynth.playSkillShot();
            spawnFloatingText('CRITICAL SKILL SHOT!', canvasWidth / 2, 220, '#00f0ff');
            createParticles(skillShotSensor.x, skillShotSensor.y, 25, '#00f0ff');
            updateScoreDisplay();
        }

        function spawnFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                color: color,
                alpha: 1.0,
                vy: -1.0
            });
        }

        function updateFloatingTexts(dt) {
            floatingTexts.forEach(ft => {
                ft.y += ft.vy;
                ft.alpha -= 0.8 * dt;
            });
            floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);
        }

        let lastDisplayedScore = 0;
        function updateScoreDisplay() {
            const scoreEl = document.getElementById('score');
            scoreEl.textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('multiplier').textContent = currentMultiplier + 'x';

            if (score > lastDisplayedScore) {
                scoreEl.classList.remove('score-bump');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('score-bump');
            }
            lastDisplayedScore = score;
        }

        // --- Drawing Functions ---
        function drawBall() {
            if (!gameActive) return;

            const isGold = bossState.goldSkinTimer > 0;

            for (let i = 0; i < ball.trail.length; i++) {
                const pos = ball.trail[i];
                const ratio = i / ball.trail.length;
                const radius = ball.radius * (0.3 + 0.7 * ratio);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = isGold ? `rgba(255, 215, 0, ${0.25 * ratio})` : `rgba(0, 240, 255, ${0.18 * ratio})`;
                ctx.fill();
                ctx.closePath();
            }

            const grad = ctx.createRadialGradient(
                ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.1,
                ball.x, ball.y, ball.radius
            );
            if (isGold) {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#fff7a0');
                grad.addColorStop(0.75, '#ffd700');
                grad.addColorStop(1, '#b8860b');
            } else {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#dcdcdc');
                grad.addColorStop(0.75, '#4a4a5a');
                grad.addColorStop(1, '#1e1e24');
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.shadowColor = isGold ? '#ffd700' : '#00f0ff';
            ctx.shadowBlur = isGold ? 14 : 8;
            ctx.fill();
            ctx.closePath();
            ctx.restore();
        }

        function drawLauncher() {
            ctx.save();
            ctx.fillStyle = '#333';
            ctx.fillRect(canvasWidth - 45, canvasHeight - launcher.height - 10, 35, launcher.height + 10);

            const currentHeight = launcher.height - launcher.pullDistance;
            const springBaseY = launcher.y + launcher.height;

            const plungerGrad = ctx.createLinearGradient(launcher.x - launcher.width / 2, 0, launcher.x + launcher.width / 2, 0);
            plungerGrad.addColorStop(0, '#3a3a48');
            plungerGrad.addColorStop(0.5, '#d8d8e0');
            plungerGrad.addColorStop(1, '#3a3a48');
            ctx.fillStyle = plungerGrad;
            ctx.fillRect(launcher.x - launcher.width / 2, springBaseY - currentHeight, launcher.width, currentHeight);

            ctx.fillStyle = '#eef';
            ctx.fillRect(launcher.x - launcher.width / 2 - 2, springBaseY - currentHeight - 5, launcher.width + 4, 5);

            ctx.strokeStyle = '#8fa0c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const startY = springBaseY - currentHeight;
            const endY = springBaseY;
            const visibleSpringLength = endY - startY;
            const waves = Math.max(2, Math.floor(8 * (visibleSpringLength / launcher.height)));

            ctx.moveTo(launcher.x, startY);
            for (let i = 0; i < waves; i++) {
                const waveX = launcher.x + (i % 2 === 0 ? 1 : -1) * launcher.width * 0.6;
                const waveY = startY + (i + 0.5) * (visibleSpringLength / waves);
                ctx.lineTo(waveX, waveY);
            }
            ctx.lineTo(launcher.x, endY);
            ctx.stroke();

            // TASK_001 & TASK_003: Power Meter com Green Zone para Skill Shot
            const meterX = canvasWidth - 60;
            const meterY = canvasHeight - launcher.height - 10;
            const meterWidth = 9;
            const meterHeight = launcher.height;

            ctx.fillStyle = 'rgba(8,10,18,0.9)';
            ctx.fillRect(meterX - 1, meterY - 1, meterWidth + 2, meterHeight + 2);

            const SEGMENTS = 10;
            const gap = 2;
            const segH = (meterHeight - gap * (SEGMENTS - 1)) / SEGMENTS;
            const powerRatio = Math.min(1, launcher.pullDistance / launcher.maxPull);
            const litCount = Math.round(powerRatio * SEGMENTS);

            for (let i = 0; i < SEGMENTS; i++) {
                const t = i / (SEGMENTS - 1);
                const isGreenZone = (t >= 0.75 && t <= 0.85);
                let ledColor = t < 0.5 ? '#39ff14' : (t < 0.8 ? '#ffd700' : '#ff2e97');
                if (isGreenZone) ledColor = '#00f0ff'; // Zona de precisão em Ciano Neon

                const segY = meterY + meterHeight - (i + 1) * segH - i * gap;
                if (i < litCount) {
                    ctx.fillStyle = ledColor;
                    ctx.shadowColor = ledColor;
                    ctx.shadowBlur = isGreenZone ? 12 : 8;
                } else {
                    ctx.fillStyle = isGreenZone ? 'rgba(0, 240, 255, 0.25)' : 'rgba(40,44,56,0.7)';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(meterX, segY, meterWidth, segH);
            }
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawFlipper(flipper) {
            ctx.save();
            ctx.translate(flipper.pivotX, flipper.pivotY);
            ctx.rotate(flipper.currentAngle);

            const isEmp = (bossState.activeEmpFlipper === (flipper.isLeft ? 'left' : 'right'));
            if (isEmp) {
                ctx.globalAlpha = 0.5;
            }

            const drawX = flipper.isLeft ? -flipper.width : 0;

            const gradient = ctx.createLinearGradient(drawX, -flipper.height / 2, drawX, flipper.height / 2);
            gradient.addColorStop(0, isEmp ? '#ffffaa' : '#ffffff');
            gradient.addColorStop(0.5, isEmp ? '#ddcc66' : '#d8d8e6');
            gradient.addColorStop(1, isEmp ? '#998833' : '#9aa0b8');
            ctx.fillStyle = gradient;
            ctx.strokeStyle = isEmp ? '#ffd700' : '#00f0ff';
            ctx.lineWidth = 1.5;

            ctx.shadowColor = isEmp ? 'rgba(255, 215, 0, 0.8)' : 'rgba(0, 240, 255, 0.6)';
            ctx.shadowBlur = 8;

            ctx.beginPath();
            ctx.rect(drawX, -flipper.height / 2, flipper.width, flipper.height);
            ctx.fill();
            ctx.stroke();
            ctx.closePath();

            ctx.shadowColor = 'transparent';
            ctx.fillStyle = isEmp ? '#ffaa00' : '#444';
            ctx.beginPath();
            ctx.arc(0, 0, flipper.height/1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBumpers() {
            bumpers.forEach(bumper => {
                const displayColor = bumper.color;
                let currentRadius = bumper.radius;
                let glowIntensity = 10;

                if (bumper.isHit) {
                    const factor = bumper.hitTimer / BUMPER_HIT_DURATION;
                    currentRadius = bumper.radius * (1 + factor * 0.25);
                    glowIntensity = 25 + factor * 15;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(bumper.x, bumper.y, currentRadius, 0, Math.PI * 2);

                const grad = ctx.createRadialGradient(
                    bumper.x - currentRadius * 0.25, bumper.y - currentRadius * 0.25, currentRadius * 0.05,
                    bumper.x, bumper.y, currentRadius
                );
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, displayColor);
                grad.addColorStop(1, shadeColor(displayColor, -55));

                ctx.fillStyle = grad;
                ctx.shadowColor = displayColor;
                ctx.shadowBlur = glowIntensity;
                ctx.fill();

                ctx.strokeStyle = bumper.isHit ? '#ffffff' : shadeColor(displayColor, 30);
                ctx.lineWidth = bumper.isHit ? 3 : 1.5;

        function drawBoss() {
            if (!bossState.active) return;
            const time = performance.now();

            ctx.save();

            // 1. Desenha Anel de Glitch Pulse se Ativo
            if (bossState.glitchRingActive) {
                ctx.beginPath();
                ctx.arc(bossState.x, bossState.y, bossState.glitchRingRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 0, 51, 0.7)';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 12;
                ctx.stroke();
            }

            // 2. Desenha Núcleo Central do Chefe (Pentágono Giratório Red Glowing)
            ctx.translate(bossState.x, bossState.y);
            ctx.rotate(bossState.angle);

            ctx.beginPath();
            const sides = 5;
            for (let i = 0; i < sides; i++) {
                const a = (i * Math.PI * 2) / sides;
                const px = bossState.radius * Math.cos(a);
                const py = bossState.radius * Math.sin(a);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            const allShieldsDown = bossState.shields.every(s => s.hp <= 0);
            ctx.fillStyle = allShieldsDown ? '#ff0033' : '#aa0022';
            ctx.shadowColor = '#ff0033';
            ctx.shadowBlur = 15 + Math.sin(time / 100) * 8;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();

            // 3. Desenha Barra de Vida do Chefe
            ctx.save();
            const barW = 80;
            const barH = 6;
            const barX = bossState.x - barW / 2;
            const barY = bossState.y - bossState.radius - 16;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ff0033';
            ctx.shadowColor = '#ff0033';
            ctx.shadowBlur = 8;
            ctx.fillRect(barX, barY, barW * Math.max(0, bossState.hp / bossState.maxHp), barH);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, barH);
            ctx.restore();

            // 4. Desenha Escudos Orbitais
            bossState.shields.forEach(shield => {
                if (shield.hp > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(shield.x, shield.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // 5. Desenha Firewall Barrier se ativa
            if (bossState.activeFirewall && bossState.activeFirewall.hp > 0) {
                const fw = bossState.activeFirewall;
                ctx.save();
                ctx.fillStyle = fw.hp === 2 ? '#ffaa00' : '#ff4400';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 12;
                ctx.fillRect(fw.x, fw.y, fw.width, fw.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(fw.x, fw.y, fw.width, fw.height);
                ctx.restore();

        function drawFloatingTexts() {

            floatingTexts.forEach(ft => {

        function drawWalls() {
            ctx.save();
            ctx.strokeStyle = '#1f6f8f';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(0, 240, 255, 0.7)';
            ctx.shadowBlur = 8;
            walls.forEach(wall => {
                ctx.beginPath();
                ctx.moveTo(wall.x1, wall.y1);
                ctx.lineTo(wall.x2, wall.y2);

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.beginPath();
                const lengthFactor = 2;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.vx * lengthFactor, p.y - p.vy * lengthFactor);
                ctx.strokeStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
                ctx.lineWidth = p.size;
                ctx.lineCap = 'round';
                ctx.shadowColor = `rgb(${p.r}, ${p.g}, ${p.b})`;
                ctx.shadowBlur = 6;
                ctx.stroke();
                ctx.closePath();
                ctx.restore();

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.alpha = Math.max(0, p.alpha - p.decay);
                p.size *= 0.97;
            });
            particles = particles.filter(p => p.alpha > 0 && p.size > 0.4);
        }

        function distSq(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return dx * dx + dy * dy;
        }

        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
            const lineLenSq = distSq(x1, y1, x2, y2);
            if (lineLenSq < 0.0001) return { x: x1, y: y1, t: 0 };

            const t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / lineLenSq;
            if (t < 0) return { x: x1, y: y1, t: 0 };
            if (t > 1) return { x: x2, y: y2, t: 1 };

            const closestX = x1 + t * (x2 - x1);
            const closestY = y1 + t * (y2 - y1);
            return { x: closestX, y: closestY, t: t };
        }

        function reflectVelocity(vx, vy, normalX, normalY) {
            const speed = Math.sqrt(vx*vx + vy*vy);
            const dot = vx * normalX + vy * normalY;
            const reflectVx = vx - 2 * dot * normalX;
            const reflectVy = vy - 2 * dot * normalY;
            const reflectSpeed = Math.sqrt(reflectVx*reflectVx + reflectVy*reflectVy);
            if (reflectSpeed === 0) return {x: 0, y: 0};
            return { x: (reflectVx / reflectSpeed) * speed, y: (reflectVy / reflectSpeed) * speed };
        }

        function checkWallCollisions() {
            const restitution = 0.5;

            walls.forEach(wall => {
                const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, wall.x1, wall.y1, wall.x2, wall.y2);
                const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                if (distanceSquared < ball.radius * ball.radius) {
                    const overlap = ball.radius - Math.sqrt(distanceSquared);
                    const dx = ball.x - closestX;
                    const dy = ball.y - closestY;
                    const collisionDist = Math.sqrt(dx*dx + dy*dy);
                    const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                    const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                    ball.x += moveX;
                    ball.y += moveY;

                    let wallDx = wall.x2 - wall.x1;
                    let wallDy = wall.y2 - wall.y1;
                    let normalX = -(wallDy);
                    let normalY = wallDx;
                    if ((ball.x - closestX) * normalX + (ball.y - closestY) * normalY < 0) {
                        normalX *= -1;
                        normalY *= -1;
                    }
                    const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                    if (normalLen > 0.01) {
                        normalX /= normalLen;
                        normalY /= normalLen;
                    } else {
                        normalX = moveX / overlap;
                        normalY = moveY / overlap;
                    }

                    const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                    ball.speedX = reflected.x * restitution;
                    ball.speedY = reflected.y * restitution;
                    createParticles(closestX, closestY, 3, '#AAAAAA');
                }
            });
        }

        function checkBumperCollisions() {
            bumpers.forEach((bumper, index) => {
                 if (bumper.hitTimer > 0) bumper.hitTimer--;
                 else bumper.isHit = false;

                 const distanceSquared = distSq(ball.x, ball.y, bumper.x, bumper.y);
                 const radiiSumSquared = (ball.radius + bumper.radius) * (ball.radius + bumper.radius);

                if (distanceSquared < radiiSumSquared) {
                    const distance = Math.sqrt(distanceSquared);
                    const overlap = (ball.radius + bumper.radius) - distance;

                    const normalX = (ball.x - bumper.x) / distance;
                    const normalY = (ball.y - bumper.y) / distance;

                    ball.x += normalX * overlap;
                    ball.y += normalY * overlap;

                    const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                    const currentSpeed = Math.sqrt(ball.speedX**2 + ball.speedY**2);
                    const minBounceSpeed = 5 * bounceBoost;
                    const bounceSpeed = Math.max(minBounceSpeed, currentSpeed * BUMPER_BOUNCE);
                    const speedFactor = bounceSpeed / Math.sqrt(reflected.x**2 + reflected.y**2);

                    ball.speedX = reflected.x * speedFactor;
                    ball.speedY = reflected.y * speedFactor;

                    if (!bumper.isHit) {
                         addScore(bumper.points);
                         updateScoreDisplay();
                         bumper.isHit = true;
                         bumper.hitTimer = BUMPER_HIT_DURATION;
                         soundSynth.playBumperHit(bumper.freq);
                         createParticles(ball.x, ball.y, 15, bumper.hitColor);
                         registerBumperHitForMissions(index);
                     }
                }
            });
        }

        function checkMultiplierZoneCollisions(dt) {
             multiplierZones.forEach((zone, index) => {
                 const inside = ball.x + ball.radius > zone.x && ball.x - ball.radius < zone.x + zone.width &&
                                ball.y + ball.radius > zone.y && ball.y - ball.radius < zone.y + zone.height;
                 if (inside) {
                      if (zone.multiplier > currentMultiplier) {
                           currentMultiplier = zone.multiplier;
                           updateScoreDisplay();
                      }
                      if (index === 2 || index === 3) {
                           overclockZoneTime += (dt || 0);
                           if (overclockZoneTime >= 3.0 && overclockTimer <= 0) {
                                overclockTimer = 20; globalScoreMultiplier = 2;
                                overclockZoneTime = 0;
                                createParticles(ball.x, ball.y, 18, '#ff2e97');
                           }
                      }
                      if (index === 3 && activePhysicsMode !== 'low_gravity') {
                           setPhysicsMode('low_gravity', 12);
                           createParticles(ball.x, ball.y, 16, '#00f0ff');
                      }
                 }
            });
        }

        function checkFlipperCollisions() {
            checkSingleFlipperCollision(leftFlipper);
            checkSingleFlipperCollision(rightFlipper);
        }

        function checkSingleFlipperCollision(flipper) {
            const ballRadiusSq = ball.radius * ball.radius;
            const angle = flipper.currentAngle;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const halfHeight = flipper.height / 2;
            const drawX = flipper.isLeft ? -flipper.width : 0;

            const corners = [
                { x: drawX, y: -halfHeight },
                { x: drawX + flipper.width, y: -halfHeight },
                { x: drawX + flipper.width, y: halfHeight },
                { x: drawX, y: halfHeight }
            ].map(p => ({
                x: flipper.pivotX + p.x * cos - p.y * sin,
                y: flipper.pivotY + p.x * sin + p.y * cos
            }));

            for (let i = 0; i < 4; i++) {
                const p1 = corners[i];
                const p2 = corners[(i + 1) % 4];
                const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, p1.x, p1.y, p2.x, p2.y);
                const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                if (distanceSquared < ballRadiusSq) {
                     const overlap = ball.radius - Math.sqrt(distanceSquared);
                     const dx = ball.x - closestX;
                     const dy = ball.y - closestY;
                     const collisionDist = Math.sqrt(dx*dx + dy*dy);
                     const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                     const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                     ball.x += moveX * 1.1;
                     ball.y += moveY * 1.1;

                     let edgeDx = p2.x - p1.x;
                     let edgeDy = p2.y - p1.y;
                     let normalX = -edgeDy;
                     let normalY = edgeDx;
                     if ((closestX - flipper.pivotX) * normalX + (closestY - flipper.pivotY) * normalY < 0) {
                         normalX *= -1;
                         normalY *= -1;
                     }
                     const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                      if (normalLen > 0.01) {
                         normalX /= normalLen;
                         normalY /= normalLen;
                      }

                     const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                      let impulseX = 0;
                      let impulseY = -FLIPPER_STRENGTH * bounceBoost;
                      impulseX += (flipper.isLeft ? FLIPPER_SIDE_STRENGTH : -FLIPPER_SIDE_STRENGTH) * bounceBoost;
                      if (flipper.angularVelocity !== 0) {
                           const r = Math.hypot(closestX - flipper.pivotX, closestY - flipper.pivotY);
                           const rFactor = Math.min(1.4, r / flipper.width);
                           impulseY -= Math.abs(flipper.angularVelocity) * 40 * rFactor * bounceBoost;
                       }

                     ball.speedX = reflected.x * 0.5 + impulseX;
                     ball.speedY = reflected.y * 0.5 + impulseY;

                     addScore(1);
                     updateScoreDisplay();
                     createParticles(closestX, closestY, 8, '#FFFFFF');
                     return;
                 }
             }
        }

        function updateFlippers(deltaTime) {
             // Flipper esquerdo
             if (bossState.activeEmpFlipper === 'left') {
                 leftFlipper.isActivating = false;
             }
             const leftTargetAngle = leftFlipper.isActivating ? leftFlipper.activeAngle : leftFlipper.restAngle;
             const leftAngleDiff = leftTargetAngle - leftFlipper.currentAngle;
             leftFlipper.angularVelocity = Math.sign(leftAngleDiff) * Math.min(Math.abs(leftAngleDiff), FLIPPER_ROTATE_SPEED);
             if (Math.abs(leftAngleDiff) > 0.01) {
                  leftFlipper.currentAngle += leftFlipper.angularVelocity;
              } else {
                  leftFlipper.currentAngle = leftTargetAngle;
                  leftFlipper.angularVelocity = 0;
              }
             leftFlipper.isUp = leftFlipper.currentAngle === leftFlipper.activeAngle;

             // Flipper direito
             if (bossState.activeEmpFlipper === 'right') {
                 rightFlipper.isActivating = false;
             }
             const rightTargetAngle = rightFlipper.isActivating ? rightFlipper.activeAngle : rightFlipper.restAngle;
             const rightAngleDiff = rightTargetAngle - rightFlipper.currentAngle;
             rightFlipper.angularVelocity = Math.sign(rightAngleDiff) * Math.min(Math.abs(rightAngleDiff), FLIPPER_ROTATE_SPEED);
             if (Math.abs(rightAngleDiff) > 0.01) {
                 rightFlipper.currentAngle += rightFlipper.angularVelocity;
             } else {
                 rightFlipper.currentAngle = rightTargetAngle;
                 rightFlipper.angularVelocity = 0;
             }
             rightFlipper.isUp = rightFlipper.currentAngle === rightFlipper.activeAngle;
        }

        function update(timestamp) {
            if (!gameActive) {
                soundSynth.updateAmbient(0, false);
                return;
            }

            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            const launchReady = activeBalls.find(b => !b.isLaunched);
            if (launcher.charging && launchReady) {
                launcher.pullDistance += 90 * deltaTime;
                if (launcher.pullDistance > launcher.maxPull) launcher.pullDistance = launcher.maxPull;
            }

            updateFlippers(deltaTime);
            updatePhysicsMode(deltaTime);
            updateMissions(deltaTime);
            updateBoss(deltaTime);
            checkBossCollisions();
            updateFloatingTexts(deltaTime);

            if (bossState.goldSkinTimer > 0) bossState.goldSkinTimer -= deltaTime;
            if (frameFlashTimer > 0) frameFlashTimer -= deltaTime;

            let maxBallSpeed = 0;

            for (let i = activeBalls.length - 1; i >= 0; i--) {
                ball = activeBalls[i];
                if (ball.isLaunched) {
                    ball.speedY += currentGravity;
                    ball.x += ball.speedX;
                    ball.y += ball.speedY;
                    ball.speedX *= currentFriction;
                    ball.speedY *= currentFriction;

                    const curSpeed = Math.hypot(ball.speedX, ball.speedY);
                    if (curSpeed > maxBallSpeed) maxBallSpeed = curSpeed;

                    ball.trail.push({ x: ball.x, y: ball.y });
                    if (ball.trail.length > ball.maxTrailLength) ball.trail.shift();

                    checkBallStuckOrOutOfBounds(deltaTime);
                    checkWallCollisions();
                    checkBumperCollisions();
                    checkMultiplierZoneCollisions(deltaTime);
                    checkFlipperCollisions();
                    checkFirewallTargets();
                    checkSkillShotSensor(ball);
                }
                handleDrainCheck(ball, i);
            }

            checkBallToBallCollisions();
            soundSynth.updateAmbient(maxBallSpeed, true);

            bumpers.forEach(bumper => {
               if (bumper.hitTimer > 0) bumper.hitTimer -= 1;
                else bumper.isHit = false;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawTableGrid();

        function drawTableGrid() {
            ctx.save();
            ctx.lineWidth = 1;
            let gridColor = 'rgba(255, 255, 255, 0.03)';
            const time = performance.now();
            if (activePhysicsMode === 'low_gravity') {
                const pulse = 0.05 + Math.sin(time / 200) * 0.03;
                gridColor = `rgba(0, 240, 255, ${pulse})`;
            } else if (activePhysicsMode === 'overdrive') {
                const pulse = 0.08 + Math.sin(time / 80) * 0.05;
                gridColor = `rgba(255, 0, 127, ${pulse})`;
            }
            ctx.strokeStyle = gridColor;
            const spacing = 40;
            for (let x = 0; x < canvasWidth; x += spacing) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
            for (let y = 0; y < canvasHeight; y += spacing) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }
            ctx.restore();
        }

        function drawFirewallTargets() {
            const time = performance.now();
            firewallTargets.forEach((t, i) => {
                ctx.save();
                const isNext = (i === firewallProgress);
                const done = (i < firewallProgress);
                ctx.fillStyle = done ? 'rgba(80,80,90,0.5)' : t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = isNext ? (10 + Math.sin(time / 120) * 8) : (done ? 0 : 4);
                ctx.fillRect(t.x, t.y, t.width, t.height);
                if (isNext) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(t.x, t.y, t.width, t.height); }
                ctx.restore();
            });
        }

        function drawMissionsHUD() {
            if (!gameStarted || !gameActive) return;
            const x = 12, y = 12, w = 168, h = 46;
            ctx.save();
            ctx.fillStyle = 'rgba(18, 19, 32, 0.6)';
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 6;
            ctx.font = '700 11px "Orbitron", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(missionsState.label, x + 10, y + 18);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cdd6f4';
            ctx.font = '10px "Orbitron", sans-serif';
            ctx.fillText(missionsState.detail, x + 10, y + 32);

            const barX = x + 10, barY = y + 37, barW = w - 20, barH = 4;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 6;
            ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, missionsState.barRatio)), barH);
            ctx.restore();
        }

        function drawFrameFlash() {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 30, 60, ${Math.min(0.8, frameFlashTimer * 3)})`;
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, canvasWidth - 6, canvasHeight - 6);
            ctx.restore();
        }

        function createParticles(x, y, count, color) {
             const rgb = hexToRgb(color) || { r: 255, g: 0, b: 128 };
             for (let i = 0; i < count; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const speed = 1.5 + Math.random() * 4.5;
                 const life = 0.5 + Math.random() * 0.6;
                 particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.8,
                    r: rgb.r,
                    g: rgb.g,
                    b: rgb.b,
                    alpha: 1,
                    decay: 1 / (life * 60),
                    size: 1.5 + Math.random() * 2
                });
            }
        }

        function hexToRgb(hex) {
             if (!hex) return null;
             const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
             return result ? {
                 r: parseInt(result[1], 16),
                 g: parseInt(result[2], 16),
                 b: parseInt(result[3], 16)
             } : null;
        }

        function shadeColor(hexColor, percent) {
            if (!hexColor) return '#000000';
             let rgb = hexToRgb(hexColor);
             if (!rgb) return '#000000';
             let { r, g, b } = rgb;
            const amount = Math.round(2.55 * percent);
             r = Math.min(255, Math.max(0, r + amount));
             g = Math.min(255, Math.max(0, g + amount));
             b = Math.min(255, Math.max(0, b + amount));
            const rr = r.toString(16).padStart(2, '0');
            const gg = g.toString(16).padStart(2, '0');
            const bb = b.toString(16).padStart(2, '0');
            return `#${rr}${gg}${bb}`;
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }

        var lastTimestamp = 0;
        updateScoreDisplay();
        requestAnimationFrame(gameLoop);
    </script>
</body>
