        /* === TASK_001: Estética Retro-Futurista Synthwave / Cyberpunk === */
        body {
            background-color: #0d0e15;
            background-image: radial-gradient(circle at 50% 0%, #1a1030 0%, #0d0e15 55%, #05060a 100%);

        #gameCanvas {

        #gameInfo {
            margin-top: 20px;

<body>
    <!-- Google Tag Manager (noscript) -->

    <h1>PIMBAL</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="gameInfo">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Multiplier: <span id="multiplier">1x</span></div>
    </div>

    <script>
        // Game Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWidth = canvas.width;
        const canvasHeight = canvas.height;

        // Game variables
        let score = 0;
        let lives = 3;
        let currentMultiplier = 1;
        let gameActive = true;
        let gameStarted = false;
        let particles = []; // For visual effects

        // --- Variáveis de Segurança da Bola ---
        let ballStuckTimer = 0; // Timer para bola parada
        const MAX_STUCK_TIME_SECONDS = 6; // Tempo máximo parada (em segundos)
        const STUCK_VELOCITY_THRESHOLD = 0.15; // Velocidade abaixo da qual é considerada parada

        // --- Constants ---
        const BALL_RADIUS = 8;
        const GRAVITY = 0.2;
        const FRICTION = 0.995; // Air resistance / rolling friction
        const BUMPER_BOUNCE = 1.05; // How much speed increases on bumper hit
        const FLIPPER_STRENGTH = 10; // Base upward speed boost from flipper
        const FLIPPER_SIDE_STRENGTH = 4; // Sideways boost

        const LEFT_FLIPPER_REST_ANGLE = Math.PI / 6; // Point slightly up when resting
        const LEFT_FLIPPER_ACTIVE_ANGLE = -Math.PI / 4; // Angle when flipped up
        const RIGHT_FLIPPER_REST_ANGLE = Math.PI - Math.PI / 6; // Mirror rest angle
        const RIGHT_FLIPPER_ACTIVE_ANGLE = Math.PI + Math.PI / 4; // Mirror active angle

        // Ball properties
        // TASK_002: fábrica de bolas (cada uma carrega o próprio rastro e stuckTimer)
        function createBall(x, y, launched = false) {
            return {
                xInitial: canvasWidth - 24,
                yInitial: canvasHeight - 89,
                x: x, y: y,
                radius: BALL_RADIUS,
                speedX: 0, speedY: 0,
                isLaunched: launched,
                trail: [],
                maxTrailLength: 12,
                stuckTimer: 0 // TASK_002: stuck individual por bola (decisão do TL)
            };
        }
        let ball = createBall(canvasWidth - 24, canvasHeight - 89, false); // bola "corrente" (ponteiro)

        // === TASK_002: Multibola, gravidade mutável e missões ciber-sintéticas ===
        let activeBalls = [ball];
        let currentGravity = GRAVITY;
        let currentFriction = FRICTION;
        let activePhysicsMode = 'normal'; // 'normal' | 'low_gravity' | 'overdrive'
        let physicsModeTimer = 0;
        let bounceBoost = 1;              // amplifica rebotes no overdrive
        let globalScoreMultiplier = 1;   // 2x durante o OVERCLOCK
        let frameFlashTimer = 0;         // flash vermelho da moldura ao perder uma bola no multiball

        // Estado das missões
        const missionsState = { label: '', detail: '', barRatio: 0, accent: '#00f0ff' };
        let hackGridHits = new Set();    // índices 0,1,2 atingidos
        let hackGridTimer = 0;           // janela de 15s
        let hackGridDone = false;
        let overclockZoneTime = 0;       // tempo cumulativo em zona central
        let overclockTimer = 0;          // duração do bônus 2x
        let lowerBumperStreak = 0;       // hits sucessivos nos bumpers inferiores
        let firewallProgress = 0;        // 0..3 alvos em sequência

        // Alvos físicos da missão FIREWALL CRACK (laterais inferiores)
        const firewallTargets = [
            { x: 14,               y: 360, width: 22, height: 12, color: '#ff2e97' },
            { x: canvasWidth - 60, y: 400, width: 22, height: 12, color: '#00f0ff' },
            { x: 14,               y: 440, width: 22, height: 12, color: '#39ff14' }
        ];

        // Launcher properties
        const launcher = {
            x: canvasWidth - 25, // Positioned in the launcher lane
            y: canvasHeight - 80, // Bottom position
            width: 15,
            height: 70, // Total visual height
            pullDistance: 0, // How far it's pulled back
            maxPull: 60, // Max pixels it can be pulled
            springStiffness: 0.4, // Power based on pull distance
            charging: false
        };

        // Flipper properties - Revised for Pivot Rotation
        const flipperHeight = 10;
        const flipperWidth = 70; // Adjusted size

        const leftFlipper = {
            pivotX: 110, // Pivot X (closer to center)
            pivotY: canvasHeight - 60, // Pivot Y
            width: flipperWidth,
            height: flipperHeight,
            restAngle: LEFT_FLIPPER_REST_ANGLE,
            activeAngle: LEFT_FLIPPER_ACTIVE_ANGLE,
            currentAngle: LEFT_FLIPPER_REST_ANGLE,
            angularVelocity: 0, // For smooth animation
            isActivating: false, // Is the key pressed?
            isUp: false, // Is it fully up? (Used for state checking)
            color: '#E0E0E0',
            isLeft: false
        };

        const rightFlipper = {
            pivotX: canvasWidth - 110, // Pivot X (mirror)
            pivotY: canvasHeight - 60, // Pivot Y
            width: flipperWidth,
            height: flipperHeight,
            restAngle: RIGHT_FLIPPER_REST_ANGLE,
            activeAngle: RIGHT_FLIPPER_ACTIVE_ANGLE,
            currentAngle: RIGHT_FLIPPER_REST_ANGLE,
            angularVelocity: 0,
            isActivating: false,
            isUp: false,
            color: '#E0E0E0',
            isLeft: false
        };
        const FLIPPER_ROTATE_SPEED = 0.5; // Radians per frame step (adjust for speed)

        // Obstacles - Bumpers
        const bumpers = [
            // TASK_001: paleta neon synthwave (pink / gold / cyan / green)
            { x: 100, y: 150, radius: 18, points: 10, color: '#ff2e97', hitColor: '#ffffff', isHit: false, hitTimer: 0 },
            { x: 200, y: 200, radius: 22, points: 15, color: '#ffcc00', hitColor: '#ffffff', isHit: false, hitTimer: 0 },
            { x: 300, y: 150, radius: 18, points: 10, color: '#ff2e97', hitColor: '#ffffff', isHit: false, hitTimer: 0 },
            { x: 150, y: 300, radius: 15, points: 5, color: '#39ff14', hitColor: '#ffffff', isHit: false, hitTimer: 0 },
            { x: 250, y: 300, radius: 15, points: 5, color: '#00f0ff', hitColor: '#ffffff', isHit: false, hitTimer: 0 }
        ];
        const BUMPER_HIT_DURATION = 8; // Frames the hit color shows

        // Multiplier zones
        const multiplierZones = [
            // TASK_001: barreiras holográficas neon
            { x: 50, y: 100, width: 60, height: 60, multiplier: 2, color: 'rgba(255, 46, 151, 0.2)', borderColor: 'rgba(255, 46, 151, 0.8)' },
            { x: 290, y: 100, width: 60, height: 60, multiplier: 2, color: 'rgba(255, 46, 151, 0.2)', borderColor: 'rgba(255, 46, 151, 0.8)' },
            { x: 170, y: 100, width: 60, height: 60, multiplier: 3, color: 'rgba(57, 255, 20, 0.2)', borderColor: 'rgba(57, 255, 20, 0.8)' },
            { x: 170, y: 250, width: 60, height: 60, multiplier: 5, color: 'rgba(0, 240, 255, 0.2)', borderColor: 'rgba(0, 240, 255, 0.8)' }
        ];

        // Walls and boundaries - Defined as line segments for better collision
        const walls = [
            // Outer Walls
            { x1: 10, y1: 10, x2: 10, y2: canvasHeight - 80 }, // Left straight
            { x1: canvasWidth - 10, y1: 10, x2: canvasWidth - 10, y2: canvasHeight }, // Right straight (full height for launcher lane)
            { x1: 350, y1: 0, x2: canvasWidth - 10, y2: 50 }, // Top diagonal straight
            { x1: 10, y1: 0, x2: canvasWidth - 10, y2: 0 }, // Top straight

            // Bottom Diagonal Walls
            { x1: 10, y1: canvasHeight - 80, x2: leftFlipper.pivotX - flipperWidth/3, y2: leftFlipper.pivotY + 10 }, // Bottom Left Diagonal
            { x1: canvasWidth - 10, y1: canvasHeight - 80, x2: rightFlipper.pivotX + flipperWidth/3, y2: rightFlipper.pivotY + 10 }, // Bottom Right Diagonal (adjusted start y)

            // Walls around flippers leading to drain (adjust points carefully)
            { x1: leftFlipper.pivotX + flipperWidth/1.5, y1: leftFlipper.pivotY+15, x2: canvasWidth/2 - 10, y2: canvasHeight}, // Left side of drain
            { x1: rightFlipper.pivotX - flipperWidth/1.5, y1: rightFlipper.pivotY+15, x2: canvasWidth/2 + 10, y2: canvasHeight}, // Right side of drain

            // Launcher lane wall
            { x1: canvasWidth - 45, y1: 100, x2: canvasWidth - 45, y2: canvasHeight - launcher.height - 10 } // Inner wall of launcher lane
        ];

        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                launcher.charging = true;
            }
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'z') {
                leftFlipper.isActivating = true;
            }
            if (e.key === 'ArrowRight' || e.key === '/') { // Forward slash often used
                rightFlipper.isActivating = true;
            }
            if (e.key === 'Enter' && !gameActive) {
                resetGame();
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                if (launcher.charging && activeBalls.some(b => !b.isLaunched)) {
                    launchBall();
                }
                launcher.charging = false;
                launcher.pullDistance = 0; // Reset pull on release
            }
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'z') {
                leftFlipper.isActivating = false;
            }
            if (e.key === 'ArrowRight' || e.key === '/') {
                rightFlipper.isActivating = false;
            }
        });

        // Game functions
        function resetGame() {
            score = 0;
            lives = 3;
            currentMultiplier = 1;
            gameActive = true;
            gameStarted = false; // Needs to be started again by launching
            particles = [];

            resetBallToLauncher(); // TASK_002: nova bola única na lane
            // Reset de missões e modos de gravidade
            setPhysicsMode('normal', 0);
            hackGridHits.clear(); hackGridTimer = 0; hackGridDone = false;
            overclockZoneTime = 0; overclockTimer = 0; globalScoreMultiplier = 1;
            lowerBumperStreak = 0; firewallProgress = 0; frameFlashTimer = 0;

            leftFlipper.currentAngle = leftFlipper.restAngle;
            rightFlipper.currentAngle = rightFlipper.restAngle;
            leftFlipper.isActivating = false;
            rightFlipper.isActivating = false;

            updateScoreDisplay();
        }

         function resetBallPosition() {
            console.log("Resetting ball position (stuck or out of bounds)");
            ball.x = ball.xInitial; // Posição inicial no lançador
            ball.y = ball.yInitial;
            ball.speedX = 0;
            ball.speedY = 0;
            ball.isLaunched = false; // Precisa ser lançada novamente
            ball.trail = []; // TASK_001: limpa o rastro
            launcher.pullDistance = 0; // Reseta o lançador também
            ball.stuckTimer = 0; // Reseta o timer de parada desta bola
            // NÃO mexe em lives ou currentMultiplier
             createParticles(ball.x, ball.y, 5, '#8888FF'); // Efeito visual de reset
        }

        function checkBallStuckOrOutOfBounds(deltaTime) {
            if (!ball.isLaunched || !gameActive) {
                ball.stuckTimer = 0;
                return;
            }

            // --- Verificar se está parada (timer individual por bola) ---
            const currentSpeedSq = ball.speedX * ball.speedX + ball.speedY * ball.speedY;
            if (currentSpeedSq < STUCK_VELOCITY_THRESHOLD * STUCK_VELOCITY_THRESHOLD) {
                ball.stuckTimer += deltaTime;
            } else {
                ball.stuckTimer = 0;
            }

            if (ball.stuckTimer > MAX_STUCK_TIME_SECONDS) {
                // TASK_002: no multibola, teletransporta SÓ esta bola para o topo (decisão do TL)
                if (activeBalls.length > 1) {
                    createParticles(ball.x, ball.y, 10, '#00f0ff');
                    ball.x = 200; ball.y = 50;
                    ball.speedX = (Math.random() - 0.5) * 2; ball.speedY = 2;
                    ball.trail = [];
                    ball.stuckTimer = 0;
                    createParticles(ball.x, ball.y, 10, '#00f0ff');
                } else {
                    resetBallPosition();
                }
                return;
            }

            // --- Verificar se está fora dos limites seguros (antes de cair no dreno) ---
            // Define limites seguros (um pouco dentro das paredes e acima da área de perigo dos flippers)
            const safeMinX = 10 + ball.radius;
            const safeMaxX = canvasWidth - 10 - ball.radius; // Ajustar se a lane do lançador for diferente
            const safeMinY = 10 + ball.radius;
            const safeMaxY = canvasHeight - 20; // Acima da área onde o dreno normal ocorre

            if (ball.x < safeMinX || ball.x > safeMaxX || ball.y < safeMinY)
            {
                // Considera fora de bounds APENAS se NÃO estiver na área do lançador inicial
                // E se não estiver caindo na área do dreno (o check de dreno normal cuidará disso)
                const isInLauncherArea = ball.x > canvasWidth - 45 - ball.radius && ball.y > canvasHeight - launcher.height - 10 - ball.radius;

                if (!isInLauncherArea && ball.y < safeMaxY) { // Só reseta se estiver acima da área de perigo
                     console.warn(`Ball out of safe bounds (${ball.x.toFixed(0)}, ${ball.y.toFixed(0)}), resetting.`);
                     resetBallPosition();
                     return;
                 }
            }
            // Nota: Não precisamos checar ball.y > safeMaxY aqui,
            // pois a lógica de perda de vida já cuida da queda total.
        }

        function resetBall() {
            ball.x = ball.xInitial; // Posição inicial no lançador
            ball.y = ball.yInitial;
            ball.speedX = 0;
            ball.speedY = 0;
            ball.isLaunched = false;
            ball.trail = []; // TASK_001: limpa o rastro
            launcher.pullDistance = 0;
            currentMultiplier = 1; // Reset multiplier on losing a ball
        }

        function launchBall() {
            // TASK_002: lança a bola que estiver na lane do lançador (não lançada)
            const b = activeBalls.find(x => !x.isLaunched);
            if (b && launcher.pullDistance > 5) { // Require some pull
                b.isLaunched = true;
                b.speedY = -(launcher.pullDistance * launcher.springStiffness * 1.4);
                b.speedX = -1 - Math.random(); // Slight random angle leftwards
                launcher.pullDistance = 0;
                if (!gameStarted) gameStarted = true;
                createParticles(b.x, b.y + 10, 10, '#FFFF88'); // Launch sparks
            }
            launcher.charging = false;
        }

        // === TASK_002: pontuação com multiplicador de sobrevivência (× nº de bolas) + overclock ===
        function addScore(base) {
            score += Math.round(base * currentMultiplier * activeBalls.length * globalScoreMultiplier);
        }

        // Dreno por bola — só perde vida quando a ÚLTIMA bola cai
        function handleDrainCheck(b, index) {
            if (b.y > canvasHeight + b.radius * 2) {
                activeBalls.splice(index, 1);
                if (activeBalls.length === 0) {
                    if (lives > 1) {
                        lives--;
                        resetBallToLauncher();
                    } else {
                        lives = 0;
                        gameActive = false;
                    }
                    updateScoreDisplay();
                } else {
                    frameFlashTimer = 0.25; // ainda há bolas: flash vermelho de aviso
                }
            }
        }

        function resetBallToLauncher() {
            const nb = createBall(canvasWidth - 24, canvasHeight - 89, false);
            activeBalls = [nb];
            ball = nb;
            launcher.pullDistance = 0;
            currentMultiplier = 1;
        }

        // Spawna 2 bolas adicionais (Multiball) a partir de portais neon superiores
        function spawnMultiball() {
            const spawns = [{ x: 150, y: 60 }, { x: 250, y: 60 }];
            spawns.forEach(s => {
                const nb = createBall(s.x, s.y, true);
                nb.speedX = (Math.random() - 0.5) * 4;
                nb.speedY = 2 + Math.random() * 2;
                activeBalls.push(nb);
                createParticles(s.x, s.y, 14, '#00f0ff'); // faíscas elétricas do portal
            });
        }

        // Colisão elástica 2D bola-bola (massas iguais) — troca de velocidades normais
        function checkBallToBallCollisions() {
            for (let i = 0; i < activeBalls.length; i++) {
                for (let j = i + 1; j < activeBalls.length; j++) {
                    const b1 = activeBalls[i], b2 = activeBalls[j];
                    const dx = b2.x - b1.x, dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = b1.radius + b2.radius;
                    if (dist < minDist && dist > 0) {
                        const overlap = minDist - dist;
                        const nX = dx / dist, nY = dy / dist;
                        // resolve penetração igualmente
                        b1.x -= nX * (overlap / 2); b1.y -= nY * (overlap / 2);
                        b2.x += nX * (overlap / 2); b2.y += nY * (overlap / 2);
                        // tangente
                        const tX = -nY, tY = nX;
                        const v1n = b1.speedX * nX + b1.speedY * nY;
                        const v1t = b1.speedX * tX + b1.speedY * tY;
                        const v2n = b2.speedX * nX + b2.speedY * nY;
                        const v2t = b2.speedX * tX + b2.speedY * tY;
                        // troca das componentes normais (massas iguais)
                        b1.speedX = v2n * nX + v1t * tX; b1.speedY = v2n * nY + v1t * tY;
                        b2.speedX = v1n * nX + v2t * tX; b2.speedY = v1n * nY + v2t * tY;
                        createParticles(b1.x + nX * b1.radius, b1.y + nY * b1.radius, 8, '#ffffff');
                    }
                }
            }
        }

        // === TASK_002: modos de gravidade mutáveis ===
        function setPhysicsMode(mode, duration) {
            activePhysicsMode = mode;
            physicsModeTimer = duration;
            if (mode === 'low_gravity') {
                currentGravity = GRAVITY * 0.5; currentFriction = 1.0; bounceBoost = 1;
            } else if (mode === 'overdrive') {
                currentGravity = GRAVITY * 1.35; currentFriction = FRICTION; bounceBoost = 1.4;
            } else {
                currentGravity = GRAVITY; currentFriction = FRICTION; bounceBoost = 1;
            }
        }

        function updatePhysicsMode(dt) {
            if (physicsModeTimer > 0) {
                physicsModeTimer -= dt;
                if (physicsModeTimer <= 0) setPhysicsMode('normal', 0);
            }
        }

        // === TASK_002: temporizadores e HUD das missões ===
        function updateMissions(dt) {
            // HACK THE GRID — janela de 15s
            if (hackGridTimer > 0 && !hackGridDone) {
                hackGridTimer -= dt;
                if (hackGridTimer <= 0) { hackGridHits.clear(); }
            }
            // OVERCLOCK — bônus 2x temporário
            if (overclockTimer > 0) {
                overclockTimer -= dt;
                if (overclockTimer <= 0) { globalScoreMultiplier = 1; }
            }

            // Descritor de HUD: prioriza missão em andamento
            if (overclockTimer > 0) {
                missionsState.label = 'SYSTEM OVERCLOCK · 2x';
                missionsState.detail = `TIME LEFT: ${overclockTimer.toFixed(1)}s`;
                missionsState.barRatio = overclockTimer / 20;
                missionsState.accent = '#ff2e97';
            } else if (hackGridTimer > 0 && !hackGridDone) {
                missionsState.label = 'HACK THE GRID';
                missionsState.detail = `BUMPERS: ${hackGridHits.size}/3 · ${hackGridTimer.toFixed(1)}s`;
                missionsState.barRatio = hackGridTimer / 15;
                missionsState.accent = '#ff2e97';
            } else {
                missionsState.label = 'FIREWALL CRACK';
                missionsState.detail = `TARGETS: ${firewallProgress}/3`;
                missionsState.barRatio = firewallProgress / 3;
                missionsState.accent = '#39ff14';
            }
        }

        // Registra hit de bumper nas missões (chamado de checkBumperCollisions)
        function registerBumperHitForMissions(index) {
            // HACK THE GRID: bumpers superiores 0,1,2
            if (index <= 2) {
                if (hackGridHits.size === 0) { hackGridTimer = 15; hackGridDone = false; }
                if (hackGridTimer > 0) {
                    hackGridHits.add(index);

        function drawLauncher() {
            ctx.save();
            // Base plate for launcher
             ctx.fillStyle = '#333';
             ctx.fillRect(canvasWidth - 45, canvasHeight - launcher.height - 10, 35, launcher.height + 10);


            // Spring simulation based on pullDistance
            const currentHeight = launcher.height - launcher.pullDistance;
            const springBaseY = launcher.y + launcher.height; // Bottom of spring path

            // Draw the visible plunger part (cromado degradê)
            const plungerGrad = ctx.createLinearGradient(launcher.x - launcher.width / 2, 0, launcher.x + launcher.width / 2, 0);
            plungerGrad.addColorStop(0, '#3a3a48');
            plungerGrad.addColorStop(0.5, '#d8d8e0');
            plungerGrad.addColorStop(1, '#3a3a48');
            ctx.fillStyle = plungerGrad;
            ctx.fillRect(launcher.x - launcher.width / 2, springBaseY - currentHeight, launcher.width, currentHeight);
            // Draw plunger top cap
            ctx.fillStyle = '#eef';
            ctx.fillRect(launcher.x - launcher.width / 2 - 2, springBaseY - currentHeight - 5, launcher.width + 4, 5);


            // Draw Spring visualization (compressed part) — cromo neon
            ctx.strokeStyle = '#8fa0c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const startY = springBaseY - currentHeight; // Top of visible plunger
            const endY = springBaseY; // Bottom fixed point
            const visibleSpringLength = endY - startY;
            const waves = Math.max(2, Math.floor(8 * (visibleSpringLength / launcher.height))); // Fewer waves when compressed

            ctx.moveTo(launcher.x, startY); // Start at plunger top center
            for (let i = 0; i < waves; i++) {
                // Zigzag pattern
                const waveX = launcher.x + (i % 2 === 0 ? 1 : -1) * launcher.width * 0.6;
                const waveY = startY + (i + 0.5) * (visibleSpringLength / waves);
                ctx.lineTo(waveX, waveY);
            }
            ctx.lineTo(launcher.x, endY); // End at base center
            ctx.stroke();


            // TASK_001: Power Meter como equalizador de LEDs segmentados sci-fi
            const meterX = canvasWidth - 60;
            const meterY = canvasHeight - launcher.height - 10;
            const meterWidth = 9;
            const meterHeight = launcher.height;
            // moldura
            ctx.fillStyle = 'rgba(8,10,18,0.9)';
            ctx.fillRect(meterX - 1, meterY - 1, meterWidth + 2, meterHeight + 2);

            const SEGMENTS = 10;
            const gap = 2;
            const segH = (meterHeight - gap * (SEGMENTS - 1)) / SEGMENTS;
            const powerRatio = Math.min(1, launcher.pullDistance / launcher.maxPull);
            const litCount = Math.round(powerRatio * SEGMENTS);
            for (let i = 0; i < SEGMENTS; i++) {
                const t = i / (SEGMENTS - 1); // 0 base -> 1 topo
                // cor LED: verde -> amarelo -> vermelho conforme sobe
                const ledColor = t < 0.5 ? '#39ff14' : (t < 0.8 ? '#ffd700' : '#ff2e97');
                const segY = meterY + meterHeight - (i + 1) * segH - i * gap;
                if (i < litCount) {
                    ctx.fillStyle = ledColor;
                    ctx.shadowColor = ledColor;
                    ctx.shadowBlur = 8;
                } else {
                    ctx.fillStyle = 'rgba(40,44,56,0.7)';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(meterX, segY, meterWidth, segH);
            }
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawParticles() {

        // --- Collision Detection ---

        // Helper: Calculate distance between two points squared (faster than sqrt)
        function distSq(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return dx * dx + dy * dy;
        }

        // Helper: Closest point on a line segment to a point
        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
            const lineLenSq = distSq(x1, y1, x2, y2);
            if (lineLenSq < 0.0001) return { x: x1, y: y1, t: 0 }; // Segment is a point

            // Project point onto the line containing the segment
            const t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / lineLenSq;

            if (t < 0) return { x: x1, y: y1, t: 0 }; // Closest point is p1
            if (t > 1) return { x: x2, y: y2, t: 1 }; // Closest point is p2

            // Closest point is within the segment
            const closestX = x1 + t * (x2 - x1);
            const closestY = y1 + t * (y2 - y1);
            return { x: closestX, y: closestY, t: t };
        }

         // Helper: Reflect velocity vector off a normal vector
         function reflectVelocity(vx, vy, normalX, normalY) {
             const speed = Math.sqrt(vx*vx + vy*vy);
             const dot = vx * normalX + vy * normalY;
             // Reflect velocity vector: v' = v - 2 * (v . n) * n
             const reflectVx = vx - 2 * dot * normalX;
             const reflectVy = vy - 2 * dot * normalY;
             // Optionally normalize and scale, or just return reflected components
             // Normalizing and scaling by original speed might prevent weird speed changes
             const reflectSpeed = Math.sqrt(reflectVx*reflectVx + reflectVy*reflectVy);
             if (reflectSpeed === 0) return {x: 0, y: 0}; // Avoid division by zero
             return { x: (reflectVx / reflectSpeed) * speed, y: (reflectVy / reflectSpeed) * speed };
         }

         function checkWallCollisions() {
             const restitution = 0.5; // Bounciness factor

             walls.forEach(wall => {
                 const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, wall.x1, wall.y1, wall.x2, wall.y2);
                 const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                 if (distanceSquared < ball.radius * ball.radius) {
                    // Collision occurred
                     // Move ball out of collision slightly to prevent sticking
                     const overlap = ball.radius - Math.sqrt(distanceSquared);
                     const dx = ball.x - closestX;
                     const dy = ball.y - closestY;
                     const collisionDist = Math.sqrt(dx*dx + dy*dy);
                     // Avoid division by zero if somehow distance is zero
                    const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                    const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                     ball.x += moveX;
                     ball.y += moveY;


                     // Calculate the normal vector of the wall segment
                     let wallDx = wall.x2 - wall.x1;
                     let wallDy = wall.y2 - wall.y1;
                     // Normal vector (perpendicular, pointing "outward" from the wall)
                     // Need consistent winding or knowledge of which side is "inside"
                     // Simple approach: Use normal pointing away from ball center
                     let normalX = -(wallDy);
                     let normalY = wallDx;
                     // Ensure normal points away from ball
                     if ((ball.x - closestX) * normalX + (ball.y - closestY) * normalY < 0) {
                         normalX *= -1;
                         normalY *= -1;
                     }
                     const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                     if (normalLen > 0.01) {
                        normalX /= normalLen;
                        normalY /= normalLen;
                     } else { // Segment is a point, use direction from ball? Not ideal. Default normal?
                         normalX = moveX / overlap; // Use penetration direction if normal fails
                         normalY = moveY / overlap;
                     }


                     // Reflect velocity using the calculated normal
                     const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                     ball.speedX = reflected.x * restitution;
                     ball.speedY = reflected.y * restitution;
                      // Optional: Add small sound effect here
                      createParticles(closestX, closestY, 3, '#AAAAAA'); // Wall sparks
                 }
            });
            // TASK_002: o dreno é tratado por bola em handleDrainCheck (suporte a multibola)
        }

        function checkBumperCollisions() {
            bumpers.forEach((bumper, index) => {
                 if (bumper.hitTimer > 0) bumper.hitTimer--; // Decrement hit timer
                 else bumper.isHit = false;

                 const distanceSquared = distSq(ball.x, ball.y, bumper.x, bumper.y);
                 const radiiSumSquared = (ball.radius + bumper.radius) * (ball.radius + bumper.radius);

                if (distanceSquared < radiiSumSquared) {
                    // Collision!
                    const distance = Math.sqrt(distanceSquared);
                    const overlap = (ball.radius + bumper.radius) - distance;

                     // Normal of collision (from bumper center to ball center)
                     const normalX = (ball.x - bumper.x) / distance;
                     const normalY = (ball.y - bumper.y) / distance;

                     // Move ball out of collision
                     ball.x += normalX * overlap;
                     ball.y += normalY * overlap;

                     // Reflect velocity (basic reflection off the normal)
                     const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);

                     // Apply bounce factor and ensure minimum speed away from bumper
                     const currentSpeed = Math.sqrt(ball.speedX**2 + ball.speedY**2);
                     const minBounceSpeed = 5 * bounceBoost; // TASK_002: +40% no overdrive
                     const bounceSpeed = Math.max(minBounceSpeed, currentSpeed * BUMPER_BOUNCE);

                     const speedFactor = bounceSpeed / Math.sqrt(reflected.x**2 + reflected.y**2);

                     ball.speedX = reflected.x * speedFactor;
                     ball.speedY = reflected.y * speedFactor;


                    // Score and visual feedback
                    if (!bumper.isHit) { // Prevent scoring multiple times on one hit
                         addScore(bumper.points); // TASK_002: × multiplicador × nº bolas × overclock
                         updateScoreDisplay();
                         bumper.isHit = true;
                         bumper.hitTimer = BUMPER_HIT_DURATION;
                          createParticles(ball.x, ball.y, 15, bumper.hitColor); // Bumper hit sparks
                          registerBumperHitForMissions(index); // TASK_002: missões/overdrive
                     }
                }
            });
        }

        function checkMultiplierZoneCollisions(dt) {
             multiplierZones.forEach((zone, index) => {
                 const inside = ball.x + ball.radius > zone.x && ball.x - ball.radius < zone.x + zone.width &&

         function checkFlipperCollisions() {
            checkSingleFlipperCollision(leftFlipper);
            checkSingleFlipperCollision(rightFlipper);
        }

        function checkSingleFlipperCollision(flipper) {
            const ballRadiusSq = ball.radius * ball.radius;

            // 1. Define the flipper rectangle vertices in world space based on current angle
             const angle = flipper.currentAngle;
             const cos = Math.cos(angle);
             const sin = Math.sin(angle);
             const halfHeight = flipper.height / 2;
             const drawX = flipper.isLeft ? -flipper.width : 0; // Start X relative to pivot

             // Calculate corner positions relative to pivot, then add pivot world coords
             const corners = [
                { x: drawX, y: -halfHeight },         // Top-start corner
                { x: drawX + flipper.width, y: -halfHeight }, // Top-end corner
                { x: drawX + flipper.width, y: halfHeight },  // Bottom-end corner
                { x: drawX, y: halfHeight }           // Bottom-start corner
            ].map(p => ({
                x: flipper.pivotX + p.x * cos - p.y * sin,
                y: flipper.pivotY + p.x * sin + p.y * cos
            }));

            // 2. Check collision with the four line segments of the flipper rectangle
            for (let i = 0; i < 4; i++) {
                const p1 = corners[i];
                const p2 = corners[(i + 1) % 4]; // Next corner, wraps around
                 const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, p1.x, p1.y, p2.x, p2.y);
                 const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                 if (distanceSquared < ballRadiusSq) {
                     // Collision with this edge
                     // Move ball out slightly
                     const overlap = ball.radius - Math.sqrt(distanceSquared);
                     const dx = ball.x - closestX;
                     const dy = ball.y - closestY;
                     const collisionDist = Math.sqrt(dx*dx + dy*dy);
                     const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                     const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                     ball.x += moveX * 1.1; // Move slightly more to ensure separation
                     ball.y += moveY * 1.1;

                     // Calculate edge normal
                     let edgeDx = p2.x - p1.x;
                     let edgeDy = p2.y - p1.y;
                     let normalX = -edgeDy;
                     let normalY = edgeDx;
                     // Ensure normal points outward (away from flipper center, approximate)
                     // A better way involves checking against flipper's pre-rotation axes
                     if ((closestX - flipper.pivotX) * normalX + (closestY - flipper.pivotY) * normalY < 0) {
                         normalX *= -1;
                         normalY *= -1;
                     }
                     const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                      if (normalLen > 0.01) {
                         normalX /= normalLen;
                         normalY /= normalLen;
                      }


                     // Reflect velocity
                     const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                      // Add flipper impulse/angular velocity effect (× overdrive boost)
                      let impulseX = 0;
                      let impulseY = -FLIPPER_STRENGTH * bounceBoost; // Base upward impulse
                      impulseX += (flipper.isLeft ? FLIPPER_SIDE_STRENGTH : -FLIPPER_SIDE_STRENGTH) * bounceBoost;
                      // TASK_002 (decisão TL #2): momentum proporcional à distância do pivô (v = ω·r)
                      if (flipper.angularVelocity !== 0) {
                           const r = Math.hypot(closestX - flipper.pivotX, closestY - flipper.pivotY);
                           const rFactor = Math.min(1.4, r / flipper.width); // ponta transmite mais força
                           impulseY -= Math.abs(flipper.angularVelocity) * 40 * rFactor * bounceBoost;
                       }

                     // Apply combined reflection and impulse
                     ball.speedX = reflected.x * 0.5 + impulseX;
                     ball.speedY = reflected.y * 0.5 + impulseY;

                     // Add score, visual effect (× sobrevivência/overclock)
                     addScore(1);
                     updateScoreDisplay();
                     createParticles(closestX, closestY, 8, '#FFFFFF'); // Flipper hit sparks
                      // Optional: Play flipper sound

                     return; // Only handle one edge collision per frame
                 }
             }
         }


        // --- Update Game Logic ---
        function updateFlippers(deltaTime) {
             // Update Left Flipper Angle
             const leftTargetAngle = leftFlipper.isActivating ? leftFlipper.activeAngle : leftFlipper.restAngle;
             const leftAngleDiff = leftTargetAngle - leftFlipper.currentAngle;
             // Apply angular velocity based on difference, clamped by max speed
              leftFlipper.angularVelocity = Math.sign(leftAngleDiff) * Math.min(Math.abs(leftAngleDiff), FLIPPER_ROTATE_SPEED);
              if (Math.abs(leftAngleDiff) > 0.01) { // Check difference before updating
                   leftFlipper.currentAngle += leftFlipper.angularVelocity;
               } else {
                   leftFlipper.currentAngle = leftTargetAngle; // Snap to target angle
                   leftFlipper.angularVelocity = 0;
               }
              leftFlipper.isUp = leftFlipper.currentAngle === leftFlipper.activeAngle;


             // Update Right Flipper Angle
             const rightTargetAngle = rightFlipper.isActivating ? rightFlipper.activeAngle : rightFlipper.restAngle;
             const rightAngleDiff = rightTargetAngle - rightFlipper.currentAngle;
             rightFlipper.angularVelocity = Math.sign(rightAngleDiff) * Math.min(Math.abs(rightAngleDiff), FLIPPER_ROTATE_SPEED);
              if (Math.abs(rightAngleDiff) > 0.01) {
                 rightFlipper.currentAngle += rightFlipper.angularVelocity;
             } else {
                 rightFlipper.currentAngle = rightTargetAngle;
                 rightFlipper.angularVelocity = 0;
             }
              rightFlipper.isUp = rightFlipper.currentAngle === rightFlipper.activeAngle;
        }

        function update(timestamp) {
            if (!gameActive) return; // Don't update if game over

            // Calcular deltaTime
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = Math.min(0.1, (timestamp - lastTimestamp) / 1000); // Delta em segundos, com limite
            lastTimestamp = timestamp;

            // Update launcher pull distance (atua na bola ainda não lançada)
            const launchReady = activeBalls.find(b => !b.isLaunched);
            if (launcher.charging && launchReady) {
                launcher.pullDistance += 90 * deltaTime;
                if (launcher.pullDistance > launcher.maxPull) launcher.pullDistance = launcher.maxPull;
            }

            // Update flippers + TASK_002 timers
            updateFlippers();
            updatePhysicsMode(deltaTime);
            updateMissions(deltaTime);
            if (frameFlashTimer > 0) frameFlashTimer -= deltaTime;

            // TASK_002: itera todas as bolas ativas (ponteiro global `ball`)
            for (let i = activeBalls.length - 1; i >= 0; i--) {
                ball = activeBalls[i];
                if (ball.isLaunched) {
                    ball.speedY += currentGravity;
                    ball.x += ball.speedX;
                    ball.y += ball.speedY;
                    ball.speedX *= currentFriction;
                    ball.speedY *= currentFriction;

                    ball.trail.push({ x: ball.x, y: ball.y });
                    if (ball.trail.length > ball.maxTrailLength) ball.trail.shift();

                    checkBallStuckOrOutOfBounds(deltaTime);
                    checkWallCollisions();
                    checkBumperCollisions();
                    checkMultiplierZoneCollisions(deltaTime);
                    checkFlipperCollisions();
                    checkFirewallTargets();
                }
                handleDrainCheck(ball, i);
            }

            // TASK_002: colisão elástica entre bolas (multiball)
            checkBallToBallCollisions();

            // Update bumper hit state timers
            bumpers.forEach(bumper => {
               if (bumper.hitTimer > 0) bumper.hitTimer -= 1; // Simples contador de frames
                // Alternativa baseada em tempo:
                // if (bumper.hitTimer > 0) bumper.hitTimer -= deltaTime;
                else bumper.isHit = false;
            });
        }

        // --- Main Draw Function ---
        function drawGameOver() {
            ctx.save();
            ctx.fillStyle = 'rgba(5, 6, 12, 0.88)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.textAlign = 'center';
            // GAME OVER em Press Start 2P magenta com glow neon
            ctx.fillStyle = '#ff2e97';
            ctx.font = '24px "Press Start 2P", monospace';
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 18;
            ctx.fillText('GAME', canvasWidth / 2, canvasHeight / 2 - 80);
            ctx.fillText('OVER', canvasWidth / 2, canvasHeight / 2 - 40);

            // Placar final em Orbitron dourado
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 14;
            ctx.font = '900 28px "Orbitron", sans-serif';
            ctx.fillText(`${score}`, canvasWidth / 2, canvasHeight / 2 + 20);
            ctx.fillStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.font = '700 12px "Orbitron", sans-serif';
            ctx.fillText('FINAL SCORE', canvasWidth / 2, canvasHeight / 2 - 4);

            ctx.fillStyle = '#cdd6f4';
            ctx.shadowBlur = 0;
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.fillText('PRESS ENTER', canvasWidth / 2, canvasHeight / 2 + 70);
            ctx.restore();
        }

        function drawInstructions() {
            if (!gameStarted && gameActive) { // Show only if game not started AND not game over
                ctx.save();
                ctx.fillStyle = 'rgba(5, 6, 12, 0.9)';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                // TASK_001: scanlines estilo CRT
                ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
                for (let y = 0; y < canvasHeight; y += 4) ctx.fillRect(0, y, canvasWidth, 2);

                ctx.textAlign = 'center';
                // Logo neon piscante (pulsa com o tempo)
                const t = performance.now();
                const glow = 12 + Math.sin(t / 200) * 8;
                ctx.fillStyle = '#ff2e97';
                ctx.font = '30px "Press Start 2P", monospace';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = glow;
                ctx.fillText('PIMBAL', canvasWidth / 2, canvasHeight / 2 - 150);

                ctx.shadowBlur = 6;
                ctx.shadowColor = '#00f0ff';
                ctx.fillStyle = '#00f0ff';
                ctx.font = '11px "Press Start 2P", monospace';
                ctx.fillText('CONTROLS', canvasWidth / 2, canvasHeight / 2 - 80);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#cdd6f4';
                ctx.font = '13px "Orbitron", sans-serif';
                ctx.fillText('SPACE  ·  Charge & Launch', canvasWidth / 2, canvasHeight / 2 - 40);
                ctx.fillText('< / Z  ·  Left Flipper', canvasWidth / 2, canvasHeight / 2 - 14);
                ctx.fillText('> / /  ·  Right Flipper', canvasWidth / 2, canvasHeight / 2 + 12);

                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 8;
                ctx.font = '700 14px "Orbitron", sans-serif';
                ctx.fillText('Hit Bumpers & Zones for Points!', canvasWidth / 2, canvasHeight / 2 + 60);

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffaa00';
                ctx.font = '900 15px "Orbitron", sans-serif';
                ctx.fillText('HOLD SPACE → RELEASE TO LAUNCH', canvasWidth / 2, canvasHeight / 2 + 120);
                ctx.restore();
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw game elements (order matters for layering)
            drawTableGrid();            // TASK_002: grade CRT reativa ao modo de gravidade
            drawMultiplierZones();
            drawFirewallTargets();      // TASK_002: alvos da missão Firewall
            drawWalls();
            drawBumpers();
            drawLauncher();
            drawParticles();
            drawFlipper(leftFlipper);
            drawFlipper(rightFlipper);
            // TASK_002: desenha todas as bolas ativas (ponteiro global `ball`)
            activeBalls.forEach(b => { ball = b; drawBall(); });

            drawMissionsHUD();          // TASK_002: HUD glassmorphic de missões
            if (frameFlashTimer > 0) drawFrameFlash();

            // If game over, show message overlay
            if (!gameActive) {
                drawGameOver();
            }

            // Show instructions if game hasn't started (and not game over)
            drawInstructions();
        }

        // === TASK_002: grade CRT eletrostática reativa ao modo de gravidade ===
        function drawTableGrid() {
            ctx.save();
            ctx.lineWidth = 1;
            let gridColor = 'rgba(255, 255, 255, 0.03)';
            const time = performance.now();
            if (activePhysicsMode === 'low_gravity') {
                const pulse = 0.05 + Math.sin(time / 200) * 0.03;
                gridColor = `rgba(0, 240, 255, ${pulse})`;
            } else if (activePhysicsMode === 'overdrive') {
                const pulse = 0.08 + Math.sin(time / 80) * 0.05;
                gridColor = `rgba(255, 0, 127, ${pulse})`;
            }
            ctx.strokeStyle = gridColor;
            const spacing = 40;
            for (let x = 0; x < canvasWidth; x += spacing) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
            for (let y = 0; y < canvasHeight; y += spacing) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }
            ctx.restore();
        }

        // === TASK_002: alvos físicos da FIREWALL CRACK (o próximo acende) ===
        function drawFirewallTargets() {
            const time = performance.now();
            firewallTargets.forEach((t, i) => {
                ctx.save();
                const isNext = (i === firewallProgress);
                const done = (i < firewallProgress);
                ctx.fillStyle = done ? 'rgba(80,80,90,0.5)' : t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = isNext ? (10 + Math.sin(time / 120) * 8) : (done ? 0 : 4);
                ctx.fillRect(t.x, t.y, t.width, t.height);
                if (isNext) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(t.x, t.y, t.width, t.height); }
                ctx.restore();
            });
        }

        // === TASK_002: HUD glassmorphic de missões (canvas, topo-esquerdo) ===
        function drawMissionsHUD() {
            if (!gameStarted || !gameActive) return;
            const x = 12, y = 12, w = 168, h = 46;
            ctx.save();
            ctx.fillStyle = 'rgba(18, 19, 32, 0.6)';
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
            ctx.fill(); ctx.stroke();
            // título da missão
            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 6;
            ctx.font = '700 11px "Orbitron", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(missionsState.label, x + 10, y + 18);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cdd6f4';
            ctx.font = '10px "Orbitron", sans-serif';
            ctx.fillText(missionsState.detail, x + 10, y + 32);
            // barra de progresso/tempo
            const barX = x + 10, barY = y + 37, barW = w - 20, barH = 4;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 6;
            ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, missionsState.barRatio)), barH);
            ctx.restore();
        }

        // === TASK_002: flash vermelho da moldura ao perder bola no multiball ===
        function drawFrameFlash() {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 30, 60, ${Math.min(0.8, frameFlashTimer * 3)})`;
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, canvasWidth - 6, canvasHeight - 6);
            ctx.restore();
        }


        // --- Utility Functions ---
         function createParticles(x, y, count, color) {
             // TASK_001: faíscas de curto-circuito com física de amortecimento
             const rgb = hexToRgb(color) || { r: 255, g: 0, b: 128 };
             for (let i = 0; i < count; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const speed = 1.5 + Math.random() * 4.5;
                 const life = 0.5 + Math.random() * 0.6;
                 particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.8, // viés térmico/gravitacional para cima
                    r: rgb.r,
                    g: rgb.g,
                    b: rgb.b,
                    alpha: 1,
                    decay: 1 / (life * 60), // decaimento por frame (~60 FPS)
                    size: 1.5 + Math.random() * 2
                });
            }
        }

         function hexToRgb(hex) {
             if (!hex) return null;
             const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
             return result ? {
                 r: parseInt(result[1], 16),
                 g: parseInt(result[2], 16),
                 b: parseInt(result[3], 16)
             } : null;
         }

         function shadeColor(hexColor, percent) {
            if (!hexColor) return '#000000';
             let rgb = hexToRgb(hexColor);
             if (!rgb) return '#000000';
             let { r, g, b } = rgb;

            const amount = Math.round(2.55 * percent); // Convert percent (-100 to 100) to 0-255 range delta

             r = Math.min(255, Math.max(0, r + amount));
             g = Math.min(255, Math.max(0, g + amount));
             b = Math.min(255, Math.max(0, b + amount));

            const rr = r.toString(16).padStart(2, '0');
            const gg = g.toString(16).padStart(2, '0');
            const bb = b.toString(16).padStart(2, '0');
            return `#${rr}${gg}${bb}`;
        }

        // --- Game Loop ---
        function gameLoop(timestamp) { // Adicionar timestamp
            update(timestamp); // Passa o timestamp para update
            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- Start the game ---
        var lastTimestamp = 0; // Inicializar lastTimestamp globalmente também
        updateScoreDisplay();
        // Iniciar o loop com requestAnimationFrame para obter o primeiro timestamp
        requestAnimationFrame(gameLoop);
    </script>
