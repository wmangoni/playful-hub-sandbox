        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.beginPath();
                const lengthFactor = 2;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.vx * lengthFactor, p.y - p.vy * lengthFactor);
                ctx.strokeStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
                ctx.lineWidth = p.size;
                ctx.lineCap = 'round';
                ctx.shadowColor = `rgb(${p.r}, ${p.g}, ${p.b})`;
                ctx.shadowBlur = 6;
                ctx.stroke();
                ctx.closePath();
                ctx.restore();

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.alpha = Math.max(0, p.alpha - p.decay);
                p.size *= 0.97;
            });
            particles = particles.filter(p => p.alpha > 0 && p.size > 0.4);
        }

        function distSq(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return dx * dx + dy * dy;
        }

        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
            const lineLenSq = distSq(x1, y1, x2, y2);
            if (lineLenSq < 0.0001) return { x: x1, y: y1, t: 0 };

            const t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / lineLenSq;
            if (t < 0) return { x: x1, y: y1, t: 0 };
            if (t > 1) return { x: x2, y: y2, t: 1 };

            const closestX = x1 + t * (x2 - x1);
            const closestY = y1 + t * (y2 - y1);
            return { x: closestX, y: closestY, t: t };
        }

        function reflectVelocity(vx, vy, normalX, normalY) {
            const speed = Math.sqrt(vx*vx + vy*vy);
            const dot = vx * normalX + vy * normalY;
            const reflectVx = vx - 2 * dot * normalX;
            const reflectVy = vy - 2 * dot * normalY;
            const reflectSpeed = Math.sqrt(reflectVx*reflectVx + reflectVy*reflectVy);
            if (reflectSpeed === 0) return {x: 0, y: 0};
            return { x: (reflectVx / reflectSpeed) * speed, y: (reflectVy / reflectSpeed) * speed };
        }

        function checkWallCollisions() {
            const restitution = 0.5;

            walls.forEach(wall => {
                const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, wall.x1, wall.y1, wall.x2, wall.y2);
                const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                if (distanceSquared < ball.radius * ball.radius) {
                    const overlap = ball.radius - Math.sqrt(distanceSquared);
                    const dx = ball.x - closestX;
                    const dy = ball.y - closestY;
                    const collisionDist = Math.sqrt(dx*dx + dy*dy);
                    const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                    const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                    ball.x += moveX;
                    ball.y += moveY;

                    let wallDx = wall.x2 - wall.x1;
                    let wallDy = wall.y2 - wall.y1;
                    let normalX = -(wallDy);
                    let normalY = wallDx;
                    if ((ball.x - closestX) * normalX + (ball.y - closestY) * normalY < 0) {
                        normalX *= -1;
                        normalY *= -1;
                    }
                    const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                    if (normalLen > 0.01) {
                        normalX /= normalLen;
                        normalY /= normalLen;
                    } else {
                        normalX = moveX / overlap;
                        normalY = moveY / overlap;
                    }

                    const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                    
                    // Micro-desvio angular natural para evitar loops ortogonais fechados
                    const wallMicroAngle = (Math.random() - 0.5) * 0.06; // ~1.7 graus
                    const wCos = Math.cos(wallMicroAngle), wSin = Math.sin(wallMicroAngle);
                    const wRotX = reflected.x * wCos - reflected.y * wSin;
                    const wRotY = reflected.x * wSin + reflected.y * wCos;

                    ball.speedX = wRotX * restitution;
                    ball.speedY = wRotY * restitution;
                    createParticles(closestX, closestY, 3, '#AAAAAA');
                }
            });
        }

        function checkBumperCollisions() {
            bumpers.forEach((bumper, index) => {
                 if (bumper.hitTimer > 0) bumper.hitTimer--;
                 else bumper.isHit = false;

                 const distanceSquared = distSq(ball.x, ball.y, bumper.x, bumper.y);
                 const radiiSumSquared = (ball.radius + bumper.radius) * (ball.radius + bumper.radius);

                if (distanceSquared < radiiSumSquared) {
                    const distance = Math.sqrt(distanceSquared);
                    const overlap = (ball.radius + bumper.radius) - distance;

                    const normalX = (ball.x - bumper.x) / (distance || 1);
                    const normalY = (ball.y - bumper.y) / (distance || 1);

                    ball.x += normalX * (overlap + 0.5);
                    ball.y += normalY * (overlap + 0.5);

                    const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                    const currentSpeed = Math.hypot(ball.speedX, ball.speedY);
                    const bounceSpeed = Math.min(MAX_BALL_SPEED * 0.85, Math.max(4.8, currentSpeed * 1.02)) * bounceBoost;
                    const rLen = Math.hypot(reflected.x, reflected.y) || 1;

                    // Micro-perturbação angular imperceptível (~3.5°) para quebrar trajetórias fechadas 1D
                    const bMicroAngle = (Math.random() - 0.5) * 0.12;
                    const bCos = Math.cos(bMicroAngle), bSin = Math.sin(bMicroAngle);
                    const normRefVx = (reflected.x / rLen);
                    const normRefVy = (reflected.y / rLen);
                    let finalRefVx = normRefVx * bCos - normRefVy * bSin;
                    let finalRefVy = normRefVx * bSin + normRefVy * bCos;

                    // Detecção de rebotes consecutivos em curta distância (< 80px)
                    if (ball.lastBouncePos) {
                        const distLastBounce = Math.hypot(ball.x - ball.lastBouncePos.x, ball.y - ball.lastBouncePos.y);
                        if (distLastBounce < 80) {
                            ball.consecutiveBounces = (ball.consecutiveBounces || 0) + 1;
                            if (ball.consecutiveBounces >= 2) {
                                // Aplica leve quebra de eixo perpendicular para escapar do ping-pong
                                const escapeJitterX = (Math.random() - 0.5) * 0.6;
                                finalRefVx += escapeJitterX;
                                finalRefVy += 0.35; // Tendência sutil de descida em direção às aletas
                            }
                        } else {
                            ball.consecutiveBounces = 1;
                        }
                    } else {
                        ball.consecutiveBounces = 1;
                    }
                    ball.lastBouncePos = { x: ball.x, y: ball.y };

                    const fLen = Math.hypot(finalRefVx, finalRefVy) || 1;
                    ball.speedX = (finalRefVx / fLen) * bounceSpeed;
                    ball.speedY = (finalRefVy / fLen) * bounceSpeed;

                    if (!bumper.isHit) {
                         addScore(bumper.points);
                         updateScoreDisplay();
                         bumper.isHit = true;
                         bumper.hitTimer = BUMPER_HIT_DURATION;
                         soundSynth.playBumperHit(bumper.freq);
                         createParticles(ball.x, ball.y, 15, bumper.hitColor);
                         registerBumperHitForMissions(index);
                     }
                }
            });
        }

        function checkMultiplierZoneCollisions(dt) {
             multiplierZones.forEach((zone, index) => {
                 const inside = ball.x + ball.radius > zone.x && ball.x - ball.radius < zone.x + zone.width &&
                                ball.y + ball.radius > zone.y && ball.y - ball.radius < zone.y + zone.height;
                 if (inside) {
                      if (zone.multiplier > currentMultiplier) {
                           currentMultiplier = zone.multiplier;
                           updateScoreDisplay();
                      }
                      if (index === 2 || index === 3) {
                           overclockZoneTime += (dt || 0);
                           if (overclockZoneTime >= 3.0 && overclockTimer <= 0) {
                                overclockTimer = 20; globalScoreMultiplier = 2;
                                overclockZoneTime = 0;
                                createParticles(ball.x, ball.y, 18, '#ff2e97');
                           }
                      }
                      if (index === 3 && activePhysicsMode !== 'low_gravity') {
                           setPhysicsMode('low_gravity', 12);
                           createParticles(ball.x, ball.y, 16, '#00f0ff');
                      }
                 }
            });
        }

        function checkFlipperCollisions() {
            checkSingleFlipperCollision(leftFlipper);
            checkSingleFlipperCollision(rightFlipper);
        }

        function checkSingleFlipperCollision(flipper) {
            const ballRadiusSq = ball.radius * ball.radius;
            const angle = flipper.currentAngle;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const rBase = flipper.height / 2 + 1;
            const rTip = flipper.height / 2 - 2;
            const len = flipper.width;

            // Vértices do corpo cônico do flipper no espaço local
            const corners = [
                { x: 0, y: -rBase },
                { x: len, y: -rTip },
                { x: len, y: rTip },
                { x: 0, y: rBase }
            ].map(p => ({
                x: flipper.pivotX + p.x * cos - p.y * sin,
                y: flipper.pivotY + p.x * sin + p.y * cos
            }));

            // Centro local do flipper no espaço mundial
            const centerLocalX = flipper.pivotX + (len / 2) * cos;
            const centerLocalY = flipper.pivotY + (len / 2) * sin;

            for (let i = 0; i < 4; i++) {
                const p1 = corners[i];
                const p2 = corners[(i + 1) % 4];
                const { x: closestX, y: closestY } = closestPointOnSegment(ball.x, ball.y, p1.x, p1.y, p2.x, p2.y);
                const distanceSquared = distSq(ball.x, ball.y, closestX, closestY);

                if (distanceSquared < ballRadiusSq) {
                     const dist = Math.sqrt(distanceSquared);
                     const overlap = ball.radius - dist;
                     const dx = ball.x - closestX;
                     const dy = ball.y - closestY;
                     const collisionDist = dist;
                     const moveX = collisionDist < 0.01 ? 0 : (dx / collisionDist) * overlap;
                     const moveY = collisionDist < 0.01 ? 0 : (dy / collisionDist) * overlap;
                     ball.x += moveX * 1.05;
                     ball.y += moveY * 1.05;

                     let edgeDx = p2.x - p1.x;
                     let edgeDy = p2.y - p1.y;
                     let normalX = -edgeDy;
                     let normalY = edgeDx;
                     if ((closestX - centerLocalX) * normalX + (closestY - centerLocalY) * normalY < 0) {
                         normalX *= -1;
                         normalY *= -1;
                     }
                     const normalLen = Math.sqrt(normalX*normalX + normalY*normalY);
                     if (normalLen > 0.01) {
                         normalX /= normalLen;
                         normalY /= normalLen;
                     }

                     const reflected = reflectVelocity(ball.speedX, ball.speedY, normalX, normalY);
                     let impulseX = (flipper.isLeft ? FLIPPER_SIDE_STRENGTH : -FLIPPER_SIDE_STRENGTH) * 0.7 * bounceBoost;
                     let impulseY = -FLIPPER_STRENGTH * 0.75 * bounceBoost;

                     // Impulso extra quando o flipper está sendo acionado
                     if (flipper.isActivating || Math.abs(flipper.angularVelocity) > 0.05) {
                          const r = Math.hypot(closestX - flipper.pivotX, closestY - flipper.pivotY);
                          const rFactor = Math.min(1.3, Math.max(0.3, r / flipper.width));
                          impulseY -= 4.0 * rFactor * bounceBoost;
                          impulseX += (flipper.isLeft ? 2.5 : -2.5) * rFactor * bounceBoost;
                     }

                     ball.speedX = reflected.x * 0.35 + impulseX;
                     ball.speedY = reflected.y * 0.35 + impulseY;

                     // Limitar velocidade máxima para controle perfeito
                     const speed = Math.hypot(ball.speedX, ball.speedY);
                     if (speed > MAX_BALL_SPEED) {
                         ball.speedX = (ball.speedX / speed) * MAX_BALL_SPEED;
                         ball.speedY = (ball.speedY / speed) * MAX_BALL_SPEED;
                     }

                     addScore(1);
                     updateScoreDisplay();
                     createParticles(closestX, closestY, 6, flipper.isLeft ? '#ff007f' : '#00f0ff');
                     return;
                }
            }
        }

        function updateFlippers(deltaTime) {
             // Flipper esquerdo
             if (bossState.activeEmpFlipper === 'left') {
                 leftFlipper.isActivating = false;
             }
             const leftTargetAngle = leftFlipper.isActivating ? leftFlipper.activeAngle : leftFlipper.restAngle;
             const leftAngleDiff = leftTargetAngle - leftFlipper.currentAngle;
             leftFlipper.angularVelocity = Math.sign(leftAngleDiff) * Math.min(Math.abs(leftAngleDiff), FLIPPER_ROTATE_SPEED);
             if (Math.abs(leftAngleDiff) > 0.01) {
                  leftFlipper.currentAngle += leftFlipper.angularVelocity;
             } else {
                  leftFlipper.currentAngle = leftTargetAngle;
                  leftFlipper.angularVelocity = 0;
             }
             leftFlipper.isUp = Math.abs(leftFlipper.currentAngle - leftFlipper.activeAngle) < 0.05;

             // Flipper direito
             if (bossState.activeEmpFlipper === 'right') {
                 rightFlipper.isActivating = false;
             }
             const rightTargetAngle = rightFlipper.isActivating ? rightFlipper.activeAngle : rightFlipper.restAngle;
             const rightAngleDiff = rightTargetAngle - rightFlipper.currentAngle;
             rightFlipper.angularVelocity = Math.sign(rightAngleDiff) * Math.min(Math.abs(rightAngleDiff), FLIPPER_ROTATE_SPEED);
             if (Math.abs(rightAngleDiff) > 0.01) {
                  rightFlipper.currentAngle += rightFlipper.angularVelocity;
             } else {
                  rightFlipper.currentAngle = rightTargetAngle;
                  rightFlipper.angularVelocity = 0;
             }
             rightFlipper.isUp = Math.abs(rightFlipper.currentAngle - rightFlipper.activeAngle) < 0.05;
        }

        function update(timestamp) {
            if (!gameActive) {
                soundSynth.updateAmbient(0, false);
                return;
            }

            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = Math.min(0.06, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            const launchReady = activeBalls.find(b => !b.isLaunched);
            if (launcher.charging && launchReady && !tiltSystem.isTilted) {
                launcher.pullDistance += 90 * deltaTime;
                if (launcher.pullDistance > launcher.maxPull) launcher.pullDistance = launcher.maxPull;
            }

            updateTiltSystem(deltaTime);
            updateDmdSystem(deltaTime);
            updateFlippers(deltaTime);
            updatePhysicsMode(deltaTime);
            updateMissions(deltaTime);
            updateBoss(deltaTime);
            checkBossCollisions();
            updateFloatingTexts(deltaTime);

            if (bossState.goldSkinTimer > 0) bossState.goldSkinTimer -= deltaTime;
            if (frameFlashTimer > 0) frameFlashTimer -= deltaTime;
            if (kickbackState.flashTimer > 0) kickbackState.flashTimer -= deltaTime;

            let maxBallSpeed = 0;
            const SUB_STEPS = 4;

            for (let i = activeBalls.length - 1; i >= 0; i--) {
                ball = activeBalls[i];
                if (ball.isLaunched) {
                    for (let step = 0; step < SUB_STEPS; step++) {
                        ball.speedY += (currentGravity / SUB_STEPS);
                        ball.speedX *= Math.pow(currentFriction, 1 / SUB_STEPS);
                        ball.speedY *= Math.pow(currentFriction, 1 / SUB_STEPS);

                        const spd = Math.hypot(ball.speedX, ball.speedY);
                        const inLauncherLane = (ball.x > 340 && ball.speedY < 0);
                        const maxSpd = inLauncherLane ? 19.0 : MAX_BALL_SPEED;
                        if (spd > maxSpd) {
                            ball.speedX = (ball.speedX / spd) * maxSpd;
                            ball.speedY = (ball.speedY / spd) * maxSpd;
                        }

                        ball.x += ball.speedX / SUB_STEPS;
                        ball.y += ball.speedY / SUB_STEPS;

                        checkBoundaries(ball);
                        checkWallCollisions();
                        checkSlingshotCollisions();
                        checkOutlaneKickback();
                        checkBumperCollisions();
                        checkMultiplierZoneCollisions(deltaTime / SUB_STEPS);
                        checkFlipperCollisions();
                        checkFirewallTargets();
                        checkSkillShotSensor(ball);
                    }

                    const curSpeed = Math.hypot(ball.speedX, ball.speedY);
                    if (curSpeed > maxBallSpeed) maxBallSpeed = curSpeed;

                    ball.trail.push({ x: ball.x, y: ball.y });
                    if (ball.trail.length > ball.maxTrailLength) ball.trail.shift();

                    checkBallStuckOrOutOfBounds(deltaTime);
                }
                handleDrainCheck(ball, i);
            }

            checkBallToBallCollisions();
            soundSynth.updateAmbient(maxBallSpeed, true);

            bumpers.forEach(bumper => {
               if (bumper.hitTimer > 0) bumper.hitTimer -= 1;
                else bumper.isHit = false;
            });
        }

        function drawGameOver() {
            ctx.save();
            ctx.fillStyle = 'rgba(5, 6, 12, 0.88)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff2e97';
            ctx.font = '24px "Press Start 2P", monospace';
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 18;
            ctx.fillText('GAME', canvasWidth / 2, canvasHeight / 2 - 80);
            ctx.fillText('OVER', canvasWidth / 2, canvasHeight / 2 - 40);

            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 14;
            ctx.font = '900 28px "Orbitron", sans-serif';
            ctx.fillText(`${score}`, canvasWidth / 2, canvasHeight / 2 + 20);
            ctx.fillStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.font = '700 12px "Orbitron", sans-serif';
            ctx.fillText('FINAL SCORE', canvasWidth / 2, canvasHeight / 2 - 4);

            ctx.fillStyle = '#cdd6f4';
            ctx.shadowBlur = 0;
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.fillText('PRESS ENTER', canvasWidth / 2, canvasHeight / 2 + 70);
            ctx.restore();
        }

        function drawInstructions() {
            if (!gameStarted && gameActive) {
                ctx.save();
                ctx.fillStyle = 'rgba(5, 6, 12, 0.9)';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
                for (let y = 0; y < canvasHeight; y += 4) ctx.fillRect(0, y, canvasWidth, 2);

                ctx.textAlign = 'center';
                const t = performance.now();
                const glow = 12 + Math.sin(t / 200) * 8;
                ctx.fillStyle = '#ff2e97';
                ctx.font = '28px "Press Start 2P", monospace';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = glow;
                ctx.fillText('PIMBAL 2.0', canvasWidth / 2, canvasHeight / 2 - 160);

                ctx.shadowBlur = 6;
                ctx.shadowColor = '#00f0ff';
                ctx.fillStyle = '#00f0ff';
                ctx.font = '11px "Press Start 2P", monospace';
                ctx.fillText('ARCADE CONTROLS', canvasWidth / 2, canvasHeight / 2 - 100);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#cdd6f4';
                ctx.font = '12px "Orbitron", sans-serif';
                ctx.fillText('SPACE / Toque  ·  Carregar Plunger', canvasWidth / 2, canvasHeight / 2 - 60);
                ctx.fillText('Z / A / ←  ·  Aleta Esquerda', canvasWidth / 2, canvasHeight / 2 - 34);
                ctx.fillText('X / D / → / /  ·  Aleta Direita', canvasWidth / 2, canvasHeight / 2 - 8);
                ctx.fillText('Q / W / E  ·  Nudge / Empurrão da Mesa', canvasWidth / 2, canvasHeight / 2 + 18);
                ctx.fillText('T  ·  Trocar Tema (Synthwave/Vapor/Matrix)', canvasWidth / 2, canvasHeight / 2 + 44);

                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 8;
                ctx.font = '700 13px "Orbitron", sans-serif';
                ctx.fillText('Slingshots · Kickback Savers · Minigame DMD', canvasWidth / 2, canvasHeight / 2 + 84);

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffaa00';
                ctx.font = '900 15px "Orbitron", sans-serif';
                ctx.fillText('HOLD SPACE → RELEASE TO PLAY', canvasWidth / 2, canvasHeight / 2 + 130);
                ctx.restore();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Aplica offset de Nudge na mesa
            ctx.save();
            ctx.translate(tiltSystem.tableOffset.x, tiltSystem.tableOffset.y);

            // Fundo do tema
            const theme = THEMES[currentThemeKey];
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            bgGrad.addColorStop(0, theme.canvasBg1);
            bgGrad.addColorStop(1, theme.canvasBg2);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Imagem de Fundo Vaporwave integrada diretamente na mesa de pinball
            if (bgPinballImage.complete && bgPinballImage.naturalWidth > 0 && theme.bgAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = theme.bgAlpha;
                ctx.drawImage(bgPinballImage, 0, 0, canvasWidth, canvasHeight);

                // Vinheta sutil para preservar o contraste dos bumpers e luzes neon
                const vignette = ctx.createRadialGradient(canvasWidth / 2, canvasHeight / 2, 80, canvasWidth / 2, canvasHeight / 2, 290);
                vignette.addColorStop(0, 'rgba(5, 6, 12, 0.05)');
                vignette.addColorStop(1, 'rgba(5, 6, 12, 0.55)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.restore();
            }

            if (theme.matrixRain) {
                drawMatrixRain();
            }

            drawTableGrid();
            drawMultiplierZones();
            drawSkillShotSensor();
            drawFirewallTargets();
            drawWalls();
            drawSlingshots();
            drawKickbackLamps();
            drawBumpers();
            drawBoss();
            drawLauncher();
            drawParticles();
            drawFlipper(leftFlipper);
            drawFlipper(rightFlipper);
            activeBalls.forEach(b => { ball = b; drawBall(); });

            drawDmdPanel();
            drawMissionsHUD();
            drawFloatingTexts();
            if (frameFlashTimer > 0) drawFrameFlash();
            drawTiltOverlay();

            ctx.restore(); // Fecha o translate do Nudge

            if (!gameActive) {
                drawGameOver();
            }

            drawInstructions();
        }

        function drawMatrixRain() {
            ctx.save();
            ctx.font = '10px monospace';
            ctx.fillStyle = 'rgba(57, 255, 20, 0.4)';
            matrixDrops.forEach(drop => {
                const char = drop.chars[Math.floor(Math.random() * drop.chars.length)];
                ctx.fillText(char, drop.x, drop.y);
                drop.y += drop.speed;
                if (drop.y > canvasHeight) {
                    drop.y = 0;
                    drop.x = Math.random() * canvasWidth;
                }
            });
            ctx.restore();
        }

        function drawSlingshots() {
            slingshots.forEach(sl => {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(sl.p1.x, sl.p1.y);
                ctx.lineTo(sl.p2.x, sl.p2.y);
                ctx.lineTo(sl.p3.x, sl.p3.y);
                ctx.closePath();

                const isFlash = sl.hitFlash > 0;
                ctx.fillStyle = isFlash ? '#ffffff' : 'rgba(15, 25, 45, 0.85)';
                ctx.fill();

                ctx.strokeStyle = isFlash ? '#ffffff' : sl.color;
                ctx.lineWidth = isFlash ? 3 : 2;
                ctx.shadowColor = sl.color;
                ctx.shadowBlur = isFlash ? 16 : 8;
                ctx.stroke();

                // Face ativa estroboscópica (hipotenusa)
                ctx.beginPath();
                ctx.moveTo(sl.faceP1.x, sl.faceP1.y);
                ctx.lineTo(sl.faceP2.x, sl.faceP2.y);
                ctx.strokeStyle = isFlash ? '#ffffff' : (sl.isLeft ? '#ff007f' : '#00f0ff');
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Bobinas metálicas nos vértices
                [sl.p1, sl.p2, sl.p3].forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#cdd6f4';
                    ctx.fill();
                });

                ctx.restore();
            });
        }

        function drawKickbackLamps() {
            ctx.save();
            // Lâmpada Outlane Esquerdo
            const leftOn = kickbackState.leftActive;
            ctx.beginPath();
            ctx.arc(28, 480, 7, 0, Math.PI * 2);
            ctx.fillStyle = leftOn ? '#39ff14' : 'rgba(60,60,70,0.6)';
            ctx.shadowColor = leftOn ? '#39ff14' : 'transparent';
            ctx.shadowBlur = leftOn ? 10 : 0;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Lâmpada Outlane Direito
            const rightOn = kickbackState.rightActive;
            ctx.beginPath();
            ctx.arc(335, 480, 7, 0, Math.PI * 2);
            ctx.fillStyle = rightOn ? '#39ff14' : 'rgba(60,60,70,0.6)';
            ctx.shadowColor = rightOn ? '#39ff14' : 'transparent';
            ctx.shadowBlur = rightOn ? 10 : 0;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        function drawDmdPanel() {
            if (!gameStarted || !gameActive) return;
            ctx.save();
            const dmdX = 110, dmdY = 12, dmdW = 180, dmdH = 26;

            // Caixa do DMD estilo vidro fumê com LEDs
            ctx.fillStyle = '#06060c';
            ctx.strokeStyle = 'rgba(255, 180, 0, 0.4)';
            ctx.lineWidth = 1.5;
            if (ctx.roundRect) ctx.roundRect(dmdX, dmdY, dmdW, dmdH, 6); else ctx.rect(dmdX, dmdY, dmdW, dmdH);
            ctx.fill();
            ctx.stroke();

            // Grid de micropontos LED
            ctx.fillStyle = 'rgba(255, 170, 0, 0.08)';
            for (let px = dmdX + 4; px < dmdX + dmdW - 4; px += 4) {
                for (let py = dmdY + 4; py < dmdY + dmdH - 4; py += 4) {
                    ctx.fillRect(px, py, 2, 2);
                }
            }

            // Conteúdo do DMD
            ctx.textAlign = 'center';
            ctx.font = '800 9px "Press Start 2P", monospace';
            if (dmdSystem.activeMode === 'CYBER_LOCKPICK') {
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 6;
                ctx.fillText(dmdSystem.message, dmdX + dmdW / 2, dmdY + 17);
            } else if (dmdSystem.lockSuccessTimer > 0) {
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.fillText(dmdSystem.message, dmdX + dmdW / 2, dmdY + 17);
            } else {
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 4;
                const dmdText = `SCORE ${score} · MULTI ${currentMultiplier}X`;
                ctx.fillText(dmdText, dmdX + dmdW / 2, dmdY + 17);
            }
            ctx.restore();
        }

        function drawTiltOverlay() {
            if (tiltSystem.warningTimer > 0 || tiltSystem.isTilted) {
                ctx.save();
                ctx.textAlign = 'center';
                const alpha = Math.min(1.0, tiltSystem.warningTimer);
                ctx.fillStyle = tiltSystem.isTilted ? 'rgba(255, 0, 60, 0.9)' : 'rgba(255, 170, 0, 0.9)';
                ctx.shadowColor = tiltSystem.isTilted ? '#ff003c' : '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.font = '900 16px "Press Start 2P", monospace';
                ctx.fillText(tiltSystem.warningText || 'TILT!', canvasWidth / 2, canvasHeight / 2);
                ctx.restore();
            }
        }

        function drawTableGrid() {
            ctx.save();
            ctx.lineWidth = 1;
            let gridColor = 'rgba(255, 255, 255, 0.03)';
            const time = performance.now();
            if (activePhysicsMode === 'low_gravity') {
                const pulse = 0.05 + Math.sin(time / 200) * 0.03;
                gridColor = `rgba(0, 240, 255, ${pulse})`;
            } else if (activePhysicsMode === 'overdrive') {
                const pulse = 0.08 + Math.sin(time / 80) * 0.05;
                gridColor = `rgba(255, 0, 127, ${pulse})`;
            }
            ctx.strokeStyle = gridColor;
            const spacing = 40;
            for (let x = 0; x < canvasWidth; x += spacing) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
            for (let y = 0; y < canvasHeight; y += spacing) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }
            ctx.restore();
        }

        function drawFirewallTargets() {
            const time = performance.now();
            firewallTargets.forEach((t, i) => {
                ctx.save();
                const isNext = (i === firewallProgress);
                const done = (i < firewallProgress);
                ctx.fillStyle = done ? 'rgba(80,80,90,0.5)' : t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = isNext ? (10 + Math.sin(time / 120) * 8) : (done ? 0 : 4);
                ctx.fillRect(t.x, t.y, t.width, t.height);
                if (isNext) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(t.x, t.y, t.width, t.height); }
                ctx.restore();
            });
        }

        function drawMissionsHUD() {
            if (!gameStarted || !gameActive) return;
            const x = 12, y = 12, w = 90, h = 42;
            ctx.save();
            ctx.fillStyle = 'rgba(18, 19, 32, 0.7)';
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, 6); else ctx.rect(x, y, w, h);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 5;
            ctx.font = '700 9px "Orbitron", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(missionsState.label || 'MISSION', x + 6, y + 16);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cdd6f4';
            ctx.font = '8px "Orbitron", sans-serif';
            ctx.fillText(missionsState.detail || 'ACTIVE', x + 6, y + 28);

            const barX = x + 6, barY = y + 33, barW = w - 12, barH = 3;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = missionsState.accent;
            ctx.shadowColor = missionsState.accent; ctx.shadowBlur = 4;
            ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, missionsState.barRatio)), barH);
            ctx.restore();
        }

        function drawFrameFlash() {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 30, 60, ${Math.min(0.8, frameFlashTimer * 3)})`;
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, canvasWidth - 6, canvasHeight - 6);
            ctx.restore();
        }

        function createParticles(x, y, count, color) {
             const rgb = hexToRgb(color) || { r: 255, g: 0, b: 128 };
             for (let i = 0; i < count; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const speed = 1.5 + Math.random() * 4.5;
                 const life = 0.5 + Math.random() * 0.6;
                 particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.8,
                    r: rgb.r,
                    g: rgb.g,
                    b: rgb.b,
                    alpha: 1,
                    decay: 1 / (life * 60),
                    size: 1.5 + Math.random() * 2
                });
            }
        }

        function hexToRgb(hex) {
             if (!hex) return null;
             const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
             return result ? {
                 r: parseInt(result[1], 16),
                 g: parseInt(result[2], 16),
                 b: parseInt(result[3], 16)
             } : null;
        }

        function shadeColor(hexColor, percent) {
            if (!hexColor) return '#000000';
             let rgb = hexToRgb(hexColor);
             if (!rgb) return '#000000';
             let { r, g, b } = rgb;
            const amount = Math.round(2.55 * percent);
             r = Math.min(255, Math.max(0, r + amount));
             g = Math.min(255, Math.max(0, g + amount));
             b = Math.min(255, Math.max(0, b + amount));
            const rr = r.toString(16).padStart(2, '0');
            const gg = g.toString(16).padStart(2, '0');
            const bb = b.toString(16).padStart(2, '0');
            return `#${rr}${gg}${bb}`;
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }

        var lastTimestamp = 0;
        updateScoreDisplay();
        requestAnimationFrame(gameLoop);

        // Debug/QA Hook
        window.__pinball = {
            getBall: () => ball,
            getBalls: () => typeof activeBalls !== 'undefined' ? activeBalls : (typeof balls !== 'undefined' ? balls : [ball]),
            getActiveBalls: () => typeof activeBalls !== 'undefined' ? activeBalls : [ball],
            getLeftFlipper: () => leftFlipper,
            getRightFlipper: () => rightFlipper,
            getBumpers: () => bumpers,
            getSlingshots: () => slingshots,
            getKickbackState: () => kickbackState,
            getTiltSystem: () => tiltSystem,
            getDmdSystem: () => dmdSystem,
            getTheme: () => currentThemeKey,
            setTheme: (k) => setTheme(k),
            triggerNudge: (dx, dy) => performNudge(dx, dy),
            triggerDmdMinigame: (m) => triggerDmdMinigame(m),
            handleDmdInput: (b) => handleDmdLockpickInput(b),
            getMultiplierZones: () => multiplierZones,
            getParticles: () => particles,
            getScore: () => score,
            getLives: () => lives,
            getMultiplier: () => currentMultiplier || scoreMultiplier,
            getGlobalMultiplier: () => typeof globalScoreMultiplier !== 'undefined' ? globalScoreMultiplier : 1,
            getPhysicsMode: () => typeof activePhysicsMode !== 'undefined' ? activePhysicsMode : 'normal',
            getGravity: () => typeof currentGravity !== 'undefined' ? currentGravity : GRAVITY,
            getFriction: () => typeof currentFriction !== 'undefined' ? currentFriction : FRICTION,
            getFirewallTargets: () => typeof firewallTargets !== 'undefined' ? firewallTargets : [],
            getMissionsState: () => typeof missionsState !== 'undefined' ? missionsState : {},
            isGameActive: () => gameActive,
            isGameOver: () => gameOver,
            spawnMultiball: typeof spawnMultiball !== 'undefined' ? spawnMultiball : () => {},
            setPhysicsMode: typeof setPhysicsMode !== 'undefined' ? setPhysicsMode : () => {},
            checkBallToBallCollisions: typeof checkBallToBallCollisions !== 'undefined' ? checkBallToBallCollisions : () => {},
            handleDrainCheck: typeof handleDrainCheck !== 'undefined' ? handleDrainCheck : () => {},
            addScore: typeof addScore !== 'undefined' ? addScore : () => {},
            createParticles,
            updateScoreDisplay,
            draw,
            update
        };
    </script>
</body>
</html>
