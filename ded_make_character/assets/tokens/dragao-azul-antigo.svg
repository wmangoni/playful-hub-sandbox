<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="az-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="az-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="az-lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="az-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base circular -->
  <circle cx="100" cy="100" r="95" fill="url(#az-bg)" stroke="#0f172a" stroke-width="4" />
  <!-- Borda metálica rúnica -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#az-rim)" stroke-width="7" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6" />
  <circle cx="100" cy="100" r="81" fill="none" stroke="#1d4ed8" stroke-width="1" opacity="0.5" />
  
  <!-- Relâmpagos e Arcos de Choque -->
  <path d="M 40,50 L 75,70 L 65,85 L 95,95 L 85,115 L 120,130" fill="none" stroke="url(#az-lightning)" stroke-width="2.5" opacity="0.7" filter="url(#az-glow)" />
  <path d="M 160,55 L 130,80 L 140,95 L 115,110 L 135,135" fill="none" stroke="url(#az-lightning)" stroke-width="2" opacity="0.6" filter="url(#az-glow)" />
  
  <!-- Cabeça de Dragão Azul estilizada (Chifre nasal imponente e escamas) -->
  <g transform="translate(100, 105) scale(0.85)">
    <!-- Pescoço e escamas dorsais -->
    <path d="M -35,50 C -45,10 -30,-30 0,-60 C 30,-30 45,10 35,50 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <!-- Chifre nasal principal gigantesco característico do Dragão Azul -->
    <path d="M 0,-60 L -12,-110 L 0,-105 L 12,-110 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2" filter="url(#az-glow)" />
    <!-- Chifres secundários laterais -->
    <path d="M -25,-40 C -55,-55 -65,-75 -70,-90 C -55,-70 -35,-55 -20,-48" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M 25,-40 C 55,-55 65,-75 70,-90 C 55,-70 35,-55 20,-48" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Crânio do Dragão -->
    <path d="M 0,-50 C -35,-30 -30,10 0,35 C 30,10 35,-30 0,-50 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M -20,-10 L 0,15 L 20,-10 L 0,-25 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Focinho e dentes -->
    <path d="M -15,15 L 0,35 L 15,15" fill="none" stroke="#e0f2fe" stroke-width="2" />
    <!-- Olhos brilhantes de eletricidade -->
    <circle cx="-16" cy="-12" r="5" fill="#f0f9ff" filter="url(#az-glow)" />
    <circle cx="16" cy="-12" r="5" fill="#f0f9ff" filter="url(#az-glow)" />
    <circle cx="-16" cy="-12" r="2.5" fill="#38bdf8" />
    <circle cx="16" cy="-12" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Ornatos cardeais do aro -->
  <circle cx="100" cy="10" r="5" fill="#38bdf8" filter="url(#az-glow)" />
  <circle cx="100" cy="190" r="5" fill="#38bdf8" filter="url(#az-glow)" />
  <circle cx="10" cy="100" r="5" fill="#38bdf8" filter="url(#az-glow)" />
  <circle cx="190" cy="100" r="5" fill="#38bdf8" filter="url(#az-glow)" />
  <!-- Rótulo do tamanho 3.5 -->
  <rect x="80" y="165" width="40" height="18" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
  <text x="100" y="178" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ENORME</text>
</svg>
