<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="tar-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="55%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="tar-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="tar-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="tar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base circular -->
  <circle cx="100" cy="100" r="95" fill="url(#tar-bg)" stroke="#1c1917" stroke-width="4" />
  <!-- Borda dourada antiga e runas de cataclismo -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#tar-rim)" stroke-width="8" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.6" />

  <!-- Espinhos e carapaça colossal do Tarrasque -->
  <g transform="translate(100, 105) scale(0.9)">
    <!-- Carapaça dorsal com placas blindadas -->
    <path d="M 0,-70 L -45,-30 L -55,30 L 0,60 L 55,30 L 45,-30 Z" fill="url(#tar-armor)" stroke="#ca8a04" stroke-width="2.5" />
    
    <!-- Espinhos dorsais titânicos -->
    <polygon points="0,-70 -12,-98 0,-92 12,-98" fill="#eab308" stroke="#713f12" stroke-width="2" filter="url(#tar-glow)" />
    <polygon points="-30,-45 -55,-70 -35,-55" fill="#ca8a04" stroke="#713f12" stroke-width="1.5" />
    <polygon points="30,-45 55,-70 35,-55" fill="#ca8a04" stroke="#713f12" stroke-width="1.5" />
    <polygon points="-45,0 -75,-15 -50,-5" fill="#a16207" stroke="#713f12" stroke-width="1.5" />
    <polygon points="45,0 75,-15 50,-5" fill="#a16207" stroke="#713f12" stroke-width="1.5" />

    <!-- Cabeça blindada com mandíbula reptiliana monstruosa -->
    <path d="M 0,-50 C -30,-40 -35,5 0,28 C 35,5 30,-40 0,-50 Z" fill="#292524" stroke="#eab308" stroke-width="2" />
    
    <!-- Grandes chifres curvados -->
    <path d="M -20,-35 C -45,-55 -60,-40 -70,-65 C -55,-45 -40,-30 -15,-25" fill="#ca8a04" stroke="#713f12" stroke-width="2" />
    <path d="M 20,-35 C 45,-55 60,-40 70,-65 C 55,-45 40,-30 15,-25" fill="#ca8a04" stroke="#713f12" stroke-width="2" />

    <!-- Mandíbulas vorazes e dentes serrilhados -->
    <path d="M -18,10 L 0,28 L 18,10 Z" fill="#7f1d1d" stroke="#fef08a" stroke-width="1.5" />
    <polygon points="-12,12 -10,20 -7,13" fill="#fef08a" />
    <polygon points="12,12 10,20 7,13" fill="#fef08a" />
    <polygon points="0,20 -3,26 3,26" fill="#fef08a" />

    <!-- Olhos âmbar primitivos ferozes -->
    <ellipse cx="-15" cy="-15" rx="5" ry="3" fill="#fef08a" filter="url(#tar-glow)" transform="rotate(-15 -15 -15)" />
    <ellipse cx="15" cy="-15" rx="5" ry="3" fill="#fef08a" filter="url(#tar-glow)" transform="rotate(15 15 -15)" />
    <line x1="-15" y1="-18" x2="-15" y2="-12" stroke="#713f12" stroke-width="2" />
    <line x1="15" y1="-18" x2="15" y2="-12" stroke="#713f12" stroke-width="2" />
  </g>

  <!-- Ornatos cardeais míticos -->
  <circle cx="100" cy="8" r="5" fill="#eab308" filter="url(#tar-glow)" />
  <circle cx="100" cy="192" r="5" fill="#eab308" filter="url(#tar-glow)" />
  <circle cx="8" cy="100" r="5" fill="#eab308" filter="url(#tar-glow)" />
  <circle cx="192" cy="100" r="5" fill="#eab308" filter="url(#tar-glow)" />

  <!-- Rótulo do tamanho 3.5 -->
  <rect x="75" y="165" width="50" height="18" rx="4" fill="#09090b" stroke="#eab308" stroke-width="1.5" />
  <text x="100" y="178" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold" fill="#eab308" text-anchor="middle">COLOSSAL</text>
</svg>
