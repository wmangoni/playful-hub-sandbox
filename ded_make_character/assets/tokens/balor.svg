<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#180404" />
    </radialGradient>
    <linearGradient id="bal-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#260404" />
    </linearGradient>
    <linearGradient id="bal-fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="bal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base circular sombria -->
  <circle cx="100" cy="100" r="95" fill="url(#bal-bg)" stroke="#1a0404" stroke-width="4" />
  <!-- Borda de ferro forjado e chamas -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#bal-rim)" stroke-width="7" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7" />
  <circle cx="100" cy="100" r="81" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5" />

  <!-- Chamas de fundo ao redor -->
  <path d="M 60,140 Q 50,100 65,75 Q 80,105 75,130 Z" fill="url(#bal-fire)" opacity="0.4" filter="url(#bal-glow)" />
  <path d="M 140,140 Q 150,100 135,75 Q 120,105 125,130 Z" fill="url(#bal-fire)" opacity="0.4" filter="url(#bal-glow)" />

  <!-- Asas Demoníacas de Morcego -->
  <path d="M 100,105 C 50,70 25,60 15,90 C 25,105 35,120 50,130 C 70,125 85,115 100,105 Z" fill="#2d0606" stroke="#b91c1c" stroke-width="2" />
  <path d="M 100,105 C 150,70 175,60 185,90 C 175,105 165,120 150,130 C 130,125 115,115 100,105 Z" fill="#2d0606" stroke="#b91c1c" stroke-width="2" />

  <!-- Silhueta e Cabeça do Balor -->
  <g transform="translate(100, 102) scale(0.9)">
    <!-- Tronco e ombros musculosos -->
    <path d="M -40,45 C -45,15 -35,-15 0,-30 C 35,-15 45,15 40,45 Z" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    
    <!-- Chifres curvados clássicos do Balor -->
    <path d="M -22,-20 C -45,-30 -65,-55 -55,-85 C -45,-75 -35,-55 -15,-35 Z" fill="#1c0303" stroke="#f97316" stroke-width="2" />
    <path d="M 22,-20 C 45,-30 65,-55 55,-85 C 45,-75 35,-55 15,-35 Z" fill="#1c0303" stroke="#f97316" stroke-width="2" />

    <!-- Crânio demoníaco e queixo -->
    <path d="M 0,-35 C -25,-25 -20,15 0,35 C 20,15 25,-25 0,-35 Z" fill="#7f1d1d" stroke="#f97316" stroke-width="2" />
    
    <!-- Focinho, presas e boca em chamas -->
    <path d="M -15,12 L 0,28 L 15,12 Z" fill="#991b1b" stroke="#fef08a" stroke-width="1.5" />
    <line x1="-10" y1="14" x2="-8" y2="22" stroke="#fef08a" stroke-width="1.5" />
    <line x1="10" y1="14" x2="8" y2="22" stroke="#fef08a" stroke-width="1.5" />

    <!-- Olhos flamejantes incandescentes -->
    <circle cx="-14" cy="-8" r="4.5" fill="#fef08a" filter="url(#bal-glow)" />
    <circle cx="14" cy="-8" r="4.5" fill="#fef08a" filter="url(#bal-glow)" />
    <circle cx="-14" cy="-8" r="2" fill="#ef4444" />
    <circle cx="14" cy="-8" r="2" fill="#ef4444" />
  </g>

  <!-- Ornatos cardeais do aro -->
  <polygon points="100,4 96,14 104,14" fill="#f97316" filter="url(#bal-glow)" />
  <polygon points="100,196 96,186 104,186" fill="#f97316" filter="url(#bal-glow)" />
  <polygon points="4,100 14,96 14,104" fill="#f97316" filter="url(#bal-glow)" />
  <polygon points="196,100 186,96 186,104" fill="#f97316" filter="url(#bal-glow)" />
  
  <!-- Rótulo do tamanho 3.5 -->
  <rect x="80" y="165" width="40" height="18" rx="4" fill="#180404" stroke="#f97316" stroke-width="1.5" />
  <text x="100" y="178" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold" fill="#f97316" text-anchor="middle">GRANDE</text>
</svg>
