    <script>
        // Get canvas and context
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas dimensions
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // Initialize parameters
        let params = {
            stringCount: 40,
            vibrationSpeed: 5,
            vibrationAmplitude: 50,
            influenceRadius: 200,
            stringThickness: 2,
            stringColor: '#4caf50',
            backgroundColor: '#111111',
            rainbowMode: false
        };
        
        // TASK_003: Temas visuais, sintetizador procedural, notas especiais e game feel
        let currentTheme = 'cyberpunk'; // 'cyberpunk' | 'vaporwave' | 'nebula'
        let synthEnabled = true;
        let frenzyTime = 0; // Segundos restantes do Modo Frenesi
        let hasShield = false; // Estado do escudo (máx 1)
        let shakeTime = 0;
        let shakeIntensity = 0;

        let mouse = {
            x: 0,
            y: 0,
            isMoving: false,
            lastMoveTime: Date.now()
        };

        // Escala Pentatônica Menor de Lá (A Minor Pentatonic Scale)
        const PENTATONIC_SCALE = [
            220.00, // A3
            261.63, // C4
            293.66, // D4
            329.63, // E4
            392.00, // G4
            440.00, // A4
            523.25, // C5
            587.33, // D5
            659.25, // E5
            783.99, // G5
            880.00, // A5
            1046.50,// C6
            1174.66,// D6
            1318.51,// E6
            1567.98 // G6
        ];

        class ProceduralSynth {
            constructor() {
                this.ctx = null;
                this.waveType = 'sine'; // 'sine' | 'triangle' | 'sawtooth'
                this.activeNodes = {};
            }

            init() {
                if (this.ctx) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn("AudioContext não suportado para synth:", e);
                }
            }

            playNote(frequency, duration = 0.3) {
                if (!synthEnabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                try {
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();

                    osc.type = this.waveType;
                    osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);

                    const now = this.ctx.currentTime;
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.25, now + 0.02); // Attack
                    gainNode.gain.exponentialRampToValueAtTime(0.08, now + 0.1); // Decay
                    gainNode.gain.setValueAtTime(0.08, now + Math.max(0.1, duration - 0.05)); // Sustain
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration); // Release

                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {
                    console.warn("Erro no playNote synth:", e);
                }
            }

            startHoldNote(noteId, frequency) {
                if (!synthEnabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (this.activeNodes[noteId]) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gainNode = this.ctx.createGain();

                    osc.type = this.waveType;
                    osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);

                    const now = this.ctx.currentTime;
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05);

                    osc.connect(gainNode);
                    gainNode.connect(this.ctx.destination);

                    osc.start(now);
                    this.activeNodes[noteId] = { osc, gainNode };
                } catch (e) {
                    console.warn("Erro no startHoldNote synth:", e);
                }
            }

            stopHoldNote(noteId) {
                if (!this.activeNodes[noteId]) return;
                try {
                    const { osc, gainNode } = this.activeNodes[noteId];
                    const now = this.ctx.currentTime;
                    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                    osc.stop(now + 0.1);
                } catch (e) {}
                delete this.activeNodes[noteId];
            }
        }

        const synth = new ProceduralSynth();

        function getStringFrequency(stringIndex) {
            const idx = Math.abs(stringIndex) % PENTATONIC_SCALE.length;
            return PENTATONIC_SCALE[idx];
        }

        function applyRippleForce(stringIndex, centerIdx, force) {
            if (!strings || stringIndex < 0 || stringIndex >= strings.length) return;
            const string = strings[stringIndex];
            if (!string || !string.points) return;
            const width = 15;
            for (let i = -width; i <= width; i++) {
                const idx = centerIdx + i;
                if (idx >= 0 && idx < string.points.length) {
                    const distFactor = 1 - Math.abs(i) / width;
                    string.points[idx].velocity += force * distFactor * (Math.random() * 0.4 + 0.6);
                }
            }
        }

        function triggerRipple(stringIndex, targetX, force) {
            const pointCount = 100;
            const centerIdx = Math.min(pointCount - 1, Math.max(0, Math.floor((targetX / canvas.width) * (pointCount - 1))));

            applyRippleForce(stringIndex, centerIdx, force);
            applyRippleForce(stringIndex - 1, centerIdx, force * 0.5);
            applyRippleForce(stringIndex + 1, centerIdx, force * 0.5);
            applyRippleForce(stringIndex - 2, centerIdx, force * 0.25);
            applyRippleForce(stringIndex + 2, centerIdx, force * 0.25);
        }

        function triggerScreenShake(duration, intensity) {
            shakeTime = duration;
            shakeIntensity = intensity;
        }

        function applyScreenShake() {
            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeIntensity;
                const dy = (Math.random() - 0.5) * shakeIntensity;
                canvas.style.transform = `translate(${dx}px, ${dy}px)`;
                shakeTime -= 16.67;
                if (shakeTime <= 0) {
                    canvas.style.transform = 'translate(0px, 0px)';
                }
            }
        }

        // Renomear a classe String para VibratingString
        class VibratingString {
            constructor(y, index) {
                this.index = index;
                this.points = [];
                this.offset = Math.random() * 10;
                
                // Create points along the string
                const pointCount = 100;
                for (let i = 0; i < pointCount; i++) {
                    const x = (canvas.width / (pointCount - 1)) * i;
                    this.points.push({
                        x: x,
                        y: y,
                        originalY: y,
                        velocity: 0
                    });
                }
            }
            
            update() {
                const time = Date.now() * 0.001;
                const speed = params.vibrationSpeed * 0.1;
                
                for (let i = 0; i < this.points.length; i++) {
                    const point = this.points[i];
                    
                    // Calculate distance from mouse
                    const dx = point.x - mouse.x;
                    const dy = point.originalY - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // Apply mouse influence
                    if (distance < params.influenceRadius && mouse.isMoving) {
                        const force = (1 - distance / params.influenceRadius) * params.vibrationAmplitude;
                        point.velocity += force * (Math.random() * 0.2 - 0.1);
                    }
                    
                    // Natural vibration
                    const naturalVibration = Math.sin(time * speed + i * 0.1 + this.offset) * 2;
                    point.velocity += naturalVibration;

                    // Vibração reativa aos graves da música (Audio Reactive)
                    if (audioBass > 0) {
                        point.velocity += audioBass * params.vibrationAmplitude * 0.15
                            * Math.sin(time * 8 + i * 0.2 + this.offset);
                    }
                    
                    // Apply physics
                    point.velocity *= 0.95; // Damping
                    point.y = point.originalY + point.velocity;
                }
            }
            
            draw() {
                ctx.beginPath();
                
                // Set string color
                if (params.rainbowMode) {
                    const hue = (this.index / params.stringCount * 360 + Date.now() * 0.05) % 360;
                    ctx.strokeStyle = `hsl(${hue}, 80%, 60%)`;
                } else {
                    ctx.strokeStyle = params.stringColor;
                }
                
                ctx.lineWidth = params.stringThickness;
                
                // Draw the string
                ctx.moveTo(this.points[0].x, this.points[0].y);
                
                for (let i = 1; i < this.points.length; i++) {
                    const point = this.points[i];
                    const prevPoint = this.points[i - 1];
                    
                    // Use quadratic curves for smoother lines
                    const cpX = (prevPoint.x + point.x) / 2;
                    const cpY = (prevPoint.y + point.y) / 2;
                    
                    ctx.quadraticCurveTo(prevPoint.x, prevPoint.y, cpX, cpY);
                }
                
                ctx.stroke();
            }
        }
        
        // Create strings
        let strings = [];
        
        function createStrings() {
            strings = [];
            const spacing = canvas.height / (params.stringCount + 1);
            
            for (let i = 0; i < params.stringCount; i++) {
                const y = spacing * (i + 1);
                strings.push(new VibratingString(y, i));
            }
        }
        
        // --- Elementos de Áudio ---
        const backgroundMusic = new Audio('../assets/sounds/happy-relaxing-loop.mp3');
        backgroundMusic.loop = true; // Para tocar em loop
        backgroundMusic.volume = 0.4; // Ajuste o volume conforme necessário

        const noteCaptureSound = new Audio('../assets/sounds/sfx-pop.mp3');
        noteCaptureSound.volume = 0.5; // Volume 50%

        const obstacleHitSound = new Audio('../assets/sounds/enemy_hit.mp3');
        obstacleHitSound.volume = 0.7; // Ajuste o volume conforme necessário

        // === TASK_002: Web Audio API (visualizador reativo de frequências) ===
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let audioDataArray = null;
        let audioBass = 0;    // intensidade dos graves (0..1)
        let audioTreble = 0;  // intensidade dos agudos (0..1)

        function initAudioAnalysis(audioElement) {
            if (audioCtx) return; // só inicializa uma vez (MediaElementSource é único por elemento)
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                sourceNode = audioCtx.createMediaElementSource(audioElement);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                audioDataArray = new Uint8Array(analyser.frequencyBinCount);
            } catch (e) {
                console.warn('Web Audio API indisponível, seguindo sem reatividade:', e);
                analyser = null;
            }
        }

        function calculateAverage(arr, start, end) {
            let sum = 0, count = 0;
            for (let i = start; i < end && i < arr.length; i++) { sum += arr[i]; count++; }
            return count ? sum / count : 0;
        }

        function updateAudioReactivity() {
            if (!analyser) return;
            analyser.getByteFrequencyData(audioDataArray);
            audioBass = calculateAverage(audioDataArray, 0, 10) / 255;     // graves (bumbo/baixo)
            audioTreble = calculateAverage(audioDataArray, 80, 120) / 255; // agudos (pratos/vocais)
        }

        function hexToRgb(hex) {
            const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
        }
        function blendColors(hex1, hex2, t) {
            const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
            if (!c1 || !c2) return hex1;
            const r = Math.round(c1.r + (c2.r - c1.r) * t);
            const g = Math.round(c1.g + (c2.g - c1.g) * t);
            const b = Math.round(c1.b + (c2.b - c1.b) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // === TASK_003: Renderização de Temas Visuais e Partículas ===
        function drawThemeBackground() {
            if (currentTheme === 'cyberpunk') {
                // Fundo Cyberpunk reativo aos graves
                const baseBg = analyser ? blendColors(params.backgroundColor, '#1d0c24', Math.min(1, audioBass * 0.6)) : params.backgroundColor;
                ctx.fillStyle = baseBg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grade virtual 3D com linhas convergentes
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)';
                ctx.lineWidth = 1.5;
                const horizonY = canvas.height * 0.4;
                const lineCount = 20;

                for (let i = 0; i <= lineCount; i++) {
                    const xOffset = (i / lineCount) * canvas.width;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width / 2, horizonY);
                    ctx.lineTo(xOffset, canvas.height);
                    ctx.stroke();
                }

                const time = Date.now() * 0.002 * (1 + audioBass * 2);
                const gridLines = 10;
                for (let i = 0; i < gridLines; i++) {
                    const progress = ((i + time) % gridLines) / gridLines;
                    const y = horizonY + (canvas.height - horizonY) * Math.pow(progress, 2);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            } else if (currentTheme === 'vaporwave') {
                // Gradiente vertical retro de anoitecer
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#2e0854');
                grad.addColorStop(0.5, '#8b008b');
                grad.addColorStop(1, '#ff69b4');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Sol aramado central
                const centerX = canvas.width / 2;
                const centerY = canvas.height * 0.45;
                const baseRadius = Math.min(canvas.width, canvas.height) * 0.22;
                const currentRadius = baseRadius + (audioBass * baseRadius * 0.2);

                const sunGrad = ctx.createLinearGradient(centerX, centerY - currentRadius, centerX, centerY + currentRadius);
                sunGrad.addColorStop(0, '#ffcc00');
                sunGrad.addColorStop(1, '#ff007f');
                ctx.fillStyle = sunGrad;

                ctx.beginPath();
                ctx.arc(centerX, centerY, currentRadius, 0, Math.PI, true);
                ctx.fill();

                // Linhas pretas horizontais cortando o sol
                ctx.fillStyle = '#2e0854';
                const stripeCount = 6;
                for (let i = 0; i < stripeCount; i++) {
                    const sy = centerY + (i / stripeCount) * currentRadius * 0.9;
                    const sh = 4 + i * 2;
                    ctx.fillRect(centerX - currentRadius - 10, sy, currentRadius * 2 + 20, sh);
                }

                // Grade aramada inferior
                ctx.strokeStyle = 'rgba(255, 0, 127, 0.25)';
                ctx.lineWidth = 1;
                const gridStartY = centerY;
                for (let i = 0; i <= 16; i++) {
                    const x = (i / 16) * canvas.width;
                    ctx.beginPath();
                    ctx.moveTo(centerX, gridStartY);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                const time = Date.now() * 0.001 * (1 + audioBass * 1.5);
                for (let i = 0; i < 8; i++) {
                    const progress = ((i + time) % 8) / 8;
                    const y = gridStartY + (canvas.height - gridStartY) * Math.pow(progress, 1.8);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            } else if (currentTheme === 'nebula') {
                // Poeira estelar fluida em rotação orbital
                const time = Date.now() * 0.0003;
                const angle = time % (Math.PI * 2);

                const c1X = canvas.width / 2 + Math.cos(angle) * canvas.width * 0.25;
                const c1Y = canvas.height / 2 + Math.sin(angle) * canvas.height * 0.25;
                const c2X = canvas.width / 2 - Math.cos(angle + Math.PI/2) * canvas.width * 0.2;
                const c2Y = canvas.height / 2 - Math.sin(angle + Math.PI/2) * canvas.height * 0.2;

                const grad = ctx.createRadialGradient(c1X, c1Y, 10, c2X, c2Y, Math.max(canvas.width, canvas.height) * 0.85);
                grad.addColorStop(0, '#4b0082');
                grad.addColorStop(0.3, '#191970');
                grad.addColorStop(0.7, '#240a34');
                grad.addColorStop(1, '#05020c');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Spot de luz suave
                const reactiveRad = 200 + audioBass * 300;
                const spotGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2, canvas.height / 2, reactiveRad);
                spotGrad.addColorStop(0, 'rgba(218, 165, 32, 0.12)');
                spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = spotGrad;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, reactiveRad, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let sparkles = [];
        function emitThemeParticles(intensity) {
            const count = Math.floor(intensity * 4);
            for (let i = 0; i < count; i++) {
                if (currentTheme === 'cyberpunk') {
                    sparkles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height + 10,
                        vy: -(1 + Math.random() * 3.5) * (0.5 + intensity),
                        vx: Math.random() * 1.5 - 0.75,
                        size: 2 + Math.random() * 4,
                        life: 1.0,
                        hue: 300 + Math.random() * 40,
                        type: 'square'
                    });
                } else if (currentTheme === 'vaporwave') {
                    sparkles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height + 20,
                        vy: -(0.5 + Math.random() * 1.5) * (0.8 + intensity),
                        vx: Math.sin(Math.random() * Math.PI) * 0.3,
                        size: 3 + Math.random() * 8,
                        life: 1.0,
                        hue: 180 + Math.random() * 40,
                        type: 'bubble'
                    });
                } else if (currentTheme === 'nebula') {
                    sparkles.push({
                        x: Math.random() * canvas.width,
                        y: -10,
                        vy: (2 + Math.random() * 4) * (0.7 + intensity),
                        vx: -(1 + Math.random() * 2),
                        size: 1.5 + Math.random() * 2.5,
                        life: 1.0,
                        hue: 45 + Math.random() * 15,
                        type: 'star'
                    });
                }
            }
        }

        function updateThemeParticles() {
            for (const s of sparkles) {
                s.y += s.vy || 0;
                s.x += s.vx || 0;
                s.life -= (s.type === 'bubble') ? 0.008 : 0.016;
            }
            sparkles = sparkles.filter(s => s.life > 0 && s.y > -30 && s.y < canvas.height + 30 && s.x > -30 && s.x < canvas.width + 30);
        }

        function drawThemeParticles() {
            for (const s of sparkles) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, s.life);
                if (s.type === 'square') {
                    ctx.fillStyle = `hsl(${s.hue}, 100%, 70%)`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `hsl(${s.hue}, 100%, 60%)`;
                    ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
                } else if (s.type === 'bubble') {
                    ctx.strokeStyle = `hsla(${s.hue}, 100%, 80%, 0.7)`;
                    ctx.fillStyle = `hsla(${s.hue}, 100%, 85%, 0.15)`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (s.type === 'star') {
                    ctx.strokeStyle = `hsla(${s.hue}, 100%, 75%, ${s.life})`;
                    ctx.lineWidth = s.size;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - (s.vx || 0) * 3, s.y - (s.vy || 0) * 3);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${s.hue || 180}, 100%, 75%)`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `hsl(${s.hue || 180}, 100%, 70%)`;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Desenhar estrela de 5 pontas para Frenzy Note
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        function drawFrenzyNote(note, stringY) {
            const hue = (Date.now() * 0.15) % 360;
            ctx.save();
            ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
            ctx.shadowBlur = 15;
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            drawStar(ctx, note.x, stringY, 5, note.radius * 1.3, note.radius * 0.6);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        function drawShieldShape(ctx, cx, cy, size) {
            ctx.beginPath();
            ctx.moveTo(cx, cy - size);
            ctx.lineTo(cx + size * 0.85, cy - size * 0.6);
            ctx.lineTo(cx + size * 0.85, cy + size * 0.25);
            ctx.quadraticCurveTo(cx, cy + size, cx, cy + size * 1.1);
            ctx.quadraticCurveTo(cx, cy + size, cx - size * 0.85, cy + size * 0.25);
            ctx.lineTo(cx - size * 0.85, cy - size * 0.6);
            ctx.closePath();
        }

        function drawShieldNote(note, stringY) {
            ctx.save();
            ctx.fillStyle = '#00ff87';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ff87';
            drawShieldShape(ctx, note.x, stringY, note.radius);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            drawShieldShape(ctx, note.x, stringY, note.radius * 0.65);
            ctx.stroke();
            ctx.restore();
        }

        function drawFrenzyHUD() {
            if (frenzyTime <= 0) return;
            const barWidth = 280;
            const barHeight = 14;
            const x = (canvas.width - barWidth) / 2;
            const y = 22;
            const progress = frenzyTime / 8.0;

            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x - 12, y - 20, barWidth + 24, barHeight + 28);

            const hue = (Date.now() * 0.2) % 360;
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = `hsl(${hue}, 100%, 75%)`;
            ctx.textAlign = 'center';
            ctx.fillText(`⚡ FRENZY MODE (x2) ⚡`, canvas.width / 2, y - 4);

            ctx.fillStyle = '#222';
            ctx.fillRect(x, y, barWidth, barHeight);

            const grad = ctx.createLinearGradient(x, 0, x + barWidth, 0);
            grad.addColorStop(0, '#ff007f');
            grad.addColorStop(1, '#00f0ff');
            ctx.fillStyle = grad;
            ctx.fillRect(x, y, barWidth * Math.max(0, progress), barHeight);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, barWidth, barHeight);
            ctx.restore();
        }

        function hitMine(note) {

        // Iniciar a sustentação de uma Hold Note ao pressionar sobre a cabeça na zona
        function startHoldIfAny(x, y) {
            const zoneX = canvas.width * 0.8;
            for (const note of notes) {
                if (!note.active || note.type !== 'hold' || note.holdComplete || note.holdBroken) continue;
                const stringY = strings[note.stringIndex].points[0].y;
                const headClose = Math.abs(x - note.x) <= note.radius * 2 && Math.abs(y - stringY) <= 45;
                const inWindow = note.x >= zoneX - 40 && note.x <= zoneX + 60;
                if (headClose && inWindow) {
                    note.holding = true;
                    note.holdStarted = true;
                    const freq = getStringFrequency(note.stringIndex);
                    synth.startHoldNote(note.stringIndex, freq);
                    return true;
                }
            }
            return false;
        }

        // Substituir a função checkNoteCapture por uma versão mais simples
        function checkNoteCapture(x, y) {
            // Verificar cliques em notas
            for (let i = 0; i < notes.length; i++) {
                const note = notes[i];
                if (!note.active) continue;

                // Obter a posição Y da corda
                const stringY = strings[note.stringIndex].points[0].y;

                // Calcular a distância entre o clique e a nota
                const distance = Math.sqrt(Math.pow(x - note.x, 2) + Math.pow(y - stringY, 2));

                // Verificar se o clique foi próximo o suficiente da nota
                if (distance <= note.radius * 2) { // Aumentar um pouco a área de clique
                    // Mina: clicar é sempre punido (independe da zona)
                    if (note.type === 'mine') {
                        hitMine(note);
                        return;
                    }
                    // Hold note é tratada pelo sistema de segurar (mousedown), não por clique simples
                    if (note.type === 'hold') {
                        continue;
                    }
                    // Verificar se a nota normal está na zona de captura
                    const zone = captureZones[note.stringIndex];
                    if (Math.abs(note.x - zone.x) <= zone.width / 2 + note.radius) { // Ajustar verificação da zona
                        // Capturar nota
                        // Calcular precisão baseada na distância do centro da zona
                        const precisionFactor = 1 - (Math.abs(note.x - zone.x) / (zone.width / 2));
                        captureNote(note, Math.max(0, precisionFactor)); // Garante que precisão não seja negativa
                        return; // Sai após capturar uma nota
                    }
                }
            }

            // Verificar se o clique foi dentro de alguma zona de captura (sem acertar nota)
            let clickedInZone = false;
            let clickY = y; // Usar o Y do clique
            for (let i = 0; i < captureZones.length; i++) {
                const zone = captureZones[i];
                const stringY = strings[i].points[0].y;

                // Verificar se o clique está horizontalmente na zona e verticalmente próximo à corda
                if (Math.abs(x - zone.x) <= zone.width / 2 && Math.abs(clickY - stringY) <= 40) { // 40px de tolerância vertical
                    clickedInZone = true;
                    break;
                }
            }

            // Se clicou em uma zona de captura mas não acertou nada (nem nota, nem obstáculo)
            if (clickedInZone) {
                // Não penalizar por clicar na zona vazia por enquanto
                // showFeedback("MISS!", x, y, "yellow");
                // missedNote(); // Chama a função de erro se desejar penalizar
            }
        }

        // === TASK_002: Modal de upload de música customizada ===
        const NOTE_MAP_TEMPLATE = {

        function openCustomMusicModal(startScreen) {

            // Link de download do template via data URI

            templateLink.setAttribute('href', templateData);
            templateLink.setAttribute('download', 'template.json');

            function refreshStartState() {
                const ready = !!loadedAudioFile && !!loadedNoteMap;
                startCustomBtn.disabled = !ready;
                startCustomBtn.style.opacity = ready ? '1' : '0.5';

                const file = e.target.files[0];

                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (!parsed || !Array.isArray(parsed.notes)) throw new Error('Campo "notes" ausente');
                        loadedNoteMap = parsed;

                        loadedNoteMap = null;

                    loadedNoteMap = null;
                    jsonStatus.style.color = '#ff5252';
                    jsonStatus.textContent = 'Erro ao ler o arquivo.';

        // Preparar e iniciar uma partida com música customizada
        function startCustomGame(audioFile, noteMap) {
            customMode = true;

            // Construir a fila de notas a partir do JSON
            const rawNotes = Array.isArray(noteMap.notes) ? noteMap.notes : [];
            const parsed = rawNotes.map(n => ({
                time: Number(n.time) || 0,
                lane: Number(n.lane) || 0,
                type: (n.type === 'hold') ? 'hold' : (n.type === 'obstacle' || n.type === 'mine') ? 'mine' : 'normal',
                duration: Number(n.duration) || 0
            })).filter(n => n.time >= 0).sort((a, b) => a.time - b.time);

            customLaneCount = Math.max(4, ...parsed.map(n => n.lane + 1));
            noteQueue = parsed;

            // Configurar o áudio customizado no mesmo elemento (MediaElementSource é único)
            if (customAudioURL) URL.revokeObjectURL(customAudioURL);
            customAudioURL = URL.createObjectURL(audioFile);
            backgroundMusic.src = customAudioURL;
            backgroundMusic.loop = false;

            initAudioAnalysis(backgroundMusic);
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            // Fim da música encerra a partida
            backgroundMusic.onended = () => { if (gameActive && customMode) gameOver(); };

            backgroundMusic.play().catch(error => console.error("Erro ao tocar música customizada:", error));
            initGame();
        }

        // Inicializar o jogo
        function initGame() {
            // Configurar zonas de captura
            setupCaptureZones();

            // Resetar variáveis
            score = 0;
            combo = 0;
            lives = 3;
            level = 1;
            frenzyTime = 0;
            hasShield = false;
            notes = [];
            sparkles = [];

            if (customMode) {
                // Notas vêm da fila baseada no tempo do áudio; sem geradores procedurais.
            } else {
                // Iniciar geradores procedurais
                startNoteGenerator();
            }

            // Atualizar UI
            updateScoreDisplay();

            // Ativar o jogo
            gameActive = true;
        }

        // Configurar zonas de captura
        function setupCaptureZones() {
            captureZones = [];
            
            // Criar uma zona de captura para cada corda
            strings.forEach((string, index) => {
                captureZones.push({
                    stringIndex: index,
                    x: canvas.width * 0.8, // Posição horizontal da zona
                    width: 80,
                    active: true
                });
            });
        }

        // Gerar notas musicais
        function startNoteGenerator() {
            const noteInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(noteInterval);
                    return;
                }
                
                // Aumentar frequência baseado no nível
                if (Math.random() < 0.3 + (level * 0.05)) {
                    createNote();
                }
            }, 1000 - (level * 50));
        }

        // Criar uma nova nota (modo procedural / áudio default)
        function createNote() {
            const stringIndex = Math.floor(Math.random() * strings.length);
            const speed = 2 + (level * 0.5);
            const roll = Math.random();

            const note = { stringIndex, x: 0, speed, radius: 15, active: true, type: 'normal', custom: false };

            if (roll < 0.05) {
                // Estrela de Frenesi (Frenzy Note)
                note.type = 'frenzy';
                note.color = 'gold';
                note.points = 40;
            } else if (roll < 0.13) {
                // Coração de Proteção (Shield Note)
                note.type = 'shield';
                note.color = '#00ff87';
                note.points = 30;
            } else if (roll < 0.25) {
                // Nota Mina
                note.type = 'mine';
                note.color = 'red';
                note.points = 0;
            } else if (roll < 0.40) {
                // Nota Sustentada (Hold - amarela com cauda)
                note.type = 'hold';
                note.color = 'yellow';
                note.points = 30;
                note.duration = 0.8 + Math.random() * 1.2;
                note.tailLength = note.duration * speed * 60;
                note.holding = false;
                note.holdStarted = false;
                note.holdBroken = false;
                note.holdComplete = false;
            } else {
                // Notas normais (azul/verde/dourada)
                const c = Math.random();
                if (c > 0.95) { note.color = 'gold'; note.points = 50; }
                else if (c > 0.6) { note.color = 'lime'; note.points = 20; }
                else { note.color = 'cyan'; note.points = 10; }
            }

            notes.push(note);
        }

        // === TASK_002: construção de notas customizadas (time-driven) ===
        function laneToStringIndex(lane) {
            const lc = customLaneCount || 4;
            const frac = (lane + 0.5) / lc;
            return Math.min(strings.length - 1, Math.max(0, Math.floor(frac * strings.length)));
        }

        function buildCustomNote(q, zoneX) {
            const note = {
                stringIndex: laneToStringIndex(q.lane),
                x: 0, radius: 15, active: true, custom: true, time: q.time, type: q.type
            };
            if (q.type === 'frenzy') {
                note.color = 'gold';
                note.points = 40;
            } else if (q.type === 'shield') {
                note.color = '#00ff87';
                note.points = 30;
            } else if (q.type === 'hold') {
                note.duration = q.duration || 1.0;
                note.color = 'yellow';
                note.points = 30;
                note.tailLength = zoneX * (note.duration / T_VIEW);
                note.holding = false;
                note.holdStarted = false;
                note.holdBroken = false;
                note.holdComplete = false;
            } else if (q.type === 'mine' || q.type === 'obstacle') {
                note.type = 'mine';
                note.color = 'red';
                note.points = 0;
            } else {
                note.color = 'cyan';
                note.points = 10;
            }
            return note;
        }

        // Renderização de notas por tipo
        function drawNotes() {
            notes.forEach(note => {
                if (!note.active) return;
                const stringY = strings[note.stringIndex].points[0].y;
                if (note.type === 'frenzy') drawFrenzyNote(note, stringY);
                else if (note.type === 'shield') drawShieldNote(note, stringY);
                else if (note.type === 'hold') drawHoldNote(note, stringY);
                else if (note.type === 'mine') drawMineNote(note, stringY);
                else drawNormalNote(note, stringY);
            });
        }

        function drawNormalNote(note, stringY) {
            // Círculo da nota
            ctx.beginPath();
            ctx.arc(note.x, stringY, note.radius, 0, Math.PI * 2);
            ctx.fillStyle = note.color;
            ctx.fill();

            // Brilho externo
            ctx.beginPath();
            ctx.arc(note.x, stringY, note.radius + 3, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Destaque ao entrar na zona de captura
            const zone = captureZones[note.stringIndex];
            if (zone && Math.abs(note.x - zone.x) <= zone.width / 2) {
                ctx.beginPath();
                ctx.arc(note.x, stringY, note.radius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function drawHoldNote(note, stringY) {
            const tailLen = note.tailLength || 0;
            const broken = note.holdBroken;
            const headColor = broken ? '#888' : (note.holdComplete ? '#7fffd4' : 'yellow');
            const tailColor = broken ? 'rgba(140,140,140,0.4)'
                                     : (note.holding ? 'rgba(255, 235, 59, 0.6)' : 'rgba(255, 235, 59, 0.35)');

            // Cauda: retângulo ao longo da corda, atrás da cabeça
            ctx.save();
            ctx.fillStyle = tailColor;
            ctx.fillRect(note.x - tailLen, stringY - note.radius * 0.7, tailLen, note.radius * 1.4);
            ctx.restore();

            // Cabeça com brilho neon
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = broken ? '#888' : '#00e5ff';
            ctx.beginPath();
            ctx.arc(note.x, stringY, note.radius, 0, Math.PI * 2);
            ctx.fillStyle = headColor;
            ctx.fill();
            ctx.restore();
        }

        function drawMineNote(note, stringY) {
            // Piscar dinâmico baseado em seno do tempo
            const blink = (Math.sin(Date.now() * 0.02) + 1) / 2; // 0..1
            const radius = note.radius + blink * 4;
            ctx.save();
            ctx.globalAlpha = 0.55 + blink * 0.45;
            ctx.shadowBlur = 10 + blink * 20;
            ctx.shadowColor = 'red';
            ctx.beginPath();
            ctx.arc(note.x, stringY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff1744';
            ctx.fill();
            ctx.strokeStyle = 'darkred';
            ctx.lineWidth = 2;
            ctx.stroke();
            // "X" de aviso no centro
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            const r = note.radius * 0.5;
            ctx.beginPath();
            ctx.moveTo(note.x - r, stringY - r); ctx.lineTo(note.x + r, stringY + r);
            ctx.moveTo(note.x + r, stringY - r); ctx.lineTo(note.x - r, stringY + r);
            ctx.stroke();
            ctx.restore();
        }
        
        // Atualização de notas: suporta modo procedural e modo customizado (time-driven)
        function updateNotes() {
            const zoneX = canvas.width * 0.8;

            // Modo customizado: spawnar notas que entraram na janela de visão (T_VIEW segundos antes)
            if (customMode) {
                const t = backgroundMusic.currentTime;
                while (noteQueue.length && (noteQueue[0].time - t) <= T_VIEW) {
                    notes.push(buildCustomNote(noteQueue.shift(), zoneX));
                }
            }

            notes.forEach(note => {
                if (!note.active) return;
                const stringY = strings[note.stringIndex].points[0].y;

                if (note.custom) {
                    const t = backgroundMusic.currentTime;
                    // Posição sincronizada com o tempo da música (independe do FPS)
                    note.x = zoneX * (1 - (note.time - t) / T_VIEW);

                    if (note.type === 'hold') {
                        handleHoldProgress(note, stringY, zoneX);
                        if (t >= note.time + note.duration + 0.15) {
                            finalizeHold(note);
                            note.active = false;
                        }
                    } else if (t >= note.time + 0.15) {
                        // Passou da zona com tolerância
                        note.active = false;
                        if (note.type !== 'mine') notePassed(note); // mina evitada não penaliza
                    }
                } else {
                    // Modo procedural: move por velocidade
                    note.x += note.speed;
                    if (note.type === 'hold') handleHoldProgress(note, stringY, zoneX);

                    if (note.x > canvas.width) {
                        note.active = false;
                        if (note.type === 'hold') finalizeHold(note);
                        else if (note.type !== 'mine') notePassed(note); // mina evitada não penaliza
                    }
                }
            });

            // Remover notas inativas
            notes = notes.filter(note => note.active);

            // Desenhar notas
            drawNotes();
        }

        // Progresso de sustentação de uma Hold Note (+5 pts por frame enquanto segura)
        function handleHoldProgress(note, stringY, zoneX) {
            if (note.holdComplete || note.holdBroken || !note.holding) return;

            // Continua válido enquanto o mouse estiver pressionado e próximo da corda
            const onString = mouseDown && Math.abs(mouse.y - stringY) <= 45;
            if (!onString) {
                note.holdBroken = true;
                note.holding = false;
                synth.stopHoldNote(note.stringIndex);
                combo = 0;
                showFeedback("BREAK!", zoneX, stringY, "gray");
                updateScoreDisplay();
                return;
            }

            // Pontuação contínua de sustentação
            score += (frenzyTime > 0) ? 10 : 5;

            // Completou: a extremidade da cauda passou a linha de captura
            const tailStartX = note.x - (note.tailLength || 0);
            if (tailStartX >= zoneX) {
                note.holdComplete = true;
                note.holding = false;
                synth.stopHoldNote(note.stringIndex);
                combo++;
                showFeedback("HOLD!", zoneX, stringY, "gold");
                updateScoreDisplay();
                checkLevelUp();
            }
        }

        // Finaliza uma Hold Note ao sair de cena
        function finalizeHold(note) {
            if (note.holdComplete) return;
            synth.stopHoldNote(note.stringIndex);
            const stringY = strings[note.stringIndex].points[0].y;
            if (note.holdStarted) {
                // Tentou segurar mas não completou
                if (!note.holdBroken) {
                    combo = 0;
                    showFeedback("BREAK!", note.x, stringY, "gray");
                    updateScoreDisplay();
                }
            } else {
                // Nunca tentou segurar = nota perdida (perde vida)
                notePassed(note);
            }
        }

        // Desenhar zonas de captura
        function drawCaptureZones() {
            captureZones.forEach(zone => {
                const y = strings[zone.stringIndex].points[0].y;
                
                // Desenhar zona de captura mais visível
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(zone.x - zone.width/2, y - 40, zone.width, 80);
                
                // Adicionar borda para melhor visibilidade
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(zone.x - zone.width/2, y - 40, zone.width, 80);

                // Aura neon verde quando o Escudo está ativo
                if (hasShield) {
                    const angle = Date.now() * 0.003;
                    ctx.save();
                    ctx.strokeStyle = '#00ff87';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#00ff87';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(zone.x, y, 36, angle, angle + Math.PI * 1.5);
                    ctx.stroke();
                    ctx.restore();
                }
                
                // Adicionar linha central para indicar o ponto ideal de captura
                ctx.beginPath();
                ctx.moveTo(zone.x, y - 40);
                ctx.lineTo(zone.x, y + 40);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        // Capturar uma nota
        function captureNote(note, precision) {
            // Tocar som de captura
            noteCaptureSound.currentTime = 0;
            noteCaptureSound.play().catch(error => console.error("Erro ao tocar som de captura:", error));

            // Tocar nota procedural de acordo com a escala pentatônica da corda
            const freq = getStringFrequency(note.stringIndex);
            synth.playNote(freq, 0.3);

            // Ondulação (Ripple) na corda ao capturar a nota
            triggerRipple(note.stringIndex, note.x, 80);

            // Pontos base + bônus de precisão
            let earnedPoints = note.points;
            
            if (note.type === 'frenzy') {
                frenzyTime = 8.0;
                triggerScreenShake(300, 8);
                showFeedback("FRENZY!", note.x, strings[note.stringIndex].points[0].y, "gold");
            } else if (note.type === 'shield') {
                hasShield = true;
                showFeedback("SHIELD UP!", note.x, strings[note.stringIndex].points[0].y, "#00ff87");
            } else {
                if (precision > 0.9) {
                    earnedPoints += 5; // Perfect timing
                    showFeedback("PERFECT!", note.x, strings[note.stringIndex].points[0].y, "gold");
                } else if (precision > 0.7) {
                    showFeedback("GREAT!", note.x, strings[note.stringIndex].points[0].y, "lime");
                } else {
                    showFeedback("GOOD", note.x, strings[note.stringIndex].points[0].y, "white");
                }
            }
            
            // Aplicar multiplicador de combo
            combo++;
            let multiplier = 1;
            
            if (combo >= 20) multiplier = 5;
            else if (combo >= 10) multiplier = 3;
            else if (combo >= 5) multiplier = 2;

            if (frenzyTime > 0) multiplier *= 2;
            
            score += earnedPoints * multiplier;
            
            // Atualizar UI
            updateScoreDisplay();
            
            // Criar efeito visual
            createCaptureEffect(note);
            
            // Desativar a nota
            note.active = false;
            
            // Verificar aumento de nível
            checkLevelUp();
        }

        // Mostrar feedback visual
        function showFeedback(text, x, y, color) {
            const feedback = document.createElement('div');
            feedback.textContent = text;
            feedback.style.position = 'absolute';
            feedback.style.left = `${x}px`;
            feedback.style.top = `${y - 30}px`;
            feedback.style.color = color;
            feedback.style.fontWeight = 'bold';
            feedback.style.fontSize = '18px';
            feedback.style.textShadow = '0 0 5px black';
            feedback.style.pointerEvents = 'none';
            feedback.style.zIndex = '1000';
            feedback.style.transition = 'transform 0.5s, opacity 0.5s';
            
            document.body.appendChild(feedback);
            
            // Animação
            setTimeout(() => {
                feedback.style.transform = 'translateY(-30px)';
                feedback.style.opacity = '0';
            }, 10);
            
            // Remover após animação
            setTimeout(() => {
                document.body.removeChild(feedback);
            }, 500);
        }

        // Criar efeito visual para captura
        function createCaptureEffect(note) {
            // Intensificar vibração da corda
            const string = strings[note.stringIndex];
            string.amplitude = params.vibrationAmplitude * 2;
            
            // Restaurar amplitude normal após um tempo
            setTimeout(() => {
                string.amplitude = params.vibrationAmplitude;
            }, 300);
        }

        // Quando o jogador erra uma nota
        function missedNote() {
            combo = 0;
            showFeedback("MISS!", mouse.x, mouse.y, "yellow");
            updateScoreDisplay();
        }

        // Quando uma nota passa da tela sem ser capturada
        function notePassed(note) {
            const stringY = strings[note.stringIndex].points[0].y;
            triggerRipple(note.stringIndex, canvas.width, 40);

            if (hasShield) {
                hasShield = false;
                showFeedback("SHIELD BLOCK!", canvas.width * 0.9, stringY, "#00ff87");
                triggerScreenShake(200, 5);
            } else {
                lives--;
                combo = 0;
                showFeedback("LOST!", canvas.width, stringY, "red");
                if (lives <= 0) {
                    gameOver();
                }
            }

            updateScoreDisplay();
        }

        // Verificar aumento de nível
        function checkLevelUp() {
            // Aumentar nível a cada 500 pontos
            const newLevel = Math.floor(score / 500) + 1;
            
            if (newLevel > level) {
                level = newLevel;
                showLevelUp();
            }
        }

        // Mostrar animação de aumento de nível
        function showLevelUp() {
            const levelUpText = document.createElement('div');
            levelUpText.textContent = `LEVEL ${level}`;
            levelUpText.style.position = 'absolute';
            levelUpText.style.left = '50%';
            levelUpText.style.top = '50%';
            levelUpText.style.transform = 'translate(-50%, -50%)';
            levelUpText.style.color = 'gold';
            levelUpText.style.fontWeight = 'bold';
            levelUpText.style.fontSize = '48px';
            levelUpText.style.textShadow = '0 0 10px black';
            levelUpText.style.zIndex = '1000';
            
            document.body.appendChild(levelUpText);
            
            // Remover após animação
            setTimeout(() => {
                document.body.removeChild(levelUpText);
            }, 2000);
        }

        // Game over
        function gameOver() {
            gameActive = false;
            backgroundMusic.onended = null;
            backgroundMusic.pause(); // Pausa a música de fundo
            backgroundMusic.currentTime = 0; // Opcional: reseta a música para o início
            // Após o game over, "Jogar Novamente" volta para o modo default
            customMode = false;
            noteQueue = [];
            
            // Verificar se a pontuação atual é um high score
            const isHighScore = checkHighScore(score);
            
            // Mostrar tela de game over
            const gameOverScreen = document.createElement('div');
            gameOverScreen.style.position = 'absolute';
            gameOverScreen.style.left = '0';
            gameOverScreen.style.top = '0';
            gameOverScreen.style.width = '100%';
            gameOverScreen.style.height = '100%';
            gameOverScreen.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
            gameOverScreen.style.display = 'flex';
            gameOverScreen.style.flexDirection = 'column';
            gameOverScreen.style.justifyContent = 'center';
            gameOverScreen.style.alignItems = 'center';
            gameOverScreen.style.zIndex = '2000';
            
            const gameOverText = document.createElement('h1');
            gameOverText.textContent = 'GAME OVER';
            gameOverText.style.color = 'red';
            gameOverText.style.fontSize = '48px';
            gameOverText.style.marginBottom = '20px';
            
            const scoreText = document.createElement('h2');
            scoreText.textContent = `Final Score: ${score}`;
            scoreText.style.color = 'white';
            scoreText.style.fontSize = '36px';
            scoreText.style.marginBottom = '30px';
            
            gameOverScreen.appendChild(gameOverText);
            gameOverScreen.appendChild(scoreText);
            
            // Criar o botão de reinício antecipadamente para referência
            const restartButton = document.createElement('button');
            restartButton.textContent = 'Jogar Novamente';
            restartButton.style.padding = '10px 20px';
            restartButton.style.fontSize = '24px';
            restartButton.style.backgroundColor = '#4caf50';
            restartButton.style.color = 'white';
            restartButton.style.border = 'none';
            restartButton.style.borderRadius = '5px';
            restartButton.style.cursor = 'pointer';
            restartButton.style.marginTop = '20px';
            
            // Declarar nameInput no escopo da função principal
            let nameInput = null;
            
            // Se for um high score, mostrar formulário para nome
            if (isHighScore) {
                const highScoreMessage = document.createElement('p');
                highScoreMessage.textContent = 'Novo recorde! Digite seu nome:';
                highScoreMessage.style.color = 'gold';
                highScoreMessage.style.fontSize = '24px';
                highScoreMessage.style.marginBottom = '10px';
                
                nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.maxLength = 15;
                nameInput.placeholder = 'Seu nome';
                nameInput.style.padding = '10px';
                nameInput.style.fontSize = '18px';
                nameInput.style.marginBottom = '20px';
                nameInput.style.width = '250px';
                nameInput.style.textAlign = 'center';
                nameInput.style.borderRadius = '5px';
                nameInput.style.border = '2px solid #4caf50';
                
                const submitButton = document.createElement('button');
                submitButton.textContent = 'Salvar Pontuação';
                submitButton.style.padding = '10px 20px';
                submitButton.style.fontSize = '18px';
                submitButton.style.backgroundColor = '#4caf50';
                submitButton.style.color = 'white';
                submitButton.style.border = 'none';
                submitButton.style.borderRadius = '5px';
                submitButton.style.cursor = 'pointer';
                submitButton.style.marginBottom = '30px';
                
                submitButton.addEventListener('click', () => {
                    const playerName = nameInput.value.trim() || 'Anônimo';
                    saveHighScore(playerName, score);
                    
                    // Remover formulário e mostrar high scores
                    gameOverScreen.removeChild(highScoreMessage);
                    gameOverScreen.removeChild(nameInput);
                    gameOverScreen.removeChild(submitButton);
                    
                    // Mostrar tabela de high scores
                    const highScoresTable = createHighScoresTable();
                    gameOverScreen.insertBefore(highScoresTable, restartButton);
                });
                
                gameOverScreen.appendChild(highScoreMessage);
                gameOverScreen.appendChild(nameInput);
                gameOverScreen.appendChild(submitButton);
            } else {
                // Mostrar tabela de high scores diretamente
                const highScoresTable = createHighScoresTable();
                gameOverScreen.appendChild(highScoresTable);
            }
            
            restartButton.addEventListener('click', () => {
                document.body.removeChild(gameOverScreen);
                // Retomar a música default no replay
                backgroundMusic.src = '../assets/sounds/happy-relaxing-loop.mp3';
                backgroundMusic.loop = true;
                backgroundMusic.currentTime = 0;
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                backgroundMusic.play().catch(() => {});
                initGame();
            });
            
            gameOverScreen.appendChild(restartButton);
            document.body.appendChild(gameOverScreen);
            
            // Focar no campo de entrada se for high score
            if (isHighScore && nameInput) {
                setTimeout(() => nameInput.focus(), 100);
            }
        }

        // Verificar se a pontuação atual é um high score
        function checkHighScore(score) {
            const highScores = getHighScores();
            
            // Se temos menos de 5 pontuações, é automaticamente um high score
            if (highScores.length < 5) {
                return true;
            }
            
            // Verificar se a pontuação é maior que a menor pontuação na lista
            const lowestScore = highScores[highScores.length - 1].score;
            return score > lowestScore;
        }
        
        // Obter high scores do localStorage
        function getHighScores() {
            const highScores = localStorage.getItem('stringCatcherHighScores');
            return highScores ? JSON.parse(highScores) : [];
        }
        
        // Salvar high score
        function saveHighScore(name, score) {
            let highScores = getHighScores();
            
            // Adicionar nova pontuação
            highScores.push({ name, score, date: new Date().toLocaleDateString() });
            
            // Ordenar por pontuação (decrescente)
            highScores.sort((a, b) => b.score - a.score);
            
            // Manter apenas os 5 melhores
            highScores = highScores.slice(0, 5);
            
            // Salvar no localStorage
            localStorage.setItem('stringCatcherHighScores', JSON.stringify(highScores));
        }
        
        // Criar tabela de high scores
        function createHighScoresTable() {
            const highScores = getHighScores();
            const currentScore = score; // Capturar a pontuação atual
            const currentDate = new Date().toLocaleDateString();
            
            const container = document.createElement('div');
            container.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            container.style.padding = '20px';
            container.style.borderRadius = '10px';
            container.style.marginTop = '20px';
            container.style.marginBottom = '20px';
            container.style.width = '80%';
            container.style.maxWidth = '500px';
            
            const title = document.createElement('h3');
            title.textContent = 'Melhores Pontuações';
            title.style.color = 'gold';
            title.style.fontSize = '24px';
            title.style.marginBottom = '15px';
            title.style.textAlign = 'center';
            
            container.appendChild(title);
            
            if (highScores.length === 0) {
                const noScores = document.createElement('p');
                noScores.textContent = 'Ainda não há pontuações registradas.';
                noScores.style.color = 'white';
                noScores.style.textAlign = 'center';
                container.appendChild(noScores);
                return container;
            }
            
            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.style.color = 'white';
            
            // Cabeçalho da tabela
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            const headers = ['Posição', 'Nome', 'Pontuação', 'Data'];
            headers.forEach(headerText => {
                const header = document.createElement('th');
                header.textContent = headerText;
                header.style.padding = '8px';
                header.style.borderBottom = '2px solid #4caf50';
                header.style.textAlign = 'left';
                headerRow.appendChild(header);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Corpo da tabela
            const tbody = document.createElement('tbody');
            
            highScores.forEach((score, index) => {
                const row = document.createElement('tr');
                
                // Destacar a linha se for a pontuação atual
                if (score.score === currentScore && score.date === currentDate) {
                    row.style.backgroundColor = 'rgba(76, 175, 80, 0.3)';
                }
                
                // Posição
                const positionCell = document.createElement('td');
                positionCell.textContent = `${index + 1}º`;
                positionCell.style.padding = '8px';
                positionCell.style.borderBottom = '1px solid #555';
                
                // Nome
                const nameCell = document.createElement('td');
                nameCell.textContent = score.name;
                nameCell.style.padding = '8px';
                nameCell.style.borderBottom = '1px solid #555';
                
                // Pontuação
                const scoreCell = document.createElement('td');
                scoreCell.textContent = score.score;
                scoreCell.style.padding = '8px';
                scoreCell.style.borderBottom = '1px solid #555';
                
                // Data
                const dateCell = document.createElement('td');
                dateCell.textContent = score.date;
                dateCell.style.padding = '8px';
                dateCell.style.borderBottom = '1px solid #555';
                
                row.appendChild(positionCell);
                row.appendChild(nameCell);
                row.appendChild(scoreCell);
                row.appendChild(dateCell);
                
                tbody.appendChild(row);
            });
            
            table.appendChild(tbody);
            container.appendChild(table);
            
            return container;
        }

        // Atualizar display de pontuação
        function updateScoreDisplay() {
            // Criar ou atualizar o elemento de pontuação
            let scoreDisplay = document.getElementById('score-display');
            
            if (!scoreDisplay) {
                scoreDisplay = document.createElement('div');
                scoreDisplay.id = 'score-display';
                scoreDisplay.style.position = 'absolute';
                scoreDisplay.style.top = '20px';
                scoreDisplay.style.right = '20px';
                scoreDisplay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
                scoreDisplay.style.color = 'white';
                scoreDisplay.style.padding = '10px';
                scoreDisplay.style.borderRadius = '5px';
                scoreDisplay.style.fontFamily = 'Arial, sans-serif';
                scoreDisplay.style.zIndex = '1000';
                
                document.body.appendChild(scoreDisplay);
            }
            
            // Determinar multiplicador atual
            let multiplier = 1;
            if (combo >= 20) multiplier = 5;
            else if (combo >= 10) multiplier = 3;
            else if (combo >= 5) multiplier = 2;
            if (frenzyTime > 0) multiplier *= 2;
            
            const shieldBadge = hasShield ? '<div style="color:#00ff87; font-weight:bold; margin-top:4px;">🛡️ Shield Active</div>' : '';

            // Atualizar conteúdo
            scoreDisplay.innerHTML = `
                <div style="font-size: 24px; font-weight: bold;">Score: ${score}</div>
                <div>Combo: ${combo} (x${multiplier})</div>
                <div>Lives: ${'❤️'.repeat(lives)}</div>
                <div>Level: ${level}</div>
                ${shieldBadge}
            `;
        }

        // Inicializar o jogo
        addStartGameButton();
    </script>
</body>
</html>
