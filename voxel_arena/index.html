                const domeMat = new THREE.MeshBasicMaterial({ color: 0xbd00ff, wireframe: true, transparent: true, opacity: 0.6 });
                const dome = new THREE.Mesh(domeGeo, domeMat);
                dome.position.y = 4.0;
                group.add(dome);
                this.shieldDome = dome;

                const beamGeo = new THREE.CylinderGeometry(1.5, 1.5, 100, 16);
                beamGeo.rotateX(Math.PI / 2);
                beamGeo.translate(0, 0, -50);
                const beamMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending });
                const beamMesh = new THREE.Mesh(beamGeo, beamMat);
                beamMesh.position.set(0, 3.8, 0);
                group.add(beamMesh);
                this.laserBeamMesh = beamMesh;

                group.scale.setScalar(4.5);
                return group;
            }

            createOrbitalCrystals() {
                const geo = new THREE.IcosahedronGeometry(1.2);
                const mat = new THREE.MeshStandardMaterial({ color: 0xbd00ff, emissive: 0xbd00ff, emissiveIntensity: 2.5, roughness: 0.2 });
                for (let i = 0; i < 3; i++) {
                    const crystal = new THREE.Mesh(geo, mat.clone());
                    crystal.hp = 80; crystal.maxHp = 80; crystal.index = i;
                    crystal.castShadow = true;
                    this.scene.add(crystal);
                    this.crystals.push(crystal);
                }
            }

            update(dt, game) {
                if (this.isDead || !game) return;
                this.time += dt;

                const playerPos = game.player.mesh.position;

                if (this.laserState !== 'firing') {
                    this.mesh.lookAt(playerPos.x, this.mesh.position.y, playerPos.z);
                }

                if (this.phase === 1) {
                    this.updateOrbitalCrystals(dt);
                    this.smashTimer -= dt;
                    if (this.smashTimer <= 0) {
                        this.smashTimer = 6.0;
                        this.performSmashAttack(game);
                    }
                    if (this.crystals.length === 0) {
                        this.phase = 2;
                        this.shieldDome.visible = false;
                        document.getElementById('boss-subtext').textContent = "FASE 2: HYPERBEAM DE FUSÃO";
                        game.flashFog(0x00ffff);
                        this.playAudio('boss_roar');
                    }
                } else if (this.phase === 2) {
                    this.updateHyperbeam(dt, game);
                    if (this.hp <= this.maxHp * 0.35) {
                        this.transitionToPhase3(game);
                    }
                } else if (this.phase === 3) {
                    this.updateOverdrive(dt, game);
                }

                const hpPct = Math.max(0, (this.hp / this.maxHp) * 100);
                document.getElementById('boss-hp-fill').style.width = `${hpPct}%`;
            }

            updateOrbitalCrystals(dt) {
                this.crystalAngle += dt * 1.5;
                const radius = 5.0 * 4.5;
                const bossCenter = this.mesh.position.clone().add(new THREE.Vector3(0, 3.5 * 4.5, 0));

                this.crystals.forEach((c, i) => {
                    const angle = this.crystalAngle + (i * Math.PI * 2 / 3);
                    c.position.x = bossCenter.x + Math.cos(angle) * radius;
                    c.position.z = bossCenter.z + Math.sin(angle) * radius;
                    c.position.y = bossCenter.y + Math.sin(this.time * 3 + i) * 1.5;
                    c.rotation.x += dt * 2;
                    c.rotation.y += dt * 3;
                });
            }

            performSmashAttack(game) {
                const lArm = this.leftArm, rArm = this.rightArm;
                let t = 0;
                const anim = () => {
                    t += 0.1;
                    if (t <= 1) {
                        lArm.rotation.x = Math.sin(t * Math.PI) * (-Math.PI / 2);
                        rArm.rotation.x = Math.sin(t * Math.PI) * (-Math.PI / 2);
                        requestAnimationFrame(anim);
                    } else {
                        lArm.rotation.x = 0; rArm.rotation.x = 0;
                    }
                };
                anim();

                const ringGeo = new THREE.RingGeometry(0.5, 2.0, 32);
                ringGeo.rotateX(-Math.PI / 2);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xbd00ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(this.mesh.position);
                ring.position.y = 0.1;
                this.scene.add(ring);

                activeVFX.push({
                    group: ring, light: null, initialIntensity: 0, maxLife: 1500, life: 1500,
                    customUpdate: (dt, age) => {
                        ring.scale.setScalar(1 + age * 22);
                        ringMat.opacity = 0.9 * (1 - age);
                    }
                });

                const dist = game.player.mesh.position.distanceTo(this.mesh.position);
                if (dist < 22.0) {
                    game.player.takeDamage(18);
                    const pushDir = game.player.mesh.position.clone().sub(this.mesh.position).normalize();
                    game.player.mesh.position.addScaledVector(pushDir, 5.0);
                    if (game.shakeManager) game.shakeManager.trigger(pushDir, 1.2, 0.4);
                    if (game.popupManager) game.popupManager.spawnPopup(game.player.mesh.position, '-18 IMPACTO', '#bd00ff');
                }
            }

            updateHyperbeam(dt, game) {
                this.laserCooldown -= dt;

                if (this.laserState === 'idle' && this.laserCooldown <= 0) {
                    this.laserState = 'charging';
                    this.laserTimer = 2.0;
                    this.playAudio('laser_charge');
                    if (game.popupManager) game.popupManager.spawnPopup(this.mesh.position, 'CARREGANDO HYPERBEAM!', '#00ffff');
                } else if (this.laserState === 'charging') {
                    this.laserTimer -= dt;
                    this.chestCore.material.emissiveIntensity = 2.0 + (2.0 - this.laserTimer) * 4.0;
                    if (this.laserTimer <= 0) {
                        this.laserState = 'firing';
                        this.laserTimer = 4.0;
                        this.laserAngle = this.mesh.rotation.y - Math.PI / 2;
                        this.playAudio('laser_beam');
                    }
                } else if (this.laserState === 'firing') {
                    this.laserTimer -= dt;
                    this.laserAngle += (Math.PI / 4.0) * dt;
                    this.mesh.rotation.y = this.laserAngle;
                    this.laserBeamMesh.material.opacity = 0.85;

                    const playerPos = game.player.mesh.position;
                    const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.mesh.rotation.y);
                    const toPlayer = playerPos.clone().sub(this.mesh.position);
                    toPlayer.y = 0;
                    const proj = toPlayer.dot(fwd);
                    const closest = this.mesh.position.clone().addScaledVector(fwd, proj);
                    const distToBeam = playerPos.distanceTo(closest);

                    if (distToBeam < 3.5 && proj > 0 && proj < 70) {
                        game.player.takeDamage(25 * dt);
                        if (game.popupManager && Math.random() < 0.2) {
                            game.popupManager.spawnPopup(playerPos, '-25 LASER', '#00ffff');
                        }
                        if (game.shakeManager) game.shakeManager.trigger(toPlayer, 0.5, 0.1);
                    }

                    if (this.laserTimer <= 0) {
                        this.laserState = 'idle';
                        this.laserCooldown = 12.0;
                        this.laserBeamMesh.material.opacity = 0.0;
                        this.chestCore.material.emissiveIntensity = 2.0;
                    }
                }
            }

            transitionToPhase3(game) {
                this.phase = 3;
                this.shieldDome.visible = false;
                document.getElementById('boss-subtext').textContent = "FASE 3: SOBRECARGA ENRAIVECIDA";
                game.flashFog(0xff0000);
                this.playAudio('boss_roar');

                const debrisGroup = new THREE.Group();
                for (let i = 0; i < 6; i++) {
                    const piece = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0), new THREE.MeshStandardMaterial({ color: 0x1a0f30, roughness: 0.9 }));
                    piece.position.copy(this.mesh.position).add(new THREE.Vector3((Math.random()-0.5)*4, 4, (Math.random()-0.5)*4));
                    debrisGroup.add(piece);
                }
                this.scene.add(debrisGroup);

                activeVFX.push({
                    group: debrisGroup, light: null, initialIntensity: 0, maxLife: 2500, life: 2500,
                    customUpdate: (dt, age) => {
                        debrisGroup.children.forEach(c => {
                            c.position.y -= dt * 8.0;
                            c.position.y = Math.max(0.5, c.position.y);
                            c.rotation.x += dt * 5;
                        });
                    }
                });

                this.chestCore.material.color.setHex(0xff0000);
                this.chestCore.material.emissive.setHex(0xff0000);
                this.chestCore.material.emissiveIntensity = 6.0;
                this.coreLight.color.setHex(0xff0000);
            }

            updateOverdrive(dt, game) {
                this.phase3Timer += dt;
                const speed = 7.0;
                const dir = game.player.mesh.position.clone().sub(this.mesh.position);
                dir.y = 0;
                if (dir.length() > 3.0) {
                    dir.normalize();
                    this.mesh.position.addScaledVector(dir, speed * dt);
                }

                if (this.phase3Timer >= 8.0) {
                    this.phase3Timer = 0;
                    this.spawnServantsAndMissiles(game);
                }
            }

            spawnServantsAndMissiles(game) {
                if (game.enemyManager) {
                    for (let i = 0; i < 3; i++) game.enemyManager.spawnEnemy('basic');
                }
                if (game.popupManager) game.popupManager.spawnPopup(this.mesh.position, 'SERVOS & MÍSSEIS!', '#ff0033');

                for (let i = 0; i < 3; i++) {
                    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
                    cube.position.copy(this.mesh.position).add(new THREE.Vector3((i - 1) * 3, 4, 0));
                    this.scene.add(cube);

                    const entry = {
                        group: cube, light: null, initialIntensity: 0, maxLife: 3000, life: 3000,
                        customUpdate: (dt, age) => {
                            if (!game.player) return;
                            const toPlayer = game.player.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)).sub(cube.position);
                            if (toPlayer.length() < 1.2) {
                                game.player.takeDamage(12);
                                entry.life = 0;
                            } else {
                                cube.position.addScaledVector(toPlayer.normalize(), 14.0 * dt);
                                cube.rotation.x += dt * 10;
                            }
                        }
                    };
                    activeVFX.push(entry);
                }
            }

            takeDamage(amount, game, isCritical = false) {
                if (this.isDead) return;

                if (this.phase === 1 && this.crystals.length > 0) {
                    amount *= 0.10;
                    if (game.popupManager) game.popupManager.spawnPopup(this.mesh.position, 'ESCUDADO!', '#bd00ff');
                }

                this.hp -= amount;
                if (isCritical && game) game.bossCriticalHits = (game.bossCriticalHits || 0) + 1;
                if (game) game.bossDamageDealt = (game.bossDamageDealt || 0) + amount;

                this.torsoMesh.material.color.setHex(0xffffff);
                setTimeout(() => { if (!this.isDead && this.torsoMesh) this.torsoMesh.material.color.setHex(0x1a0f30); }, 100);

                if (this.hp <= 0) {
                    this.hp = 0;
                    this.die(game);
                }
            }

            hitCrystal(crystal, amount, game) {
                crystal.hp -= amount;
                crystal.material.color.setHex(0xffffff);
                setTimeout(() => { if (crystal.material) crystal.material.color.setHex(0xbd00ff); }, 80);

                if (crystal.hp <= 0) {
                    this.playAudio('crystal_shatter');
                    this.scene.remove(crystal);
                    if (crystal.geometry) crystal.geometry.dispose();
                    if (crystal.material) crystal.material.dispose();
                    const idx = this.crystals.indexOf(crystal);
                    if (idx !== -1) this.crystals.splice(idx, 1);
                    if (game.popupManager) game.popupManager.spawnPopup(crystal.position, 'CRISTAL QUEBRADO!', '#bd00ff', true);
                }
            }

            playAudio(type) {
                try {
                    if (type === 'boss_roar') {
                        const ctx = window.skillAudioCtx || audioCtx;
                        if (!ctx) return;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(180, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 1.5);
                        gain.gain.setValueAtTime(0.4, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(); osc.stop(ctx.currentTime + 1.5);
                    } else if (type === 'laser_charge') {
                        const ctx = window.skillAudioCtx || audioCtx;
                        if (!ctx) return;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(200, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 2.0);
                        gain.gain.setValueAtTime(0.25, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2.0);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(); osc.stop(ctx.currentTime + 2.0);
                    } else if (type === 'crystal_shatter') {
                        const ctx = window.skillAudioCtx || audioCtx;
                        if (!ctx) return;
                        [2200, 2750, 3100, 4120].forEach(freq => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, ctx.currentTime);
                            gain.gain.setValueAtTime(0.2, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                            osc.connect(gain); gain.connect(ctx.destination);
                            osc.start(); osc.stop(ctx.currentTime + 0.15);
                        });
                    }
                } catch (e) {}
            }

            die(game) {
                this.isDead = true;
                this.scene.remove(this.mesh);
                this.crystals.forEach(c => {
                    this.scene.remove(c);
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                });
                this.crystals = [];

                if (game) {
                    game.endBossBattle(true);
                }
            }
        }

        class Input {
            constructor() {
                this.keys = {};
                this.mouseDown = false;
                this.mouseRightDown = false;
                this.scroll = 0;
                this.mouseX = 0;
                this.mouseY = 0;

                document.addEventListener('keydown', (e) => this.keys[e.code] = true);
                document.addEventListener('keyup', (e) => this.keys[e.code] = false);
                document.addEventListener('mousedown', (e) => {
                    if (e.button === 0) this.mouseDown = true;
                    if (e.button === 2) this.mouseRightDown = true;
                });
                document.addEventListener('mouseup', (e) => {
                    if (e.button === 0) this.mouseDown = false;
                    if (e.button === 2) this.mouseRightDown = false;
                });
                document.addEventListener('wheel', (e) => {
                    this.scroll = Math.sign(e.deltaY);
                });
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = e.movementX;
                    this.mouseY = e.movementY;
                });
            }

            resetFrame() {
                this.mouseX = 0;
                this.mouseY = 0;
                this.scroll = 0;
            }
        }

        class Arena {
            constructor(scene) {
                this.scene = scene;
                this.createFloor();
                this.createWalls();
                this.createEnvironment();
            }

            createFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const c = canvas.getContext('2d');

                c.fillStyle = '#4f8f3f';
                c.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 6000; i++) {
                    const x = Math.random() * 512, y = Math.random() * 512;
                    const size = 1 + Math.random() * 3;
                    const shade = Math.random();
                    const r = 70 + Math.round(shade * 50);
                    const g = 135 + Math.round(shade * 55);
                    const b = 55 + Math.round(shade * 40);
                    c.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.15 + Math.random() * 0.2})`;
                    c.fillRect(x, y, size, size);
                }

                for (let i = 0; i < 30; i++) {
                    const x = Math.random() * 512, y = Math.random() * 512;
                    const r = 10 + Math.random() * 30;
                    c.fillStyle = 'rgba(180, 180, 168, 0.25)';
                    c.beginPath();
                    c.ellipse(x, y, r, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
                    c.fill();
                }

                c.strokeStyle = 'rgba(211, 175, 55, 0.18)';
                c.lineWidth = 2;
                for (let i = 0; i <= 512; i += 64) {
                    c.beginPath(); c.moveTo(i, 0); c.lineTo(i, 512); c.stroke();
                    c.beginPath(); c.moveTo(0, i); c.lineTo(512, i); c.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(8, 8);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            createFloor() {
                const geo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff, roughness: 0.9, metalness: 0.05,
                    map: this.createFloorTexture()
                });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.rotation.x = -Math.PI / 2;
                this.mesh.receiveShadow = true;
                this.scene.add(this.mesh);

                const grid = new THREE.GridHelper(ARENA_SIZE, 20, 0x9fe0c0, 0x4a8a6a);
                grid.material.transparent = true;
                grid.material.opacity = 0.22;
                grid.position.y = 0.02;
                this.scene.add(grid);
            }

            createWalls() {
                const wallHeight = 10;
                const halfSize = ARENA_SIZE / 2;
                const wallGeo = new THREE.BoxGeometry(ARENA_SIZE, wallHeight, 2);
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f1320, roughness: 0.9, metalness: 0.15 });

                const walls = [
                    { pos: [0, wallHeight / 2, -halfSize], rot: 0 },
                    { pos: [0, wallHeight / 2, halfSize], rot: 0 },
                    { pos: [-halfSize, wallHeight / 2, 0], rot: Math.PI / 2 },
                    { pos: [halfSize, wallHeight / 2, 0], rot: Math.PI / 2 }
                ];

                walls.forEach(w => {
                    const mesh = new THREE.Mesh(wallGeo, wallMat);
                    mesh.position.set(...w.pos);
                    mesh.rotation.y = w.rot;
                    mesh.receiveShadow = true;
                    this.scene.add(mesh);
                });
            }

            createEnvironment() {
                this.envMeshes = [];
                const treeGeo = new THREE.BoxGeometry(1, 4, 1);
                const treeMat = new THREE.MeshStandardMaterial({ color: 0x241812, roughness: 0.95 });
                const leafGeo = new THREE.BoxGeometry(3, 3, 3);
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x13241b, roughness: 1.0 });

                for (let i = 0; i < 20; i++) {
                    const x = (Math.random() - 0.5) * ARENA_SIZE * 0.8;
                    const z = (Math.random() - 0.5) * ARENA_SIZE * 0.8;
                    if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;

                    const trunk = new THREE.Mesh(treeGeo, treeMat);
                    trunk.position.set(x, 2, z);
                    trunk.castShadow = true; trunk.receiveShadow = true;
                    this.scene.add(trunk);
                    this.envMeshes.push(trunk);

                    const leaves = new THREE.Mesh(leafGeo, leafMat);
                    leaves.position.set(x, 5, z);
                    leaves.castShadow = true; leaves.receiveShadow = true;
                    this.scene.add(leaves);
                    this.envMeshes.push(leaves);
                }

                const rockGeo = new THREE.DodecahedronGeometry(1);
                const rockMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.9 });

                for (let i = 0; i < 15; i++) {
                    const x = (Math.random() - 0.5) * ARENA_SIZE * 0.9;
                    const z = (Math.random() - 0.5) * ARENA_SIZE * 0.9;
                    if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;

                    const rock = new THREE.Mesh(rockGeo, rockMat);
                    const scale = 1 + Math.random() * 2;
                    rock.scale.set(scale, scale, scale);
                    rock.position.set(x, scale / 2, z);
                    rock.castShadow = true; rock.receiveShadow = true;
                    this.scene.add(rock);
                    this.envMeshes.push(rock);
                }
            }

            clearCenterObstacles(radius = 10) {
                if (!this.envMeshes) return;
                for (let i = this.envMeshes.length - 1; i >= 0; i--) {
                    const mesh = this.envMeshes[i];
                    if (mesh.position.length() < radius) {
                        this.scene.remove(mesh);
                        if (mesh.geometry) mesh.geometry.dispose();
                        if (mesh.material) mesh.material.dispose();
                        this.envMeshes.splice(i, 1);
                    }
                }
            }
        }

        class Player {
            constructor(scene, camera) {
                this.scene = scene;
                this.camera = camera;
                this.mesh = this.createMesh();
                this.scene.add(this.mesh);

                this.stats = { hp: 100, maxHp: 100, stamina: 100, maxStamina: 100 };
                this.position = new THREE.Vector3(0, 0, 0);
                this.rotation = 0;

                this.yaw = 0;
                this.pitch = -0.5;
                this.zoom = 15;

                this.isAttacking = false;
                this.isDefending = false;
                this.isDodging = false;
                this.attackCooldown = 0;
                this.dodgeCooldown = 0;
                this.enemyManager = null;

                this.skills = [
                    { name: 'Spin', cooldown: 0, maxCooldown: 5,  cdMult: 1.0 },
                    { name: 'Dash', cooldown: 0, maxCooldown: 3,  cdMult: 1.0 },
                    { name: 'Heal', cooldown: 0, maxCooldown: 10, cdMult: 1.0 },
                    { name: 'Ult', cooldown: 0, maxCooldown: 30, cdMult: 1.0 }
                ];

                this.xp = 0;
                this.level = 1;
                this.damageMultiplier = 1.0;
                this.speedMultiplier = 1.0;
                this.staminaRegenBonus = 1.0;
                this.dashRangeMult = 1.0;
                this.healMult = 1.0;
                this.ultMult = 1.0;
                this.idleTimer = 0;
            }

            trySpendStamina(cost) {
                if (this.stats.stamina < cost) {
                    if (this.scene.game) {
                        this.scene.game.flashStamina();
                        if (this.scene.game.popupManager) {
                            this.scene.game.popupManager.spawnPopup(this.mesh.position, 'SEM STAMINA!', '#ff3333', false, true);
                        }
                    }
                    return false;
                }
                this.stats.stamina -= cost;
                return true;
            }

            gainXP(amount) {
                this.xp += amount;
                const xpNeeded = this.level * 120;
                if (this.xp >= xpNeeded) {
                    this.xp -= xpNeeded;
                    this.levelUp();
                }
            }

            levelUp() {
                this.level++;
                if (this.scene.game) this.scene.game.triggerUpgradeDraft();
            }

            createMesh() {
                const group = new THREE.Group();
                const armorColor = 0x3498db;
                const skinColor = 0xffccaa;
                const darkColor = 0x2c3e50;

                const bodyGeo = new THREE.BoxGeometry(0.8, 1.0, 0.5);
                const bodyMat = new THREE.MeshStandardMaterial({ color: armorColor });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1.2; body.castShadow = true;
                group.add(body);

                const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const headMat = new THREE.MeshStandardMaterial({ color: skinColor });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2.0; head.castShadow = true;
                group.add(head);

                const helmGeo = new THREE.BoxGeometry(0.55, 0.2, 0.55);
                const helmMat = new THREE.MeshStandardMaterial({ color: darkColor });
                const helm = new THREE.Mesh(helmGeo, helmMat);
                helm.position.y = 2.2;
                group.add(helm);

                const eyeGeo = new THREE.BoxGeometry(0.1, 0.05, 0.05);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.15, 2.0, -0.26);
                group.add(leftEye);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.15, 2.0, -0.26);
                group.add(rightEye);

                const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
                const armMat = new THREE.MeshStandardMaterial({ color: armorColor });

                const leftArm = new THREE.Mesh(armGeo, armMat);
                leftArm.position.set(-0.6, 1.2, 0);
                group.add(leftArm);

                const rightArm = new THREE.Mesh(armGeo, armMat);
                rightArm.position.set(0.6, 1.2, 0);
                group.add(rightArm);

                const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
                const legMat = new THREE.MeshStandardMaterial({ color: darkColor });

                const leftLeg = new THREE.Mesh(legGeo, legMat);
                leftLeg.position.set(-0.25, 0.45, 0);
                group.add(leftLeg);

                const rightLeg = new THREE.Mesh(legGeo, legMat);
                rightLeg.position.set(0.25, 0.45, 0);
                group.add(rightLeg);

                const swordGeo = new THREE.BoxGeometry(0.1, 1.8, 0.1);
                const swordMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 });
                const sword = new THREE.Mesh(swordGeo, swordMat);
                sword.position.set(0, -0.4, -0.5);
                sword.rotation.x = -Math.PI / 2;
                rightArm.add(sword);
                this.rightArm = rightArm;

                return group;
            }

            update(dt, input) {
                if (this.attackCooldown > 0) this.attackCooldown -= dt;
                if (this.dodgeCooldown > 0) this.dodgeCooldown -= dt;

                if (input.mouseDown && this.attackCooldown <= 0 && !this.isAttacking) {
                    this.attack();
                }
                this.isDefending = input.mouseRightDown && this.stats.stamina > 0;
                if (this.isDefending) {
                    this.stats.stamina = Math.max(0, this.stats.stamina - 15 * dt);
                }

                if (input.keys['Digit1']) this.useSkill(0);
                if (input.keys['Digit2']) this.useSkill(1);
                if (input.keys['Digit3']) this.useSkill(2);
                if (input.keys['Digit4']) this.useSkill(3);

                this.skills.forEach(s => {
                    if (s.cooldown > 0) s.cooldown -= dt;
                });

                if (input.scroll !== 0) {
                    this.zoom += input.scroll * 2;
                    this.zoom = Math.max(5, Math.min(30, this.zoom));
                }

                if (document.pointerLockElement) {
                    this.yaw -= input.mouseX * 0.002;
                    this.pitch -= input.mouseY * 0.002;
                    this.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, this.pitch));
                }

                let speed = 10 * this.speedMultiplier;
                if (this.isDefending) speed *= 0.5;

                const moveDir = new THREE.Vector3();
                if (input.keys['KeyW']) moveDir.z -= 1;
                if (input.keys['KeyS']) moveDir.z += 1;
                if (input.keys['KeyA']) moveDir.x -= 1;
                if (input.keys['KeyD']) moveDir.x += 1;

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

                    this.mesh.position.add(moveDir.multiplyScalar(speed * dt));

                    const halfSize = ARENA_SIZE / 2 - 2;
                    this.mesh.position.x = Math.max(-halfSize, Math.min(halfSize, this.mesh.position.x));
                    this.mesh.position.z = Math.max(-halfSize, Math.min(halfSize, this.mesh.position.z));

                    const angle = Math.atan2(moveDir.x, moveDir.z);
                    this.mesh.rotation.y = angle + Math.PI;
                }

                const movingNow = !!(input.keys['KeyW'] || input.keys['KeyS'] || input.keys['KeyA'] || input.keys['KeyD']);
                if (movingNow || this.isDefending) this.idleTimer = 0; else this.idleTimer += dt;
                if (!this.isDefending) {
                    const regenRate = (this.idleTimer > 1.0 ? 45 : 25) * this.staminaRegenBonus;
                    this.stats.stamina = Math.min(this.stats.maxStamina, this.stats.stamina + regenRate * dt);
                }

                const camX = this.mesh.position.x + this.zoom * Math.sin(this.yaw) * Math.cos(this.pitch);
                const camY = this.mesh.position.y + this.zoom * Math.sin(Math.max(0.1, -this.pitch)) + 2;
                const camZ = this.mesh.position.z + this.zoom * Math.cos(this.yaw) * Math.cos(this.pitch);

                this.camera.position.set(camX, camY, camZ);
                this.camera.lookAt(this.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)));
            }

            attack() {
                if (!this.trySpendStamina(8)) return;
                this.isAttacking = true;
                this.attackCooldown = 0.5;

                const startRot = 0;
                const endRot = -Math.PI / 2;

                let t = 0;
                const anim = () => {
                    t += 0.15;
                    if (t <= 1) {
                        this.rightArm.rotation.x = THREE.MathUtils.lerp(startRot, endRot, Math.sin(t * Math.PI));
                        requestAnimationFrame(anim);
                    } else {
                        this.isAttacking = false;
                        this.rightArm.rotation.x = startRot;
                    }
                };
                anim();

                if (this.enemyManager) {
                    const playerFwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw).normalize();
                    this.enemyManager.checkHit(this.mesh.position, 4, 10 * this.damageMultiplier, playerFwd);
                }
            }

            heal(amount) {
                this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + amount);
            }

            takeDamage(amount) {
                if (this.isDodging) return;

                this.stats.hp -= amount;

                if (this.scene.game && this.scene.game.popupManager) {
                    this.scene.game.popupManager.spawnPopup(this.mesh.position, `-${Math.round(amount)}`, '#ff0033');
                }

                if (amount > 15 && this.scene.game) {
                    this.scene.game.triggerHitstop(80);
                    if (this.scene.game.shakeManager) {
                        this.scene.game.shakeManager.trigger(null, 1.2, 0.35);
                    }
                }

                if (this.mesh.children[0].material) {
                    const oldColor = this.mesh.children[0].material.color.getHex();
                    this.mesh.children[0].material.color.setHex(0xff0000);
                    setTimeout(() => {
                        if (this.mesh && this.mesh.children[0]) {
                            this.mesh.children[0].material.color.setHex(oldColor);
                        }
                    }, 100);
                }

                if (this.stats.hp <= 0) {
                    this.stats.hp = 0;
                    if (this.scene.game) this.scene.game.endGame(false);
                }
            }

            useSkill(index) {
                const skill = this.skills[index];
                if (skill.cooldown > 0) return;

                const STAMINA_COST = [20, 15, 30, 50];
                if (!this.trySpendStamina(STAMINA_COST[index])) return;

                skill.cooldown = skill.maxCooldown * skill.cdMult;

                if (index === 0) { // Spin
                    this.enemyManager.checkHit(this.mesh.position, 8, 20 * this.damageMultiplier);
                    spawnDynamicSkillVFX(this.scene, this.mesh.position, 'spin');
                    playSkillSound('spin');
                } else if (index === 1) { // Dash
                    const fromPos = this.mesh.position.clone();
                    const dist = 10 * this.dashRangeMult;
                    const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                    this.mesh.position.add(fwd.multiplyScalar(dist));
                    const half = ARENA_SIZE / 2 - 2;
                    this.mesh.position.x = Math.max(-half, Math.min(half, this.mesh.position.x));
                    this.mesh.position.z = Math.max(-half, Math.min(half, this.mesh.position.z));
                    spawnDashGhosts(this.scene, this.mesh, fromPos, this.mesh.position.clone());
                    this.enemyManager.checkHit(this.mesh.position, 5, 15 * this.damageMultiplier);
                    playSkillSound('dash');
                } else if (index === 2) { // Heal
                    this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + 30 * this.healMult);
                    spawnDynamicSkillVFX(this.scene, this.mesh.position, 'heal');
                    playSkillSound('heal');
                    if (this.scene.game && this.scene.game.popupManager) {
                        this.scene.game.popupManager.spawnPopup(this.mesh.position, `+${Math.round(30 * this.healMult)} CURA`, '#00ff88');
                    }
                } else if (index === 3) { // Ult
                    this.enemyManager.checkHit(this.mesh.position, 25 * this.ultMult, 100 * this.ultMult);
                    spawnDynamicSkillVFX(this.scene, this.mesh.position, 'ult');
                    playSkillSound('ult');
                }
            }
        }

        class Enemy {
            constructor(scene, position, type = 'basic') {
                this.scene = scene;
                this.type = type;
                this.cfg = ENEMY_CONFIG[type] || ENEMY_CONFIG.basic;
                this.mesh = this.createMesh();
                this.mesh.position.copy(position);
                this.scene.add(this.mesh);

                this.hp = this.cfg.hp;
                this.speed = this.cfg.speed;
                this.damage = this.cfg.damage;
                this.attackCdMax = this.cfg.attackCd;
                this.xpValue = this.cfg.xp;
                this.isDead = false;
                this.attackCooldown = 0;
            }

            createMesh() {
                const enemyGroup = new THREE.Group();
                const cfg = this.cfg;

                const darkArmorMat = new THREE.MeshStandardMaterial({ color: cfg.armor, roughness: 0.9, metalness: 0.2 });
                const fleshMat = new THREE.MeshStandardMaterial({ color: cfg.flesh, roughness: 0.9 });
                const eyeIntensity = this.type === 'basic' ? 2.0 : 3.5;
                const rubyGlowMat = new THREE.MeshStandardMaterial({ color: cfg.eye, emissive: cfg.eye, emissiveIntensity: eyeIntensity });

                const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.9), darkArmorMat);
                torso.position.y = 1.1; torso.castShadow = true; torso.receiveShadow = true;
                enemyGroup.add(torso);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), fleshMat);
                head.position.set(0, 2.0, 0); head.castShadow = true;
                enemyGroup.add(head);

                const eyeGeo = new THREE.BoxGeometry(0.12, 0.08, 0.08);
                const leftEye = new THREE.Mesh(eyeGeo, rubyGlowMat);
                leftEye.position.set(-0.18, 2.05, -0.28);
                enemyGroup.add(leftEye);
                const rightEye = new THREE.Mesh(eyeGeo, rubyGlowMat);
                rightEye.position.set(0.18, 2.05, -0.28);
                enemyGroup.add(rightEye);

                const armGeo = new THREE.BoxGeometry(0.3, 1.1, 0.3);
                const leftArm = new THREE.Mesh(armGeo, darkArmorMat);
                leftArm.position.set(-0.75, 1.2, 0.1); leftArm.rotation.x = 0.2; leftArm.castShadow = true;
                enemyGroup.add(leftArm);
                const rightArm = new THREE.Mesh(armGeo, darkArmorMat);
                rightArm.position.set(0.75, 1.2, 0.1); rightArm.rotation.x = 0.2; rightArm.castShadow = true;
                enemyGroup.add(rightArm);

                const legGeo = new THREE.BoxGeometry(0.4, 0.8, 0.4);
                const leftLeg = new THREE.Mesh(legGeo, darkArmorMat);
                leftLeg.position.set(-0.35, 0.4, 0); leftLeg.castShadow = true;
                enemyGroup.add(leftLeg);
                const rightLeg = new THREE.Mesh(legGeo, darkArmorMat);
                rightLeg.position.set(0.35, 0.4, 0); rightLeg.castShadow = true;
                enemyGroup.add(rightLeg);

                this.flashMats = [darkArmorMat, fleshMat];
                this.baseColors = this.flashMats.map(m => m.color.getHex());

                enemyGroup.scale.setScalar(cfg.scale);
                return enemyGroup;
            }

            update(dt, playerPos) {
                if (this.isDead) return;
                if (this.attackCooldown > 0) this.attackCooldown -= dt;

                const dir = playerPos.clone().sub(this.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist > 2.5) {
                    dir.normalize();
                    this.mesh.position.add(dir.multiplyScalar(this.speed * dt));
                    this.mesh.lookAt(playerPos);
                } else if (this.attackCooldown <= 0) {
                    this.attack();
                }
            }

            attack() {
                this.attackCooldown = this.attackCdMax;
                const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
                this.mesh.position.add(fwd.multiplyScalar(0.5));
                setTimeout(() => this.mesh.position.sub(fwd.multiplyScalar(0.5)), 100);

                if (this.scene.game && this.scene.game.player) {
                    this.scene.game.player.takeDamage(this.damage);
                }
            }

            takeDamage(amount, isCritical = false) {
                this.hp -= amount;
                if (this.flashMats) {
                    this.flashMats.forEach(m => m.color.setHex(0xffffff));
                    setTimeout(() => {
                        if (!this.isDead && this.flashMats) {
                            this.flashMats.forEach((m, i) => m.color.setHex(this.baseColors[i]));
                        }
                    }, 100);
                }

                if (this.scene.game && this.scene.game.popupManager) {
                    const txt = Math.round(amount).toString();
                    if (isCritical) {
                        this.scene.game.popupManager.spawnPopup(this.mesh.position, `${txt}!`, '#ffd700', true);
                    } else {
                        this.scene.game.popupManager.spawnPopup(this.mesh.position, txt, '#00ffff');
                    }
                }

                if (this.hp <= 0) {
                    this.die();
                }
            }

            die() {
                this.isDead = true;
                const deathPos = this.mesh.position.clone();
                this.scene.remove(this.mesh);
                this.mesh.traverse(c => {
                    if (c.isMesh) {
                        if (c.geometry) c.geometry.dispose();
                        if (c.material) {
                            if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                            else c.material.dispose();
                        }
                    }
                });

                const game = this.scene.game;
                if (game && game.xpOrbManager) {
                    game.xpOrbManager.spawnOrb(deathPos, this.xpValue);
                }
            }
        }

        class EnemyManager {
            constructor(scene, player) {
                this.scene = scene;
                this.player = player;
                this.enemies = [];
                this.spawnTimer = 0;
            }

            update(dt, waveNum) {
                if (waveNum >= 6) return; 

                const config = WAVE_CONFIG[waveNum] || WAVE_CONFIG[1];
                this.spawnTimer += dt;
                if (this.spawnTimer >= config.spawnInterval && this.enemies.length < config.maxEnemies) {
                    this.spawnTimer = 0;
                    this.spawnEnemy(this.selectEnemyType(waveNum));
                }

                this.enemies.forEach(e => e.update(dt, this.player.mesh.position));
                this.enemies = this.enemies.filter(e => !e.isDead);
            }

            selectEnemyType(waveNum) {
                const config = WAVE_CONFIG[waveNum];
                if (!config) return 'basic';
                const r = config.ratios;
                const rand = Math.random();
                if (rand < r.basic) return 'basic';
                if (rand < r.basic + r.brute) return 'brute';
                return 'stalker';
            }

            spawnEnemy(type = 'basic') {
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 10;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const pos = new THREE.Vector3(x, 0, z).add(this.player.mesh.position);

                const half = ARENA_SIZE / 2 - 2;
                pos.x = Math.max(-half, Math.min(half, pos.x));
                pos.z = Math.max(-half, Math.min(half, pos.z));

                this.enemies.push(new Enemy(this.scene, pos, type));
            }

            checkHit(origin, range, damage, direction = null) {
                const game = this.scene.game;

                this.enemies.forEach(e => {
                    const toEnemy = e.mesh.position.clone().sub(origin);
                    const dist = toEnemy.length();

                    if (dist < range) {
                        let hit = true;
                        if (direction) {
                            toEnemy.normalize();
                            const angle = direction.angleTo(toEnemy);
                            if (angle > Math.PI / 3) hit = false;
                        }

                        if (hit) {
                            const isCrit = Math.random() < 0.25;
                            const finalDmg = isCrit ? damage * 1.75 : damage;
                            e.takeDamage(finalDmg, isCrit);

                            if (isCrit && game) {
                                game.triggerHitstop(80);
                                if (game.shakeManager) game.shakeManager.trigger(toEnemy, 0.9, 0.35);
                            }
                        }
                    }
                });

                if (game && game.boss && !game.boss.isDead) {
                    const boss = game.boss;

                    boss.crystals.forEach(c => {
                        const toCrystal = c.position.clone().sub(origin);
                        if (toCrystal.length() < range + 2.0) {
                            boss.hitCrystal(c, damage, game);
                        }
                    });

                    const toBoss = boss.mesh.position.clone().sub(origin);
                    if (toBoss.length() < range + 6.0) {
                        const isCrit = Math.random() < 0.25;
                        const finalDmg = isCrit ? damage * 1.75 : damage;
                        boss.takeDamage(finalDmg, game, isCrit);
                        if (game.popupManager) {
                            const txt = Math.round(finalDmg).toString();
                            game.popupManager.spawnPopup(boss.mesh.position, isCrit ? `${txt}!` : txt, isCrit ? '#ffd700' : '#00ffff', isCrit);
                        }
                        if (isCrit) {
                            game.triggerHitstop(80);
                            if (game.shakeManager) game.shakeManager.trigger(toBoss, 1.0, 0.35);
                        }
                    }
                }
            }
        }

        class Item {
            constructor(scene, position, type = 'health') {
                this.scene = scene;
                this.type = type;
                this.mesh = this.createMesh();
                this.mesh.position.copy(position);
                this.mesh.position.y = 0.5;
                this.scene.add(this.mesh);
                this.active = true;
            }

            createMesh() {
                const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.5 });
                const mesh = new THREE.Mesh(geo, mat);

                this.time = Math.random() * 100;
                this.baseY = 0.5;

                return mesh;
            }

            update(dt) {
                this.time += dt * 2;
                this.mesh.position.y = this.baseY + Math.sin(this.time) * 0.2;
                this.mesh.rotation.y += dt;
            }

            pickup() {
                this.active = false;
                this.scene.remove(this.mesh);
                if (this.mesh.geometry) this.mesh.geometry.dispose();
                if (this.mesh.material) {
                    if (Array.isArray(this.mesh.material)) {
                        this.mesh.material.forEach(m => m.dispose());
                    } else {
                        this.mesh.material.dispose();
                    }
                }
            }
        }

        class ItemManager {
            constructor(scene, player) {
                this.scene = scene;
                this.player = player;
                this.items = [];
            }

            spawnItem(position) {
                this.items.push(new Item(this.scene, position));
            }

            update(dt) {
                this.items.forEach(item => {
                    item.update(dt);
                    if (item.mesh.position.distanceTo(this.player.mesh.position) < 1.5) {
                        this.player.heal(20);
                        item.pickup();
                    }
                });
                this.items = this.items.filter(i => i.active);
            }
        }

        class XpOrb {
            constructor(scene, position, xpValue) {
                this.scene = scene;
                this.xpValue = xpValue;
                this.active = true;
                this.time = Math.random() * 100;
                this.magneticSpeed = 0;
                this.mesh = this.createMesh(position);
                this.scene.add(this.mesh);
            }

            createMesh(position) {
                const geo = new THREE.OctahedronGeometry(0.3);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffd700, emissive: 0xcc9900, emissiveIntensity: 1.5,
                    roughness: 0.2, metalness: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                mesh.position.y = 0.6;
                mesh.castShadow = true;
                return mesh;
            }

            update(dt, playerPosition) {
                if (!this.active) return;
                this.mesh.rotation.y += dt * 2.5;
                this.mesh.rotation.x += dt * 1.2;
                this.time += dt * 3.0;
                this.mesh.position.y = 0.6 + Math.sin(this.time) * 0.15;

                const toPlayer = playerPosition.clone().sub(this.mesh.position);
                const distance = toPlayer.length();
                if (distance < 8.0) {
                    this.magneticSpeed += dt * 30.0;
                    toPlayer.normalize();
                    this.mesh.position.addScaledVector(toPlayer, this.magneticSpeed * dt);
                }
            }

            destroy() {
                this.active = false;
                this.scene.remove(this.mesh);
                if (this.mesh.geometry) this.mesh.geometry.dispose();
                if (this.mesh.material) this.mesh.material.dispose();
            }
        }

        class XpOrbManager {
            constructor(scene, player) {
                this.scene = scene;
                this.player = player;
                this.orbs = [];
            }

            spawnOrb(position, xpValue) {
                if (this.orbs.length >= 40) {
                    const oldest = this.orbs.shift();
                    if (oldest) oldest.destroy();
                }
                this.orbs.push(new XpOrb(this.scene, position, xpValue));
            }

            update(dt) {
                this.orbs.forEach(orb => {
                    orb.update(dt, this.player.mesh.position);
                    if (orb.mesh.position.distanceTo(this.player.mesh.position) < 1.2) {
                        this.player.gainXP(orb.xpValue);
                        orb.destroy();
                    }
                });
                this.orbs = this.orbs.filter(o => o.active);
            }
        }

        class Game {
            constructor() {
                this.container = document.getElementById('game-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x5aa0dc);
                this.scene.fog = new THREE.FogExp2(0xc9e4f0, 0.02);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 15, 15);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.15;
                this.container.appendChild(this.renderer.domElement);

                const hemiLight = new THREE.HemisphereLight(0xbfd9ff, 0x8a7a5a, 0.95);
                this.scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffe0b3, 2.6);
                dirLight.position.set(-20, 30, -20);
                dirLight.castShadow = true;
                dirLight.shadow.camera.left = -50;
                dirLight.shadow.camera.right = 50;
                dirLight.shadow.camera.top = 50;
                dirLight.shadow.camera.bottom = -50;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                this.scene.add(dirLight);

                this.createSkyDome();

                this.input = new Input();
                this.arena = new Arena(this.scene);
                this.player = new Player(this.scene, this.camera);
                this.itemManager = new ItemManager(this.scene, this.player);
                this.scene.game = this;
                this.enemyManager = new EnemyManager(this.scene, this.player);
                this.player.enemyManager = this.enemyManager;
                this.xpOrbManager = new XpOrbManager(this.scene, this.player);

                this.shakeManager = new ScreenShakeManager();
                this.popupManager = new DamagePopupManager(this.camera);
                this.geyserManager = new LavaGeyserManager(this.scene);
                this.gravityNexus = new GravityNexus(this.scene);
                this.boss = null;
                this.hitstopTimer = 0;

                this.bossFightStartTime = 0;
                this.bossCriticalHits = 0;
                this.bossDamageDealt = 0;

                this.currentWave = 1;
                this.baseFogColor = new THREE.Color(0xc9e4f0);
                this.fogFlashTimer = 0;

                this.clock = new THREE.Clock();
                this.isRunning = false;
                this.timeLeft = 300;
                this.gameOver = false;

                window.addEventListener('resize', () => this.onResize());
                document.getElementById('start-btn').addEventListener('click', () => this.start());

                this.renderer.domElement.addEventListener('click', () => {
                    if (this.isRunning) this.renderer.domElement.requestPointerLock();
                });

                this.animate();
            }

            createSkyDome() {
                const canvas = document.createElement('canvas');
                canvas.width = 16; canvas.height = 512;
                const c = canvas.getContext('2d');
                const grad = c.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0.0, '#2b5aa7');
                grad.addColorStop(0.45, '#5aa0dc');
                grad.addColorStop(0.75, '#a8d4ef');
                grad.addColorStop(1.0, '#c9e4f0');
                c.fillStyle = grad;
                c.fillRect(0, 0, 16, 512);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                this.skyDomeMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite: false, fog: false });
                const geo = new THREE.SphereGeometry(400, 32, 16);
                this.skyDome = new THREE.Mesh(geo, this.skyDomeMat);
                this.skyDome.renderOrder = -1;
                this.skyDome.frustumCulled = false;
                this.scene.add(this.skyDome);
            }

            start() {
                document.getElementById('start-screen').classList.add('hidden');
                this.isRunning = true;
                initSkillAudio();
                this.showWaveBanner(1);
            }

            triggerHitstop(ms = 80) {
                this.hitstopTimer = ms / 1000;
            }

            showWaveBanner(n) {
                const labels = {
                    1: 'Incursão Inicial', 2: 'Elites Despertam', 3: 'Caçadores nas Sombras',
                    4: 'Ritmo Frenético', 5: 'Sobrevivência Final', 6: 'Colosso Voxel'
                };
                const banner = document.getElementById('wave-banner');
                banner.innerHTML = `WAVE ${n === 6 ? 'BOSS' : n}<span class="wave-sub">${labels[n] || ''}</span>`;
                banner.classList.remove('show');
                void banner.offsetWidth;
                banner.classList.add('show');
            }

            flashStamina() {
                const bar = document.getElementById('stamina-fill').parentElement;
                bar.classList.remove('exhausted');
                void bar.offsetWidth;
                bar.classList.add('exhausted');
            }

            flashFog(hex) {
                if (this.scene.fog) this.scene.fog.color.setHex(hex);
                this.fogFlashTimer = 0.5;
            }

            spawnBoss() {
                this.currentWave = 6;
                this.showWaveBanner(6);
                document.getElementById('timer').innerText = "BOSS ENCOUNTER";
                document.getElementById('timer').style.color = "#ff3333";
                document.getElementById('wave-info').innerText = "Batalha Final";

                this.enemyManager.enemies.forEach(e => e.die());
                this.enemyManager.enemies = [];

                this.arena.clearCenterObstacles(10);

                const startBg = this.scene.background.clone();
                const targetBg = new THREE.Color(0x1c052e);
                const skyStart = this.skyDomeMat ? this.skyDomeMat.color.clone() : null;
                let t = 0;
                const transition = () => {
                    t += 0.05;
                    if (t <= 1) {
                        this.scene.background.lerpColors(startBg, targetBg, t);
                        if (this.skyDomeMat && skyStart) {
                            this.skyDomeMat.color.lerpColors(skyStart, targetBg, t);
                        }
                        if (this.scene.fog) {
                            this.scene.fog.color.lerpColors(startBg, targetBg, t);
                            this.scene.fog.density = THREE.MathUtils.lerp(0.02, 0.038, t);
                        }
                        requestAnimationFrame(transition);
                    }
                };
                transition();

                document.getElementById('boss-bar-container').classList.remove('hidden');

                this.boss = new VoxelBoss(this.scene, this.player.level);
                this.bossFightStartTime = this.clock.getElapsedTime();
                this.bossCriticalHits = 0;
                this.bossDamageDealt = 0;
            }

            triggerUpgradeDraft() {
                this.isRunning = false;
                document.exitPointerLock();
                const modal = document.getElementById('upgrade-modal');
                const wrapper = document.getElementById('cards-wrapper');
                document.getElementById('level-badge').textContent = `LEVEL ${this.player.level}`;
                wrapper.innerHTML = '';

                const pool = [...UPGRADE_POOL];
                const picks = [];
                for (let i = 0; i < 3 && pool.length; i++) {
                    picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
                }

                picks.forEach(up => {
                    const card = document.createElement('div');
                    card.className = 'upgrade-card';
                    card.innerHTML = `
                        <div class="upgrade-rarity">${up.rarity}</div>
                        <div class="icon-placeholder">${up.icon}</div>
                        <h3>${up.name}</h3>
                        <p>${up.desc}</p>`;
                    card.addEventListener('click', () => {
                        up.apply(this.player);
                        modal.classList.add('hidden');
                        this.isRunning = true;
                        if (this.renderer && this.renderer.domElement) {
                            this.renderer.domElement.requestPointerLock();
                        }
                    });
                    wrapper.appendChild(card);
                });

                modal.classList.remove('hidden');
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const realDt = this.clock.getDelta();

                if (this.hitstopTimer > 0) {
                    this.hitstopTimer -= realDt;
                    this.renderer.render(this.scene, this.camera);
                    return;
                }

                const dt = realDt;

                updateVFX(this.scene, dt);

                if (this.fogFlashTimer > 0) {
                    this.fogFlashTimer -= dt;
                    if (this.fogFlashTimer <= 0 && this.scene.fog && this.currentWave < 6) {
                        this.scene.fog.color.copy(this.baseFogColor);
                    }
                }

                if (this.isRunning && !this.gameOver) {
                    if (this.currentWave <= 5) {
                        this.timeLeft -= dt;
                        if (this.timeLeft <= 0) {
                            this.timeLeft = 0;
                            this.spawnBoss();
                        }
                    }

                    if (this.currentWave <= 5) {
                        const elapsed = 300 - this.timeLeft;
                        const wave = Math.min(5, Math.floor(elapsed / 60) + 1);
                        if (wave !== this.currentWave) {
                            this.currentWave = wave;
                            document.getElementById('wave-info').innerText = `Wave ${wave}`;
                            this.showWaveBanner(wave);
                            if (WAVE_CONFIG[wave] && WAVE_CONFIG[wave].elite) this.flashFog(0x3a0000);
                        }
                    }

                    this.geyserManager.update(dt, this.currentWave, this);
                    if (this.currentWave === 4 || this.currentWave === 6) {
                        this.gravityNexus.setActive(true);
                        this.gravityNexus.update(dt, this);
                    } else {
                        this.gravityNexus.setActive(false);
                    }

                    this.player.update(dt, this.input);
                    this.enemyManager.update(dt, this.currentWave);
                    if (this.boss) this.boss.update(dt, this);
                    this.xpOrbManager.update(dt);
                    this.itemManager.update(dt);
                    this.input.resetFrame();

                    if (this.currentWave <= 5) {
                        const min = Math.floor(this.timeLeft / 60);
                        const sec = Math.floor(this.timeLeft % 60);
                        document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                    }

                    const hpPct = (this.player.stats.hp / this.player.stats.maxHp) * 100;
                    document.getElementById('health-fill').style.width = `${hpPct}%`;

                    const stamPct = (this.player.stats.stamina / this.player.stats.maxStamina) * 100;
                    document.getElementById('stamina-fill').style.width = `${stamPct}%`;

                    const xpPct = (this.player.xp / (this.player.level * 120)) * 100;
                    document.getElementById('xp-fill').style.width = `${Math.min(100, xpPct)}%`;

                    const slots = document.querySelectorAll('.skill-slot');
                    this.player.skills.forEach((s, i) => {
                        const el = document.querySelectorAll('.skill-cooldown')[i];
                        const pct = Math.max(0, (s.cooldown / s.maxCooldown) * 100);
                        el.style.background = `conic-gradient(rgba(5, 7, 10, 0.78) ${pct}%, transparent ${pct}%)`;

                        if (this._cdReady === undefined) this._cdReady = [true, true, true, true];
                        const ready = s.cooldown <= 0;
                        if (ready && !this._cdReady[i]) {
                            const slot = slots[i];
                            slot.classList.remove('ready-pulse');
                            void slot.offsetWidth;
                            slot.classList.add('ready-pulse');
                        }
                        this._cdReady[i] = ready;
                    });

                    this.enemyManager.enemies.forEach(e => {
                        const dist = this.player.mesh.position.distanceTo(e.mesh.position);
                        if (dist < 2.0) {
                            const dir = this.player.mesh.position.clone().sub(e.mesh.position).normalize();
                            this.player.mesh.position.addScaledVector(dir, 0.1);
                            e.mesh.position.subScaledVector(dir, 0.1);
                        }
                    });

                    if (this.boss && !this.boss.isDead) {
                        const dist = this.player.mesh.position.distanceTo(this.boss.mesh.position);
                        if (dist < 6.0) {
                            const dir = this.player.mesh.position.clone().sub(this.boss.mesh.position).normalize();
                            this.player.mesh.position.addScaledVector(dir, 0.1);
                        }
                    }

                    this.popupManager.update(dt);
                    this.shakeManager.update(dt, this.camera.position);
                }

                this.renderer.render(this.scene, this.camera);
            }

            endBossBattle(win) {
                const bossTime = Math.round(this.clock.getElapsedTime() - this.bossFightStartTime);
                const summaryDiv = document.getElementById('boss-stats-summary');
                summaryDiv.innerHTML = `
                    <table class="boss-stats-table">
                        <tr><td>Tempo da Batalha:</td><td>${bossTime}s</td></tr>
                        <tr><td>Acertos Críticos:</td><td>${this.bossCriticalHits || 0}</td></tr>
                        <tr><td>Dano Total no Boss:</td><td>${Math.round(this.bossDamageDealt || 0)}</td></tr>
                        <tr><td>XP Total Acumulada:</td><td>${this.player.xp + (this.player.level - 1) * 120}</td></tr>
                    </table>
                `;
                document.getElementById('boss-bar-container').classList.add('hidden');
                this.endGame(true);
            }

            endGame(win) {
                this.gameOver = true;
                document.exitPointerLock();
                const screen = document.getElementById('game-over-screen');
                screen.classList.remove('hidden');
                document.getElementById('go-title').innerText = win ? "Vitoria Gloriosa!" : "Derrotado";
                document.getElementById('restart-btn').classList.remove('hidden');
                document.getElementById('restart-btn').onclick = () => location.reload();
            }
        }

        window.onload = () => {
            const game = new Game();
            window.__arena = {
                game,
                activeVFX,
                spawnDynamicSkillVFX, spawnDashGhosts, updateVFX,
                initSkillAudio, playSkillSound,
                THREE,
                makeEnemy: (type) => new Enemy(game.scene, new THREE.Vector3(5, 0, 5), type),
                vfxCount: () => activeVFX.length,
                ENEMY_CONFIG, WAVE_CONFIG, UPGRADE_POOL, Enemy, XpOrb,
                orbCount: () => game.xpOrbManager.orbs.length,
                enemyCount: () => game.enemyManager.enemies.length,
                getPlayerState: () => ({
                    xp: game.player.xp, level: game.player.level,
                    hp: game.player.stats.hp, maxHp: game.player.stats.maxHp,
                    stamina: game.player.stats.stamina,
                    damageMultiplier: game.player.damageMultiplier,
                    speedMultiplier: game.player.speedMultiplier,
                    staminaRegenBonus: game.player.staminaRegenBonus,
                    dashRangeMult: game.player.dashRangeMult,
                    healMult: game.player.healMult, ultMult: game.player.ultMult,
                    skillCdMult: game.player.skills.map(s => s.cdMult),
                    currentWave: game.currentWave
                }),
                selectType: (w) => game.enemyManager.selectEnemyType(w),
                spawnBoss: () => game.spawnBoss(),
                triggerHitstop: (ms) => game.triggerHitstop(ms),
                triggerShake: (intensity, duration) => game.shakeManager.trigger(new THREE.Vector3(1, 0, 0), intensity, duration),
                spawnDamagePopup: (txt, col, isCrit) => game.popupManager.spawnPopup(game.player.mesh.position, txt, col, isCrit),
                bossState: () => game.boss ? { hp: game.boss.hp, maxHp: game.boss.maxHp, phase: game.boss.phase, crystals: game.boss.crystals.length } : null,
                geyserCount: () => game.geyserManager.geysers.length,
                isNexusActive: () => game.gravityNexus.active
            };
        };
    </script>
</body>
