<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Arena</title>
    <style>
        /* TASK_001: tipografia ciber-medieval (fallback gracioso se a CDN bloquear) */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Outfit:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070a;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            user-select: none;
        }

        /* HUD */
        #hud-top {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #d4af37;
            font-size: 32px;
            text-shadow: 0 0 10px #000;
        }

        #hud-stats {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-container {
            width: 300px;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            position: relative;
            transform: skewX(-20deg);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .bar-fill {
            height: 100%;
            transition: width 0.2s;
        }

        #health-fill {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            width: 100%;
        }

        #stamina-fill {
            background: linear-gradient(to right, #2980b9, #3498db);
            width: 100%;
        }

        #xp-fill {
            background: linear-gradient(to right, #f1c40f, #f39c12);
            width: 0%;
        }

        #skills-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
        }

        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #777;
            border-radius: 5px;
            /* Circular look comes from cooldown overlay if we want, but keeping square with radial fill is fine too. Let's make it slightly rounded. */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            /* Ensure cooldown stays inside */
        }

        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: conic-gradient(rgba(255, 255, 255, 0.5) 0%, transparent 0%);
            /* transition: none;  We update manually */
        }

        .key-hint {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #aaa;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            color: #d4af37;
            font-size: 64px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #d4af37;
        }

        button {
            background: linear-gradient(to bottom, #555, #222);
            color: #fff;
            border: 2px solid #d4af37;
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin: 10px;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            background: #444;
            box-shadow: 0 0 15px #d4af37;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================================
           === TASK_001 — HUD de Luxo Glassmorphism, Runas SVG & Modais Premium
           ===================================================================== */

        #hud-top { color: #e5c158; }
        #timer {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            text-shadow: 0 0 18px rgba(229, 193, 88, 0.5), 0 0 4px #000;
        }
        #wave-info { font-family: 'Outfit', sans-serif; letter-spacing: 2px; }

        /* Barras com acabamento de vidro fosco + contorno dourado metálico */
        .bar-container {
            width: 320px;
            height: 18px;
            background: rgba(10, 14, 22, 0.6);
            border: 1.5px solid rgba(211, 175, 55, 0.45);
            border-radius: 4px;
            transform: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 6px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
        }
        .bar-fill { box-shadow: 0 0 8px currentColor; }
        #health-fill  { background: linear-gradient(90deg, #962626, #e74c3c); color: #e74c3c; }
        #stamina-fill { background: linear-gradient(90deg, #1b5b82, #3498db); color: #3498db; }
        #xp-fill      { background: linear-gradient(90deg, #c59b27, #f39c12); color: #f39c12; }

        /* Slots de habilidade glassmorphism */
        .skill-slot {
            width: 65px;
            height: 65px;
            background: rgba(12, 17, 28, 0.85);
            border: 2px solid rgba(211, 175, 55, 0.3);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
            overflow: visible;
        }
        .skill-slot:hover {
            border-color: rgba(211, 175, 55, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(211, 175, 55, 0.3);
        }
        .skill-slot svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 6px currentColor);
            transition: transform 0.3s;
        }
        .skill-slot:hover svg { transform: scale(1.15) rotate(5deg); }

        /* Temas de cor por habilidade */
        .skill-slot[data-skill="spin"] { color: #ffd700; }
        .skill-slot[data-skill="dash"] { color: #00ffff; }
        .skill-slot[data-skill="heal"] { color: #00ff88; }
        .skill-slot[data-skill="ult"]  { color: #ff00ff; }

        .key-hint {
            top: auto;
            bottom: -18px;
            color: rgba(229, 193, 88, 0.7);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            text-shadow: 0 0 4px #000;
        }

        /* Cooldown cônico sobre o ícone */
        .skill-cooldown {
            border-radius: 8px;
            background: conic-gradient(rgba(5, 7, 10, 0.78) 0%, transparent 0%);
        }

        /* Flash luminoso ao zerar o cooldown */
        .skill-slot.ready-pulse {
            animation: flashGlow 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        @keyframes flashGlow {
            0%   { box-shadow: 0 0 0px currentColor; filter: brightness(1.0); transform: scale(1.0); }
            30%  { box-shadow: 0 0 30px currentColor; filter: brightness(2.0); transform: scale(1.1); }
            100% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); filter: brightness(1.0); transform: scale(1.0); }
        }

        /* Modais glassmorphic */
        .screen {
            background: radial-gradient(circle, rgba(12, 17, 28, 0.95) 0%, rgba(5, 7, 10, 0.98) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #e5c158;
            text-shadow: 0 0 20px rgba(229, 193, 88, 0.4);
            letter-spacing: 6px;
        }
        button {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #1b2234 0%, #0d121f 100%);
            border: 1.5px solid rgba(229, 193, 88, 0.5);
            border-radius: 6px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        button:hover {
            border-color: #e5c158;
            background: linear-gradient(135deg, #242f49 0%, #131b2e 100%);
            box-shadow: 0 0 20px rgba(229, 193, 88, 0.6);
            transform: scale(1.05);
        }

        /* =====================================================================
           === TASK_002 — Waves, Stamina Pulse & Draft Roguelite Modal
           ===================================================================== */

        /* Banner flutuante de onda */
        #wave-banner {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            font-family: 'Cinzel', serif;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #e5c158;
            text-shadow: 0 0 30px rgba(229, 193, 88, 0.8), 0 0 8px #000;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        #wave-banner.show { animation: waveBannerAnim 2.2s ease-out forwards; }
        @keyframes waveBannerAnim {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); filter: brightness(2); }
            20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            35%  { transform: translate(-50%, -50%) scale(1.0); }
            80%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.0); }
        }
        #wave-banner .wave-sub {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            letter-spacing: 4px;
            color: #c0392b;
            text-shadow: 0 0 12px rgba(231, 76, 60, 0.7);
            margin-top: 6px;
        }

        /* Pulso vermelho de exaustão na barra de stamina */
        .bar-container.exhausted { animation: staminaPulse 0.4s ease-in-out; }
        @keyframes staminaPulse {
            0%, 100% { border-color: rgba(211, 175, 55, 0.45); box-shadow: 0 0 10px rgba(0,0,0,0.8); }
            50%      { border-color: #ff2a2a; box-shadow: 0 0 18px rgba(255, 42, 42, 0.9); }
        }

        /* Modal de Draft de Upgrades */
        #upgrade-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(6, 9, 15, 0.96) 0%, rgba(2, 3, 5, 0.99) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }
        #upgrade-title-container { text-align: center; margin-bottom: 40px; }
        #upgrade-title-container h1 { font-size: 44px; margin: 0; }
        .level-badge {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000; font-weight: bold;
            padding: 6px 16px; border-radius: 20px; font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            display: inline-block; margin-bottom: 10px;
            font-family: 'Outfit', sans-serif;
        }
        #cards-wrapper { display: flex; gap: 30px; perspective: 1000px; }
        .upgrade-card {
            width: 240px; height: 340px;
            background: rgba(15, 20, 32, 0.75);
            border: 2px solid rgba(211, 175, 55, 0.3);
            border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            text-align: center; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.02);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.4s, box-shadow 0.4s;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }
        .upgrade-card:hover {
            transform: translateY(-15px) rotateY(5deg);
            border-color: rgba(229, 193, 88, 0.9);
            box-shadow: 0 20px 40px rgba(229, 193, 88, 0.25), 0 0 30px rgba(229, 193, 88, 0.15);
        }
        .upgrade-card .icon-placeholder {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(229, 193, 88, 0.1);
            border: 1px solid rgba(229, 193, 88, 0.3);
            display: flex; justify-content: center; align-items: center;
            color: #e5c158; font-size: 28px; margin-top: 15px;
            transition: background 0.3s;
        }
        .upgrade-card:hover .icon-placeholder {
            background: rgba(229, 193, 88, 0.25);
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
        }
        .upgrade-card h3 {
            font-family: 'Cinzel', serif; color: #e5c158;
            font-size: 20px; margin: 15px 0 10px 0; text-transform: uppercase;
        }
        .upgrade-card p {
            font-family: 'Outfit', sans-serif; color: #bdc3c7;
            font-size: 14px; line-height: 1.5; flex-grow: 1;
        }
        .upgrade-rarity {
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            font-weight: bold; color: #95a5a6; margin-bottom: 10px;
        }

        /* =====================================================================
           === TASK_003 — Boss Health Bar, Floating Damage Popups & Boss Stats
           ===================================================================== */
        #boss-bar-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            background: rgba(12, 17, 28, 0.85);
            border: 2px solid rgba(229, 193, 88, 0.8);
            border-radius: 8px;
            padding: 8px 16px;
            box-shadow: 0 0 25px rgba(229, 193, 88, 0.4), 0 0 15px rgba(255, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            z-index: 15;
        }

        #boss-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 900;
            color: #ff3333;
            letter-spacing: 4px;
            text-shadow: 0 0 12px #ff0000, 0 0 4px #000;
            margin-bottom: 4px;
        }

        #boss-hp-bar {
            width: 100%;
            height: 16px;
            background: rgba(10, 14, 22, 0.8);
            border: 1.5px solid rgba(211, 175, 55, 0.6);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        #boss-hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #8b0000, #ff3333);
            box-shadow: 0 0 12px #ff3333;
            transition: width 0.15s ease-out;
        }

        #boss-subtext {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            color: #bd00ff;
            letter-spacing: 2px;
            margin-top: 3px;
            text-shadow: 0 0 6px #bd00ff;
            text-transform: uppercase;
        }

        #popup-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 100;
        }

        .damage-popup {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.6rem;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 15px currentColor;
            animation: popupFloat 1.0s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            white-space: nowrap;
        }

        .damage-popup.critical {
            font-size: 2.4rem;
            letter-spacing: 2px;
            animation: popupCriticalFloat 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.5) forwards;
        }

        .damage-popup.stamina-alert {
            color: #ff3333 !important;
            font-size: 1.2rem;
            animation: popupStaminaFloat 0.8s ease-out forwards;
        }

        @keyframes popupFloat {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -40px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -100px) scale(0.9); }
        }

        @keyframes popupCriticalFloat {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.2) rotate(-15deg); }
            20% { opacity: 1; transform: translate(-50%, -50px) scale(1.3) rotate(5deg); }
            100% { opacity: 0; transform: translate(-50%, -140px) scale(1.0) rotate(-5deg); }
        }

        @keyframes popupStaminaFloat {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(0.9); }
        }

        .boss-stats-table {
            margin-top: 15px;
            margin-bottom: 20px;
            border-collapse: collapse;
            color: #e5c158;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            width: 320px;
        }

        .boss-stats-table td {
            padding: 6px 16px;
            border-bottom: 1.5px solid rgba(229, 193, 88, 0.2);
            text-align: left;
        }

        .boss-stats-table td:last-child {
            text-align: right;
            font-weight: bold;
            color: #ffffff;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="hud-top">
            <div id="timer">05:00</div>
            <div id="wave-info" style="font-size: 18px; color: #aaa;">Wave 1</div>
        </div>

        <!-- TASK_003: Boss HP Bar Container -->
        <div id="boss-bar-container" class="hidden">
            <div id="boss-title">COLOSSO VOXEL</div>
            <div id="boss-hp-bar">
                <div id="boss-hp-fill"></div>
            </div>
            <div id="boss-subtext">FASE 1: ESCUDO DE CRISTAIS ORBITAIS</div>
        </div>

        <!-- TASK_003: Overlay de Popups Flutuantes -->
        <div id="popup-container"></div>

        <div id="hud-stats">
            <div class="bar-container">
                <div id="health-fill" class="bar-fill"></div>
            </div>
            <div class="bar-container">
                <div id="stamina-fill" class="bar-fill"></div>
            </div>
            <div class="bar-container" style="height: 10px; width: 200px; margin-top: 5px;">
                <div id="xp-fill" class="bar-fill"></div>
            </div>
        </div>

        <div id="wave-banner"></div>

        <div id="skills-container">
            <div class="skill-slot" data-skill="spin"><span class="key-hint">1</span>
                <!-- Runa de redemoinho (Spin) -->
                <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.6 5.5" stroke-linecap="round"/><path d="M12 4l-3 1.5M12 4l1.5 3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.5"/></svg>
                <div class="skill-cooldown"></div>
            </div>
            <div class="skill-slot" data-skill="dash"><span class="key-hint">2</span>
                <!-- Runa de impulso (Dash) -->
                <svg viewBox="0 0 24 24"><path d="M4 7l6 5-6 5M11 7l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="skill-cooldown"></div>
            </div>
            <div class="skill-slot" data-skill="heal"><span class="key-hint">3</span>
                <!-- Runa de cura (Heal) -->
                <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>
                <div class="skill-cooldown"></div>
            </div>
            <div class="skill-slot" data-skill="ult"><span class="key-hint">4</span>
                <!-- Runa de cataclisma (Ultimate) -->
                <svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.2L21 9l-5 4.4L17.6 21 12 17.3 6.4 21 8 13.4 3 9l6.6-.8z" stroke-linejoin="round"/></svg>
                <div class="skill-cooldown"></div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Voxel Arena</h1>
        <div style="margin-bottom: 30px; text-align: center; color: #ccc; font-size: 18px; line-height: 1.6;">
            <p><strong>WASD</strong> to Move | <strong>Mouse</strong> to Look</p>
            <p><strong>Left Click</strong> to Attack | <strong>Right Click</strong> to Defend</p>
            <p><strong>1</strong>: Spin Attack | <strong>2</strong>: Dash</p>
            <p><strong>3</strong>: Heal | <strong>4</strong>: Ultimate</p>
        </div>
        <button id="start-btn">Enter Arena</button>
    </div>

    <!-- TASK_002: Modal de Draft Roguelite -->
    <div id="upgrade-modal" class="hidden">
        <div id="upgrade-title-container">
            <div class="level-badge" id="level-badge">LEVEL UP</div>
            <h1>Escolha seu Poder</h1>
        </div>
        <div id="cards-wrapper"></div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 id="go-title">Defeated</h1>
        <div id="boss-stats-summary"></div>
        <div id="bonus-selection" style="display: flex; gap: 20px;">
            <!-- Bonuses injected here -->
        </div>
        <button id="restart-btn" class="hidden">Try Again</button>
    </div>
    <script type="module">
        import * as THREE from 'three';

        // --- Game Constants ---
        const ARENA_SIZE = 100;

        // =====================================================================
        // === TASK_002 — Enemy Config, Wave Config & Upgrade Pool
        // =====================================================================

        const ENEMY_CONFIG = {
            basic:  { hp: 30,  speed: 6, damage: 5,  attackCd: 1.5, scale: 1.0, xp: 15,
                      armor: 0x1f0d3d, flesh: 0x2d1b4e, eye: 0xff0000 },
            brute:  { hp: 120, speed: 3, damage: 15, attackCd: 1.5, scale: 1.8, xp: 40,
                      armor: 0x4a0a0a, flesh: 0x3a0606, eye: 0xffcc00 },
            stalker:{ hp: 25,  speed: 9, damage: 6,  attackCd: 0.8, scale: 0.7, xp: 20,
                      armor: 0x052410, flesh: 0x031a0a, eye: 0x00ffff }
        };

        const activeVFX = [];

        function updateVFX(scene, dt) {
            for (let i = activeVFX.length - 1; i >= 0; i--) {
                const vfx = activeVFX[i];
                vfx.life -= dt * 1000;
                const age = 1.0 - (vfx.life / vfx.maxLife);

                if (vfx.group.customUpdate) {
                    vfx.group.customUpdate(dt, age);
                }

                if (vfx.light) {
                    vfx.light.intensity = vfx.initialIntensity * Math.cos(age * Math.PI / 2);
                }

                if (vfx.life <= 0) {
                    scene.remove(vfx.group);
                    vfx.group.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                    activeVFX.splice(i, 1);
                }
            }
        }

        function spawnDynamicSkillVFX(scene, position, type) {
            const vfxGroup = new THREE.Group();
            vfxGroup.position.copy(position);

            let lightColor, lightIntensity, lightDistance, duration;

            if (type === 'spin') {
                lightColor = 0xffd700;
                lightIntensity = 4.0;
                lightDistance = 15;
                duration = 300;

                const ringGeo = new THREE.TorusGeometry(5, 0.4, 8, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700, transparent: true, opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                vfxGroup.add(ring);

                vfxGroup.customUpdate = (dt, age) => {
                    ring.rotation.z += dt * 15;
                    ring.scale.setScalar(1 + age * 2.0);
                    ringMat.opacity = 1.0 - age;
                };
            } else if (type === 'heal') {
                lightColor = 0x00ff88;
                lightIntensity = 5.0;
                lightDistance = 12;
                duration = 600;

                const particles = [];
                const partGeo = new THREE.SphereGeometry(0.2, 4, 4);
                const partMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true });

                for (let i = 0; i < 12; i++) {
                    const part = new THREE.Mesh(partGeo, partMat);
                    const angle = (i / 12) * Math.PI * 2;
                    part.position.set(Math.cos(angle) * 1.5, 0.2 * i, Math.sin(angle) * 1.5);
                    vfxGroup.add(part);
                    particles.push(part);
                }

                vfxGroup.customUpdate = (dt, age) => {
                    particles.forEach((p, idx) => {
                        const angle = (idx / 12) * Math.PI * 2 + age * Math.PI * 4;
                        p.position.x = Math.cos(angle) * (1.5 - age * 0.5);
                        p.position.z = Math.sin(angle) * (1.5 - age * 0.5);
                        p.position.y += dt * 4;
                    });
                    partMat.opacity = 1.0 - age;
                };
            } else if (type === 'ult') {
                lightColor = 0xff00ff;
                lightIntensity = 8.0;
                lightDistance = 40;
                duration = 800;

                const domeGeo = new THREE.SphereGeometry(1, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
                const domeMat = new THREE.MeshBasicMaterial({
                    color: 0xff00ff, wireframe: true, transparent: true, opacity: 0.9,
                    blending: THREE.AdditiveBlending
                });
                const dome = new THREE.Mesh(domeGeo, domeMat);
                vfxGroup.add(dome);

                vfxGroup.customUpdate = (dt, age) => {
                    const currentRadius = 1 + age * 28;
                    dome.scale.setScalar(currentRadius);
                    domeMat.opacity = 1.0 - Math.pow(age, 2);
                };
            }

            const pLight = new THREE.PointLight(lightColor, lightIntensity, lightDistance, 1.5);
            pLight.position.set(0, 1.5, 0);
            pLight.castShadow = true;
            pLight.shadow.bias = -0.002;
            vfxGroup.add(pLight);

            scene.add(vfxGroup);

            activeVFX.push({
                group: vfxGroup,
                light: pLight,
                initialIntensity: lightIntensity,
                maxLife: duration,
                life: duration
            });
        }

        function spawnDashGhosts(scene, playerMesh, fromPos, toPos) {
            const ghostCount = 4;
            for (let i = 0; i < ghostCount; i++) {
                const t = (i + 1) / (ghostCount + 1);
                const pos = new THREE.Vector3().lerpVectors(fromPos, toPos, t);
                const ghostGroup = playerMesh.clone(true);

                ghostGroup.position.copy(pos);
                ghostGroup.rotation.copy(playerMesh.rotation);
                ghostGroup.scale.copy(playerMesh.scale);

                ghostGroup.traverse(child => {
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            const clonedMats = child.material.map(m => {
                                const cm = m.clone();
                                cm.transparent = true;
                                cm.opacity = 0.35;
                                cm.blending = THREE.AdditiveBlending;
                                cm.depthWrite = false;
                                if (cm.emissive) cm.emissive = new THREE.Color(0x0066ff);
                                if (cm.emissiveIntensity !== undefined) cm.emissiveIntensity = 2.0;
                                return cm;
                            });
                            child.material = clonedMats;
                        } else {
                            const cm = child.material.clone();
                            cm.transparent = true;
                            cm.opacity = 0.35;
                            cm.blending = THREE.AdditiveBlending;
                            cm.depthWrite = false;
                            if (cm.emissive) cm.emissive = new THREE.Color(0x0066ff);
                            if (cm.emissiveIntensity !== undefined) cm.emissiveIntensity = 2.0;
                            child.material = cm;
                        }
                    }
                });

                scene.add(ghostGroup);

                activeVFX.push({
                    group: ghostGroup,
                    light: null,
                    initialIntensity: 0,
                    maxLife: 300,
                    life: 300,
                    customUpdate: (dt, age) => {
                        ghostGroup.traverse(child => {
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => { m.opacity = 0.35 * (1 - age); });
                            }
                        });
                    }
                });
            }
        }

        let audioCtx = null;

        function initSkillAudio() {
            if (!audioCtx) {
                try { audioCtx = new AudioContext(); } catch (e) {}
            }
        }

        function playSkillSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                switch (type) {
                    case 'spin':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                        break;
                    case 'dash':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                        break;
                    case 'heal':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(784, audioCtx.currentTime + 0.4);
                        break;
                    case 'ult':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.6);
                        break;
                    default:
                        osc.type = 'sine';
                }

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.6);
            } catch (e) {}
        }

        class ScreenShakeManager {
            constructor() {
                this.intensity = 0;
                this.duration = 0;
                this.timer = 0;
                this.direction = new THREE.Vector3();
            }

            trigger(direction, intensity = 0.8, duration = 0.35) {
                if (!direction || direction.length() === 0) direction = new THREE.Vector3(1, 0, 0);
                this.direction.copy(direction).normalize();
                this.intensity = intensity;
                this.duration = duration;
                this.timer = duration;
            }

            update(dt, cameraPosition) {
                if (this.timer > 0) {
                    this.timer -= dt;
                    const progress = Math.max(0, this.timer / this.duration);
                    const decay = Math.pow(progress, 2);
                    const frequency = 40;
                    const offsetDist = Math.sin(this.timer * frequency) * this.intensity * decay;
                    const shakeOffset = this.direction.clone().multiplyScalar(offsetDist);
                    cameraPosition.add(shakeOffset);
                }
            }
        }

        class DOMElementPool {
            constructor(containerId, initialSize = 30) {
                this.container = document.getElementById(containerId);
                this.pool = [];
                if (this.container) {
                    for (let i = 0; i < initialSize; i++) {
                        const el = document.createElement('div');
                        el.className = 'damage-popup';
                        el.style.display = 'none';
                        this.container.appendChild(el);
                        this.pool.push(el);
                    }
                }
            }

            acquire() {
                let el = this.pool.length > 0 ? this.pool.pop() : document.createElement('div');
                if (this.container && !el.parentNode) {
                    this.container.appendChild(el);
                }
                return el;
            }

            release(el) {
                el.style.display = 'none';
                el.className = 'damage-popup';
                el.textContent = '';
                this.pool.push(el);
            }
        }

        class DamagePopupManager {
            constructor(camera) {
                this.camera = camera;
                this.pool = new DOMElementPool('popup-container', 35);
                this.activePopups = [];
            }

            spawnPopup(position, text, color = '#00ffff', isCritical = false, isStamina = false) {
                const el = this.pool.acquire();
                let cls = 'damage-popup';
                if (isCritical) cls += ' critical';
                if (isStamina) cls += ' stamina-alert';
                el.className = cls;
                el.textContent = text;
                el.style.color = color;
                el.style.display = 'block';

                const duration = isCritical ? 1.2 : (isStamina ? 0.8 : 1.0);
                const item = {
                    element: el,
                    pos: position.clone(),
                    life: duration,
                    maxLife: duration
                };
                this.activePopups.push(item);
                this.updateElementPos(item);
            }

            updateElementPos(item) {
                const projected = item.pos.clone().project(this.camera);
                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;
                item.element.style.left = `${x}px`;
                item.element.style.top = `${y}px`;
            }

            update(dt) {
                for (let i = this.activePopups.length - 1; i >= 0; i--) {
                    const item = this.activePopups[i];
                    item.life -= dt;
                    if (item.life <= 0) {
                        this.pool.release(item.element);
                        this.activePopups.splice(i, 1);
                    } else {
                        this.updateElementPos(item);
                    }
                }
            }
        }

        class LavaGeyser {
            constructor(scene, position) {
                this.scene = scene;
                this.position = position.clone();
                this.state = 'warning';
                this.timer = 0;
                this.damageTimer = 0;
                this.isDead = false;
                this.group = new THREE.Group();
                this.group.position.copy(this.position);

                const ringGeo = new THREE.RingGeometry(0.5, 3.0, 32);
                ringGeo.rotateX(-Math.PI / 2);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                this.warningMesh = new THREE.Mesh(ringGeo, ringMat);
                this.warningMesh.position.y = 0.05;
                this.group.add(this.warningMesh);

                const colGeo = new THREE.CylinderGeometry(2.8, 3.0, 6, 16, 1, true);
                colGeo.translate(0, 3, 0);
                const colMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
                this.columnMesh = new THREE.Mesh(colGeo, colMat);
                this.group.add(this.columnMesh);

                this.light = new THREE.PointLight(0xff3300, 0, 15);
                this.light.position.y = 2;
                this.group.add(this.light);

                this.scene.add(this.group);
            }

            update(dt, game) {
                this.timer += dt;

                if (this.state === 'warning') {
                    const flash = (Math.sin(this.timer * 15) + 1) * 0.5;
                    this.warningMesh.material.opacity = 0.3 + flash * 0.6;
                    if (this.timer >= 2.0) {
                        this.state = 'active';
                        this.timer = 0;
                        this.warningMesh.material.color.setHex(0xff0000);
                        playSkillSound('spin');
                    }
                } else if (this.state === 'active') {
                    const progress = this.timer / 6.0;
                    const fade = progress < 0.1 ? progress / 0.1 : (1.0 - progress);
                    this.columnMesh.material.opacity = fade * 0.75;
                    this.light.intensity = fade * 4.0;
                    this.warningMesh.material.opacity = fade * 0.9;

                    this.damageTimer += dt;
                    if (this.damageTimer >= 0.5) {
                        this.damageTimer -= 0.5;
                        this.checkDamage(game);
                    }

                    if (this.timer >= 6.0) {
                        this.destroy();
                    }
                }
            }

            checkDamage(game) {
                if (!game) return;
                const radius = 3.0;
                if (game.player && game.player.mesh.position.distanceTo(this.position) < radius) {
                    game.player.takeDamage(8);
                    if (game.popupManager) {
                        game.popupManager.spawnPopup(game.player.mesh.position, '-8 LAVA', '#ff3300');
                    }
                }
                if (game.enemyManager) {
                    game.enemyManager.enemies.forEach(e => {
                        if (e.mesh.position.distanceTo(this.position) < radius) {
                            e.takeDamage(8);
                            if (game.popupManager) {
                                game.popupManager.spawnPopup(e.mesh.position, '8', '#ff6600');
                            }
                        }
                    });
                }
                if (game.boss && !game.boss.isDead && game.boss.mesh.position.distanceTo(this.position) < radius + 2.0) {
                    game.boss.takeDamage(8, game);
                }
            }

            destroy() {
                this.isDead = true;
                this.scene.remove(this.group);
                this.group.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
            }
        }

        class LavaGeyserManager {
            constructor(scene) {
                this.scene = scene;
                this.geysers = [];
                this.spawnTimer = 0;
            }

            update(dt, waveNum, game) {
                if (waveNum >= 3) {
                    const spawnInterval = waveNum >= 6 ? 4.0 : 7.0;
                    const maxGeysers = waveNum >= 6 ? 4 : 2;
                    this.spawnTimer += dt;
                    if (this.spawnTimer >= spawnInterval && this.geysers.length < maxGeysers) {
                        this.spawnTimer = 0;
                        const rx = (Math.random() - 0.5) * ARENA_SIZE * 0.75;
                        const rz = (Math.random() - 0.5) * ARENA_SIZE * 0.75;
                        this.geysers.push(new LavaGeyser(this.scene, new THREE.Vector3(rx, 0, rz)));
                    }
                }

                this.geysers.forEach(g => g.update(dt, game));
                this.geysers = this.geysers.filter(g => !g.isDead);
            }
        }

        class GravityNexus {
            constructor(scene) {
                this.scene = scene;
                this.active = false;
                this.mesh = this.createMesh();
                this.mesh.position.set(0, 0.5, 0);
                this.time = 0;
            }

            createMesh() {
                const group = new THREE.Group();
                const sphereGeo = new THREE.SphereGeometry(1.5, 24, 24);
                const sphereMat = new THREE.MeshStandardMaterial({
                    color: 0x240046, emissive: 0x7b2cbf, emissiveIntensity: 3.0,
                    roughness: 0.1
                });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                group.add(sphere);

                const ringGeo = new THREE.TorusGeometry(3.0, 0.15, 8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x9d4edd, transparent: true, opacity: 0.75, wireframe: true });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 3;
                group.add(ring);
                this.ring = ring;

                const light = new THREE.PointLight(0x7b2cbf, 4.0, 20);
                group.add(light);
                group.visible = false;
                this.scene.add(group);
                return group;
            }

            setActive(state) {
                this.active = state;
                this.mesh.visible = state;
            }

            update(dt, game) {
                if (!this.active || !game) return;
                this.time += dt;
                this.ring.rotation.z += dt * 2.0;
                this.mesh.scale.setScalar(1.0 + Math.sin(this.time * 4) * 0.08);

                const nexusPos = this.mesh.position;
                const G = 250;

                if (game.player) {
                    const toNexus = nexusPos.clone().sub(game.player.mesh.position);
                    toNexus.y = 0;
                    const d = toNexus.length();
                    if (d > 1.2 && d < 45.0) {
                        const forceMag = Math.min(12.0, G / (d * d));
                        game.player.mesh.position.addScaledVector(toNexus.normalize(), forceMag * dt);
                    }
                }

                if (game.enemyManager) {
                    game.enemyManager.enemies.forEach(e => {
                        const toNexus = nexusPos.clone().sub(e.mesh.position);
                        toNexus.y = 0;
                        const d = toNexus.length();
                        if (d > 1.2 && d < 45.0) {
                            const forceMag = Math.min(14.0, G / (d * d));
                            e.mesh.position.addScaledVector(toNexus.normalize(), forceMag * dt);
                        }
                    });
                }

                if (game.xpOrbManager) {
                    game.xpOrbManager.orbs.forEach(orb => {
                        const toNexus = nexusPos.clone().sub(orb.mesh.position);
                        toNexus.y = 0;
                        const d = toNexus.length();
                        if (d > 0.8 && d < 45.0) {
                            const forceMag = Math.min(18.0, G / (d * d));
                            orb.mesh.position.addScaledVector(toNexus.normalize(), forceMag * dt);
                        }
                    });
                }
            }
        }
