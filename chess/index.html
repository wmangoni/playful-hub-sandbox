<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Xadrez com IA e Análise</title>
    <!-- Incluir CSS do chessboardjs -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        :root {
            --primary-bg: #b3aa88;
            --container-bg: #f8fafc;
            --text-color: #0f172a;
            --accent-color: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-color: var(--primary-bg);
            transition: background 0.5s ease, color 0.5s ease;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            border-radius: 12px;
            background-color: var(--container-bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: var(--text-color);
        }

        .board-flex-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .advantage-bar-container {
            position: relative;
            width: 25px;
            height: 400px;
            border: 2px solid #2d2d2d;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #111;
        }

        .bar-fill {
            width: 100%;
            transition: height 0.3s ease-in-out;
        }

        .white-fill {
            background-color: #ffffff;
            height: 50%;
        }

        .black-fill {
            background-color: #222222;
            height: 50%;
        }

        #advantageBarLabel {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            bottom: 50%;
            transform: translateY(50%);
            color: #888;
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .board-container {
            position: relative;
            width: 400px;
            margin-bottom: 0;
        }

        #myBoard {
            width: 400px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        #status, #turn {
            margin: 5px 0;
            font-weight: bold;
            min-height: 1.2em;
        }

        select, button {
            padding: 8px 12px;
            font-size: 0.95em;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
            transition: all 0.2s ease;
        }

        button:hover {
            filter: brightness(0.9);
        }

        .highlight-check {
            box-shadow: inset 0 0 15px 5px rgba(255, 0, 0, 0.7) !important;
        }

        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            font-size: 1.8em;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: wait;
            border-radius: 3px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
        }

        #loadingOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .captured-pieces {
            display: flex;
            flex-wrap: wrap;
            min-height: 44px;
            padding: 8px;
            margin: 10px 0;
            background: #e8e0d3;
            border-radius: 6px;
            width: 400px;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.05);
            transition: background 0.3s ease;
        }

        .captured-piece {
            width: 26px;
            height: 26px;
            margin: 2px;
        }

        /* Estilos para destacar a última jogada */
        .highlight-white {
            box-shadow: inset 0 0 3px 3px rgba(255, 235, 59, 0.85);
        }

        .highlight-black {
            box-shadow: inset 0 0 3px 3px rgba(255, 235, 59, 0.85);
        }

        .highlight-legal-move {
            background-color: rgba(76, 175, 80, 0.35) !important;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -12;
            }
        }

        /* --- Temas Gráficos --- */
        
        /* 1. Classic Wood (Mesa Tradicional) */
        body.theme-wood {
            background: linear-gradient(135deg, #2b1f17 0%, #150f0b 100%);
            color: #f5eedc;
        }
        .theme-wood .game-container {
            background: #3a2a1f;
            border: 2px solid #5c381e;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            color: #f5eedc;
        }
        .theme-wood .board-b72b1 {
            border: 10px solid #5c381e;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .theme-wood .white-1e1d7 {
            background-color: #f0d9b5;
        }
        .theme-wood .black-3c85d {
            background-color: #b58863;
        }
        .theme-wood .captured-pieces {
            background: #2b1f17;
            border: 1px solid #5c381e;
        }
        .theme-wood button, .theme-wood select {
            background-color: #5c381e;
            color: #ebd0a7;
            border: 1px solid #7c4c2a;
        }
        
        /* 2. Glassmorphism (Translúcido Futurista) */
        body.theme-glass {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
        }
        .theme-glass .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }
        .theme-glass .board-b72b1 {
            background: rgba(255, 255, 255, 0.03);
            border: 6px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .theme-glass .white-1e1d7 {
            background-color: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }
        .theme-glass .black-3c85d {
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-sizing: border-box;
        }
        .theme-glass img.piece-4a2a4 {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.2s ease;
        }
        .theme-glass img.piece-4a2a4:hover {
            transform: scale(1.08);
        }
        .theme-glass .captured-pieces {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .theme-glass button, .theme-glass select {
            background-color: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 3. Neon Cyber (Brilho Synthwave) */
        body.theme-cyber {
            background: linear-gradient(135deg, #05010a 0%, #120424 100%);
            color: #00f5d4;
        }
        .theme-cyber .game-container {
            background: rgba(5, 1, 10, 0.95);
            border: 2px solid #00f5d4;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.2), inset 0 0 15px rgba(123, 44, 191, 0.15);
            color: #00f5d4;
        }
        .theme-cyber .board-b72b1 {
            background: #020205;
            border: 6px solid #00f5d4;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.3), inset 0 0 15px rgba(123, 44, 191, 0.2);
        }
        .theme-cyber .white-1e1d7 {
            background-color: #1a0826;
            border: 1px solid rgba(123, 44, 191, 0.3);
            box-sizing: border-box;
        }
        .theme-cyber .black-3c85d {
            background-color: #0c0812;
            border: 1px solid rgba(0, 245, 212, 0.2);
            box-sizing: border-box;
        }
        .theme-cyber img.piece-4a2a4 {
            filter: drop-shadow(0 0 4px #00f5d4) drop-shadow(0 0 8px #7b2cbf);
        }
        .theme-cyber .square-55d63.highlight-white,
        .theme-cyber .square-55d63.highlight-black {
            box-shadow: inset 0 0 15px #00f5d4, 0 0 10px #00f5d4 !important;
        }
        .theme-cyber .captured-pieces {
            background: #0c0812;
            border: 1px solid rgba(0, 245, 212, 0.2);
        }
        .theme-cyber button, .theme-cyber select {
            background-color: #7b2cbf;
            color: #00f5d4;
            border: 1px solid #00f5d4;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(123, 44, 191, 0.4);
        }
        .theme-cyber button:hover, .theme-cyber select:hover {
            background-color: #9d4edd;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.6);
        }
    </style>
</head>
<body class="theme-wood">

    <script>
        // --- Variáveis Globais ---
        var board = null; // Objeto chessboardjs
        var game = new Chess(); // Objeto chess.js
        var playerColor = 'w'; // Jogador humano é sempre as brancas por simplicidade
        var aiColor = 'b';
        var currentDifficultyDepth = 3; // Profundidade inicial (Fácil)
        var loadingOverlay = document.getElementById('loadingOverlay'); // Referência ao overlay
        const capturedPieces = {
            w: [], // Peças brancas capturadas
            b: []  // Peças pretas capturadas
        };
        const DEBUG_MODE = false; // Controle global para debug
        const moveSound = new Audio('../assets/sounds/sfx-pop.mp3');
        const victorySound = new Audio('../assets/sounds/powerup3.mp3');
        const defeatSound = new Audio('../assets/sounds/game_over_bgm.mp3');

        // --- Stockfish.js Setup ---
        const STOCKFISH_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        let stockfishWorker = null;
        let bestMoveRecommended = null;
        var showComputerHints = true;

        // --- CONSTANTES DE AVALIAÇÃO MINIMAX ---
        const PAWN_VALUE = 100;
        const KNIGHT_VALUE = 320;
        const BISHOP_VALUE = 330;
        const ROOK_VALUE = 500;
        const QUEEN_VALUE = 900;
        const KING_VALUE = 20000;

        const DOUBLED_PAWN_PENALTY = -10;
        const ISOLATED_PAWN_PENALTY = -15;
        const PASSED_PAWN_BONUS_BASE = 20;
        const CASTLING_BONUS = 50;
        const PAWN_SHIELD_BONUS = 10;
        const KING_EXPOSED_PENALTY = -30;
        const DEVELOPMENT_BONUS = 10;
        const CENTER_PAWN_BONUS = 15;
        const ATTACK_CENTER_BONUS = 5;

        // --- Tabelas Posição-Peça (Piece-Square Tables) ---
        var pawnTable = [

        var knightTable = [

            [-40, -20,   0,   0,   0,   0, -20, -40],
            [-30,   0,  10,  10,  10,  10,   0, -30],
            [-30,   0,  10,  20,  20,  10,   0, -30],
            [-30,   0,  10,  20,  20,  10,   0, -30],
            [-30,   0,  10,  10,  10,  10,   0, -30],
            [-40, -20,   0,   0,   0,   0, -20, -40],
            [-50, -40, -30, -30, -30, -30, -40, -50]
        ];

        var bishopTable = [
            [-20, -10, -10, -10, -10, -10, -10, -20],
            [-10,   0,   0,   0,   0,   0,   0, -10],
            [-10,   0,   0,  10,  10,   0,   0, -10],
            [-10,   0,  10,  10,  10,  10,   0, -10],
            [-10,   0,  10,  10,  10,  10,   0, -10],
            [-10,   0,   0,  10,  10,   0,   0, -10],
            [-10,   0,   0,   0,   0,   0,   0, -10],
            [-20, -10, -10, -10, -10, -10, -10, -20]
        ];

        var rookTable = [
            [  0,   0,   0,   0,   0,   0,   0,   0],
            [  0,  10,  10,  10,  10,  10,  10,   0],
            [-10,   0,   0,   0,   0,   0,   0, -10],

         var queenTable = [
            [-20, -10, -10,   0,   0, -10, -10, -20],

        ];

        var kingTable = [
            [ 20,  30,  10,   0,   0,  10,  30,  20],
            [ 20,  20,   0,   0,   0,   0,  20,  20],
            [-10, -20, -20, -20, -20, -20, -20, -10],

            [-30, -40, -40, -50, -50, -40, -40, -30]
        ];

        var kingTableEndGame = [
            [-50,-40,-30,-20,-20,-30,-40,-50],
            [-30,-20,-10,  0,  0,-10,-20,-30],
            [-30,-10, 20, 30, 30, 20,-10,-30],
            [-30,-10, 30, 40, 40, 30,-10,-30],
            [-30,-10, 30, 40, 40, 30,-10,-30],
            [-30,-10, 20, 30, 30, 20,-10,-30],
            [-30,-20,-10,  0,  0,-10,-20,-30],
            [-50,-40,-30,-20,-20,-30,-40,-50]
        ];

        // --- Lógica de Análise Stockfish.js ---
        function initStockfish() {
            try {
                const blobCode = `importScripts('${STOCKFISH_CDN}');`;
                const blob = new Blob([blobCode], { type: 'application/javascript' });
                const blobURL = URL.createObjectURL(blob);
                stockfishWorker = new Worker(blobURL);

                stockfishWorker.onmessage = function(event) {
                    handleStockfishMessage(event.data);
                };

                stockfishWorker.postMessage('uci');
                stockfishWorker.postMessage('ucinewgame');
                stockfishWorker.postMessage('isready');
            } catch (e) {
                console.error("Erro ao inicializar o Stockfish.js:", e);
            }
        }

        function requestAnalysis() {
            clearArrow();
            if (!stockfishWorker) return;
            const currentFen = game.fen();
            stockfishWorker.postMessage(`position fen ${currentFen}`);
            stockfishWorker.postMessage('go depth 10');
        }

        function handleStockfishMessage(line) {
            if (line.startsWith('info') && line.includes('score')) {
                const scoreMatch = line.match(/score (cp|mate) (-?\d+)/);
                if (scoreMatch) {
                    const scoreType = scoreMatch[1];
                    let scoreVal = parseInt(scoreMatch[2], 10);
                    
                    if (game.turn() === 'b') {
                        scoreVal = -scoreVal;
                    }
                    
                    updateAdvantageBar(scoreType, scoreVal);
                }
            }
            
            if (line.startsWith('bestmove')) {
                const moveMatch = line.match(/^bestmove ([a-h][1-8])([a-h][1-8])(?:[qrbn])?/);
                if (moveMatch) {
                    const from = moveMatch[1];
                    const to = moveMatch[2];
                    bestMoveRecommended = { from, to };
                    
                    if (game.turn() === playerColor && !game.game_over()) {
                        drawBestMoveArrow(from, to);
                    } else {
                        clearArrow();
                    }
                }
            }
        }

        function updateAdvantageBar(type, scoreVal) {
            const label = document.getElementById('advantageBarLabel');
            const whiteBar = document.getElementById('advantageBarWhite');
            const blackBar = document.getElementById('advantageBarBlack');
            
            let labelText = '';
            let whiteHeight = 50;
            
            if (type === 'mate') {
                const absMate = Math.abs(scoreVal);
                labelText = `#M${absMate}`;
                whiteHeight = scoreVal > 0 ? 100 : 0;
            } else {
                const pawns = (scoreVal / 100).toFixed(1);
                labelText = scoreVal > 0 ? `+${pawns}` : pawns;
                
                let clampedPawns = scoreVal / 100;
                if (clampedPawns > 10) clampedPawns = 10;
                if (clampedPawns < -10) clampedPawns = -10;
                
                whiteHeight = 50 + (clampedPawns / 10) * 45;
            }
            
            label.textContent = labelText;
            whiteBar.style.height = `${whiteHeight}%`;
            blackBar.style.height = `${100 - whiteHeight}%`;
        }

        function drawBestMoveArrow(fromSquare, toSquare) {

                clearArrow();

            const toPos = getSquareCenter(toSquare);

            line.setAttribute('y1', fromPos.y);

        function getSquareCenter(squareName) {
            const squareEl = document.querySelector(`#myBoard .square-${squareName}`);
            if (!squareEl) return null;
            
            const boardEl = document.getElementById('myBoard');
            const boardRect = boardEl.getBoundingClientRect();
            const sqRect = squareEl.getBoundingClientRect();
            
            return {
                x: (sqRect.left + sqRect.width / 2) - boardRect.left,
                y: (sqRect.top + sqRect.height / 2) - boardRect.top
            };

        // --- Funções Auxiliares de Avaliação e Debug ---
        function debug(...args) {
            if (DEBUG_MODE) {
                console.log(...args);
            }
        }

        function playMoveSound() {
            moveSound.currentTime = 0;
            moveSound.play().catch(error => {
                debug("Erro ao jogar som do movimento:", error);
            });
        }

        function determineIsEndGame(currentBoard) {
            let whiteMaterial = 0;
            let blackMaterial = 0;
            let queens = 0;

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = currentBoard[i][j];
                    if (piece && piece.type !== 'k' && piece.type !== 'p') {
                        const value = getPieceValue(piece);
                        if (piece.color === 'w') {
                            whiteMaterial += value;
                        } else {
                            blackMaterial += value;
                        }
                        if (piece.type === 'q') {
                            queens++;
                        }
                    }
                }
            }
            const lowMaterialThreshold = KNIGHT_VALUE + BISHOP_VALUE + ROOK_VALUE;
            return queens === 0 || (whiteMaterial < lowMaterialThreshold && blackMaterial < lowMaterialThreshold);
        }
            
        function evaluateBoard(currentBoard, turn) {
            let totalEvaluation = 0;
            
            if (game.in_threefold_repetition()) {
                return turn === 'b' ? -5000 : 5000;
            }
            
            if (game.in_draw() || game.in_stalemate() || game.insufficient_material()) {
                return turn === 'b' ? -3000 : 3000;
            }

            let materialScore = 0;
            let positionalScore = 0;
            let structureAndSafetyScore = 0;
            let tacticalBonus = 0;
            let whiteKingSquare = null;
            let blackKingSquare = null;
            let whiteMinorPiecesDeveloped = 0;
            let blackMinorPiecesDeveloped = 0;
            let whitePawns = [];
            let blackPawns = [];

            const isEndGame = determineIsEndGame(currentBoard);

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = currentBoard[i][j];
                    const square = String.fromCharCode('a'.charCodeAt(0) + j) + (8 - i);

                    if (piece) {
                        const pieceValue = getPieceValue(piece);
                        materialScore += (piece.color === 'w' ? pieceValue : -pieceValue);

                        let table = null;
                        switch (piece.type) {
                            case 'p':
                                table = pawnTable;
                                if (piece.color === 'w') whitePawns.push({ square: square, col: j, row: i });
                                else blackPawns.push({ square: square, col: j, row: i });
                                break;
                            case 'n':
                                table = knightTable;
                                if (piece.color === 'w' && !(i === 7 && (j === 1 || j === 6))) whiteMinorPiecesDeveloped += 10;
                                if (piece.color === 'b' && !(i === 0 && (j === 1 || j === 6))) blackMinorPiecesDeveloped += 10;
                                break;
                            case 'b':
                                table = bishopTable;
                                if (piece.color === 'w' && !(i === 7 && (j === 2 || j === 5))) whiteMinorPiecesDeveloped += 10;
                                if (piece.color === 'b' && !(i === 0 && (j === 2 || j === 5))) blackMinorPiecesDeveloped += 10;
                                break;
                            case 'r': table = rookTable; break;
                            case 'q': table = queenTable; break;
                            case 'k':
                                table = isEndGame ? kingTableEndGame : kingTable;
                                if (piece.color === 'w') whiteKingSquare = { square: square, row: i, col: j };
                                else blackKingSquare = { square: square, row: i, col: j };
                                break;
                        }

                        if (table) {
                            const tableRow = piece.color === 'w' ? i : 7 - i;
                            const tableCol = j;
                            const tableValue = table[tableRow][tableCol];
                            positionalScore += (piece.color === 'w' ? tableValue : -tableValue);
                        }
                    }
                }
            }

            // Estrutura de Peões
            let whitePawnStructureScore = 0;
            let blackPawnStructureScore = 0;
            const whitePawnCols = whitePawns.map(p => p.col);
            const blackPawnCols = blackPawns.map(p => p.col);

            whitePawns.forEach(pawn => {
                const col = pawn.col;
                const rank = 8 - pawn.row;
                if (whitePawnCols.filter(c => c === col).length > 1) whitePawnStructureScore += DOUBLED_PAWN_PENALTY;
                if (!whitePawnCols.includes(col - 1) && !whitePawnCols.includes(col + 1)) whitePawnStructureScore += ISOLATED_PAWN_PENALTY;
                
                let isPassed = true;
                for (let bpCol = col - 1; bpCol <= col + 1; bpCol++) {
                    if (bpCol >= 0 && bpCol <= 7) {
                        blackPawns.forEach(blackPawn => {
                            if (blackPawn.col === bpCol && blackPawn.row < pawn.row) {
                                isPassed = false;
                            }
                        });
                    }
                    if (!isPassed) break;
                }
                if (isPassed) whitePawnStructureScore += PASSED_PAWN_BONUS_BASE + (rank - 2) * 5;
                if (pawn.square === 'd4' || pawn.square === 'e4') whitePawnStructureScore += CENTER_PAWN_BONUS;
            });

            blackPawns.forEach(pawn => {
                const col = pawn.col;
                const rank = 8 - pawn.row;
                if (blackPawnCols.filter(c => c === col).length > 1) blackPawnStructureScore += DOUBLED_PAWN_PENALTY;
                if (!blackPawnCols.includes(col - 1) && !blackPawnCols.includes(col + 1)) blackPawnStructureScore += ISOLATED_PAWN_PENALTY;
                
                let isPassed = true;
                for (let wpCol = col - 1; wpCol <= col + 1; wpCol++) {
                    if (wpCol >= 0 && wpCol <= 7) {
                        whitePawns.forEach(whitePawn => {
                            if (whitePawn.col === wpCol && whitePawn.row > pawn.row) {
                                isPassed = false;
                            }
                        });
                    }
                     if (!isPassed) break;
                }
                if (isPassed) blackPawnStructureScore += PASSED_PAWN_BONUS_BASE + (7 - rank) * 5;
                if (pawn.square === 'd5' || pawn.square === 'e5') blackPawnStructureScore += CENTER_PAWN_BONUS;
            });

            structureAndSafetyScore += whitePawnStructureScore;
            structureAndSafetyScore -= blackPawnStructureScore;

            // Segurança do Rei e Roque
            let whiteKingSafetyScore = 0;
            let blackKingSafetyScore = 0;
            let whiteCastled = false;
            if (whiteKingSquare) {
                if (whiteKingSquare.square === 'g1' && currentBoard[7][5]?.type === 'r' && currentBoard[7][5]?.color === 'w') {
                    whiteCastled = true;
                    if (currentBoard[6][5]?.type === 'p' && currentBoard[6][5]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[6][6]?.type === 'p' && currentBoard[6][6]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[6][7]?.type === 'p' && currentBoard[6][7]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                } else if (whiteKingSquare.square === 'c1' && currentBoard[7][3]?.type === 'r' && currentBoard[7][3]?.color === 'w') {
                    whiteCastled = true;
                    if (currentBoard[6][0]?.type === 'p' && currentBoard[6][0]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[6][1]?.type === 'p' && currentBoard[6][1]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[6][2]?.type === 'p' && currentBoard[6][2]?.color === 'w') whiteKingSafetyScore += PAWN_SHIELD_BONUS;
                }
                if (whiteCastled) whiteKingSafetyScore += CASTLING_BONUS;
            }
            let blackCastled = false;
             if (blackKingSquare) {
                if (blackKingSquare.square === 'g8' && currentBoard[0][5]?.type === 'r' && currentBoard[0][5]?.color === 'b') {
                    blackCastled = true;
                    if (currentBoard[1][5]?.type === 'p' && currentBoard[1][5]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[1][6]?.type === 'p' && currentBoard[1][6]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[1][7]?.type === 'p' && currentBoard[1][7]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                } else if (blackKingSquare.square === 'c8' && currentBoard[0][3]?.type === 'r' && currentBoard[0][3]?.color === 'b') {
                    blackCastled = true;
                    if (currentBoard[1][0]?.type === 'p' && currentBoard[1][0]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[1][1]?.type === 'p' && currentBoard[1][1]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                    if (currentBoard[1][2]?.type === 'p' && currentBoard[1][2]?.color === 'b') blackKingSafetyScore += PAWN_SHIELD_BONUS;
                }
                if (blackCastled) blackKingSafetyScore += CASTLING_BONUS;
            }
            structureAndSafetyScore += whiteKingSafetyScore;
            structureAndSafetyScore -= blackKingSafetyScore;

            // Desenvolvimento de Peças
            structureAndSafetyScore += whiteMinorPiecesDeveloped * DEVELOPMENT_BONUS;
            structureAndSafetyScore -= blackMinorPiecesDeveloped * DEVELOPMENT_BONUS;

            // Bônus Táticos
            const turnAfterPosition = game.turn();

            if (game.in_checkmate()) {
                tacticalBonus += (turnAfterPosition === 'w' ? -KING_VALUE * 2 : KING_VALUE * 2);
            } else if (game.in_check()) {
                tacticalBonus += (turnAfterPosition === 'w' ? -50 : 50);
            }

            // Bônus de Ataque ao Rei
            const enemyColor = turn === 'w' ? 'b' : 'w';
            const enemyKingSquare = enemyColor === 'w' ? whiteKingSquare : blackKingSquare;
            let attackBonus = 0;
            if (enemyKingSquare && !isEndGame) {
                const kingRow = enemyKingSquare.row;
                const kingCol = enemyKingSquare.col;
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const piece = currentBoard[i][j];
                        if (piece && piece.color === turn) {
                            const distance = Math.abs(i - kingRow) + Math.abs(j - kingCol);
                            attackBonus += Math.max(0, (14 - distance)) * 2;
                        }
                    }
                }
            }
            tacticalBonus += (turn === 'w' ? attackBonus : -attackBonus);

            totalEvaluation = materialScore + positionalScore + structureAndSafetyScore + tacticalBonus;
            debug(`Eval: Mat=${materialScore}, Pos=${positionalScore}, Struct=${structureAndSafetyScore}, Tact=${tacticalBonus} => Tot=${totalEvaluation}`);

            return totalEvaluation;
        }

        function getPieceValue(piece) {
            if (piece === null) return 0;
            switch (piece.type) {
                case 'p': return PAWN_VALUE;
                case 'n': return KNIGHT_VALUE;
                case 'b': return BISHOP_VALUE;
                case 'r': return ROOK_VALUE;
                case 'q': return QUEEN_VALUE;
                case 'k': return KING_VALUE;
                default: return 0;
            }
        }

        function findKing(color) {
            var boardState = game.board();
            for (var i = 0; i < 8; i++) {
                for (var j = 0; j < 8; j++) {
                    var piece = boardState[i][j];
                    if (piece && piece.type === 'k' && piece.color === color) {
                        return String.fromCharCode('a'.charCodeAt(0) + j) + (8 - i);
                    }
                }
            }
            return null;
        }

        // --- Motor de Minimax AI Local ---
        function minimaxRoot(depth, isMaximizingPlayer) {
            const moves = game.moves({ verbose: true });
            const BEAM_WIDTH = 10;
            const evaluatedMoves = [];
            
            for (const move of moves) {
                game.move(move.san);
                const score = evaluateBoard(game.board(), game.turn());
                game.undo();
                
                evaluatedMoves.push({
                    move: move,
                    score: score
                });
            }
            
            evaluatedMoves.sort((a, b) => {
                return isMaximizingPlayer ? b.score - a.score : a.score - b.score;
            });
            
            const bestMoves = evaluatedMoves.slice(0, Math.min(BEAM_WIDTH, evaluatedMoves.length));
            
            let bestMoveFound = null;
            let bestScore = isMaximizingPlayer ? -Infinity : Infinity;
            
            for (const moveObj of bestMoves) {
                game.move(moveObj.move.san);
                const value = selectiveSearch(depth - 1, -Infinity, Infinity, !isMaximizingPlayer, BEAM_WIDTH);
                game.undo();
                
                if (isMaximizingPlayer) {
                    if (value > bestScore) {
                        bestScore = value;
                        bestMoveFound = moveObj.move;
                    }
                } else {
                    if (value < bestScore) {
                        bestScore = value;
                        bestMoveFound = moveObj.move;
                    }
                }
            }
            
            if (bestMoveFound === null && moves.length > 0) {
                return moves[0];
            }
            
            return bestMoveFound;
        }

        function selectiveSearch(depth, alpha, beta, isMaximizingPlayer, beamWidth) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board(), game.turn());
            }
            
            const moves = game.moves({ verbose: true });
            
            if (depth === 1 || moves.length <= beamWidth) {
                return minimax(depth, alpha, beta, isMaximizingPlayer);
            }
            
            const captureMoves = [];
            const nonCaptureMoves = [];
            
            for (const move of moves) {
                if (move.flags.includes('c')) {
                    captureMoves.push(move);
                } else {
                    nonCaptureMoves.push(move);
                }
            }
            
            const evaluatedCaptures = [];
            const evaluatedNonCaptures = [];
            
            for (const move of captureMoves) {
                game.move(move);
                const score = evaluateBoard(game.board(), game.turn());
                game.undo();
                evaluatedCaptures.push({ move, score });
            }
            
            for (const move of nonCaptureMoves) {
                game.move(move);
                const score = evaluateBoard(game.board(), game.turn());
                game.undo();
                evaluatedNonCaptures.push({ move, score });
            }
            
            evaluatedCaptures.sort((a, b) => {
                return isMaximizingPlayer ? b.score - a.score : a.score - b.score;
            });
            
            evaluatedNonCaptures.sort((a, b) => {
                return isMaximizingPlayer ? b.score - a.score : a.score - b.score;
            });
            
            let bestMoves = [].concat(evaluatedCaptures.slice(0, beamWidth));
            
            if (bestMoves.length < beamWidth) {
                bestMoves = bestMoves.concat(
                    evaluatedNonCaptures.slice(0, beamWidth - bestMoves.length)
                );
            }
            
            if (isMaximizingPlayer) {
                let bestScore = -Infinity;
                for (const moveObj of bestMoves) {
                    game.move(moveObj.move);
                    const score = selectiveSearch(depth - 1, alpha, beta, false, beamWidth);
                    game.undo();
                    bestScore = Math.max(bestScore, score);
                    alpha = Math.max(alpha, bestScore);
                    if (beta <= alpha) break;
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (const moveObj of bestMoves) {
                    game.move(moveObj.move);
                    const score = selectiveSearch(depth - 1, alpha, beta, true, beamWidth);
                    game.undo();
                    bestScore = Math.min(bestScore, score);
                    beta = Math.min(beta, bestScore);
                    if (beta <= alpha) break;
                }
                return bestScore;
            }
        }

        function minimax(depth, alpha, beta, isMaximizingPlayer) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board(), game.turn());
            }
            
            const moves = game.moves();
            
            if (isMaximizingPlayer) {
                let bestScore = -Infinity;
                for (const move of moves) {
                    game.move(move);
                    const score = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    bestScore = Math.max(bestScore, score);
                    alpha = Math.max(alpha, bestScore);
                    if (beta <= alpha) break;
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (const move of moves) {
                    game.move(move);
                    const score = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    bestScore = Math.min(bestScore, score);
                    beta = Math.min(beta, bestScore);
                    if (beta <= alpha) break;
                }
                return bestScore;
            }
        }

        // --- Controles de IA ---
        function makeAIMove() {
            if (game.game_over()) return;

            const ply = game.history().length;
            const isOpeningPhase = ply < 6;
            let openingMoveSAN = null;
            let captureAvailable = false;
            let bookMoveMade = false;

            if (game.turn() === aiColor && isOpeningPhase) {
                const possibleMoves = game.moves({ verbose: true });
                for (const move of possibleMoves) {
                    if (move.flags.includes('c')) {
                        captureAvailable = true;
                        break;
                    }
                }

                if (!captureAvailable) {
                    if (ply === 1) {
                        openingMoveSAN = 'e6';
                    } else if (ply === 3) {
                         if (game.history().length === 3 && game.history({verbose:true})[1].san === 'e6') {
                              openingMoveSAN = 'd5';
                         }
                    }
                }
            }

            if (openingMoveSAN) {
                 const moveResult = game.move(openingMoveSAN);
                 if (moveResult) {
                     board.position(game.fen());
                     updateStatus();
                     bookMoveMade = true;
                 }
            }

            if (!bookMoveMade) {
                var depth = parseInt(document.getElementById('difficulty').value);
                setThinkingStatus(true);
                window.setTimeout(function() {
                    var move = minimaxRoot(depth, false);
                    setThinkingStatus(false);

                    if (move) {
                        const capturedPiece = game.get(move.to);
                        game.move(move.san);
                        playMoveSound();
                        highlightMove(move.from, move.to);
                        
                        board.position(game.fen());
                        updateStatus();
                    } else {
                        console.error("AI falhou em encontrar um movimento!");
                    }
                }, 400);
            }
        }

        function setThinkingStatus(isThinking) {
            const statusElement = document.getElementById('status');
            if (isThinking) {
                statusElement.textContent = "IA está pensando...";
            } else {
                 updateStatus();
            }
        }

        function getPieceName(pieceName) {
            return pieceName.toUpperCase().slice(-1);
        }

        function updateCapturedPieces() {
            const blackCaptured = document.getElementById('blackCaptured');
            const whiteCaptured = document.getElementById('whiteCaptured');

            blackCaptured.innerHTML = '';
            whiteCaptured.innerHTML = '';
            
            capturedPieces.b.forEach(piece => {
                const img = document.createElement('img');
                img.src = `../assets/images/b${getPieceName(piece)}.png`;
                img.classList.add('captured-piece');
                blackCaptured.appendChild(img);
            });
            
            capturedPieces.w.forEach(piece => {
                const img = document.createElement('img');
                img.src = `../assets/images/w${getPieceName(piece)}.png`;
                img.classList.add('captured-piece');
                whiteCaptured.appendChild(img);
            });
        }

        function recalculateCapturedPieces() {
            capturedPieces.w = [];
            capturedPieces.b = [];
            
            const startingCounts = {
                p: 8, n: 2, b: 2, r: 2, q: 1
            };
            
            const currentCounts = {
                w: { p: 0, n: 0, b: 0, r: 0, q: 0 },
                b: { p: 0, n: 0, b: 0, r: 0, q: 0 }
            };
            
            const boardState = game.board();
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = boardState[i][j];
                    if (piece && piece.type !== 'k') {
                        currentCounts[piece.color][piece.type]++;
                    }
                }
            }
            
            for (const type in startingCounts) {
                const missingW = startingCounts[type] - currentCounts.w[type];
                for (let k = 0; k < missingW; k++) {
                    capturedPieces.w.push(type);
                }
                const missingB = startingCounts[type] - currentCounts.b[type];
                for (let k = 0; k < missingB; k++) {
                    capturedPieces.b.push(type);
                }
            }
            
            updateCapturedPieces();
        }

        function removeHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-white');
            $('#myBoard .square-55d63').removeClass('highlight-black');
        }

        function highlightMove(source, target) {
            removeHighlights();
            $('#myBoard .square-' + source).addClass('highlight-white');
            $('#myBoard .square-' + target).addClass('highlight-black');
        }

        function removeLegalMoveHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-legal-move');
        }

        function showLegalMoves(square) {
            const moves = game.moves({
                square: square,
                verbose: true
            });
            moves.forEach(move => {
                $(`#myBoard .square-${move.to}`).addClass('highlight-legal-move');
            });
        }

        // --- Handlers de Drag and Drop ---
        function onDragStart(source, piece, position, orientation) {
            removeLegalMoveHighlights();
            
            if (game.game_over() || game.turn() !== playerColor || piece.search(/^b/) !== -1) {
                return false;
            }
            showLegalMoves(source);
        }

        function onDrop(source, target) {
            removeLegalMoveHighlights();

            // Desativa controles de replay ao fazer jogada manual
            document.getElementById('replayControls').style.display = 'none';
            replayMoves = [];
            replayIndex = -1;

            const capturedPiece = game.get(target);
            
            var move = game.move({ 
                from: source, 
                to: target, 
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            playMoveSound();
            highlightMove(source, target);

            updateStatus();
            
            if (!game.game_over() && game.turn() === aiColor) {
                if (game.history().length <= 4) {
                    setTimeout(() => {
                        const possibleMoves = game.moves();
                        const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                        
                        game.move(randomMove);
                        playMoveSound();
                        
                        const lastMove = game.history({verbose: true})[game.history().length - 1];
                        highlightMove(lastMove.from, lastMove.to);
                        
                        board.position(game.fen());
                        updateStatus();
                    }, 400);
                } else {
                    makeAIMove();
                }
            }
        }

        // --- Status Tracker ---
        function updateStatus() {
            let status = '';
            let gameEnded = false;

            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Pretas' : 'Brancas';
                status = `Fim de jogo, ${winner} venceram por xeque-mate`;
                gameEnded = true;
                
                if (winner === 'Brancas') {
                    victorySound.play().catch(error => debug("Erro ao tocar som de vitória:", error));
                } else {
                    defeatSound.play().catch(error => debug("Erro ao tocar som de derrota:", error));
                }
            }
            else if (game.in_draw()) {
                status = 'Fim de jogo, empate';
                gameEnded = true;
                defeatSound.play().catch(error => debug("Erro ao tocar som de empate:", error));
            }
            else if (game.in_stalemate()) {
                status = 'Fim de jogo, empate por afogamento';
                gameEnded = true;
                defeatSound.play().catch(error => debug("Erro ao tocar som de empate:", error));
            }
            else if (game.in_threefold_repetition()) {
                status = 'Fim de jogo, empate por tripla repetição';
                gameEnded = true;
                defeatSound.play().catch(error => debug("Erro ao tocar som de empate:", error));
            }
            else if (game.insufficient_material()) {
                status = 'Fim de jogo, empate por material insuficiente';
                gameEnded = true;
                defeatSound.play().catch(error => debug("Erro ao tocar som de empate:", error));
            }
            else {
                status = game.turn() === 'b' ? 'Turno: Pretas' : 'Turno: Brancas';
            }

            if (game.in_check()) {
                status += ' (XEQUE)';
            }

            document.getElementById('turn').textContent = status;
            
            // Destaque de rei em xeque
            $('#myBoard .square-55d63').removeClass('highlight-check');
            if (game.in_check()) {
                const kingSquare = findKing(game.turn());
                if (kingSquare) {
                    $(`#myBoard .square-${kingSquare}`).addClass('highlight-check');
                }
            }
            
            recalculateCapturedPieces();
            
            if (gameEnded) {
                board.draggable = false;
                clearArrow();
            } else {
                board.draggable = true;
                requestAnalysis();
            }
        }

        // --- Replay de Histórico PGN/FEN ---
        let replayMoves = [];
        let replayIndex = -1;

        function updateReplayStatus() {
            document.getElementById('replayStatus').textContent = `Lance ${replayIndex + 1}/${replayMoves.length}`;
        }

        document.getElementById('loadPartidaBtn').addEventListener('click', function() {
            const input = document.getElementById('importInput').value.trim();
            if (!input) return;

            const tempGame = new Chess();
            
            // 1. Tentar como FEN
            if (tempGame.load(input)) {
                game = tempGame;
                board.position(game.fen());
                document.getElementById('replayControls').style.display = 'none';
                updateStatus();
                return;
            }

            // 2. Tentar como PGN
            if (tempGame.load_pgn(input)) {
                replayMoves = tempGame.history({ verbose: true });
                replayIndex = -1; // Começa no início do replay
                
                game = new Chess();
                board.position(game.fen());
                
                document.getElementById('replayControls').style.display = 'flex';
                updateReplayStatus();
                updateStatus();
                return;
            }

            alert('Formato posicional (FEN) ou histórico (PGN) inválido!');
        });

        document.getElementById('prevMoveBtn').addEventListener('click', function() {
            if (replayIndex >= 0) {
                game.undo();
                replayIndex--;
                board.position(game.fen());
                updateReplayStatus();
                updateStatus();
            }
        });

        document.getElementById('nextMoveBtn').addEventListener('click', function() {
            if (replayIndex < replayMoves.length - 1) {
                replayIndex++;
                game.move(replayMoves[replayIndex].san);
                board.position(game.fen());
                updateReplayStatus();
                updateStatus();
            }
        });

        document.getElementById('copyFenBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(game.fen());
            alert('FEN copiada para a área de transferência!');
        });

        document.getElementById('exportPgnBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(game.pgn());
            alert('Histórico PGN copiado para a área de transferência!');
        });

        // --- Customizador de Temas Visuais (Skins) ---
        document.getElementById('themeSelect').addEventListener('change', function(e) {
            const theme = e.target.value;
            
            // Remove classes antigas do body
            document.body.classList.remove('theme-wood', 'theme-glass', 'theme-cyber');
            document.body.classList.add(`theme-${theme}`);
            
            // Atualizar cores da seta baseadas no tema
            const arrowHead = document.querySelector('#arrowhead polygon');
            const arrowLine = document.getElementById('bestMoveLine');
            if (theme === 'cyber') {
                arrowHead.setAttribute('fill', '#00f5d4');
                arrowLine.setAttribute('stroke', '#00f5d4');
            } else if (theme === 'glass') {
                arrowHead.setAttribute('fill', '#ffffff');
                arrowLine.setAttribute('stroke', '#ffffff');
            } else {
                arrowHead.setAttribute('fill', '#ff9800');
                arrowLine.setAttribute('stroke', '#ff9800');
            }
        });

        // --- Configuração Chessboard.js ---
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: function() {
                board.position(game.fen());
            },
            onMouseoutSquare: removeLegalMoveHighlights,
            onMouseoverSquare: function(square, piece) {
                if (piece && piece.charAt(0) === playerColor) {
                    showLegalMoves(square);
                }
            },
            pieceTheme: '../assets/images/{piece}.png'
        };

        board = Chessboard('myBoard', config);

        // --- Event Listeners Globais ---
        document.getElementById('newGameButton').addEventListener('click', function() {
            game = new Chess();
            board.position('start');
            board.draggable = true;
            document.getElementById('replayControls').style.display = 'none';
            replayMoves = [];
            replayIndex = -1;
            bestMoveRecommended = null;
            
            capturedPieces.w = [];
            capturedPieces.b = [];
            updateCapturedPieces();
            updateStatus();
            removeHighlights();
            removeLegalMoveHighlights();
            document.getElementById('turn').textContent = 'Turno: Brancas';
            $('#myBoard .square-55d63').removeClass('highlight-check');
        });

        document.getElementById('difficulty').addEventListener('change', function(e) {
            currentDifficultyDepth = parseInt(e.target.value);
        });

        document.getElementById('toggleHintsBtn').addEventListener('click', function() {
            showComputerHints = !showComputerHints;
            if (showComputerHints) {
                this.textContent = '💡 Dicas: Ligadas';
                if (bestMoveRecommended && game.turn() === playerColor && !game.game_over()) {
                    drawBestMoveArrow(bestMoveRecommended.from, bestMoveRecommended.to);
                }
            } else {
                this.textContent = '💡 Dicas: Desligadas';
                clearArrow();
            }
        });

        // --- Inicialização ---
        $(window).resize(board.resize);
        initStockfish();
        updateStatus();
    </script>
</body>
</html>
