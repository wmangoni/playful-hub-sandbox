    function checkCollisions() {
        // 1. Colisões Bala do Jogador -> Inimigo/Chefe/Invocados (AABB numérico sem reflow)
        for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            if (!bullet || !bullet.parentNode) continue;
            const bLeft = bullet._x !== undefined ? bullet._x : parseFloat(bullet.style.left);
            const bTop = bullet._y !== undefined ? bullet._y : parseFloat(bullet.style.top);
            const bW = bullet._w || (bullet.isPlasma ? 24 : 6);
            const bH = bullet._h || (bullet.isPlasma ? 24 : 15);
            const bRight = bLeft + bW;
            const bBottom = bTop + bH;
            let hit = false;

            // --- Checa Chefe ---
            if (isBossActive && !isDreadnoughtActive && bossData) {
                const bossLeft = bossData.x || 0;
                const bossTop = bossData.y || 30;
                const bossRight = bossLeft + 100;
                const bossBottom = bossTop + 100;
                if (
                    bLeft < bossRight &&
                    bRight > bossLeft &&
                    bTop < bossBottom &&
                    bBottom > bossTop
                ) {
                    bossTakeDamage(bullet.classList.contains('special-bullet') ? 3 : 1);
                    hit = true;
                }
            }

            // --- Checa Inimigos Invocados ---
            if (!hit) {
                for (let j = summonedEnemies.length - 1; j >= 0; j--) {
                    const enemy = summonedEnemies[j];
                    if (!enemy || !enemy.parentNode) continue;
                    const eLeft = enemy._x !== undefined ? enemy._x : parseFloat(enemy.style.left);
                    const eTop = enemy._y !== undefined ? enemy._y : parseFloat(enemy.style.top);
                    const eW = enemy._w || 30;
                    const eH = enemy._h || 30;
                    if (
                        bLeft < eLeft + eW &&
                        bRight > eLeft &&
                        bTop < eTop + eH &&
                        bBottom > eTop
                    ) {
                        const enemyCenterX = eLeft + eW / 2;
                        const enemyCenterY = eTop + eH / 2;
                        createExplosion(enemyCenterX, enemyCenterY);
                        createPowerup(enemyCenterX, enemyCenterY);
                        if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                        summonedEnemies.splice(j, 1);
                        playSound(sfxPop);
                        hit = true;
                        break;
                    }
                }
            }

            // --- Checa Inimigos Normais ---
            if (!isBossActive && !hit) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (!enemy || !enemy.parentNode) continue;
                    const eLeft = enemy._x !== undefined ? enemy._x : parseFloat(enemy.style.left);
                    const eTop = enemy._y !== undefined ? enemy._y : parseFloat(enemy.style.top);
                    const eW = enemy._w || 30;
                    const eH = enemy._h || 30;
                    if (
                        bLeft < eLeft + eW &&
                        bRight > eLeft &&
                        bTop < eTop + eH &&
                        bBottom > eTop
                    ) {
                        playSound(sfxPop);
                        const enemyCenterX = eLeft + eW / 2;
                        const enemyCenterY = eTop + eH / 2;
                        createExplosion(enemyCenterX, enemyCenterY);
                        createPowerup(enemyCenterX, enemyCenterY);
                        if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                        enemies.splice(j, 1);

                        score += 10 * currentPhase;
                        scoreElement.textContent = `Score: ${score}`;
                        coins += 5;
                        updateCoinsDisplay();
                        phaseProgress++;
                        const goalIndex = currentPhase - 1;
                        if (goalIndex < phaseGoals.length && typeof phaseGoals[goalIndex] === 'number' && phaseGoals[goalIndex] > 1) {
                            if (phaseProgress >= phaseGoals[goalIndex]) {
                                advancePhase();
                            }
                        }
                        hit = true;
                        break;
                    }
                }
            }

            // --- Remove a bala SE atingiu QUALQUER alvo ---
            if (hit) {
                if (bullet.isPlasma) {
                    triggerPlasmaExplosion(bLeft + bW / 2, bTop + bH / 2);
                }
                if (bullet.parentNode === gameContainer) {
                    try {
                        gameContainer.removeChild(bullet);
                    } catch(e) {}
                }
                bullets.splice(i, 1);
            }
        }

        // 2. Colisões Tiro Inimigo/Chefe -> Jogador e Goliath
        if (escortModeActive && !isGameOver) {
            const gLeft = goliathX;
            const gTop = goliathY;
            const gRight = gLeft + 90;
            const gBottom = gTop + 50;

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                if (!bullet || !bullet.parentNode) continue;
                const bLeft = bullet._x !== undefined ? bullet._x : parseFloat(bullet.style.left);
                const bTop = bullet._y !== undefined ? bullet._y : parseFloat(bullet.style.top);
                const bW = bullet._w || 8;
                const bH = bullet._h || 15;

                if (
                    gLeft < bLeft + bW &&
                    gRight > bLeft &&
                    gTop < bTop + bH &&
                    gBottom > bTop
                ) {
                    goliathTakeDamage(15);
                    if (bullet.parentNode === gameContainer) {
                        try { gameContainer.removeChild(bullet); } catch(e) {}
                    }
                    enemyBullets.splice(i, 1);
                    break;
                }
            }

            const allKillableEnemies = enemies.concat(summonedEnemies);
            for (let i = allKillableEnemies.length - 1; i >= 0; i--) {
                const enemy = allKillableEnemies[i];
                if (!enemy || !enemy.parentNode) continue;
                const eLeft = enemy._x !== undefined ? enemy._x : parseFloat(enemy.style.left);
                const eTop = enemy._y !== undefined ? enemy._y : parseFloat(enemy.style.top);
                const eW = enemy._w || 30;
                const eH = enemy._h || 30;

                if (
                    gLeft < eLeft + eW &&
                    gRight > eLeft &&
                    gTop < eTop + eH &&
                    gBottom > eTop
                ) {
                    const eCenterX = eLeft + eW / 2;
                    const eCenterY = eTop + eH / 2;
                    createExplosion(eCenterX, eCenterY);
                    if (enemy.parentNode === gameContainer) {
                        try { gameContainer.removeChild(enemy); } catch(e) {}
                    }
                    const idxE = enemies.indexOf(enemy);
                    if (idxE > -1) enemies.splice(idxE, 1);
                    const idxS = summonedEnemies.indexOf(enemy);
                    if (idxS > -1) summonedEnemies.splice(idxS, 1);

                    goliathTakeDamage(25);
                    break;
                }
            }
        }

        const pLeft = playerX;
        const pTop = playerY;
        const pRight = pLeft + playerWidth;
        const pBottom = pTop + playerHeight;

        if (!isPlayerInvulnerable && !isGameOver) {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                if (!bullet || !bullet.parentNode) continue;
                const bLeft = bullet._x !== undefined ? bullet._x : parseFloat(bullet.style.left);
                const bTop = bullet._y !== undefined ? bullet._y : parseFloat(bullet.style.top);
                const bW = bullet._w || 8;
                const bH = bullet._h || 15;

                if (
                    pLeft < bLeft + bW &&
                    pRight > bLeft &&
                    pTop < bTop + bH &&
                    pBottom > bTop
                ) {
                    playerTakeDamage(15);
                    if (bullet.parentNode === gameContainer) {
                        try { gameContainer.removeChild(bullet); } catch(e) {}
                    }
                    enemyBullets.splice(i, 1);
                    break;
                }
            }
        }

        // 3. Colisões Jogador -> Inimigo/Invocado
        if (!isPlayerInvulnerable && !isGameOver) {
            const allKillableEnemies = enemies.concat(summonedEnemies);

            for (let i = allKillableEnemies.length - 1; i >= 0; i--) {
                const enemy = allKillableEnemies[i];
                if (!enemy || !enemy.parentNode) continue;
                const eLeft = enemy._x !== undefined ? enemy._x : parseFloat(enemy.style.left);
                const eTop = enemy._y !== undefined ? enemy._y : parseFloat(enemy.style.top);
                const eW = enemy._w || 30;
                const eH = enemy._h || 30;

                if (
                    pLeft < eLeft + eW &&
                    pRight > eLeft &&
                    pTop < eTop + eH &&
                    pBottom > eTop
                ) {
                    const enemyCenterX = eLeft + eW / 2;
                    const enemyCenterY = eTop + eH / 2;
                    createExplosion(enemyCenterX, enemyCenterY);
                    if (enemy.parentNode === gameContainer) {
                        try { gameContainer.removeChild(enemy); } catch(e) {}
                    }

                    const indexInEnemies = enemies.indexOf(enemy);
                    if (indexInEnemies > -1) {
                        enemies.splice(indexInEnemies, 1);
                    } else {
                        const indexInSummoned = summonedEnemies.indexOf(enemy);
                        if (indexInSummoned > -1) {
                            summonedEnemies.splice(indexInSummoned, 1);
                        }
                    }

                    playerTakeDamage(25);
                    break;
                }
            }
        }

        // 4. Colisões Jogador -> Powerups
        for (let i = powerups.length - 1; i >= 0; i--) {
            const powerup = powerups[i];
            const puLeft = powerup._x !== undefined ? powerup._x : parseFloat(powerup.style.left);
            const puTop = powerup._y !== undefined ? powerup._y : parseFloat(powerup.style.top);
            const puW = powerup._w || 25;
            const puH = powerup._h || 25;

            if (
                pLeft < puLeft + puW &&
                pRight > puLeft &&
                pTop < puTop + puH &&
                pBottom > puTop
            ) {
                switch (powerup.type) {
                    case 'health':
                        playerCurrentHP = Math.min(playerMaxHP, playerCurrentHP + 25);
                        updatePlayerHPBar();
                        break;
                    case 'shield':
                        hasShield += 1;
                        player.classList.add('shielded');
                        break;
                    case 'special':
                        specialCharges += 1;
                        specialChargesElement.textContent = `Tiro Especial: ${specialCharges}`;
                        break;
                    case 'homing':
                        activateHoming();
                        break;
                }

                if (powerup.parentNode === gameContainer) {
                    gameContainer.removeChild(powerup);
                }
                powerups.splice(i, 1);
                playSound(sfxPowerup);
            }
        }
    }

    function activateHoming() {
        isHomingActive = true;
        if (homingTimer) clearTimeout(homingTimer);

        homingTimer = setTimeout(() => {
            deactivateHoming();
        }, 6000);
    }

    function deactivateHoming() {
        isHomingActive = false;
        if (homingTimer) {
            clearTimeout(homingTimer);
            homingTimer = null;
        }
    }

    function gameOver() {
        if (isGameOver) return;
        isGameOver = true;
        finalScoreElement.textContent = `Score: ${score}`;
        saveHighScore();
        gameOverScreen.style.display = 'flex';
        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        deactivateSpecial();
        player.style.display = 'none';

        playSound(sfxGameOver);
        stopMusic();
        playSound(bgmGameOver);

        isPlayerInvulnerable = false;
        player.classList.remove('invulnerable');
        if (playerInvulnerableTimer) clearTimeout(playerInvulnerableTimer);
        bossElement.style.display = 'none';
        if (dreadnoughtElement) dreadnoughtElement.style.display = 'none';
        bossHPContainer.style.display = 'none';
    }

    function resetGame() {
        stopMusic();
        loadHighScore();
        destroyBlackHole();
        deactivateHyperbeamState();
        if (escortModeActive) {
            escortModeActive = false;
            if (goliathElement) goliathElement.style.display = 'none';
            if (goliathHPContainer) goliathHPContainer.style.display = 'none';
        }
        updateCoinsDisplay();

        bullets.forEach(b => { if(b.parentNode === gameContainer) gameContainer.removeChild(b); });
        bullets = [];
        enemies.forEach(e => { if(e.parentNode === gameContainer) gameContainer.removeChild(e); });
        enemies = [];
        enemyBullets.forEach(eb => { if(eb.parentNode === gameContainer) gameContainer.removeChild(eb); });
        enemyBullets = [];
        summonedEnemies.forEach(e => { if(e.parentNode === gameContainer) gameContainer.removeChild(e); });
        summonedEnemies = [];
        bossGenerators.forEach(g => { if(g.element && g.element.parentNode === gameContainer) gameContainer.removeChild(g.element); });
        bossGenerators = [];
        clearAllVFX();
        meteors.forEach(m => { if(m.element && m.element.parentNode === gameContainer) gameContainer.removeChild(m.element); });
        meteors = [];

        containerWidth = window.innerWidth || (gameContainer && gameContainer.offsetWidth) || 1920;
        containerHeight = window.innerHeight || (gameContainer && gameContainer.offsetHeight) || 1080;
        resizeShaderCanvas();
        resizeVfxCanvas();
        playerX = containerWidth / 2 - playerWidth / 2;
        playerY = containerHeight - playerHeight - 20;
        playerCurrentHP = playerMaxHP;
        isPlayerInvulnerable = false;
        if (playerInvulnerableTimer) clearTimeout(playerInvulnerableTimer);
        score = 0;
        currentPhase = 1;
        phaseProgress = 0;
        isBossActive = false;
        isDreadnoughtActive = false;
        bossData = {};
        specialCharges = 3;
        isGameOver = false;
        isSpecialActive = false;
        lastEnemySpawnTime = 0;

        scoreElement.textContent = `Score: ${score}`;
        updatePlayerHPBar();
        phaseDisplay.textContent = `Fase: ${currentPhase}`;
        specialChargesElement.textContent = `Tiro Especial: ${specialCharges}`;
        gameOverScreen.style.display = 'none';
        specialActiveElement.style.display = 'none';
        specialBarFill.style.width = '0%';
        player.style.display = 'block';
        player.style.left = playerX + 'px';
        player.classList.remove('invulnerable');
        bossElement.style.display = 'none';
        if (dreadnoughtElement) dreadnoughtElement.style.display = 'none';
        bossHPContainer.style.display = 'none';

        createStars();
        updateAndRenderCosmicShader(16);
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = null;
        startGame();

        powerups.forEach(p => { if(p.parentNode === gameContainer) gameContainer.removeChild(p); });
        powerups = [];
        hasShield = 0;
        player.classList.remove('shielded');
    }

    function enableAutoFire() {
        setInterval(() => {
            if (!isGameOver) {
                fireBullet();
            }
        }, 300);
    }

    function gameLoop() {
        if (!isGameOver) {
            const now = performance.now();
            const dt = Math.min(50, now - lastFrameTimestamp);
            lastFrameTimestamp = now;

            updatePlayer();
            if (isFirePressed) {
                fireBullet();
            }
            if (isSpecialPressed && !isSpecialActive && specialCharges > 0) {
                activateSpecial();
                isSpecialPressed = false;
            }
            updateBullets();
            updateEnemyBullets();
            enemiesFireBullets();
            createEnemy();
            updateEnemies();
            updateBoss();
            updateDreadnought(dt);
            updateEngineTrails();
            updateGravityAnomalies(dt);
            updateGoliathTransport(dt);
            updateStars();
            checkCollisions();
            updatePowerups();
            updateAndRenderCosmicShader(dt);
            updateAndRenderVFX();
            checkCriticalHealthAlert();
            gameLoopId = requestAnimationFrame(gameLoop);
        }
    }

    function advancePhase() {
        checkEscortCompletion();

        currentPhase++;
        phaseProgress = 0;

        phaseDisplay.textContent = `Fase: ${currentPhase}`;
        console.log(`Advanced to Phase ${currentPhase}`);

        const goalIndex = currentPhase - 1;

        if (goalIndex < phaseGoals.length
            && typeof phaseGoals[goalIndex] === 'number'
            && phaseGoals[goalIndex] === 1
        ) {
            spawnBoss();
        } else if (currentPhase >= 3 && currentPhase % 2 === 1) {
            initEscortMode();
        } else if (goalIndex >= phaseGoals.length) {
            console.log("Todas as fases definidas completas!");
        }

        showPhaseNotification(`Fase ${currentPhase} Iniciada!`);
    }

    function setupControls() {
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                isLeftPressed = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'd') {
                isRightPressed = true;
            }
            if (e.key === 'ArrowUp' || e.key === 'w') {
                isFirePressed = true;
            }
            if (e.key === ' ' && !isSpecialPressed) {
                isSpecialPressed = true;
            }
            if (e.key === 'h' || e.key === 'H') {
                if (weaponModal) {
                    renderWeaponCards();
                    weaponModal.style.display = weaponModal.style.display === 'flex' ? 'none' : 'flex';
                }
            }
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
            if (e.key === 'Escape') {
                if (weaponModal) weaponModal.style.display = 'none';
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                isLeftPressed = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd') {
                isRightPressed = false;
            }
            if (e.key === 'ArrowUp' || e.key === 'w') {
                isFirePressed = false;
            }
            if (e.key === ' ') {
                isSpecialPressed = false;
            }
        });

        let touchStartX = 0;
        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;

            const now = new Date().getTime();
            const timeSince = now - (touch.target.lastTouch || 0);

            if (timeSince < 300 && timeSince > 0) {
                isSpecialPressed = true;
            }

            touch.target.lastTouch = now;
            isFirePressed = true;
        });

        gameContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const touchX = touch.clientX;

            if (touchX < touchStartX - 20) {
                isLeftPressed = true;
                isRightPressed = false;
            } else if (touchX > touchStartX + 20) {
                isLeftPressed = false;
                isRightPressed = true;
            } else {
                isLeftPressed = false;
                isRightPressed = false;
            }

            playerX = touchX - playerWidth / 2;
            if (playerX < 0) playerX = 0;
            if (playerX > containerWidth - playerWidth) playerX = containerWidth - playerWidth;
        });

        gameContainer.addEventListener('touchend', () => {
            isFirePressed = false;
            isLeftPressed = false;
            isRightPressed = false;
        });

        restartButton.addEventListener('click', resetGame);
    }

    function startGame() {
        if (!window.controlsInitialized) {
            setupControls();
            enableAutoFire();
            window.controlsInitialized = true;
        }
        stopMusic();
        playSound(bgmGame);
        if (!gameLoopId) {
           gameLoopId = requestAnimationFrame(gameLoop);
        }
    }

    function updatePlayerHPBar() {
        const percentage = (playerCurrentHP / playerMaxHP) * 100;
        playerHPBarFill.style.width = `${Math.max(0, percentage)}%`;
    }

    function playerTakeDamage(damage) {
        if (isPlayerInvulnerable || isGameOver) return;

        if (hasShield > 0) {
            hasShield--;
            if (hasShield <= 0) {
                hasShield = 0;
                player.classList.remove('shielded');
            } else {
                return;
            }
        }

        playerCurrentHP -= damage;
        updatePlayerHPBar();
        playSound(sfxPlayerDamage);
        triggerScreenShake();

        if (playerCurrentHP <= 0) {
            playerCurrentHP = 0;
            updatePlayerHPBar();
            createExplosion(playerX + playerWidth / 2, playerY + playerHeight / 2);
            player.style.display = 'none';
            gameOver();
        } else {
            isPlayerInvulnerable = true;
            player.classList.add('invulnerable');

            if (playerInvulnerableTimer) {
                clearTimeout(playerInvulnerableTimer);
            }

            playerInvulnerableTimer = setTimeout(() => {
                isPlayerInvulnerable = false;
                player.classList.remove('invulnerable');
                playerInvulnerableTimer = null;
            }, playerInvulnerableDuration);
        }
    }

    function spawnBoss() {
        console.log("Spawning Boss for Phase", currentPhase);
        isBossActive = true;
        bossElement.style.display = 'block';
        bossHPContainer.style.display = 'block';

        bossData = {
            maxHP: 300 + (currentPhase * 100),
            currentHP: 0,
            x: containerWidth / 2 - 50,
            y: 30,
            targetY: 30,
            speedX: 1.5 + (currentPhase * 0.2),
            speedY: 0.5 + (currentPhase * 0.1),
            directionX: 1,
            directionY: 1,
            attackTimer: 0,
            attackInterval: 1400 - (currentPhase * 90),
            lastAttackTime: 0,
            summonInterval: 8000 - (currentPhase * 500),
            lastSummonTime: Date.now(),
            attackPattern: 0,
            lastPatternSwitchTime: Date.now()
        };
        bossData.currentHP = bossData.maxHP;
        bossElement.style.left = bossData.x + 'px';
        bossElement.style.top = bossData.y + 'px';
        updateBossHPBar();

        enemies.forEach(enemy => {
            if(enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
        });
        enemies = [];
        summonedEnemies.forEach(enemy => { if(enemy.parentNode === gameContainer) gameContainer.removeChild(enemy); });
        summonedEnemies = [];
    }

    function updateBossHPBar() {
        const percentage = (bossData.currentHP / bossData.maxHP) * 100;
        bossHPFill.style.width = `${Math.max(0, percentage)}%`;
    }

    function updateBoss() {
        if (!isBossActive || isDreadnoughtActive) return;
        const now = Date.now();

        bossData.x += bossData.speedX * bossData.directionX;
        if (bossData.x <= 10 || bossData.x >= containerWidth - 110) {
            bossData.directionX *= -1;
            bossData.x = Math.max(10, Math.min(bossData.x, containerWidth - 110));
        }
        bossData.y += bossData.speedY * bossData.directionY;
        if (bossData.y <= 20 || bossData.y >= 60) {
            bossData.directionY *= -1;
            bossData.y = Math.max(20, Math.min(bossData.y, 60));
        }
        bossElement.style.left = bossData.x + 'px';
        bossElement.style.top = bossData.y + 'px';

        if (now - bossData.lastAttackTime > bossData.attackInterval) {
            bossData.lastAttackTime = now;
            const cannonLeftX = bossData.x + 25;
            const cannonRightX = bossData.x + 75;
            const cannonY = bossData.y + 90;

            bossData.attackPattern = (bossData.attackPattern + 1) % 3;

            if (bossData.attackPattern === 0) {
                bossFireBullet(cannonLeftX, cannonY, 0, 4 + currentPhase * 0.5);
                bossFireBullet(cannonRightX, cannonY, 0, 4 + currentPhase * 0.5);
            } else if (bossData.attackPattern === 1) {
                bossFireBullet(cannonLeftX, cannonY, -1, 3.5 + currentPhase * 0.5);
                bossFireBullet(bossData.x + 50, cannonY, 0, 4 + currentPhase * 0.5);
                bossFireBullet(cannonRightX, cannonY, 1, 3.5 + currentPhase * 0.5);
            } else {
                const targetCannonX = Math.random() < 0.5 ? cannonLeftX : cannonRightX;
                for(let i=0; i<3; i++){
                    setTimeout(() => {
                        if(isBossActive && !isDreadnoughtActive) bossFireBullet(targetCannonX, cannonY, 0, 5 + currentPhase * 0.5);
                    }, i * 100);
                }
            }
        }

        if (now - bossData.lastSummonTime > bossData.summonInterval
            && summonedEnemies.length < 4
        ) {
            bossData.lastSummonTime = now;
            const summonY = bossData.y + 80;
            createEnemy(true, bossData.x, summonY);
            createEnemy(true, bossData.x + 70, summonY);
        }
    }

    function bossTakeDamage(damage) {
        if (!isBossActive) return;
        bossData.currentHP -= damage;
        updateBossHPBar();

        bossElement.style.opacity = '0.6';
        setTimeout(() => { bossElement.style.opacity = '1'; }, 100);

        if (bossData.currentHP <= 0) {
            playSound(sfxExplosion);
            if (isDreadnoughtActive) {
                defeatDreadnought();
            } else {
                defeatBoss();
            }
        }
    }

    function defeatBoss() {
        console.log("Boss Defeated!");
        isBossActive = false;
        createExplosion(bossData.x + 50, bossData.y + 50);
        bossElement.style.display = 'none';
        bossHPContainer.style.display = 'none';

        summonedEnemies.forEach(enemy => { if(enemy.parentNode === gameContainer) gameContainer.removeChild(enemy); });
        summonedEnemies = [];

        score += 500 * currentPhase;
        scoreElement.textContent = `Score: ${score}`;
        if (specialCharges < 3) {
             specialCharges++;
             specialChargesElement.textContent = `Tiro Especial: ${specialCharges}`;
        }
         playerCurrentHP = Math.min(playerMaxHP, playerCurrentHP + 25);
         updatePlayerHPBar();

        advancePhase();
    }

    function showPhaseNotification(message) {
        let notification = document.getElementById('phase-notification');
        if (!notification) {
            notification = document.createElement('div');
            notification.id = 'phase-notification';
            notification.style.position = 'absolute';
            notification.style.top = '40%';
            notification.style.left = '50%';
            notification.style.transform = 'translate(-50%, -50%)';
            notification.style.padding = '15px 30px';
            notification.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            notification.style.color = '#0f0';
            notification.style.fontSize = '24px';
            notification.style.fontWeight = 'bold';
            notification.style.borderRadius = '10px';
            notification.style.zIndex = '20';
            notification.style.display = 'none';
            gameContainer.appendChild(notification);
        }
        notification.textContent = message;
        notification.style.display = 'block';
        setTimeout(() => {
            notification.style.display = 'none';
        }, 2000);
    }

    function loadHighScore() {
        const storedScore = localStorage.getItem('spaceShooterHighScore');
        highScore = storedScore ? parseInt(storedScore, 10) : 0;
        highScoreElement.textContent = `High Score: ${highScore}`;
    }

    function saveHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('spaceShooterHighScore', highScore);
            highScoreElement.textContent = `High Score: ${highScore}`;
        }
    }

    function updateEnemyBullets() {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const bullet = enemyBullets[i];
            const x = (bullet._x !== undefined ? bullet._x : parseFloat(bullet.style.left)) + (bullet.speedX || 0);
            const y = (bullet._y !== undefined ? bullet._y : parseFloat(bullet.style.top)) + bullet.speedY;

            if (y > containerHeight || y < -20 || x < -10 || x > containerWidth + 10) {
                if (bullet.parentNode === gameContainer) gameContainer.removeChild(bullet);
                enemyBullets.splice(i, 1);
            } else {
                bullet._x = x;
                bullet._y = y;
                bullet.style.top = y + 'px';
                bullet.style.left = x + 'px';
            }
        }
    }

    function bossFireBullet(startX, startY, speedX, speedY) {
        const bullet = document.createElement('div');
        bullet.className = 'enemy-bullet';
        bullet._x = startX;
        bullet._y = startY;
        bullet._w = 8;
        bullet._h = 15;
        bullet.style.left = startX + 'px';
        bullet.style.top = startY + 'px';
        bullet.speedX = speedX;
        bullet.speedY = speedY;
        gameContainer.appendChild(bullet);
        enemyBullets.push(bullet);
    }

    window.controlsInitialized = false;
    loadHighScore();
    resetGame();

    // Hook global para automação de QA e testes
    window.__spaceShooter = {
        getPlayerState: () => ({
            hp: playerCurrentHP,
            maxHp: playerMaxHP,
            x: playerX,
            y: playerY,
            score: score,
            highScore: highScore,
            phase: currentPhase,
            specialCharges: specialCharges,
            isSpecialActive: isSpecialActive,
            isInvulnerable: isPlayerInvulnerable,
            hasShield: typeof hasShield !== 'undefined' ? hasShield : 0,
            isGameOver: isGameOver,
            coins: coins,
            activeWeapon: activeWeapon,
            unlockedWeapons: [...unlockedWeapons]
        }),
        getBossState: () => ({
            isBossActive: isBossActive,
            isDreadnoughtActive: isDreadnoughtActive,
            bossData: bossData,
            bossPhase: bossPhase,
            generatorsCount: bossGenerators.filter(g => g.hp > 0).length,
            isHyperbeamCharging: isHyperbeamCharging,
            isHyperbeamFiring: isHyperbeamFiring
        }),
        getWeaponsState: () => ({
            activeWeapon: activeWeapon,
            unlockedWeapons: [...unlockedWeapons],
            specs: WEAPON_SPECS
        }),
        getBlackHoleState: () => ({
            active: blackHoleActive,
            x: blackHoleX,
            y: blackHoleY,
            timer: blackHoleTimer
        }),
        getEscortState: () => ({
            active: escortModeActive,
            hp: goliathHP,
            maxHp: goliathMaxHP,
            x: goliathX,
            y: goliathY
        }),
        getVfxState: () => ({
            activeParticles: activeVfxParticles.length,
            activeShockwaves: activeShockwaves.length,
            poolAvailable: vfxPool.length,
            starsCount: stars.length
        }),
        getShaderState: () => ({
            webglActive: Boolean(gl && shaderProgram),
            scale: shaderScale,
            width: shaderCanvas ? shaderCanvas.width : 0,
            height: shaderCanvas ? shaderCanvas.height : 0,
            blackHoleLensStrength: shaderBlackHoleStrength,
            hyperbeamLensStrength: shaderHyperbeamStrength
        }),
        fireBullet: () => {
            lastFireTime = 0;
            fireBullet();
        },
        triggerSpecial: () => {
            if (specialCharges > 0 && !isSpecialActive) activateSpecial();
        },
        playerTakeDamage,
        spawnBoss,
        spawnDreadnoughtPrime,
        defeatDreadnought,
        spawnBlackHole,
        destroyBlackHole,
        initEscortMode,
        goliathTakeDamage,
        buyWeapon: (id) => window.buyWeapon(id),
        equipWeapon: (id) => window.equipWeapon(id),
        setCoins: (c) => { coins = c; updateCoinsDisplay(); },
        setPhase: (p) => { currentPhase = p; if (phaseDisplay) phaseDisplay.textContent = `Fase: ${currentPhase}`; },
        setScore: (s) => { score = s; if (scoreElement) scoreElement.textContent = `Score: ${score}`; },
        resetGame,
        openWeaponModal: () => { if (weaponModal) { renderWeaponCards(); weaponModal.style.display = 'flex'; } },
        closeWeaponModal: () => { if (weaponModal) { weaponModal.style.display = 'none'; } }
    };
</script>
