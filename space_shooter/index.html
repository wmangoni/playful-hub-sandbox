    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 2px solid #333;
            background-color: #050510;
            overflow: hidden;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            bottom: 20px;
            left: 280px;
            transition: opacity 0.15s ease-in-out;
        }
        #player polygon {
            fill: #3498db;
        }
        #player rect {
            animation: thrust 0.1s infinite alternate;
        }
        @keyframes thrust {
            from { fill: #e74c3c; }
            to { fill: #ff7f50; }
        }
        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            transition: transform 0.1s ease-out;
        }
        .enemy.hit {
            transform: scale(1.1);
            filter: brightness(1.5);
        }
        .bullet {
            position: absolute;
            width: 10px;
            height: 20px;
            background-color: #f1c40f;
            border-radius: 3px;
            box-shadow: 0 0 4px #f1c40f;
        }
        .special-bullet {
            position: absolute;
            width: 10px;
            height: 20px;
            background-color: #00ffff;
            box-shadow: 0 0 8px #00ffff, 0 0 4px #ffffff inset;
            border-radius: 3px;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
        }
        .star-layer1 {
            width: 2px;
            height: 2px;
            opacity: 0.9;
        }
        .star-layer2 {
            width: 1.5px;
            height: 1.5px;
            opacity: 0.6;
        }
        .star-layer3 {
            width: 1px;
            height: 1px;
            opacity: 0.4;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #player-hp-bar-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 15px;
            background-color: #555;
            border: 1px solid #888;
            border-radius: 3px;
        }
        #player-hp-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #e74c3c;
            border-radius: 2px;
            transition: width 0.2s ease-out;
        }
        #special-charges {
            position: absolute;
            top: 40px;
            right: 10px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #phase-display {
            position: absolute;
            top: 40px;
            left: 10px;
            color: #ff9900;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #special-active {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 16px;
            display: none;
        }
        #special-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
        }
        #special-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #00ffff;
            border-radius: 5px;
            transition: width 0.1s;
        }
        #player.invulnerable {
            opacity: 0.5;
            animation: blink 0.15s linear infinite;
        }
        @keyframes blink {
            50% { opacity: 0.2; }
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .explosion {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: orange;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.3s ease-out forwards;
            z-index: 5;
        }
        @keyframes explode {
            0% { transform: scale(0.1); opacity: 1; background-color: yellow; }
            50% { background-color: orange; }
            100% { transform: scale(1.5); opacity: 0; background-color: darkred; }
        }
        #game-container.shake {
            animation: screenShake 0.15s linear;
        }
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-0.5deg); }
            50% { transform: translateX(3px) rotate(0.5deg); }
            75% { transform: translateX(-2px) rotate(-0.2deg); }
        }
        #boss {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 30px;
            left: calc(50% - 50px);
            z-index: 3;
        }
        #boss svg {
            width: 100%;
            height: 100%;
        }
        #boss-hp-bar-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background-color: #444;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 10;
            text-align: center;
        }
        #boss-hp-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #e74c3c;
            border-radius: 4px;
            transition: width 0.3s ease-out;
        }
        #boss-name {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            line-height: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 1px black;
        }
        #high-score {
            margin-top: 10px;
            font-size: 18px;
            color: #f1c40f;
        }
        .enemy-bullet {
            position: absolute;
            width: 8px;
            height: 15px;
            background-color: #e74c3c;
            border-radius: 4px;
            box-shadow: 0 0 3px #e74c3c;
        }
        .powerup {
            position: absolute;
            width: 25px;
            height: 25px;
            animation: pulse 1s infinite alternate;
            z-index: 2;
        }
        .powerup svg {
            width: 100%;
            height: 100%;
        }
        @keyframes pulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.3); }
        }
        #player.shielded::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            border-radius: 50%;
            border: 2px solid #3498db;
            box-shadow: 0 0 10px #3498db;
            animation: shield-pulse 1s infinite alternate;
            pointer-events: none;
        }
        @keyframes shield-pulse {
            from { transform: scale(1); opacity: 0.5; }
            to { transform: scale(1.1); opacity: 0.8; }
        }
        .bullet.homing {
            width: 12px;
            height: 12px;
            background-color: #e67e22;
            border-radius: 50%;
            box-shadow: 0 0 8px #e67e22;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            animation: particleBurst 0.6s ease-out forwards;
            will-change: transform, opacity;
        }
        @keyframes particleBurst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--moveX, 0), var(--moveY, 0)) scale(0);
                opacity: 0;
            }
        }

        /* --- TASK_003: Critical HP Vignette --- */
        .critical-hp-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0px solid transparent;
            pointer-events: none;
            z-index: 24;
            transition: border-width 0.3s;
            box-sizing: border-box;
        }
        .critical-hp-vignette.active {
            border: 15px solid transparent;
            animation: pulseLowHP 0.8s infinite alternate;
        }
        @keyframes pulseLowHP {
            0% {
                box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.2);
                border-color: rgba(255, 0, 0, 0.15);
            }
            100% {
                box-shadow: inset 0 0 35px rgba(255, 0, 0, 0.85);
                border-color: rgba(255, 0, 0, 0.65);
            }
        }

        /* --- Dynamic Screen Shake --- */
        #game-container.shake-active {
            animation: dynamicShake 0.08s infinite;
        }
        @keyframes dynamicShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(calc(-1 * var(--shake-mag, 3px)), calc(var(--shake-mag, 3px) * 0.5)); }
            50% { transform: translate(var(--shake-mag, 3px), calc(-1 * var(--shake-mag, 3px))); }
            75% { transform: translate(calc(var(--shake-mag, 3px) * -0.5), calc(-1 * var(--shake-mag, 3px) * 0.5)); }
            100% { transform: translate(0, 0); }
        }

        /* --- Dreadnought & Orbital Generators --- */
        #dreadnought-boss {
            position: absolute;
            z-index: 5;
            display: none;
        }
        .boss-generator {
            position: absolute;
            width: 24px;
            height: 24px;
            z-index: 6;
            filter: drop-shadow(0 0 5px #00e676);
        }
        .homing-missile {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ff0055 30%, #ff6600 80%);
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0055, 0 0 5px #ffffff;
            z-index: 7;
        }

        /* --- Meteor Styling --- */
        .enemy.meteor {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.2));
        }
        .enemy.meteor.giant {
            width: 36px;
            height: 36px;
        }
        /* --- TASK_004: Black Hole, Goliath Escort & Weapon Tuning --- */
        .black-hole {
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 4;
            pointer-events: none;
            animation: spinVORTEX 8s linear infinite;
        }
        @keyframes spinVORTEX {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #goliath-transport {
            position: absolute;
            width: 90px;
            height: 55px;
            z-index: 5;
            transition: filter 0.2s;
        }
        #goliath-hp-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 180px;
            height: 22px;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid #00ffff;
            border-radius: 6px;
            z-index: 20;
            display: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            font-size: 11px;
            color: #00ffff;
            font-weight: bold;
            line-height: 22px;
            text-align: center;
        }
        #goliath-hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #0088ff, #00ffff);
            border-radius: 4px;
            transition: width 0.2s;
        }
        #goliath-hp-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 4px #000;
        }
        .plasma-orb {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ffffff 10%, #2ecc71 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 12px #2ecc71, 0 0 20px #2ecc71;
            z-index: 6;
        }
        .weapon-btn {
            position: absolute;
            top: 70px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 25;
            transition: all 0.2s;
        }
        .weapon-btn:hover {
            background: #f1c40f;
            color: #000;
            box-shadow: 0 0 10px #f1c40f;
        }
        #weapon-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
            z-index: 40;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        #weapon-modal h2 {
            margin: 0 0 15px 0;
            color: #00ffff;
            text-shadow: 0 0 8px #00ffff;
            font-size: 20px;
            text-align: center;
        }
        .weapon-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .weapon-card.active {
            border-color: #00ffff;
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 8px rgba(0,255,255,0.3);
        }
        .weapon-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .weapon-title {
            font-weight: bold;
            font-size: 14px;
        }
        .weapon-desc {
            font-size: 11px;
            color: #aaa;
            max-width: 260px;
        }
        .weapon-action-btn {
            background: #27ae60;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .weapon-action-btn:hover {
            background: #2ecc71;
        }
        .weapon-action-btn.equip-btn {
            background: #2980b9;
        }
        .weapon-action-btn.equip-btn:hover {
            background: #3498db;
        }
        .weapon-action-btn.equipped {
            background: #8e44ad;
            cursor: default;
        }
        #coins-display {
            position: absolute;
            top: 95px;
            left: 10px;
            color: #f1c40f;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 4px #f1c40f;
        }
    </style>
</head>

<script>
    const gameContainer = document.getElementById('game-container');
    const player = document.getElementById('player');
    const scoreElement = document.getElementById('score');
    const playerHPBarFill = document.getElementById('player-hp-bar-fill');
    const phaseDisplay = document.getElementById('phase-display');
    const specialChargesElement = document.getElementById('special-charges');
    const specialActiveElement = document.getElementById('special-active');
    const specialBarFill = document.getElementById('special-bar-fill');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const highScoreElement = document.getElementById('high-score');
    const restartButton = document.getElementById('restart-button');
    const bossElement = document.getElementById('boss');
    const bossHPContainer = document.getElementById('boss-hp-bar-container');
    const bossHPFill = document.getElementById('boss-hp-bar-fill');

    const containerWidth = gameContainer.offsetWidth;
    const containerHeight = gameContainer.offsetHeight;
    const playerWidth = 40;
    const playerHeight = 40;

    let playerX = containerWidth / 2 - playerWidth / 2;
    let playerY = containerHeight - playerHeight - 20;
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let stars = [];
    let score = 0;
    let highScore = 0;
    let playerMaxHP = 100;
    let playerCurrentHP = playerMaxHP;
    let isPlayerInvulnerable = false;
    let playerInvulnerableTimer = null;
    const playerInvulnerableDuration = 1500;
    let isGameOver = false;
    let gameLoopId;
    let currentPhase = 1;
    let phaseProgress = 0;
    const phaseGoals = [25, 1, 35, 1, 45, 1, 55, 1, 65, 1, 75, 1, 85, 1, 95, 1];
    let isBossActive = false;
    let bossData = {};
    let specialCharges = 3;
    let isSpecialActive = false;
    let specialTimer = null;
    let specialTimeLeft = 0;

    let isLeftPressed = false;
    let isRightPressed = false;
    let isFirePressed = false;
    let isSpecialPressed = false;
    let lastFireTime = 0;
    let lastEnemySpawnTime = 0;

    // --- TASK_003: Dreadnought Prime & Advanced Mechanics Variables ---
    const dreadnoughtElement = document.getElementById('dreadnought-boss');
    let isDreadnoughtActive = false;
    let bossPhase = 1; // 1: Generators/Shield, 2: Spiral/Homing, 3: Hyperbeam
    let bossOrbitAngle = 0;
    let bossGenerators = []; // { id, hp, element, angleOffset }
    let isHyperbeamCharging = false;
    let isHyperbeamFiring = false;
    let hyperbeamTimer = 0;
    let hyperbeamWarningLine = null;
    let hyperbeamElement = null;
    let lastGyroSpiralTime = 0;
    let gyroBurstAngle = 0;
    let gyroBurstCount = 0;
    let isGyroPausing = false;
    let gyroPauseTimer = 0;
    let lastFrameTimestamp = performance.now();
    const BOSS_GENERATOR_MAX_HP = 100;

    // --- TASK_004: Economy, Weapon Loadouts, Black Hole & Escort Mode ---
    let coins = parseInt(localStorage.getItem('spaceShooterCoins')) || 50;

    // --- Web Audio Synth for TASK_004 ---
    let audioCtx = null;
    let vortexOsc = null;
    let vortexGain = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playPlasmaBurstSound() {
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.35);

            const bufferSize = ctx.sampleRate * 0.25;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + 0.25);

            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.3, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            noise.start(now);
            noise.stop(now + 0.25);
        } catch (e) {
            console.warn("Audio Context error:", e);
        }
    }

    function playTeslaDischargeSound() {
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        } catch (e) {
            console.warn("Audio Context error:", e);
        }
    }

    function updateVortexAudioRumble(distToPlayer) {
        if (!blackHoleActive) {
            if (vortexGain) vortexGain.gain.setTargetAtTime(0, getAudioContext().currentTime, 0.1);
            return;
        }
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            if (!vortexOsc) {
                vortexOsc = ctx.createOscillator();
                vortexGain = ctx.createGain();
                vortexOsc.type = 'sine';
                vortexOsc.frequency.setValueAtTime(45, now);
                vortexGain.gain.setValueAtTime(0, now);
                vortexOsc.connect(vortexGain);
                vortexGain.connect(ctx.destination);
                vortexOsc.start(now);
            }
            const normDist = Math.max(0, 1 - distToPlayer / 300);
            vortexGain.gain.setTargetAtTime(normDist * 0.25, now, 0.1);
        } catch (e) {}
    }

    function updateGravityAnomalies(dt) {
        if (!blackHoleActive) {
            if (currentPhase >= 3 && Math.random() < 0.0008) {
                spawnBlackHole();
            }
            return;
        }

        blackHoleTimer -= dt;
        if (blackHoleTimer <= 0) {
            destroyBlackHole();
            return;
        }

        const bhCenterX = blackHoleX;
        const bhCenterY = blackHoleY;

        // Gravity pull on Player
        const pCenterX = playerX + playerWidth / 2;
        const pCenterY = playerY + playerHeight / 2;
        const pDx = bhCenterX - pCenterX;
        const pDy = bhCenterY - pCenterY;
        const pDist = Math.hypot(pDx, pDy);

        updateVortexAudioRumble(pDist);

        if (pDist < 250 && pDist > 0) {
            const pullForce = (250 - pDist) / 250 * 2.2;
            playerX += (pDx / pDist) * pullForce;
            playerY += (pDy / pDist) * pullForce;
            playerX = Math.max(0, Math.min(containerWidth - playerWidth, playerX));
            playerY = Math.max(0, Math.min(containerHeight - playerHeight, playerY));

            if (pDist <= 20) {
                playerTakeDamage(0.8);
            }
        }

        // Gravity pull on Enemies
        const allEnemies = enemies.concat(summonedEnemies);
        for (let i = allEnemies.length - 1; i >= 0; i--) {
            const enemy = allEnemies[i];
            if (!enemy || !enemy.parentNode) continue;
            const eRect = enemy.getBoundingClientRect();
            const eCenterX = eRect.left + eRect.width / 2 - gameContainer.getBoundingClientRect().left;
            const eCenterY = eRect.top + eRect.height / 2 - gameContainer.getBoundingClientRect().top;
            const eDx = bhCenterX - eCenterX;
            const eDy = bhCenterY - eCenterY;
            const eDist = Math.hypot(eDx, eDy);

            if (eDist < 250 && eDist > 0) {
                const pullForce = (250 - eDist) / 250 * 2.5;
                const currentLeft = parseFloat(enemy.style.left) || eCenterX;
                const currentTop = parseFloat(enemy.style.top) || eCenterY;
                enemy.style.left = (currentLeft + (eDx / eDist) * pullForce) + 'px';
                enemy.style.top = (currentTop + (eDy / eDist) * pullForce) + 'px';

                if (eDist <= 20) {
                    createExplosion(eCenterX, eCenterY);
                    if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                    const idxE = enemies.indexOf(enemy);
                    if (idxE > -1) enemies.splice(idxE, 1);
                    const idxS = summonedEnemies.indexOf(enemy);
                    if (idxS > -1) summonedEnemies.splice(idxS, 1);
                }
            }
        }

        // Curvature on Bullets
        bullets.forEach(bullet => {
            const bx = parseFloat(bullet.style.left) + 5;
            const by = parseFloat(bullet.style.top) + 10;
            const bDx = bhCenterX - bx;
            const bDy = bhCenterY - by;
            const bDist = Math.hypot(bDx, bDy);
            if (bDist < 200 && bDist > 0) {
                bullet.speedX = (bullet.speedX || 0) + (bDx / bDist) * 0.4;
                bullet.speedY = (bullet.speedY || -10) + (bDy / bDist) * 0.4;
            }
        });

        enemyBullets.forEach(bullet => {
            const bx = parseFloat(bullet.style.left);
            const by = parseFloat(bullet.style.top);
            const bDx = bhCenterX - bx;
            const bDy = bhCenterY - by;
            const bDist = Math.hypot(bDx, bDy);
            if (bDist < 200 && bDist > 0) {
                bullet.speedX = (bullet.speedX || 0) + (bDx / bDist) * 0.3;
                bullet.speedY = (bullet.speedY || 3) + (bDy / bDist) * 0.3;
            }
        });
    }

            this.element.className = isFragment ? 'enemy meteor fragment' : 'enemy meteor giant';

            this.element.speedX = this.speedX;

            this.element.isMeteor = true;
            this.element.isFragment = isFragment;
            this.element.meteorWidth = this.width;
            this.element.meteorHeight = this.height;
            this.element.meteorObj = this;

            meteors.push(this);
        }

    function updateMeteors() {
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            let x = parseFloat(m.element.style.left) + m.speedX;
            let y = parseFloat(m.element.style.top) + m.speedY;

            if (y > containerHeight + 40 || x < -50 || x > containerWidth + 50) {

                meteors.splice(i, 1);

                m.element.style.top = y + 'px';

    function handleMeteorDestruction(meteorObj) {
        if (!meteorObj || !meteorObj.element) return;
        const elem = meteorObj.element;
        const mx = parseFloat(elem.style.left) + meteorObj.width / 2;
        const my = parseFloat(elem.style.top) + meteorObj.height / 2;
        
        createParticleBurstCustomColor(mx, my, 12, ['#888', '#666', '#555', '#444']);

            showNotification("METEORO FRAGMENTADO!", "#bdc3c7");
            triggerScreenShake(4, 250);
            
            const numFrags = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < numFrags; i++) {
                new SpaceMeteor(true, mx - 9, my - 9, meteorObj.speedY);
            }
        }

        if (elem.parentNode === gameContainer) gameContainer.removeChild(elem);
        const idx = meteors.indexOf(meteorObj);
        if (idx > -1) meteors.splice(idx, 1);
    }

    function createParticleBurstCustomColor(relativeX, relativeY, count = 12, colors = ['#ffffff']) {
        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

    function updateDreadnought(dt) {
        if (!isDreadnoughtActive || !isBossActive) return;
        
        const bossX = parseFloat(dreadnoughtElement.style.left) || (containerWidth / 2 - bossData.width / 2);
        const bossY = parseFloat(dreadnoughtElement.style.top) || 30;
        const bossCenterX = bossX + bossData.width / 2;
        const bossCenterY = bossY + bossData.height / 2;
        
        if (Math.random() < 0.8) {
            spawnEngineParticles(bossCenterX - 4 + (Math.random() * 8 - 4), bossY + bossData.height - 15, bossPhase === 1 ? '#00ffff' : '#ff0055');
        }

        if (bossPhase === 1) {
            bossOrbitAngle += 0.02;
            
            if (bossGenerators.length === 0) {
                bossPhase = 2;
                const bubble = document.getElementById('boss-shield-bubble');
                if (bubble) bubble.style.display = 'none';
                showNotification("ESCUDOS DESATIVADOS! ATACAR NÚCLEO!", "#00ff88");
                triggerScreenShake(6, 400);
            } else {
                const radius = 85;
                for (let i = bossGenerators.length - 1; i >= 0; i--) {
                    const gen = bossGenerators[i];
                    const finalAngle = bossOrbitAngle + gen.angleOffset;
                    
                    const genX = bossCenterX + radius * Math.cos(finalAngle) - 12;
                    const genY = bossCenterY + radius * Math.sin(finalAngle) - 12;
                    
                    gen.element.style.left = genX + 'px';
                    gen.element.style.top = genY + 'px';
                }
            }
        }
        
        const now = Date.now();
        
        if (bossPhase === 1) {
            if (Math.random() < 0.03) {
                createEnemyLaser(bossCenterX - 35, bossY + bossData.height - 10, 0, 5);
                createEnemyLaser(bossCenterX + 35, bossY + bossData.height - 10, 0, 5);
            }
        } 
        else if (bossPhase === 2) {
            const newX = (containerWidth / 2 - bossData.width / 2) + Math.sin(now * 0.0015) * 120;
            dreadnoughtElement.style.left = newX + 'px';
            
            if (isGyroPausing) {
                if (now - gyroPauseTimer > 1200) {
                    isGyroPausing = false;
                    gyroBurstCount = 0;
                }
            } else {
                if (now - lastGyroSpiralTime > 120) {
                    lastGyroSpiralTime = now;
                    gyroBurstAngle += 0.3;
                    createEnemyLaserRadial(bossCenterX, bossCenterY, Math.cos(gyroBurstAngle) * 4, Math.sin(gyroBurstAngle) * 4);
                    gyroBurstCount++;
                    if (gyroBurstCount >= 18) {
                        isGyroPausing = true;
                        gyroPauseTimer = now;
                    }
                }
            }
            
            if (now - lastBossSummonTime > 4000) {
                lastBossSummonTime = now;
                launchHomingMissile(bossCenterX - 40, bossCenterY);
                launchHomingMissile(bossCenterX + 40, bossCenterY);
            }
            
            if ((bossData.currentHP / bossData.maxHP) <= 0.35) {
                bossPhase = 3;
                deactivateHyperbeamState();
                showNotification("ANOMALIA DE ENERGIA DETECTADA! DESVIE!", "#ff00ff");
                triggerScreenShake(8, 600);
            }
        } 
        else if (bossPhase === 3) {
            const targetX = containerWidth / 2 - bossData.width / 2;
            const currentX = parseFloat(dreadnoughtElement.style.left);
            dreadnoughtElement.style.left = (currentX + (targetX - currentX) * 0.08) + 'px';
            
            hyperbeamTimer += dt * 1000;
            
            if (!isHyperbeamCharging && !isHyperbeamFiring && hyperbeamTimer > 2000) {
                isHyperbeamCharging = true;
                hyperbeamTimer = 0;
                spawnHyperbeamWarning(bossCenterX, bossCenterY);
            } 
            else if (isHyperbeamCharging && hyperbeamTimer > 1500) {
                isHyperbeamCharging = false;
                isHyperbeamFiring = true;
                hyperbeamTimer = 0;
                triggerHyperbeam(bossCenterX, bossCenterY);
            } 
            else if (isHyperbeamFiring && hyperbeamTimer > 2500) {
                isHyperbeamFiring = false;
                hyperbeamTimer = 0;
                deactivateHyperbeamState();
            }
            
            if (isHyperbeamFiring) {
                applyHyperbeamContactDamage(bossCenterX);
            }
        }
    }

        const playerCenterX = playerX + playerWidth / 2;
        
        if (playerCenterX >= bossCenterX - 40 && playerCenterX <= bossCenterX + 40 && playerY < containerHeight) {
            playerTakeDamage(0.6); 
            
            if (playerX < bossCenterX) {
                playerX = Math.max(0, playerX - 5);
            } else {
                playerX = Math.min(containerWidth - playerWidth, playerX + 5);
            }
        }
    }

        if (hyperbeamWarningLine && hyperbeamWarningLine.parentNode === gameContainer) {
            gameContainer.removeChild(hyperbeamWarningLine);
            hyperbeamWarningLine = null;
        }
        if (hyperbeamElement && hyperbeamElement.parentNode === gameContainer) {
            gameContainer.removeChild(hyperbeamElement);
            hyperbeamElement = null;
        }
        isHyperbeamCharging = false;
        isHyperbeamFiring = false;
    }

    function defeatDreadnought() {
        isBossActive = false;
        isDreadnoughtActive = false;
        deactivateHyperbeamState();
        
        bossGenerators.forEach(g => {
            if (g.element.parentNode === gameContainer) gameContainer.removeChild(g.element);
        });
        bossGenerators = [];

        const bossX = parseFloat(dreadnoughtElement.style.left) || containerWidth / 2 - 65;

        for (let i = 0; i < 5; i++) {

            if (specialCharges < 3) {
                specialCharges++;

            advancePhase();
        }, 1300);
    }

        for (let i = 0; i < count; i++) {

    function triggerPlasmaExplosion(centerX, centerY) {
        createExplosion(centerX, centerY);
        playPlasmaBurstSound();
        triggerScreenShake(6, 150);

        const splashRadius = 70;
        const allTargets = enemies.concat(summonedEnemies);

        for (let i = allTargets.length - 1; i >= 0; i--) {
            const enemy = allTargets[i];
            if (!enemy || !enemy.parentNode) continue;
            const rect = enemy.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const eX = rect.left + rect.width / 2 - containerRect.left;
            const eY = rect.top + rect.height / 2 - containerRect.top;

            const dist = Math.hypot(eX - centerX, eY - centerY);
            if (dist <= splashRadius) {
                createExplosion(eX, eY);
                if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                const idxE = enemies.indexOf(enemy);
                if (idxE > -1) enemies.splice(idxE, 1);
                const idxS = summonedEnemies.indexOf(enemy);
                if (idxS > -1) summonedEnemies.splice(idxS, 1);
                score += 15 * currentPhase;
                scoreElement.textContent = `Score: ${score}`;
            }
        }

        if (isBossActive && bossData) {
            const bRect = bossElement.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const bX = bRect.left + bRect.width / 2 - containerRect.left;
            const bY = bRect.top + bRect.height / 2 - containerRect.top;
            if (Math.hypot(bX - centerX, bY - centerY) <= splashRadius + 50) {
                bossTakeDamage(8);
            }
        }

        if (isDreadnoughtActive) {
            bossGenerators.forEach(gen => {
                const gRect = gen.element.getBoundingClientRect();
                const containerRect = gameContainer.getBoundingClientRect();
                const gX = gRect.left + gRect.width / 2 - containerRect.left;
                const gY = gRect.top + gRect.height / 2 - containerRect.top;
                if (Math.hypot(gX - centerX, gY - centerY) <= splashRadius + 20) {
                    gen.hp -= 25;
                    if (gen.hp <= 0) {
                        gen.hp = 0;
                        gen.element.style.background = '#333333';
                    }
                }
            });
        }
    }

    function fireTeslaArc() {
        playTeslaDischargeSound();
        const pX = playerX + playerWidth / 2;
        const pY = playerY;

        const containerRect = gameContainer.getBoundingClientRect();
        const allTargets = enemies.concat(summonedEnemies);

            if (!e || !e.parentNode) return;
            const rect = e.getBoundingClientRect();
            const ex = rect.left + rect.width / 2 - containerRect.left;
            const ey = rect.top + rect.height / 2 - containerRect.top;
            const dist = Math.hypot(ex - pX, ey - pY);
            if (dist < minDist) {
                minDist = dist;
                primaryTarget = { element: e, x: ex, y: ey };
            }
        });

        if (isBossActive && bossData) {
            const rect = bossElement.getBoundingClientRect();
            const bx = rect.left + rect.width / 2 - containerRect.left;
            const by = rect.top + rect.height / 2 - containerRect.top;
            const dist = Math.hypot(bx - pX, by - pY);
            if (dist < minDist) {
                minDist = dist;
                primaryTarget = { isBoss: true, x: bx, y: by };
            }
        }

        if (isDreadnoughtActive) {
            bossGenerators.forEach(gen => {
                if (gen.hp <= 0) return;
                const rect = gen.element.getBoundingClientRect();
                const gx = rect.left + rect.width / 2 - containerRect.left;
                const gy = rect.top + rect.height / 2 - containerRect.top;
                const dist = Math.hypot(gx - pX, gy - pY);
                if (dist < minDist) {
                    minDist = dist;
                    primaryTarget = { isGenerator: true, genRef: gen, x: gx, y: gy };
                }
            });
        }

        if (!primaryTarget) return;

        targets.push(primaryTarget);

        let lastPos = primaryTarget;
        for (let step = 0; step < 2; step++) {
            let nextTarget = null;
            let nextDist = 130;
            allTargets.forEach(e => {
                if (!e || !e.parentNode) return;
                if (targets.some(t => t.element === e)) return;
                const rect = e.getBoundingClientRect();
                const ex = rect.left + rect.width / 2 - containerRect.left;
                const ey = rect.top + rect.height / 2 - containerRect.top;
                const dist = Math.hypot(ex - lastPos.x, ey - lastPos.y);
                if (dist < nextDist) {
                    nextDist = dist;
                    nextTarget = { element: e, x: ex, y: ey };
                }
            });
            if (nextTarget) {
                targets.push(nextTarget);
                lastPos = nextTarget;
            }
        }

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '12';

        let pathD = `M ${pX} ${pY}`;
        targets.forEach(t => {
            pathD += ` L ${t.x} ${t.y}`;
        });

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathD);
        path.setAttribute("stroke", "#00ffff");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("fill", "none");
        path.setAttribute("filter", "drop-shadow(0 0 6px #00ffff)");

        svg.appendChild(path);
        gameContainer.appendChild(svg);

        setTimeout(() => {
            if (svg.parentNode === gameContainer) gameContainer.removeChild(svg);
        }, 120);

        const baseDmg = [25, 17.5, 12];
        targets.forEach((t, idx) => {
            const dmg = baseDmg[idx] || 10;
            if (t.isBoss) {
                bossTakeDamage(dmg / 3);
            } else if (t.isGenerator) {
                t.genRef.hp -= dmg;
                if (t.genRef.hp <= 0) {
                    t.genRef.hp = 0;
                    t.genRef.element.style.background = '#333333';
                }
            } else if (t.element) {
                createExplosion(t.x, t.y);
                if (t.element.parentNode === gameContainer) gameContainer.removeChild(t.element);
                const idxE = enemies.indexOf(t.element);
                if (idxE > -1) enemies.splice(idxE, 1);
                const idxS = summonedEnemies.indexOf(t.element);
                if (idxS > -1) summonedEnemies.splice(idxS, 1);
                score += 10 * currentPhase;
                scoreElement.textContent = `Score: ${score}`;
            }
        });
    }

    function activateSpecial() {
        if (specialCharges > 0 && !isSpecialActive) {
            isSpecialActive = true;
            specialCharges--;
            specialChargesElement.textContent = `Tiro Especial: ${specialCharges}`;
            specialActiveElement.style.display = 'block';
            specialTimeLeft = 2000;

            if (specialTimer) {
                clearInterval(specialTimer);
            }

            specialTimer = setInterval(() => {
                specialTimeLeft -= 100;
                const percentage = (specialTimeLeft / 2000) * 100;
                specialBarFill.style.width = `${percentage}%`;

                if (specialTimeLeft <= 0) {
                    deactivateSpecial();
                }
            }, 100);
        }
    }

    function deactivateSpecial() {
        isSpecialActive = false;
        specialActiveElement.style.display = 'none';
        specialBarFill.style.width = '0%';

        if (specialTimer) {
            clearInterval(specialTimer);
            specialTimer = null;
        }
    }

    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            let x = parseFloat(bullet.style.left);
            let y = parseFloat(bullet.style.top);

            if (isHomingActive && !bullet.classList.contains('special-bullet')) {
                let targetX = null;
                let targetY = null;
                let closestDist = Infinity;

                // Checa o boss primeiro se estiver ativo
                if (isBossActive) {
                    const bossCenterX = parseFloat(bossElement.style.left) + 15;
                    const bossCenterY = parseFloat(bossElement.style.top) + 15;
                    const distToBoss = Math.hypot(bossCenterX - x, bossCenterY - y);

                    if (distToBoss < closestDist) {
                        closestDist = distToBoss;
                        targetX = bossCenterX;
                        targetY = bossCenterY;
                    }
                }

                // Checa inimigos normais e invocados
                const allEnemies = enemies.concat(summonedEnemies);
                for (const enemy of allEnemies) {
                    const enemyX = parseFloat(enemy.style.left) + 15;
                    const enemyY = parseFloat(enemy.style.top) + 15;
                    const dist = Math.hypot(enemyX - x, enemyY - y);

                    if (dist < closestDist) {
                        closestDist = dist;
                        targetX = enemyX;
                        targetY = enemyY;
                    }
                }

                // Se encontrou um alvo, ajusta a trajetória
                if (targetX !== null && targetY !== null) {
                    const angle = Math.atan2(targetY - y, targetX - x);
                    bullet.speedX = Math.cos(angle) * 8;
                    bullet.speedY = Math.sin(angle) * 8;
                }
            }

            x += (bullet.speedX || 0);
            y += (bullet.speedY || -10);

            if (y < 0 || x < 0 || x > containerWidth || y > containerHeight) {
                gameContainer.removeChild(bullet);
                bullets.splice(i, 1);
            } else {
                bullet.style.left = x + 'px';
                bullet.style.top = y + 'px';
            }
        }
    }

    function createEnemy(forceSpawn = false, optionalX, optionalY) {
            if (isBossActive && !forceSpawn) return;

            const now = Date.now();
            const timeSinceLastSpawn = now - lastEnemySpawnTime;

            const baseSpawnInterval = 1500 - (currentPhase * 100);
            const spawnInterval = Math.max(300, baseSpawnInterval);
            const maxEnemiesAllowed = 6 + currentPhase * 2;

            let shouldSpawn = forceSpawn;
            if (!forceSpawn) {
                shouldSpawn = timeSinceLastSpawn > spawnInterval && enemies.length < maxEnemiesAllowed;
            }

            if (shouldSpawn) {
                if (!forceSpawn) {
                    lastEnemySpawnTime = now;
                }

                const enemy = document.createElement('div');
                enemy.className = 'enemy';

                let enemyType = 0;
                if (currentPhase >= 2) {
                    // Gera aleatoriamente os inimigos de tipo 0, 1 ou 2
                    enemyType = Math.floor(Math.random() * 3);
                }

                // Corrige o visual para garantir que o inimigo do tipo 2 tenha a forma correta
                enemy.innerHTML = `<svg viewBox="0 0 100 100">
                    ${enemyType === 0 ? '<circle cx="50" cy="50" r="40" fill="#e74c3c"/><circle cx="30" cy="40" r="10" fill="#000"/><circle cx="70" cy="40" r="10" fill="#000"/>' :
                      enemyType === 1 ? '<polygon points="10,50 50,10 90,50 50,90" fill="#9b59b6"/><circle cx="35" cy="45" r="8" fill="#000"/><circle cx="65" cy="45" r="8" fill="#000"/>' :
                      // Novo inimigo atirador, com uma forma de cruz e cor roxa
                      '<rect x="20" y="40" width="60" height="20" fill="#9b59b6"/><rect x="40" y="20" width="20" height="60" fill="#9b59b6"/>'}
                </svg>`;

                const x = optionalX !== undefined ? optionalX : Math.random() * (containerWidth - 30);
                const y = optionalY !== undefined ? optionalY : -30;
                enemy.style.left = x + 'px';
                enemy.style.top = y + 'px';

                const baseSpeed = 0.5 + (currentPhase * 0.15);
                enemy.speed = forceSpawn ? baseSpeed * 0.8 : Math.random() * 1 + baseSpeed;

                enemy.movementType = 0;
                if (currentPhase >= 2 && Math.random() < 0.4) {
                    enemy.movementType = 1;
                    enemy.amplitude = Math.random() * 20 + 10;
                    enemy.frequency = Math.random() * 0.1 + 0.05;
                    enemy.movementOffset = Math.random() * Math.PI * 2;
                }

                // Adicionado: Armazena o tipo do inimigo no próprio objeto. ISSO É ESSENCIAL.
                enemy.type = enemyType;

                gameContainer.appendChild(enemy);
                if (forceSpawn) {
                    summonedEnemies.push(enemy);
                } else {
                    enemies.push(enemy);
                }
            }
        }

    function updateEnemies() {
        if (!isBossActive) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                let x = parseFloat(enemy.style.left);
                let y = parseFloat(enemy.style.top) + enemy.speed;

                if (enemy.movementType === 1) {
                    enemy.movementOffset += enemy.frequency;
                    x += Math.sin(enemy.movementOffset) * 2;
                }

                if (x < 0) x = 0;
                if (x > containerWidth - 30) x = containerWidth - 30;

                if (y > containerHeight) {
                    if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                    enemies.splice(i, 1);
                    if (currentPhase > 1) {
                        playerTakeDamage(Math.random() * 10 + 5);
                    }
                } else {
                    enemy.style.left = x + 'px';
                    enemy.style.top = y + 'px';
                }
            }
        }

        for (let i = summonedEnemies.length - 1; i >= 0; i--) {
            const enemy = summonedEnemies[i];
            let x = parseFloat(enemy.style.left);
            let y = parseFloat(enemy.style.top) + enemy.speed;

            if (enemy.movementType === 1) {
                enemy.movementOffset += enemy.frequency;
                x += Math.sin(enemy.movementOffset) * 1.5;
            }

            if (x < 0) x = 0;
            if (x > containerWidth - 30) x = containerWidth - 30;

            if (y > containerHeight) {
                if (enemy.parentNode === gameContainer) gameContainer.removeChild(enemy);
                summonedEnemies.splice(i, 1);
            } else {
                enemy.style.left = x + 'px';
                enemy.style.top = y + 'px';
            }
        }
    }

    function updateStars() {
        for (let i = 0; i < stars.length; i++) {
            const star = stars[i];
            let y = parseFloat(star.style.top) + star.speed;

            if (y > containerHeight) {
                y = -5;
                star.style.left = Math.random() * containerWidth + 'px';
            }

            star.style.top = y + 'px';
        }
    }

    function createPowerup(x, y) {

                <svg viewBox="0 0 50 50">

                          fill="#3498db"/>

                          fill="#2980b9"/>
