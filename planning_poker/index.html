<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planning Poker para times de desenvolvimento estimarem tarefas juntos, em tempo real via WebSocket.">
    <title>Planning Poker - PlayfulHub</title>
    <style>
        :root {
            --bg-1: #0d0e15;
            --bg-2: #16182a;
            --panel: rgba(22, 24, 42, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #e94560;
            --accent-2: #6c8cff;
            --neon-cyan: #00f0ff;
            --neon-green: #39ff14;
            --gold: #ffd700;
            --text: #e8e8f0;
            --muted: #9a9ab0;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 20px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }

        /* ============ Join Screen ============ */
        .join-card {
            margin: auto;
            width: 100%;
            max-width: 440px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 36px 32px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        .join-card h1 {
            font-size: 1.9rem;
            letter-spacing: 1px;
        }

        .join-card .subtitle {
            color: var(--muted);
            margin: 10px 0 28px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .field label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .field input {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .field input:focus { border-color: var(--accent-2); }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(233, 69, 96, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
        }

        .btn.neon {
            background: linear-gradient(45deg, #0e7bd1, var(--neon-cyan));
        }

        .join-hint { margin-top: 18px; font-size: 0.8rem; color: var(--muted); }

        /* ============ Room Header ============ */
        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-top-left-radius: var(--radius);
            border-top-right-radius: var(--radius);
        }

        .room-header .title { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px; }

        .room-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .room-chip {
            font-family: 'Consolas', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 6px 12px;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .copy-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .copy-btn.copied { color: var(--neon-green); border-color: var(--neon-green); }

        .status-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-top: 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.on { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        .dot.off { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; }
        .dot.mid { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

        /* ============ Players ============ */
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin: 20px 0 10px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .player-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .player-card.self { border-color: var(--accent-2); }
        .player-card .pname {
            font-weight: 700;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-card .pstatus { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
        .player-card .pstatus.voted { color: var(--neon-green); }
        .player-card .mini-card {
            margin: 10px auto 0;
            width: 42px;
            height: 56px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-card.back { background: repeating-linear-gradient(45deg, #2a2d4d, #2a2d4d 6px, #343864 6px, #343864 12px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .mini-card.value { background: linear-gradient(160deg, #1c1f38, #2a2e52); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.25); }
        .mini-card.null { border: 1px dashed var(--panel-border); color: var(--muted); font-size: 0.8rem; }

        /* ============ Deck ============ */
        .deck {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
            gap: 10px;
            max-width: 820px;
        }

        .card {
            aspect-ratio: 4 / 5;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: linear-gradient(160deg, #1c1f38, #232648);
            color: var(--text);
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover { transform: translateY(-4px); border-color: var(--neon-cyan); box-shadow: 0 8px 20px rgba(0, 240, 255, 0.18); }
        .card.picked { border-color: var(--gold); box-shadow: 0 0 16px rgba(255, 215, 0, 0.45); transform: translateY(-4px); color: var(--gold); }
        .card:disabled { cursor: not-allowed; opacity: 0.45; transform: none; }
        .card:disabled:hover { border-color: var(--panel-border); box-shadow: none; }

        .deck.is-locked .card:not(.picked) { cursor: not-allowed; opacity: 0.35; }

        /* ============ Actions ============ */
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        /* ============ Results / Stats ============ */
        .results-panel {
            margin-top: 24px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .result-item .rname { font-size: 0.85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result-item .rval { font-family: 'Consolas', 'Courier New', monospace; font-weight: 800; color: var(--neon-cyan); }

        .stats-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 110px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
        }

        .stat-box .s-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
        .stat-box .s-value { font-family: 'Consolas', 'Courier New', monospace; font-size: 1.2rem; font-weight: 800; color: var(--gold); margin-top: 4px; }

        /* ============ Toast ============ */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a0f17;
            border: 1px solid var(--accent);
            color: #ffd7de;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 50;
        }

        .toast.show { opacity: 1; }

        @media (max-width: 600px) {
            .wrap { padding: 16px 12px; }
            .deck { grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 8px; }
            .card { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- ============ ENTRADA ============ -->
        <section id="join-screen" class="screen active">
            <div class="join-card">
                <h1>Planning Poker</h1>
                <p class="subtitle" id="join-subtitle">Estime tarefas com seu time em tempo real.</p>
                <div class="field">
                    <label for="name-input">Seu nome</label>
                    <input id="name-input" type="text" maxlength="24" placeholder="Ex.: Maria" autocomplete="off">
                </div>
                <button id="join-btn" class="btn">Entrar / Criar sala</button>
                <p class="join-hint">Seus colegas acessam a mesma sala pelo link.</p>
            </div>
        </section>

        <!-- ============ SALA ============ -->
        <section id="room-screen" class="screen">
            <header class="room-header">
                <div class="title">Planning Poker</div>
                <div class="room-meta">
                    <span id="room-chip" class="room-chip">---</span>
                    <button id="copy-link-btn" class="copy-btn" type="button">Copiar link</button>
                </div>
            </header>

            <div class="status-line">
                <span><span id="conn-dot" class="dot mid"></span><span id="conn-text">Conectando...</span></span>
                <span id="round-status">0/0 votaram</span>
            </div>

            <h2 class="section-label">Participantes</h2>
            <div id="players-grid" class="players-grid"></div>

            <h2 class="section-label">Sua estimativa</h2>
            <div id="deck" class="deck"></div>

            <div class="actions">
                <button id="reveal-btn" class="btn" type="button">Revelar votos</button>
                <button id="reset-btn" class="btn secondary" type="button">Nova rodada</button>
            </div>

            <div id="results" class="results-panel" hidden>
                <h2 class="section-label" style="margin-top:0;">Votos</h2>
                <div id="results-list" class="results-list"></div>
                <div id="stats-row" class="stats-row"></div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        (function () {
            'use strict';

            const DECK = [0, 1, 2, 3, 5, 8, 13, 21, 34, '?', '\u221E'];
            const NAME_KEY = 'pp:name';

            const joinScreen = document.getElementById('join-screen');
            const roomScreen = document.getElementById('room-screen');
            const joinBtn = document.getElementById('join-btn');
            const nameInput = document.getElementById('name-input');
            const joinSubtitle = document.getElementById('join-subtitle');
            const playersGrid = document.getElementById('players-grid');
            const deckEl = document.getElementById('deck');
            const revealBtn = document.getElementById('reveal-btn');
            const resetBtn = document.getElementById('reset-btn');
            const resultsPanel = document.getElementById('results');
            const resultsList = document.getElementById('results-list');
            const statsRow = document.getElementById('stats-row');
            const roomChip = document.getElementById('room-chip');
            const copyLinkBtn = document.getElementById('copy-link-btn');
            const connDot = document.getElementById('conn-dot');
            const connText = document.getElementById('conn-text');
            const roundStatus = document.getElementById('round-status');
            const toastEl = document.getElementById('toast');

            let state = { roomId: null, selfId: null, phase: 'voting', votesRevealed: false, players: [], votes: null, stats: null };
            let ws = null;
            let reconnectTimer = null;
            let toastTimer = null;

            function getRoomId() {
                const parts = location.pathname.split('/').filter(Boolean);
                return parts.length >= 2 ? parts[parts.length - 1] : null;
            }
            const roomId = getRoomId();

            function getWsUrl() {
                const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
                return proto + location.host + '/ws/planning-poker';
            }

            function renderDeck() {
                const locked = state.phase === 'revealed';
                deckEl.classList.toggle('is-locked', locked);
                deckEl.innerHTML = '';
                DECK.forEach(function (value) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'card';
                    btn.dataset.value = String(value);
                    btn.textContent = String(value);
                    if (state.selfVote === value || (state.selfVote != null && String(state.selfVote) === String(value))) {
                        btn.classList.add('picked');
                    }
                    if (locked) {
                        btn.disabled = true;
                    } else {
                        btn.addEventListener('click', function () {
                            sendVote(value);
                        });
                    }
                    deckEl.appendChild(btn);
                });
            }

            function renderPlayers() {
                playersGrid.innerHTML = '';
                state.players.forEach(function (p) {
                    const card = document.createElement('div');
                    card.className = 'player-card' + (p.id === state.selfId ? ' self' : '');

                    const name = document.createElement('div');
                    name.className = 'pname';
                    name.textContent = p.name + (p.id === state.selfId ? ' (você)' : '');

                    const status = document.createElement('div');
                    const mini = document.createElement('div');
                    if (state.votesRevealed) {
                        status.className = 'pstatus';
                        status.textContent = 'Revelado';
                        mini.className = 'mini-card value';
                        mini.textContent = formatVote(p.vote);
                    } else if (p.hasVoted) {
                        status.className = 'pstatus voted';
                        status.textContent = 'Votou';
                        mini.className = 'mini-card back';
                        mini.innerHTML = '&nbsp;';
                    } else {
                        status.className = 'pstatus';
                        status.textContent = 'Aguardando...';
                        mini.className = 'mini-card null';
                        mini.textContent = '?';
                    }

                    card.appendChild(name);
                    card.appendChild(mini);
                    card.appendChild(status);
                    playersGrid.appendChild(card);
                });
            }

            function formatVote(v) {
                if (v === null || v === undefined) return '?';
                return String(v);
            }

            function renderRoundStatus() {
                const voted = state.players.filter(function (p) { return p.hasVoted || (state.votesRevealed && p.vote !== null); }).length;
                roundStatus.textContent = state.phase === 'revealed'
                    ? voted + '/' + state.players.length + ' revelados'
                    : voted + '/' + state.players.length + ' votaram';
                revealBtn.disabled = state.phase === 'revealed' || voted === 0;
                resetBtn.disabled = state.phase !== 'revealed';
            }

            function renderResults() {
                if (!state.votesRevealed || !state.players || state.players.length === 0) {
                    resultsPanel.hidden = true;
                    return;
                }
                resultsPanel.hidden = false;
                resultsList.innerHTML = '';
                state.players.forEach(function (p) {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    const rname = document.createElement('span');
                    rname.className = 'rname';
                    rname.textContent = p.name;
                    const rval = document.createElement('span');
                    rval.className = 'rval';
                    rval.textContent = formatVote(p.vote);
                    item.appendChild(rname);
                    item.appendChild(rval);
                    resultsList.appendChild(item);
                });

                statsRow.innerHTML = '';
                const stats = state.stats || {};
                const defs = [
                    ['Média', stats.meanRounded != null ? stats.meanRounded : '-'],
                    ['Moda', stats.mode != null ? String(stats.mode) : '-'],
                    ['Mín', stats.min != null ? stats.min : '-'],
                    ['Máx', stats.max != null ? stats.max : '-'],
                    ['Total', stats.total != null ? stats.total : '-']
                ];
                defs.forEach(function (d) {
                    const box = document.createElement('div');
                    box.className = 'stat-box';
                    const lbl = document.createElement('div');
                    lbl.className = 's-label';
                    lbl.textContent = d[0];
                    const val = document.createElement('div');
                    val.className = 's-value';
                    val.textContent = d[1];
                    box.appendChild(lbl);
                    box.appendChild(val);
                    statsRow.appendChild(box);
                });
            }

            function renderAll() {
                renderPlayers();
                renderDeck();
                renderRoundStatus();
                renderResults();
                roomChip.textContent = state.roomId || roomId || '---';
            }

            function applyRoomState(payload) {
                state.roomId = payload.roomId;
                state.phase = payload.phase;
                state.votesRevealed = payload.votesRevealed;
                state.players = payload.players || [];
                state.votes = payload.votes || null;
                state.stats = payload.stats || null;
                if (payload.selfId) state.selfId = payload.selfId;
                if (payload.selfVote !== undefined) state.selfVote = payload.selfVote;
                if (state.votesRevealed && state.selfVote === undefined && state.selfId) {
                    const me = state.players.find(function (p) { return p.id === state.selfId; });
                    if (me) state.selfVote = me.vote;
                }
                joinScreen.classList.remove('active');
                roomScreen.classList.add('active');
                renderAll();
            }

            function send(type, payload) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: type, payload: payload || {} }));
                }
            }

            function sendVote(value) {
                state.selfVote = value;
                send('vote', { value: value });
                renderDeck();
                renderRoundStatus();
            }

            function connect() {
                setConnection('mid', 'Conectando...');
                let opened = false;
                ws = new WebSocket(getWsUrl());
                ws.onopen = function () {
                    opened = true;
                    setConnection('on', 'Conectado');
                    send('join', { roomId: roomId, name: nameInput.value || getStoredName() });
                };
                ws.onmessage = function (event) {
                    let msg;
                    try { msg = JSON.parse(event.data); } catch (e) { return; }
                    handleMessage(msg);
                };
                ws.onerror = function () {
                    setConnection('off', 'Erro de conexão');
                };
                ws.onclose = function () {
                    if (!opened) setConnection('off', 'Servidor indisponível');
                    else setConnection('off', 'Reconectando...');
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, 1500);
                };
            }

            function handleMessage(msg) {
                if (!msg || !msg.type) return;
                switch (msg.type) {
                    case 'room_state':
                        applyRoomState(msg.payload || {});
                        break;
                    case 'vote_cast':
                        if (msg.payload && msg.payload.playerId !== state.selfId) {
                            const p = state.players.find(function (x) { return x.id === msg.payload.playerId; });
                            if (p) p.hasVoted = true;
                            renderPlayers();
                            renderRoundStatus();
                        }
                        break;
                    case 'revealed':
                        state.votesRevealed = true;
                        state.phase = 'revealed';
                        state.stats = (msg.payload && msg.payload.stats) || null;
                        break;
                    case 'reset_round':
                        state.votesRevealed = false;
                        state.phase = 'voting';
                        state.selfVote = null;
                        break;
                    case 'error':
                        showToast((msg.payload && msg.payload.message) || 'Erro');
                        break;
                    default:
                        break;
                }
            }

            function setConnection(kind, text) {
                connDot.className = 'dot ' + kind;
                connText.textContent = text;
            }

            function showToast(message) {
                toastEl.textContent = message;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, 3000);
            }

            function getStoredName() {
                try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
            }

            function storeName(name) {
                try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
            }

            function copyRoomLink() {
                const url = location.origin + '/planning_poker/' + (state.roomId || roomId || '');
                const done = function () {
                    copyLinkBtn.classList.add('copied');
                    copyLinkBtn.textContent = 'Link copiado!';
                    setTimeout(function () {
                        copyLinkBtn.classList.remove('copied');
                        copyLinkBtn.textContent = 'Copiar link';
                    }, 2000);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(done, function () {
                        legacyCopy(url, done);
                    });
                } else {
                    legacyCopy(url, done);
                }
            }

            function legacyCopy(text, done) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                done();
            }

            // ============ Boot ============
            const storedName = getStoredName();
            if (storedName) nameInput.value = storedName;

            if (roomId) {
                joinSubtitle.textContent = 'Entrando na sala /planning_poker/' + roomId;
                joinBtn.textContent = 'Entrar na sala';
                if (storedName) {
                    joinBtn.textContent = 'Entrar na sala';
                    connect();
                }
            } else {
                joinSubtitle.textContent = 'Crie uma sala e estime tarefas com seu time em tempo real.';
                joinBtn.textContent = 'Criar sala';
            }

            joinBtn.addEventListener('click', function () {
                const name = nameInput.value.trim();
                if (!name) {
                    showToast('Digite seu nome para continuar.');
                    nameInput.focus();
                    return;
                }
                storeName(name);
                if (roomId) {
                    connect();
                } else {
                    location.href = '/planning_poker';
                }
            });

            nameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') joinBtn.click();
            });

            copyLinkBtn.addEventListener('click', copyRoomLink);
            revealBtn.addEventListener('click', function () { send('reveal'); });
            resetBtn.addEventListener('click', function () { send('reset'); });
        })();
    </script>
</body>
</html>
